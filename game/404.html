const ACT_DUR = 4 / 14, CAST_DUR = 4 / 12;
const player = {
  x: 0, y: 0, r: 14, sx: W / 2, sy: H / 2,
  hp: 100, level: 1, xp: 0, xpNext: 5,
  faceX: 1, faceY: 0, iframe: 0, hurtFlash: 0, walk: 0,
  cls: null,     // 선택한 직업
  weapons: [],   // { key, level, timer, ... }
  passives: [],  // { key, level }
  stats: null,
  base: { maxHp: 100, speed: 208 },
  // 직업 자원 · 조합 · 전용 특성
  res: 0, noHit: 0, combos: new Set(), mastered: new Set(), traits: [], advance: [], stRes: 1,
  items: [], sigils: 0, buffFury: 0, buffWard: 0,
  tickA: 0, tickB: 0, shieldT: 0, shieldOn: 0, echoT: 0, echoSkill: null,
  // 매 프레임 다시 계산되는 배수 (진영 / 영창처럼 상황에 따라 변하는 것)
  dynDmg: 1, dynCd: 1, dynArmor: 1, dynPierce: 0, dynSpeed: 1, dynMagnet: 1,
  dynCrit: 0, dynCritMul: 2, dynProjSpeed: 1, dynHoming: 0, dynBurnAmp: 1,
  stillTime: 0, bulwark: 0, press: 0, channel: 0, meltTimer: 0, blocked: 0,
  carnage: 0, carnageTimer: 0, leechBudget: 0,
  dash: 0, dashX: 1, dashY: 0, dashDmg: 0, dashHit: new Set(),
  // 스프라이트 동작 상태 — 무기가 나갈 때 actT, 스킬을 쓸 때 castT 를 채우고 흘려보낸다
  actT: 0, castT: 0, moving: false, flip: false,
};

/* ---------- 직업 자원 · 능동 스킬 ----------
   순수 오토배틀에 '언제 쓰느냐'의 판단을 하나 추가한다.
   자원이 차는 방식이 직업마다 달라서 플레이 리듬 자체가 갈린다. */
const RES_MAX = 100;

player.onKill = function (e) {
  const R = player.cls && player.cls.resource;
  if (R && R.onKill) player.res = clamp(player.res + R.onKill * advVal("rageGain", 1) * (e.boss ? 10 : 1), 0, RES_MAX);
  if (player.combos.has("carnage")) {
    const cp = comboPower("carnage");
    player.carnage = Math.min(.35 * cp, player.carnage + .014 * cp);
    player.carnageTimer = 3.5;
  }
};

player.onHurt = function () {
  const R = player.cls && player.cls.resource;
  player.noHit = 0;
  if (!R) return;
  if (R.onHurt) player.res = clamp(player.res + R.onHurt, 0, RES_MAX);
  if (R.resetOnHurt) player.res = 0;
};

function updateResource(dt) {
  const R = player.cls && player.cls.resource;
  if (!R) return;
  player.noHit += dt;
  let d = 0;
  if (R.perSec) d += R.perSec;
  if (R.decay) d -= R.decay;
  if (R.noHitPerSec && player.noHit > 1.6) d += R.noHitPerSec;
  if (d > 0) d *= player.stRes;                 // 마나 샘 — 차는 쪽만 배로, 빠지는 쪽은 그대로
  if (d) player.res = clamp(player.res + d * dt, 0, RES_MAX);
}

function useItem() {
  if (Game.state !== "playing" || !player.items.length) return;
  const key = player.items.shift();
  const C = CONSUMABLES[key];
  C.use(player);
  spawnNumber(player.x, player.y - 30, C.name, C.color, 18);
}

function useSkill() {
  const C = player.cls;
  if (!C || Game.state !== "playing") return;
  if (player.res < curSkill().cost) {
    Sfx.throttled("nores", 260, () => Sfx.play(130, .09, "square", .3, -40));
    return;
  }
  const sk = curSkill();
  player.res -= sk.cost;
  player.castT = CAST_DUR;
  sk.use(player);
  if (advVal("skillEcho", false)) { player.echoT = .45; player.echoSkill = sk; }
}

/* ---------- 속성 조합 판정 ---------- */
/* 조합이 실제로 몇 번 터졌는지 세고, 터질 때 화면에 띄운다.
   "조합이 열렸다"만 알려주고 끝내면 플레이어는 그게 일하고 있는지 알 수 없다. */
const comboProcs = {};
function procCombo(key, x, y) {
  let e = comboProcs[key];
  if (!e) e = comboProcs[key] = { count: 0, flash: 0 };
  e.count++; e.flash = .9;
  if (x !== undefined && Math.random() < .22) {
    const c = COMBOS.find(c => c.key === key);
    if (c) spawnNumber(x, y - 34, c.name, "#ffd9a0", 15);
  }
}
function resetCombos() { for (const k in comboProcs) delete comboProcs[k]; }

/* 이 카드를 고르면(무기를 얻거나 한 단계 올리면) 어떤 조합이 열리는지 */
function combosAfterPick(key, level) {
  const els = new Set();
  let seen = false;
  for (const w of player.weapons) {
    const lv = w.key === key ? level : w.level;
    if (w.key === key) seen = true;
    if (lv >= COMBO_LEVEL) els.add(WEAPONS[w.key].element);
  }
  if (!seen && level >= COMBO_LEVEL) els.add(WEAPONS[key].element);
  const out = [];
  for (const c of COMBOS) {
    if (player.combos.has(c.key)) continue;
    if (els.has(c.a) && els.has(c.b)) out.push(c);
  }
  return out;
}

/* 아직 안 열린 조합의 진행 상황 — 무엇을 얼마나 더 올려야 하는지 보여준다 */
function combosPending() {
  const out = [];
  for (const c of COMBOS) {
    if (player.combos.has(c.key)) continue;
    const la = Math.min(elemLevel(c.a), COMBO_LEVEL);
    const lb = Math.min(elemLevel(c.b), COMBO_LEVEL);
    if (!la && !lb) continue;                 // 양쪽 다 없으면 힌트할 게 없다
    out.push({ c, la, lb, sum: la + lb });
  }
  out.sort((x, y) => y.sum - x.sum);          // 가까운 것부터
  return out;
}

// 어떤 속성이 조합에 '기여'하려면 그 속성 무기가 COMBO_LEVEL 이상이어야 한다
function elemLevel(elem) {
  let best = 0;
  for (const w of player.weapons)
    if (WEAPONS[w.key].element === elem && w.level > best) best = w.level;
  return best;
}
function activeElements(minLv) {
  const need = minLv || COMBO_LEVEL;
  const els = new Set();
  for (const w of player.weapons)
    if (w.level >= need) els.add(WEAPONS[w.key].element);
  return els;
}
// 완성된 조합은 효과가 세진다 — 최대치까지 올릴 이유를 여기서 만든다
function comboPower(key) {
  return player.mastered.has(key) ? MASTER_POWER : 1;
}

function recomputeCombos() {
  const els = activeElements();
  const mst = activeElements(COMBO_MASTER);
  const before = player.combos.size, beforeM = player.mastered.size;
  player.combos = new Set();
  player.mastered = new Set();
  for (const c of COMBOS) {
    if (!els.has(c.a) || !els.has(c.b)) continue;
    player.combos.add(c.key);
    if (mst.has(c.a) && mst.has(c.b)) player.mastered.add(c.key);
  }
  if (player.combos.size > before || player.mastered.size > beforeM) {
    Game.comboFlash = 2.6;
    Game.comboFlashMaster = player.mastered.size > beforeM;
    Sfx.play(player.mastered.size > beforeM ? 880 : 660, .3, "triangle", .9, 500);
  }
}

function recomputeStats() {
  const s = {
    damage: 1, cooldown: 1, area: 1, speed: 1, armor: 1, projSpeed: 1,
    maxHp: player.base.maxHp + (player.level - 1) * 3, regen: 0, magnet: 1, xpGain: 1, crit: .10,
    gemChance: player.cls ? player.cls.gemChance : .10,  // 직업마다 다르다
  };
  // 직업 보정을 먼저 적용하고, 그 위에 패시브를 곱한다
  const C = player.cls;
  if (C) {
    const m = C.mods;
    if (m.maxHp)    s.maxHp += m.maxHp;
    if (m.speed)    s.speed *= 1 + m.speed;
    if (m.damage)   s.damage *= 1 + m.damage;
    if (m.area)     s.area *= 1 + m.area;
    if (m.cooldown) s.cooldown *= 1 + m.cooldown;
    if (m.armor)    s.armor *= 1 - m.armor;
    if (m.regen)    s.regen += m.regen;
    if (m.crit)     s.crit += m.crit;
    if (m.xpGain)   s.xpGain *= 1 + m.xpGain;
    if (m.gemChance) s.gemChance += m.gemChance;
  }
  // 전직 보정 — 직업 보정과 같은 방식으로 누적된다.
  // 1·2차는 체감이 약해서 증폭한다 (3차는 데이터에 이미 크게 잡혀 있다).
  for (const a of player.advance) {
    const m = a.mods || {};
    const k = a.tier >= 3 ? 1 : 1.55;
    if (m.maxHp)    s.maxHp += m.maxHp * k;
    if (m.speed)    s.speed *= 1 + m.speed * k;
    if (m.damage)   s.damage *= 1 + m.damage * k;
    if (m.area)     s.area *= 1 + m.area * k;
    if (m.cooldown) s.cooldown *= 1 + m.cooldown * k;
    if (m.armor)    s.armor *= 1 - m.armor * k;
    if (m.regen)    s.regen += m.regen * k;
    if (m.crit)     s.crit += m.crit * k;
    if (m.xpGain)   s.xpGain *= 1 + m.xpGain * k;
    if (m.gemChance) s.gemChance += m.gemChance * k;
  }
  for (const p of player.passives) PASSIVES[p.key].apply(s, p.level);
  // 고대 비석 — 이번 판 동안만 남는 보정
  const M = player.monolith;
  if (M) {
    if (M.damage) s.damage *= 1 + M.damage;
    if (M.area) s.area *= 1 + M.area;
    if (M.speed) s.speed *= 1 + M.speed;
    if (M.cooldown) s.cooldown *= 1 + M.cooldown;
  }
  // 제단(영구 강화)은 마지막에 곱한다
  s.maxHp  *= 1 + .08 * Meta.lv("vigor");
  s.damage *= 1 + .05 * Meta.lv("edge");
  s.speed  *= 1 + .04 * Meta.lv("swift");
  s.xpGain *= 1 + .06 * Meta.lv("avarice");
  s.gemChance = clamp(s.gemChance + .01 * Meta.lv("avarice"), .01, 1);
  player.stats = s;
  player.hp = Math.min(player.hp, s.maxHp);
}

function addWeapon(key) {
  const w = player.weapons.find(w => w.key === key);
  if (w) w.level++;
  else player.weapons.push({ key, level: 1, timer: 0, angle: 0, fx: 0 });
  // 강화로도 조합이 열리므로 획득/강화 양쪽에서 다시 판정한다
  recomputeCombos();
}
function addTrait(key) {
  const t = player.traits.find(t => t.key === key);
  if (t) t.level++;
  else player.traits.push({ key, level: 1 });
}

/* 자세가 없는 직업(전사·추적자)과, 자세 밖에서 도는 전직 효과를 여기서 처리한다.
   매 프레임 dyn* 배수에 곱해지고, 프레임마다 초기화되므로 상태가 남지 않는다. */
function applyAdvanceEffects(p, dt, moving) {
  const s = p.stats;

  // 광전사 계열 — 피가 마를수록 빨라지고 세진다
  if (advVal("lowHpFury", false)) {
    const f = 1 - clamp(p.hp / s.maxHp, 0, 1);
    const amp = advVal("furyAmp", 1) * (1 + .25 * traitLv("warcry"));
    p.dynDmg *= 1 + .85 * f * amp;
    p.dynCd *= 1 - .38 * f;
  }
  // 검투사 계열 — 포위될수록 단단해진다
  const ca = advVal("crowdArmor", 0);
  if (ca) {
    const per = ca + traitLv("champion") * .008;
    p.dynArmor *= 1 - Math.min(.72, per * p.press);
    const cr = advVal("crowdRegen", 0);
    if (cr) p.hp = Math.min(s.maxHp, p.hp + s.maxHp * cr * p.press * dt);
  }
  if (traitLv("showman")) p.dynDmg *= 1 + .015 * traitLv("showman") * p.press;

  // 마검사 계열 — 곁의 적에게 추가 피해
  const mb = advVal("meleeBonus", 0);
  if (mb > 0 && p.press > 0)
    p.dynDmg *= 1 + (mb + .25 * traitLv("bladeDance")) * Math.min(1, p.press / 6);

  // 암살자 계열 — 집중이 찰수록 치명타
  if (advVal("focusCrit", false))
    p.dynCrit += (p.res / RES_MAX) * .35 * advVal("focusAmp", 1);
  if (traitLv("manaEdge")) p.dynCrit += .04 * traitLv("manaEdge") * Math.floor(p.channel);
  if (traitLv("shadowstep")) p.dynDmg *= 1 + .08 * traitLv("shadowstep") * Math.min(4, p.noHit / 5);
  if (traitLv("onehit")) p.dynCritMul = 2 + .4 * traitLv("onehit");

  // 사냥꾼 계열 — 발사체 강화
  const pb = advVal("projBoost", 0);
  if (pb) p.dynProjSpeed *= 1 + pb;
  p.dynPierce += advVal("pierceBonus", 0);
  if (advVal("allHoming", false)) p.dynHoming = 6.5;

  // 화상·중독 증폭
  p.dynBurnAmp = (1 + .45 * traitLv("pyreLord") + .5 * traitLv("virulence")) * advVal("burnAmp", 1);

  /* ── 3차 각성 — 수치가 아니라 규칙을 바꾸는 것들 ── */
  p.dynCrit += advVal("critAll", 0);
  p.dynCritMul += advVal("critMulBonus", 0);
  p.dynMagnet *= 1 + advVal("magnetAll", 0);
  const sh = advVal("shadowScale", 0);
  if (sh) p.dynDmg *= 1 + .1 * sh * Math.min(4, p.noHit / 5);

  // 주기 효과 — 대지 파동 / 낙뢰 / 룬 맥동
  const quake = advVal("quakeAura", 0), bolt = advVal("boltAura", 0), rune = advVal("runePulse", 0);
  if (quake || bolt || rune) {
    p.tickA -= dt;
    if (p.tickA <= 0) {
      p.tickA = quake ? 2.2 / quake : bolt ? 2.6 / bolt : 2.4 / rune;
      const dmg = (90 + p.level * 16) * s.damage * p.dynDmg;
      if (quake) {
        spawnWave({ x: p.x, y: p.y, maxR: 300 * s.area * quake, dmg, life: .45,
          color: "#d8c08a", element: "physical" });
        cam.shake = Math.max(cam.shake, 7);
      } else if (bolt) {
        const pool = nearestEnemies(p.x, p.y, 700, 6);
        for (const e of pool) { spawnBolt(e.x, e.y); damageEnemy(e, dmg, e.x, e.y - 60, 0, "storm"); }
      } else {
        spawnWave({ x: p.x, y: p.y, maxR: 260 * s.area, dmg, life: .4,
          color: "#8fb0ff", element: "frost" });
      }
    }
  }
  // 상시 빙결 — 시간의 주인
  if (advVal("freezeAura", false)) {
    const R = 340 * s.area;
    const found = hash.query(p.x, p.y, R, scratch3);
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (e.active && dist2(e.x, e.y, p.x, p.y) < R * R) e.slow = Math.max(e.slow, .4);
    }
  }
  // 주기적 무적 방패 — 일정 시간마다 한 대를 완전히 무시한다
  const gs = advVal("guardShield", 0);
  if (gs) {
    if (p.shieldOn <= 0) {
      p.shieldT -= dt;
      if (p.shieldT <= 0) { p.shieldOn = 1; p.shieldT = gs; }
    }
  } else { p.shieldOn = 0; }

  // 스킬 메아리 — 0.45초 뒤 한 번 더
  if (p.echoT > 0) {
    p.echoT -= dt;
    if (p.echoT <= 0 && p.echoSkill) { p.echoSkill.use(p); p.echoSkill = null; }
  }
}

function applyAdvance(a) {
  player.sigils = Math.max(0, player.sigils - (ADV_SIGILS[a.tier - 1] || 1));   // 단계만큼 소비한다
  player.advance.push(a);
  recomputeStats();
  // 전직은 판의 전환점이어야 한다 — 체력을 가득 채우고 주변을 쓸어버린다
  player.hp = player.stats.maxHp;
  if (a.grant) addWeapon(a.grant);
  Game.advanceFlash = 3.6;
  Game.slowmo = .9 + a.tier * .25;      // 차수가 높을수록 길게
  Game.whiteFlash = 1;
  cam.shake = 14 + a.tier * 8;
  spawnParticles(player.x, player.y, 50 + a.tier * 30, a.color, 420, 1.4, 7);
  // 각성의 파동 — 차수만큼 커지고, 3차는 실제로 적을 쓸어버린다
  spawnWave({
    x: player.x, y: player.y, maxR: 300 + a.tier * 200,
    dmg: a.tier >= 2 ? (120 + player.level * 22) * player.stats.damage : 0,
    life: .9, color: a.color, element: "holy",
  });
  player.iframe = Math.max(player.iframe, 1.2 + a.tier * .6);
  player.res = RES_MAX;                 // 새 스킬을 즉시 써볼 수 있게
  Sfx.arp([523, 659, 784, 1046, 1318, 1568], 75, .2, "triangle", .95);
}

function addPassive(key) {
  const p = player.passives.find(p => p.key === key);
  if (p) p.level++;
  else player.passives.push({ key, level: 1 });
  const before = player.stats.maxHp;
  recomputeStats();
  if (key === "vitality") player.hp = Math.min(player.stats.maxHp, player.hp + (player.stats.maxHp - before));
}

/* ---------- 게임 상태 ---------- */
const Game = {
  state: "intro",        // intro | title | altar | playing | levelup | advance | paused | dead | won
  introT: 0,             // 시작 화면 연출 시간
  time: 0, kills: 0, dmgDealt: 0,
  spawnAcc: 0, bossIdx: 0,
  choices: [], hover: -1, comboFlash: 0, comboFlashMaster: false,
  usedRebirth: false, soulsEarned: 0, soulParts: null, lastEarned: 0, houndWarn: 0,
  optFrom: "intro", optRow: 0, wipeArm: 0, traitPick: false, advanceFlash: 0, altarFlash: 0, quitArm: 0,
  lmFlash: 0, lmFlashText: "", advancePending: 0, advanceWaitT: 0, advanceWaitTier: 0, slowmo: 0, whiteFlash: 0,
  itemCd: 0, heartCd: 0,
  bestTime: Number(localStorage.getItem("ts_best") || 0),

  /* 판이 끝나면 영혼을 정산한다 (다음 판의 시작 지점이 올라간다).

     처치 수를 그대로 나누면 안 된다. 이 게임의 처치 수는 시간에 대해 폭발한다 —
     봇으로 재 보니 7분에 75,098마리였고, 옛 식(처치÷8)으로는 한 판에 9,429영혼이
     들어왔다. 제단 전체가 6,240이었으니 한 판만 잘 굴리면 전부 사 버린다.

     그래서 처치는 제곱근으로 눌러 담는다. 1,000마리 60 · 10,000마리 190 ·
     75,000마리 520 — 잘한 판이 더 주긴 하되 배수로 벌어지지는 않는다.
     대신 '얼마나 버텼는가'를 주 수입으로 삼는다. 15분은 상한이 있어 폭발하지 않는다. */
  endRun() {
    if (Attract.sim) return;            // 어트랙트 데모는 기록·영혼을 남기지 않는다
    saveBest();
    const st = Math.floor(this.time / 6);                       // 15분 완주 = 150
    const sk = Math.floor(60 * Math.sqrt(this.kills / 1000));
    const sw = this.state === "won" ? 200 : 0;
    this.soulParts = { time: st, kills: sk, win: sw };
    this.soulsEarned = st + sk + sw;
    // reset 이 지우지 않는 자리에도 남긴다 — 제단에 들어서면 어트랙트 데모가 reset 을 부른다
    this.lastEarned = this.soulsEarned;
    Meta.souls += this.soulsEarned;
    Meta.save();
  },

  // 레벨과 징표가 모두 갖춰졌을 때만 전직 화면을 연다.
  // 징표는 제단의 파수꾼이나 보스에게서 나오므로, 맵을 돌아다닐 이유가 된다.
  checkAdvance() {
    if (this.state === "advance" || this.state === "dead" || this.state === "won") return false;
    for (let tier = 1; tier <= ADV_TIERS; tier++) {
      if (player.level < ADV_LEVELS[tier - 1] || player.advance.length >= tier) continue;
      const opts = advanceOptions(tier);
      if (!opts.length) continue;
      // 시간 관문 — 레벨을 아무리 빨리 올려도 판의 1/5 · 2/5 · 3/5 · 4/5 전에는 열리지 않는다
      if (this.time < advTime(tier)) {
        this.advancePending = 0;
        this.advanceWaitT = advTime(tier) - this.time;
        this.advanceWaitTier = tier;
        return false;
      }
      this.advanceWaitT = 0;
      // 징표는 단계만큼 든다
      if (player.sigils < ADV_SIGILS[tier - 1]) { this.advancePending = tier; return false; }
      this.advancePending = 0;
      this.choices = opts;
      this.state = "advance";
      this.hover = -1;
      Sfx.levelup();
      return true;
    }
    this.advancePending = 0;
    this.advanceWaitT = 0;
    return false;
  },

  /* clsIdx 를 주면 그 직업으로 판을 깐다.
     어트랙트 데모가 전역 selectedClass 를 덮어쓰면, 타이틀에서 내가 고른 직업이
     데모가 새 판을 깔 때마다 제멋대로 바뀐다 — 실제로 그랬다. */
  reset(clsIdx) {
    for (const pool of [enemies, projectiles, slashes, waves, gems, pickups, particles, numbers, bolts, beams, eshots, hazards, fxs])
      for (const o of pool) o.active = false;
    fxLive = 0;
    floorTx = NaN; floorTy = NaN;      // 바닥 캐시 무효화
    this.time = 0; this.kills = 0; this.dmgDealt = 0; this.spawnAcc = 0; this.bossIdx = 0;

    lmState.clear(); landmarks.length = 0; structState.clear(); stActive.clear(); structures.length = 0; player.stRes = 1; obsState.clear(); obstacles.length = 0; this.lmFlash = 0; this.lmFlashText = ""; this.advancePending = 0; this.advanceWaitT = 0; this.shrinesOpened = 0; this.itemCd = 0; this.heartCd = 0; spawnedObs.length = 0; Mission.clear(); Mission.flash = 0;

  onKey(k) {
    // 브라우저는 사용자 입력 전에는 소리를 못 내게 막는다 — 첫 키에서 깨운다
    Sfx.init(); Music.start(this.state === "playing" ? "play" : "menu");
    if (k === "m") { Sfx.on = !Sfx.on; Music.fade(Sfx.on ? Music.vol() : 0); return; }   // 빠른 전체 음소거
    if (k === "n") { Opt.names = Opt.names ? 0 : 1; Opt.save(); return; }   // 몬스터 이름표
    if (k === "o" && this.state !== "options") { this.optFrom = this.state; this.state = "options"; return; }
    if (this.state === "intro") {
      if (k === "tab") { this.introFrom = "intro"; this.state = "altar"; return; }
      if (k === " " || k === "enter") { this.state = "title"; Sfx.play(520, .18, "triangle", .7, 260); return; }
      return;
    }
    if (this.state === "title") {
      if (k === "tab") { this.introFrom = "title"; this.state = "altar"; return; }
      if (k === "escape") { this.state = "intro"; return; }
      const i = "1234".indexOf(k);
      if (i >= 0 && CLASSES[i]) { selectedClass = i; return this.reset(); }
      if (k === " " || k === "enter") return this.reset();
      return;
    }
    if (this.state === "options") {
      if (k === "escape" || k === "tab" || k === "o") { this.state = this.optFrom || "intro"; return; }
      if (k === "arrowup" || k === "w") { this.optRow = (this.optRow + OPT_ROWS.length) % (OPT_ROWS.length + 1); this.optRow = (this.optRow - 1 + OPT_ROWS.length + 1) % (OPT_ROWS.length + 1); return; }
      if (k === "arrowdown" || k === "s") { this.optRow = (this.optRow + 1) % (OPT_ROWS.length + 1); return; }
      const R = OPT_ROWS[this.optRow];
      if (!R) {                                  // 마지막 줄 — 기록 지우기
        if (k === "arrowleft" || k === "arrowright" || k === "enter" || k === " ") this.wipeAsk();
        return;
      }
      if (k === "arrowleft" || k === "a") { Opt[R.key] = Math.max(0, Opt[R.key] - 1); Opt.apply(); Sfx.play(420, .04, "square", .3); return; }
      if (k === "arrowright" || k === "d") { Opt[R.key] = Math.min(R.max, Opt[R.key] + 1); Opt.apply(); Sfx.play(560, .04, "square", .3); return; }
      return;
    }
    if (this.state === "altar") {
      if (k === "tab" || k === "escape") { this.state = this.introFrom || "intro"; return; }
      const i = "123456".indexOf(k);
      if (i >= 0 && ALTAR[i]) this.buyAltar(ALTAR[i].key);
      return;
    }
    /* 판이 끝난 뒤 갈 곳이 '다시 시작' 하나뿐이었다.
       죽어서 영혼이 들어왔는데 제단으로 갈 길이 없어 새로고침 말고는 방법이 없었다. */
    if (this.state === "dead" || this.state === "won") {
      if (k === " " || k === "enter" || k === "r") return this.reset();
      if (k === "escape") { this.state = "title"; return; }
      if (k === "tab") { this.introFrom = "title"; this.state = "altar"; return; }
      return;
    }
    if (this.state === "playing" && (k === " " || k === "shift")) { useSkill(); return; }
    if (this.state === "playing" && (k === "q" || k === "e")) { useItem(); return; }
    if (this.state === "playing" && (k === "escape" || k === "p")) { this.state = "paused"; return; }
    if (this.state === "paused" && (k === "escape" || k === "p")) { this.state = "playing"; this.quitArm = 0; return; }
    if (this.state === "paused" && k === "r") {
      if (this.quitArm > 0) { this.quitArm = 0; return this.reset(); }
      this.quitArm = 2.5; Sfx.play(300, .08, "square", .4, -60); return;
    }
    if (this.state === "levelup" || this.state === "advance") {
      const i = "123".indexOf(k);
      if (i >= 0 && this.choices[i]) this.applyChoice(this.choices[i]);
    }
  },

  /* 기록 지우기는 되돌릴 수 없다 — 한 번에 지우면 안 된다.
     일시정지의 포기와 같은 방식으로 두 번 받는다. */
  wipeAsk() {
    if (this.wipeArm > 0) {
      this.wipeArm = 0;
      try { localStorage.removeItem("ts_souls"); localStorage.removeItem("ts_altar"); localStorage.removeItem("ts_best"); } catch (e) { /* 못 지워도 아래는 맞춘다 */ }
      Meta.souls = 0; Meta.levels = {}; this.bestTime = 0; this.lastEarned = 0;
      Sfx.play(180, .3, "sawtooth", .7, -60);
      return;
    }
    this.wipeArm = 3;
    Sfx.play(300, .08, "square", .4, -60);
  },

  // 제단 구입 — 키와 클릭이 같은 길을 타야 연출이 어긋나지 않는다
  buyAltar(key) {
    if (Meta.buy(key)) { this.altarFlash = 1; Sfx.play(880, .14, "triangle", .8, 300); return true; }
    Sfx.play(150, .1, "square", .35, -40);
    return false;
  },

  /* --- 레벨업 --- */
  levelUp() {
    // 한 번의 호출로 여러 레벨이 올라갈 수 있다. 고를 게 없는 레벨은 화면을 띄우지 않고
    // 조용히 넘긴다 — 안 그러면 후반에 회복 카드만 뜨는 창이 끝없이 이어져 게임이 멈춘 것처럼 보인다.
    for (let guard = 0; guard < 400; guard++) {
      player.level++;
      player.xp -= player.xpNext;
      // 2차 곡선만으로는 후반을 못 막는다 — 15분에 30만 마리를 잡으면 경험치가 수백만이 들어와
      // 레벨이 300을 넘어가고 모든 무기·패시브가 최대치가 된다(= 고를 게 없어진다).
      // 꼬리를 25레벨/×1.12 로 뒀더니 한 판에 선택 화면이 61~79번 떴다.
      // 12초에 한 번꼴이라 "플레이가 아니라 스킬 선택만 계속 누르게 된다"는 지적이 나왔다.
      // 15레벨부터 ×1.20 으로 세워 한 판을 40대 초반, 선택 화면 35~45번으로 줄인다.
      const tail = Math.pow(1.20, Math.max(0, player.level - 15));
      player.xpNext = Math.floor((5 + (player.level - 1) * 5.5 + Math.pow(player.level, 2) * .55) * tail);
      // 레벨당 최대 체력이 오르므로 여기서 다시 계산한다.
      // 오른 만큼은 그대로 채워준다 — 레벨업이 곧 한 숨 돌릴 여유가 되게.
      recomputeStats();
      player.hp = Math.min(player.stats.maxHp, player.hp + player.stats.maxHp * .06);
      // 전직 관문 — 레벨만으로는 열리지 않는다. 징표를 찾아와야 한다.
      if (this.checkAdvance()) return;
      this.choices = this.rollChoices();
      // 고를 게 남아 있으면 여기서 멈추고 선택 화면을 띄운다
      if (!this.choices.every(c => c.type === "heal")) break;
      // 전부 회복 카드 = 더 배울 게 없다. 회복만 주고 넘어간다.
      player.hp = Math.min(player.stats.maxHp, player.hp + 40);
      spawnNumber(player.x, player.y - 30, player.level + "레벨", "#ffe37a", 17);
      if (player.xp < player.xpNext) return;
    }
    this.state = "levelup";
    this.hover = -1;
    Sfx.levelup();
    spawnParticles(player.x, player.y, 24, "#ffe37a", 220, .8, 4);
  },

  rollChoices() {
    // 직업 전용 특성을 일반 카드와 같은 슬롯에서 경쟁시키면, 특성이 있는 직업만
    // 무기 강화를 덜 받아 화력이 뒤처진다(측정으로 확인). 그래서 트랙을 분리한다 —
    // 3레벨마다 한 번은 특성만 나오는 판이고, 나머지는 무기·능력만 나온다.
    const list = traitList();
    const traitPool = [];
    for (const t of list) {
      const lv = traitLv(t.key);
      if (lv < t.max) traitPool.push({ type: "trait", key: t.key, level: lv + 1, isNew: lv === 0 });
    }
    const take = arr => arr.length ? arr.splice(Math.floor(rnd(arr.length)), 1)[0] : null;

    if (player.level % 3 === 0 && traitPool.length) {
      this.traitPick = true;
      const out = [];
      while (out.length < 3 && traitPool.length) out.push(take(traitPool));
      while (out.length < 3) out.push({ type: "heal" });
      return out;
    }
    this.traitPick = false;

    const weaponPool = [], passivePool = [];
    for (const key in WEAPONS) {
      const owned = player.weapons.find(w => w.key === key);
      if (owned) { if (owned.level < MAX_LEVEL) weaponPool.push({ type: "weapon", key, level: owned.level + 1 }); }
      else if (player.weapons.length < MAX_WEAPONS) weaponPool.push({ type: "weapon", key, level: 1, isNew: true });
    }
    for (const key in PASSIVES) {
      const owned = player.passives.find(p => p.key === key);
      if (owned) { if (owned.level < MAX_LEVEL) passivePool.push({ type: "passive", key, level: owned.level + 1 }); }
      else if (player.passives.length < MAX_PASSIVES) passivePool.push({ type: "passive", key, level: 1, isNew: true });
    }

    const out = [];
    // 화력이 고사하지 않도록 무기를 최소 1개 보장
    if (weaponPool.length) out.push(take(weaponPool));
    const rest = weaponPool.concat(passivePool);
    while (out.length < 3 && rest.length) {
      const c = take(rest);
      if (c && !out.includes(c)) out.push(c);
    }
    while (out.length < 3) out.push({ type: "heal" });
    return out;
  },

  applyChoice(c) {
    if (c.tier) { applyAdvance(c); this.state = "playing"; if (player.xp >= player.xpNext) this.levelUp(); return; }
    if (c.type === "weapon") addWeapon(c.key);
    else if (c.type === "passive") addPassive(c.key);
    else if (c.type === "trait") addTrait(c.key);
    else player.hp = Math.min(player.stats.maxHp, player.hp + 40);
    this.state = "playing";
    // 레벨업 직후 경험치가 또 넘쳐 있으면 연속 레벨업
    if (player.xp >= player.xpNext) this.levelUp();
  },

  /* --- 적 스폰 --- */
  currentTypes() {
    let types = SPAWN_TABLE[0].types;
    for (const row of SPAWN_TABLE) if (this.time >= row.t) types = row.types;
    return types;
  },
  difficulty() {
    const m = this.time / 60;
    // 적 곡선은 '플레이어가 그 시각에 얼마나 강한가'에 맞춰야 한다.
    // 전직을 시간 관문(3:45 · 7:30 · 11:15)으로 옮기면서 플레이어의 힘이 크게 뒤로 밀렸는데
    // 적 곡선은 '1분대에 1차 전직을 마친 플레이어' 기준 그대로였다.
    // 그래서 계단을 옮겨도 벽은 따라 움직이기만 했다(3:36 → 4:35). 곡선 자체를 낮춘다.
    return { hp: 1 + m * .85 + Math.pow(m, 2.4) * .021, spd: 1 + m * .045, dmg: 1 + m * .13 };
  },
  targetCount() {
    return Math.min(340, Math.floor(30 + this.time / 60 * 16));
  },

  spawnEnemy(typeKey, forceX, forceY, forceRank) {
    const e = alloc(enemies); if (!e) return null;
    const T = ENEMY_TYPES[typeKey], d = this.difficulty();
    const rank = forceRank || (T.boss || typeKey === "guardian" ? RANKS.common : rollRank(this.time));
    let x, y;
    if (forceX !== undefined) { x = forceX; y = forceY; }
    else {
      // 화면 바깥 링에서 스폰 (플레이어가 보는 곳에서 튀어나오지 않게)
      const a = rnd(TAU), rad = rnd(720, 830);
      x = player.x + Math.cos(a) * rad;
      y = player.y + Math.sin(a) * rad;
    }
    e.active = true; e.id = enemyIdSeq++;
    e.x = x; e.y = y; e.vx = 0; e.vy = 0; e.kx = 0; e.ky = 0;
    e.type = T; e.boss = !!T.boss;
    e.rank = rank;
    e.xp = T.xp;                 // 개체별 값 — 분열체 자식처럼 깎이는 경우가 있다
    e.r = T.r * rank.r;
    // 보스는 기본 체력이 이미 크다(3,200~9,000). 시간 배수를 그대로 곱하면 두 번 커져서
    // 5분 보스가 20,000 이 되고, 레벨 12짜리 화력으로는 시간 안에 못 잡는다.
    // 실측: 물량을 고친 뒤에도 성기사 외 세 직업이 5:05 전후에 몰려 죽었다(= 보스 등장 시각).
    // 지수를 씌워 후반 보스는 여전히 커지되 초반 보스가 벽이 되지 않게 한다.
    e.maxHp = e.hp = T.hp * rank.hp * (e.boss ? Math.max(1, Math.pow(d.hp, .72)) : d.hp);
    e.spd = T.speed * d.spd * rnd(.92, 1.08) * (rank === RANKS.rare ? .92 : 1);
    e.dmg = T.dmg * rank.dmg * d.dmg;
    e.t1 = rnd(.4, 1.6); e.state = 0; e.gen = 0; e.hasteT = 0; e.phase = 0;
    e.introDone = false; e.rageDone = false;      // 보스 1회성 연출
    e.telT = 0; e.telX = 0; e.telY = 0; e.telR = 0;   // 예고 범위기
    e.shieldMax = e.shieldHp = T.shieldHp ? T.shieldHp * rank.hp * d.hp : 0;
    e.flash = 0; e.wob = rnd(TAU); e.slow = 0; e.burn = 0; e.burnDps = 0; e.sigilKey = null;
    e.dying = false;
    return e;
  },

  updateSpawning(dt) {
    // 보스 웨이브
    while (this.bossIdx < BOSS_TIMES.length && this.time >= BOSS_TIMES[this.bossIdx]) {
      this.bossIdx++;
      const b = this.spawnEnemy(BOSS_ORDER[Math.min(this.bossIdx - 1, BOSS_ORDER.length - 1)]);
      // 1번째 보스는 배수 없음, 이후 보스만 강해진다 (5분 구간의 난이도 스파이크 완화)
      if (b) { b.maxHp = b.hp = b.hp * (1 + (this.bossIdx - 1) * .6); cam.shake = 12; Sfx.boss(); }
      for (let i = 0; i < 8 + this.bossIdx * 6; i++) this.spawnEnemy(pick(this.currentTypes()));
    }

    let alive = 0;
    for (const e of enemies) if (e.active) alive++;
    const want = this.targetCount();
    if (alive < want) {
      this.spawnAcc += dt * (9 + this.time / 60 * 4);
      while (this.spawnAcc >= 1 && alive < want) {
        this.spawnAcc -= 1; alive++;
        this.spawnEnemy(pick(this.currentTypes()));
      }
    } else this.spawnAcc = 0;

    // 1차 각성 이후 30초마다 사냥개 무리 — 플레이어보다 빨라서 계속 도망만 칠 수 없다.
    // 각성 전에 풀면 대응 수단이 없는 채로 맞는다.
    const ht = Math.floor(this.time), pht = Math.floor(this.time - dt);
    if (ht !== pht && this.time >= 300 && ht % 30 === 0) {
      const a = rnd(TAU), n = 8 + Math.floor((this.time - 300) / 50);
      for (let i = 0; i < n; i++) {
        const aa = a + rnd(-.7, .7), rad = rnd(820, 980);
        this.spawnEnemy("hound", player.x + Math.cos(aa) * rad, player.y + Math.sin(aa) * rad);
      }
      this.houndWarn = 2.4;
      Sfx.play(240, .5, "sawtooth", .7, -120);
    }


    // 30초마다 소규모 러시 (한쪽 방향에서 몰려옴)
    const t = Math.floor(this.time), pt = Math.floor(this.time - dt);
    if (t !== pt && t > 0 && t % 24 === 0) {
      const a = rnd(TAU);
      for (let i = 0; i < 18 + t / 14; i++) {
        const aa = a + rnd(-.5, .5), rad = rnd(780, 950);
        this.spawnEnemy(pick(this.currentTypes()), player.x + Math.cos(aa) * rad, player.y + Math.sin(aa) * rad);
      }
    }
  },
};

/* ---------- 업데이트 ---------- */
function update(dt) {
  if (Game.state !== "playing") return;

  Game.time += dt;
  if (Game.time >= RUN_TIME) { Game.state = "won"; Game.endRun(); return; }
  Game.updateSpawning(dt);

  const s = player.stats;

  /* 1. 플레이어 이동 · 자원 */
  const mv = inputVector();
  if (mv.x || mv.y) { player.faceX = mv.x; player.faceY = mv.y; player.walk += dt * 10; }
  if (mv.x) player.flip = mv.x < 0;
  if (player.dash > 0) {
    // 돌진 중에는 입력을 무시하고 고정 방향으로 밀려난다
    player.dash -= dt;
    player.x += player.dashX * 940 * dt;
    player.y += player.dashY * 940 * dt;
    spawnParticles(player.x, player.y, 1, "#ff8a5c", 60, .3, 3);
  } else {
    const tspd = player.terrainSpeed || 1;      // 지형 감속 (가시덤불 · 늪)
    player.x += mv.x * player.base.speed * s.speed * player.dynSpeed * tspd * dt;
    player.y += mv.y * player.base.speed * s.speed * player.dynSpeed * tspd * dt;
  }
  // 정지 지속 시간 — 기사의 방벽과 마법사의 영창이 모두 여기에 걸린다
  const moving = !!(mv.x || mv.y) || player.dash > 0;
  player.stillTime = moving ? 0 : player.stillTime + dt;
  player.iframe = Math.max(0, player.iframe - dt);
  player.hurtFlash = Math.max(0, player.hurtFlash - dt);
  player.actT = Math.max(0, player.actT - dt);
  player.castT = Math.max(0, player.castT - dt);
  player.moving = moving;
  if (s.regen) player.hp = Math.min(s.maxHp, player.hp + s.regen * dt);
  updateResource(dt);
  Mission.update(dt);
  // 음악은 상황을 따라간다 — 보스가 살아 있으면 두꺼워진다
  {
    let bossAlive = false;
    for (const e of enemies) if (e.active && e.boss) { bossAlive = true; break; }
    Music.setMode(bossAlive ? "boss" : "play");
  }
  if (Game.itemCd > 0) Game.itemCd = Math.max(0, Game.itemCd - dt);
  if (Game.heartCd > 0) Game.heartCd = Math.max(0, Game.heartCd - dt);

  // 시간 관문이 풀리는 순간을 놓치지 않게 — 다음 레벨업까지 기다릴 필요가 없다
  if (Game.advanceWaitT > 0 && Game.time >= advTime(Game.advanceWaitTier)) Game.checkAdvance();

  // 지형지물 — 근처 칸만 실체화하고 닿으면 발동
  updateLandmarks();
  updateStructures();
  updateObstacles();
  pushOutOfObstacles(player, player.r);
  /* 막지 않는 지형의 효과.
     막는 것만 있으면 지형은 '피해 다니는 것'뿐이지만,
     밟을지 말지를 고르게 하면 지형이 판단거리가 된다. */
  player.terrainSpeed = 1;
  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    const K = ob.K;
    if (!K.hurt && !K.slow && !K.burn) continue;
    const rr = ob.r + player.r;
    const inside = dist2(player.x, player.y, ob.x, ob.y) < rr * rr;

    // 화톳불 — 곁을 지나는 적을 태운다. 플레이어에겐 무해하니 '적을 끌고 오는' 자산이 된다.
    if (K.burn) {
      // obstacles 배열은 매 프레임 새로 만들어진다. 타이머를 그 임시 객체에 두면
      // 매 프레임 0 이 되어 스로틀이 전혀 안 걸린다 — 프레임을 넘어 사는 건 st 뿐이다.
      ob.st.burnT = (ob.st.burnT || 0) - dt;
      if (ob.st.burnT <= 0) {
        ob.st.burnT = .45;
        const near = hash.query(ob.x, ob.y, ob.r + 34, scratch2);
        for (let j = 0; j < near.length; j++) {
          const en = near[j];
          const er = ob.r + en.r + 12;
          if (en.active && dist2(en.x, en.y, ob.x, ob.y) < er * er)
            damageEnemy(en, 14 + Game.time * .5, ob.x, ob.y, 20, "fire");
        }
      }
      continue;
    }
    if (!inside) continue;

    if (K.hurt) {                       // 가시덤불 — 아프고 느려진다
      player.terrainSpeed = Math.min(player.terrainSpeed, .55);
      player.thornTick = (player.thornTick || 0) - dt;
      if (player.thornTick <= 0) {
        player.thornTick = .55;
        hurtPlayer(6 + Game.time * .035, " 가시");
        spawnParticles(player.x, player.y, 4, "#7ea85c", 120, .3, 3);
      }
    } else if (K.slow) {                // 늪 — 아프진 않지만 모두가 느려진다
      player.terrainSpeed = Math.min(player.terrainSpeed, .5);
      const near = hash.query(ob.x, ob.y, ob.r + 20, scratch2);
      for (let j = 0; j < near.length; j++) {
        const en = near[j];
        const er = ob.r + en.r;
        if (en.active && dist2(en.x, en.y, ob.x, ob.y) < er * er) en.slow = Math.max(en.slow, .45);
      }
    }
  }
  for (const lm of landmarks) {
    const rr = lm.r + player.r + 6;
    if (dist2(lm.x, lm.y, player.x, player.y) < rr * rr) touchLandmark(lm);
  }
  // 구조물 — 가까이 가면 켜지고, 켜져 있는 동안 효과가 붙는다
  for (const s of structures) {
    const rr = s.r * .72 + player.r;
    if (!s.st && dist2(s.x, s.y, player.x, player.y) < rr * rr) activateStructure(s);
  }
  if (player.buffFury > 0) player.buffFury -= dt;
  if (player.buffWard > 0) player.buffWard -= dt;
  // 흡혈은 초당 상한을 둬서 무한 회복이 되지 않게 한다
  player.leechBudget = Math.min(s.maxHp * .05, player.leechBudget + s.maxHp * .05 * dt);
  if (player.carnageTimer > 0) player.carnageTimer -= dt;
  else if (player.carnage > 0) player.carnage = Math.max(0, player.carnage - dt * .12);


  /* 2. 공간 해시 재구축 */
  hash.clear();
  for (const e of enemies) if (e.active) hash.insert(e);

  /* 2-b. 직업 자세 · 전직 효과 — 매 프레임 다시 계산되는 배수 */
  player.dynDmg = 1; player.dynCd = 1; player.dynArmor = 1; player.frostVeil = 0;
  player.dynPierce = 0; player.dynSpeed = 1; player.dynMagnet = 1;
  player.dynCrit = 0; player.dynCritMul = 2; player.dynProjSpeed = 1;
  player.dynHoming = 0; player.dynBurnAmp = 1;
  /* 구조물은 반드시 이 초기화 뒤에 와야 한다. 앞에 두면 버프를 곱해도 같은 프레임
     끝에서 지워진다 — 지형 감속이 한 번도 작동하지 않았던 것과 같은 함정이고,
     실제로 수호 성채의 방어 배수가 1.00 으로 측정됐다. */
  player.stRes = 1;
  updateStructureEffects(dt);
  // 곁에 붙은 적 수는 여러 직업·전직이 함께 쓰므로 공용으로 한 번만 센다
  {
    const R = 155 * s.area;
    const found = hash.query(player.x, player.y, R, scratch3);
    let n = 0;
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (e.active && dist2(e.x, e.y, player.x, player.y) < R * R) n++;
    }
    player.press = Math.min(14, n);
  }
  if (player.cls && player.cls.stance) player.cls.stance.update(player, dt, moving);
  if (player.advance.length) applyAdvanceEffects(player, dt, moving);
  if (player.buffFury > 0) player.dynCd *= .4;      // 광란의 물약
  if (player.buffWard > 0) player.dynArmor *= .4;   // 수호의 부적

  /* 3. 무기 */
  for (const w of player.weapons) {
    const def = WEAPONS[w.key];
    if (def.passiveUpdate) { def.passiveUpdate(player, w, dt); continue; }
    if (w.fx > 0) w.fx -= dt;
    w.timer -= dt;
    if (w.timer <= 0) {
      w.timer += Math.max(.06, def.cd[w.level - 1] * s.cooldown * player.dynCd);
      if (player.actT <= 0)
        spawnFx(fxKey("cast", def.element), player.x + player.faceX * 15, player.y - 4, 30, 0);
      player.actT = ACT_DUR;
      def.fire(player, w);
    }
  }

  /* 4. 발사체 */
  for (const p of projectiles) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; continue; }
    if (p.homing) {
      p.retarget -= dt;
      if ((!p.target || !p.target.active) && p.retarget <= 0) {
        p.retarget = .2;                     // 재탐색은 초당 5회로 제한
        p.target = nearestEnemies(p.x, p.y, 800, 1)[0] || null;
      }
      if (p.target) {
        const want = Math.atan2(p.target.y - p.y, p.target.x - p.x);
        const cur = Math.atan2(p.vy, p.vx);
        let diff = ((want - cur + Math.PI * 3) % TAU) - Math.PI;
        const na = cur + clamp(diff, -p.homing * dt, p.homing * dt);
        const sp = Math.hypot(p.vx, p.vy);
        p.vx = Math.cos(na) * sp; p.vy = Math.sin(na) * sp;
        p.angle = na;
      }
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === "dagger") p.angle = Math.atan2(p.vy, p.vx);
    else p.angle += p.spin * dt;

    // 지형과의 상호작용 — 종류마다 다르다
    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      const rr = p.r + ob.r;
      if (dist2(p.x, p.y, ob.x, ob.y) >= rr * rr) continue;

      if (ob.K.reflect) {
        // 수정 기둥 — 마법이 튕겨 나간다. 각도만 뒤집으면 기둥 안에 갇히므로
        // 법선 방향으로 반사하고 표면 밖으로 밀어낸다.
        const nx = (p.x - ob.x) / (Math.hypot(p.x - ob.x, p.y - ob.y) || 1);
        const ny = (p.y - ob.y) / (Math.hypot(p.x - ob.x, p.y - ob.y) || 1);
        const dot = p.vx * nx + p.vy * ny;
        if (dot < 0) {                        // 다가올 때만 튕긴다
          p.vx -= 2 * dot * nx; p.vy -= 2 * dot * ny;
          p.angle = Math.atan2(p.vy, p.vx);
          p.x = ob.x + nx * (rr + 1); p.y = ob.y + ny * (rr + 1);
          p.bounced = (p.bounced || 0) + 1;
          p.hitIds.clear();                   // 튕긴 뒤에는 같은 적을 다시 때릴 수 있다
          spawnParticles(p.x, p.y, 4, "#bfefff", 150, .3, 3);
          Sfx.throttled("ref", 70, () => Sfx.play(880, .08, "triangle", .3, 300));
          if (p.bounced > 3) p.active = false;
        }
        damageObstacle(ob, p.dmg * .5);
        break;
      }
      if (ob.K.breakable) {
        damageObstacle(ob, p.dmg * .8);
        spawnParticles(p.x, p.y, 2, ob.K.color, 110, .25, 2.5);
        if (--p.pierce <= 0) { p.active = false; break; }
      } else if (ob.K.stop) {
        // 신전 기둥·폐허는 발사체를 막는다 — 뒤에 숨은 적은 못 맞힌다
        spawnParticles(p.x, p.y, 3, "#cfcfe0", 120, .25, 2.5);
        p.active = false; break;
      }
    }
    if (!p.active) continue;

    const found = hash.query(p.x, p.y, p.r + 26, scratch);
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (!e.active || p.hitIds.has(e.id)) continue;
      const rr = p.r + e.r;
      if (dist2(p.x, p.y, e.x, e.y) < rr * rr) {
        p.hitIds.add(e.id);
        damageEnemy(e, p.dmg, p.x, p.y, p.kind === "flame" ? 40 : 150, p.element);
        spawnParticles(p.x, p.y, 3, p.color, 130, .25, 2.5);
        if (--p.pierce <= 0) { p.active = false; break; }
      }
    }
  }

  /* 5. 채찍 참격 */
  for (const sl of slashes) {
    if (!sl.active) continue;
    sl.life -= dt;
    if (sl.life <= 0) { sl.active = false; continue; }
    sl.x = player.x; sl.y = player.y;
    const cx = sl.x + Math.cos(sl.ang) * sl.len * .5;
    const cy = sl.y + Math.sin(sl.ang) * sl.len * .5;
    const found = hash.query(cx, cy, sl.len * .6, scratch);
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (!e.active || sl.hitIds.has(e.id)) continue;
      // 부채꼴 판정: 거리 + 각도
      const dx = e.x - sl.x, dy = e.y - sl.y;
      const d = Math.hypot(dx, dy);
      if (d > sl.len + e.r) continue;
      let da = Math.abs(((Math.atan2(dy, dx) - sl.ang + Math.PI * 3) % TAU) - Math.PI);
      if (da < .62) {
        sl.hitIds.add(e.id);
        damageEnemy(e, sl.dmg, sl.x, sl.y, 260, sl.element);
        // 3차 각성: 참격이 적중하면 연쇄한다
        if (advVal("chainSlash", false) && Math.random() < .16 && sl.dmg > 4)
          spawnSlash(player, Math.atan2(e.y - player.y, e.x - player.x) + rnd(-.7, .7),
                     sl.dmg * .55, sl.len * .8, 1.0, sl.element);
      }
    }
  }

  /* 5-b. 파동 (피의 낫 · 스킬 · 폭발 연쇄) */
  for (const wv of waves) {
    if (!wv.active) continue;
    wv.life -= dt;
    if (wv.life <= 0) { wv.active = false; continue; }
    const t = 1 - wv.life / wv.maxLife;
    wv.r = wv.maxR * Math.sqrt(t);          // 처음엔 빠르게, 끝에선 천천히 퍼진다
    for (let i = 0; i < obstacles.length; i++) {
      const o = obstacles[i];
      if (o.wall || wv.hitIds.has("o" + o.key)) continue;
      const rr = wv.r + o.r;
      if (dist2(o.x, o.y, wv.x, wv.y) < rr * rr) {
        wv.hitIds.add("o" + o.key);
        damageObstacle(o, wv.dmg * .6);
      }
    }
    const found = hash.query(wv.x, wv.y, wv.r + 30, scratch);
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (!e.active || wv.hitIds.has(e.id)) continue;
      const rr = wv.r + e.r;
      if (dist2(e.x, e.y, wv.x, wv.y) < rr * rr) {
        wv.hitIds.add(e.id);
        damageEnemy(e, wv.dmg, wv.x, wv.y, 200, wv.element);
        if (wv.heal) player.hp = Math.min(s.maxHp, player.hp + wv.heal);
      }
    }
  }

  /* 5-c. 돌진 충돌 */
  if (player.dash > 0) {
    const found = hash.query(player.x, player.y, 46, scratch);
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (!e.active || player.dashHit.has(e.id)) continue;
      const rr = 34 + e.r;
      if (dist2(e.x, e.y, player.x, player.y) < rr * rr) {
        player.dashHit.add(e.id);
        damageEnemy(e, player.dashDmg * (1 + .4 * traitLv("charge")), player.x, player.y, 420, "physical");
      }
    }
  }

  /* 6. 적 */
  const sepR = 26;
  for (const e of enemies) {
    if (!e.active) continue;
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;

    // 너무 멀어지면 반대편 링으로 재배치 (스폰 비용 절약)
    if (d > 1500) {
      const a = rnd(TAU), rad = rnd(760, 880);
      e.x = player.x + Math.cos(a) * rad; e.y = player.y + Math.sin(a) * rad;
      continue;
    }

    e.wob += dt * 6;
    if (e.hasteT > 0) e.hasteT -= dt;
    // 고유 행동 — false 를 돌려주면 이번 프레임은 스스로 움직인다
    if (e.type.think && e.type.think(e, dt, d) === false) {
      if (e.flash > 0) e.flash -= dt;
      continue;
    }
    if (e.slow > 0) e.slow -= dt;
    if (e.burn > 0) {
      e.burn -= dt;
      e.hp -= e.burnDps * (player.dynBurnAmp || 1) * dt;
      if (Math.random() < dt * 7) spawnParticles(e.x, e.y, 1, "#ff8a3c", 70, .3, 2);
      if (e.hp <= 0) { killEnemy(e, "fire"); continue; }
    }
    const spd = (e.slow > 0 ? e.spd * SLOW_MUL : e.spd) * (e.hasteT > 0 ? 1.45 : 1);
    /* 넉백이 살아 있는 동안에는 추격을 그만큼 눌러 준다.

       예전에는 추격 속도를 그대로 두고 넉백을 더하기만 했다. 밀린 만큼 곧바로
       걸어 돌아오니 '맞은 쪽으로 밀린다'가 화면에서 사라졌다.

       분모에 적의 속도를 넣는 이유: 빠른 적일수록 같은 넉백에 덜 밀려야 한다.

       하한 0.6 을 두는 이유: 넉백은 잠깐 비틀거리는 것이지 영영 못 오게 하는 것이 아니다.
       완전히 0 으로 두면 사격이 이어지는 동안 아무도 다가오지 못해 장르가 바뀐다.

       0.35 도 재 봤지만(성역 한 대 8.3px 대 7.7px) 0.6 을 택했다. 억제를 세게 걸수록
       게임이 쉬워지는데, 그 '얼마나'를 이 저장소의 봇으로는 잴 수 없기 때문이다
       (tests/bot.js 는 사거리를 벌리는 봇이라 근접 무기를 아예 못 쓴다 — 전사 8판 중
       7판이 5분 내내 1레벨·3~13킬로 끝난다). 못 재는 값은 작게 잡는다. */
    const kmag = Math.hypot(e.kx, e.ky);
    const chase = kmag > 8 ? Math.max(.6, 1 - kmag / (spd * 2.2 + 40)) : 1;
    let vx = dx / d * spd * chase, vy = dy / d * spd * chase;

    // 서로 겹치지 않도록 밀어내기
    const near = hash.query(e.x, e.y, sepR + e.r, scratch2);
    for (let i = 0; i < near.length; i++) {
      const o = near[i];
      if (o === e || !o.active) continue;
      const ox = e.x - o.x, oy = e.y - o.y;
      const od2 = ox * ox + oy * oy;
      const min = (e.r + o.r) * .85;
      if (od2 < min * min && od2 > .01) {
        const od = Math.sqrt(od2), push = (min - od) / min * 90;
        vx += ox / od * push; vy += oy / od * push;
      }
    }

    e.x += (vx + e.kx) * dt; e.y += (vy + e.ky) * dt;
    if (obstacles.length) pushOutOfObstacles(e, e.r);
    /* 감쇠를 0.86 에서 0.90 으로 늦춘다. 한 번의 넉백이 실제로 옮기는 거리는
       세기 K 에 대해 K/60/(1-감쇠) 다 — 0.86 이면 K×0.12, 0.90 이면 K×0.17.
       세기 40 짜리 성역은 4.8px, 즉 픽셀아트 기준 1.6칸이었다. 안 보이는 게 당연했다. */
    e.kx *= .90; e.ky *= .90;
    if (e.flash > 0) e.flash -= dt;

  }

  /* 6-b. 접촉 피해 — 몇 마리에게 둘러싸였는지가 피해량을 정한다.
     무적 시간만 두면 1마리든 300마리든 위험이 같아져, 이 장르의 핵심 위협이 사라진다. */
  if (player.iframe <= 0 && player.dash <= 0) {
    const touch = hash.query(player.x, player.y, player.r + 46, scratch);
    let count = 0, worst = 0;
    for (let i = 0; i < touch.length; i++) {
      const e = touch[i];
      if (!e.active) continue;
      const rr = e.r + player.r;
      if (dist2(e.x, e.y, player.x, player.y) < rr * rr) { count++; if (e.dmg > worst) worst = e.dmg; }
    }
    if (count > 0) {
      // 포위 위협은 90초에 걸쳐 서서히 켠다. 시작 직후엔 무기 레벨이 0이라
      // 4.2배를 그대로 받으면 체력이 낮은 직업이 20초 안에 죽는다.
      const ramp = Math.min(1, Game.time / 90);
      const crowd = Math.min(4.2, 1 + .34 * (count - 1) * ramp);
      hurtPlayer(worst * crowd, count > 2 ? " ×" + count : "");
      if (Game.state === "dead") return;
    }
  }

  /* 6-c. 적이 쏜 탄 */
  for (const p of eshots) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; continue; }
    // 서리 장막 — 영창 2단계부터 날아오는 탄도 얼어붙는다.
    // 사수는 430px 밖에서 쏘는데 영창의 냉기는 160px 까지밖에 안 닿는다.
    // 즉 마법사의 유일한 방어 수단이 자기 천적에게는 원리상 닿지 않았다.
    // 계측하면 마법사가 받는 피해의 대부분이 적 탄이었다 — 멈춰 있는 자세를 벌하는 게
    // 설계 의도지만, 대응할 방법이 아예 없으면 그건 벌이 아니라 사고다.
    let veil = 1;
    if (player.frostVeil > 0 && dist2(p.x, p.y, player.x, player.y) < player.frostVeil * player.frostVeil)
      veil = .45;
    p.x += p.vx * veil * dt; p.y += p.vy * veil * dt;
    // 적 탄도 지형을 지킨다 — 기둥 뒤로 숨는 것이 대응 수단이 된다
    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      if (!ob.K.stop && !ob.K.reflect) continue;
      const rr = 6 + ob.r;
      if (dist2(p.x, p.y, ob.x, ob.y) >= rr * rr) continue;
      if (ob.K.reflect) {                     // 수정에 튕긴 적 탄은 적을 때린다
        const L = Math.hypot(p.x - ob.x, p.y - ob.y) || 1;
        const nx = (p.x - ob.x) / L, ny = (p.y - ob.y) / L;
        const dot = p.vx * nx + p.vy * ny;
        if (dot < 0) {
          p.vx -= 2 * dot * nx; p.vy -= 2 * dot * ny;
          p.x = ob.x + nx * (rr + 1); p.y = ob.y + ny * (rr + 1);
          spawnParticles(p.x, p.y, 3, "#bfefff", 140, .3, 3);
        }
      } else { p.active = false; }
      break;
    }
    if (!p.active) continue;
    const rr = p.r + player.r;
    if (dist2(p.x, p.y, player.x, player.y) < rr * rr) {
      p.active = false;
      hurtPlayer(p.dmg);
      spawnParticles(p.x, p.y, 6, p.color, 140, .3, 3);
      if (Game.state === "dead") return;
    }
  }

  /* 6-d. 바닥 장판 */
  for (const h of hazards) {
    if (!h.active) continue;
    h.life -= dt;
    if (h.life <= 0) { h.active = false; continue; }
    h.tick -= dt;
    if (h.tick <= 0 && dist2(h.x, h.y, player.x, player.y) < (h.r + player.r) * (h.r + player.r)) {
      h.tick = .5;
      hurtPlayer(h.dmg);
      if (Game.state === "dead") return;
    }
  }

  /* 7. 경험치 보석 */
  const magnetR = 92 * s.magnet * player.dynMagnet;
  for (const g of gems) {
    if (!g.active) continue;
    g.bob += dt * 5;
    const d2 = dist2(g.x, g.y, player.x, player.y);
    if (g.pulled || d2 < magnetR * magnetR) {
      g.pulled = true;
      const a = Math.atan2(player.y - g.y, player.x - g.x);
      const sp = 260 + 700 / (Math.sqrt(d2) + 40) * 40;
      g.vx = lerp(g.vx, Math.cos(a) * sp, .25);
      g.vy = lerp(g.vy, Math.sin(a) * sp, .25);
    } else { g.vx *= .9; g.vy *= .9; }
    g.x += g.vx * dt; g.y += g.vy * dt;
    if (d2 < 400) {
      g.active = false;
      player.xp += g.value * s.xpGain * XP_RATE;
      Sfx.pickup();
      if (player.xp >= player.xpNext) { Game.levelUp(); return; }
    }
  }

  /* 8. 아이템 */
  for (const pk of pickups) {
    if (!pk.active) continue;
    pk.bob += dt * 4;
    if (dist2(pk.x, pk.y, player.x, player.y) < 900) {
      pk.active = false;
      if (pk.kind === "heart") {
        const heal = Math.round(s.maxHp * .3);
        player.hp = Math.min(s.maxHp, player.hp + heal);
        spawnNumber(player.x, player.y - 26, "+" + heal, "#5fe08a", 18);
      } else if (pk.kind === "vacuum") {
        for (const g of gems) if (g.active) g.pulled = true;      // 화면의 모든 보석을 끌어옴
        spawnNumber(player.x, player.y - 26, "영혼 흡수!", "#9be7ff", 18);
      } else if (pk.kind === "sigil") {
        player.sigils++;
        spawnNumber(player.x, player.y - 30, "전직의 징표!", "#ffd34d", 21);
        Game.lmFlash = 3; Game.lmFlashText = "전직의 징표를 얻었다 (" + player.sigils + "개)";
        Game.checkAdvance();
      } else if (pk.kind.startsWith("item:")) {
        const key = pk.kind.slice(5), C = CONSUMABLES[key];
        if (player.items.length < MAX_ITEMS) {
          player.items.push(key);
          spawnNumber(player.x, player.y - 26, C.name, C.color, 17);
        } else {
          // 소지품이 가득 차 있으면 그 자리에서 쓴다 — 주웠는데 사라지면 억울하다
          C.use(player);
          spawnNumber(player.x, player.y - 26, C.name + " 즉시 사용", C.color, 17);
        }
      }
      Sfx.play(1046, .12, "sine", .8, 400);
    }
  }

  /* 9. 이펙트 */
  for (const p of particles) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= p.drag; p.vy *= p.drag;
    /* 중력. 위에서 내려다보는 화면이지만 파편이 '아래로 처지면' 무게가 생긴다 —
       실제 물리가 아니라 눈이 그렇게 읽는다. */
    if (p.g) p.vy += p.g * dt;
  }
  for (const n of numbers) {
    if (!n.active) continue;
    n.life -= dt;
    if (n.life <= 0) { n.active = false; continue; }
    n.y += n.vy * dt; n.vy *= .93;
  }
  for (const f of fxs) {
    if (!f.active) continue;
    f.life -= dt;
    if (f.life <= 0) { f.active = false; fxLive--; }
  }
  for (const b of beams) {
    if (!b.active) continue;
    b.life -= dt;
    if (b.life <= 0) b.active = false;
  }
  for (const b of bolts) {
    if (!b.active) continue;
    b.life -= dt;
    if (b.life <= 0) b.active = false;
  }

  /* 10. 카메라 */
  cam.x = lerp(cam.x, player.x - W / 2, .16);
  cam.y = lerp(cam.y, player.y - H / 2, .16);
  cam.shake *= .88;
  player.sx = player.x - cam.x; player.sy = player.y - cam.y;
}

/* 접촉·적 탄·장판이 모두 같은 규칙을 통과하도록 한 곳에 모은다.
   raw 는 방어력 적용 전 값. */
function hurtPlayer(raw, tag) {
  if (player.iframe > 0 || player.dash > 0 || Game.state !== "playing") return;
  const base = raw * player.stats.armor;
  const reduced = base * player.dynArmor;      // 방벽 등 자세로 줄인 값
  // 한 대에 풀피가 날아가면 대응할 기회 없이 억울하게 죽는다.
  // 최대 체력의 28% 로 상한을 둬서 풀피에서 최소 네 대를 버틴다.
  // 45% 로 뒀더니 체력 80 인 추적자만 파수꾼 접촉 두 대(=60)에 무너졌다.
  // 위협은 '한 대'가 아니라 '계속 맞는 것'에서 나와야 한다.
  let dmg = Math.min(reduced, player.stats.maxHp * .28);
  const blocked = base - reduced;
  // 3차 각성의 방패 — 한 대를 통째로 무시한다
  if (player.shieldOn > 0) {
    player.shieldOn = 0;
    dmg = 0;
    spawnNumber(player.x, player.y - 30, "방어!", "#8fd0ff", 20);
    spawnWave({ x: player.x, y: player.y, maxR: 220, dmg: 0, life: .3, color: "#8fd0ff", element: "frost" });
  }
  player.hp -= dmg;
  player.iframe = .6; player.hurtFlash = .35;
  player.onHurt();
  if (advVal("runeBurst", false))
    spawnWave({ x: player.x, y: player.y, maxR: 220 * player.stats.area,
      dmg: (40 + player.level * 6) * player.stats.damage * (1 + .5 * traitLv("runeGuard")),
      life: .35, color: "#9fb8ff", element: "frost" });
  cam.shake = Math.min(16, 4 + dmg * .22);
  spawnNumber(player.x, player.y - 22, "-" + Math.round(dmg) + (tag || ""), "#ff6b6b", 17);
  Sfx.hurt();
  if (blocked > 0 && player.cls && player.cls.stance && player.cls.stance.onBlocked)
    player.cls.stance.onBlocked(player, blocked);
  if (player.hp <= 0) onPlayerDown();
}

// 제단의 '부활'을 한 번 쓰거나, 없으면 게임 오버
function onPlayerDown() {
  Music.setMode("menu");
  if (Meta.lv("rebirth") > 0 && !Game.usedRebirth) {
    Game.usedRebirth = true;
    player.hp = player.stats.maxHp * .5;
    player.iframe = 3;
    spawnWave({ x: player.x, y: player.y, maxR: 420, dmg: 400, life: .6, color: "#ffe9b8", element: "holy" });
    cam.shake = 20;
    spawnNumber(player.x, player.y - 40, "부활!", "#ffd34d", 26);
    Sfx.levelup();
    return;
  }
  player.hp = 0;
  Game.state = "dead";
  Game.endRun();
  Sfx.dead();
}

function saveBest() {
  if (Game.time > Game.bestTime) {
    Game.bestTime = Game.time;
    try { localStorage.setItem("ts_best", String(Math.floor(Game.time))); } catch (e) { /* 저장 불가여도 무시 */ }
  }
}

/* ---------- 어트랙트 모드 ----------
   메뉴 뒤에서 실제 게임이 굴러간다. 시뮬레이션은 진짜와 같은 것을 쓴다 —
   따로 만든 '데모용 가짜'는 게임이 바뀔 때마다 어긋나기 때문이다.

   다만 데모가 진짜인 척하면 안 되므로 넷을 막는다.
     1. 기록·영혼 정산   데모가 최고 기록을 갱신하면 안 된다
     2. 소리             메뉴에서 전투음이 나면 안 된다
     3. 화면 흔들림       메뉴가 흔들리면 글씨를 읽을 수 없다
     4. 음악 전환         보스가 떠도 메뉴 음악이 유지돼야 한다 */
const Attract = {
  on: false, sim: false, life: 0, botT: 0, bx: 1, by: 0,

  start() {
    const keep = Game.state;
    Game.reset(Math.floor(Math.random() * CLASSES.length));   // 끝에서 state 를 playing 으로 바꾼다
    Game.state = keep;                  // 메뉴 상태를 곧바로 되돌린다
    // 1레벨 빈 벌판은 데모가 안 된다. 볼거리가 있는 중반에서 시작한다.
    Game.time = 150 + Math.random() * 190;
    player.level = 9 + Math.floor(Math.random() * 9);
    const keys = Object.keys(WEAPONS);
    for (let i = 0; i < 3; i++) addWeapon(keys[Math.floor(Math.random() * keys.length)]);
    for (const w of player.weapons) w.level = Math.min(MAX_LEVEL, 2 + Math.floor(Math.random() * 4));
    recomputeStats();
    player.hp = player.stats.maxHp;
    this.on = true; this.life = 0; this.botT = 0;
  },

  stop() { this.on = false; },

  /* 봇 — 여덟 방향 중 적이 가장 적은 쪽으로 흘러간다.
     정교할 이유가 없다. 화면이 심심하지만 않으면 된다. */
  steer() {
    let best = 0, bestScore = -1e9;
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU;
      const tx = player.x + Math.cos(a) * 210, ty = player.y + Math.sin(a) * 210;
      let score = -Math.hypot(tx, ty) * .04;          // 원점에서 너무 멀어지지 않게
      const near = hash.query(tx, ty, 190, scratch3);
      for (let j = 0; j < near.length; j++) if (near[j].active) score -= 7;
      if (score > bestScore) { bestScore = score; best = a; }
    }
    this.bx = Math.cos(best); this.by = Math.sin(best);
  },

  update(dt) {
    this.life += dt;
    this.botT -= dt;
    if (this.botT <= 0) { this.botT = .45 + Math.random() * .7; this.steer(); }

    const keepState = Game.state, keepShake = cam.shake, keepMode = Music.mode;
    this.sim = true;
    Game.state = "playing";
    update(dt);
    // 레벨업·전직 화면이 열리면 알아서 고른다 — 메뉴 위에 겹치면 안 된다
    let g = 0;
    while ((Game.state === "levelup" || Game.state === "advance") && g++ < 8)
      Game.applyChoice(Game.choices[Math.floor(Math.random() * Game.choices.length)]);
    const ended = Game.state === "dead" || Game.state === "won";
    this.sim = false;
    Game.state = keepState;
    cam.shake = keepShake;
    if (Music.mode !== keepMode) Music.setMode(keepMode);

    // 죽었거나, 한 판이 너무 길어지면 새 판을 깐다 (직업도 바뀐다)
    if (ended || this.life > 75) this.start();
  },
};

/* ---------- 렌더 ---------- */
const FONT = '"Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif';

/* 바닥 — 아틀라스 타일.
   예전에는 체크무늬 사각형 + 머리카락 굵기 격자선이라, 주변이 전부 픽셀인데
   바닥만 '비어 있는 판'으로 보였다.

   화면을 매 프레임 타일로 채우면 drawImage 가 275번이고 화면 한 장을 통째로
   덧칠하는 셈이라 비싸다(실측 +1.8ms). 대신 화면보다 한 타일 큰 캔버스에 미리
   그려 두고, 카메라가 타일 경계를 넘을 때만 다시 그린다. 보통 프레임에는
   blit 한 번이면 끝난다. */
const FLOOR_T = 64;
const floorCv = document.createElement("canvas");
const floorCtx = floorCv.getContext("2d");
let floorTx = NaN, floorTy = NaN, floorW = 0, floorH = 0;

/* 바닥 캐시는 '판 해상도'로 깔고 화면에는 줄여서 붙인다.
   예전에는 CSS 픽셀 크기로 깔아 두고 1:1 로 붙였다 — 고밀도 화면(dpr 2)에서는
   그 그림이 통째로 두 배로 늘어나 바닥만 유독 뭉개져 보였다.
   스프라이트를 두 배로 올리고 나니 그 차이가 눈에 띄게 벌어졌다. */
const FLOOR_K = 2;                   // 바닥 판의 밀도 배수 (타일 128px → 화면 64px)
function paintFloorCache(tx0, ty0) {
  const cols = Math.ceil(W / FLOOR_T) + 2, rows = Math.ceil(H / FLOOR_T) + 2;
  const TW = FLOOR_T * FLOOR_K;
  if (floorCv.width !== cols * TW || floorCv.height !== rows * TW) {
    floorCv.width = cols * TW; floorCv.height = rows * TW;
  }
  floorW = cols; floorH = rows;
  floorCtx.fillStyle = "#12121f";
  floorCtx.fillRect(0, 0, floorCv.width, floorCv.height);
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const tx = tx0 + i - 1, ty = ty0 + j - 1;
    Sprites.drawTile("floor", i * TW, j * TW, Math.floor(hash2(tx, ty) * 4), TW, floorCtx);
  }
  /* 장식은 두 겹이다. 첫째는 자연(이끼·풀·돌·뼈), 둘째는 유물(무늬 판석·웅덩이·널판·덩굴).
     둘 다 드문드문 — 다 깔면 무늬가 되어 눈이 피곤하다.
     겹치는 칸이 나와도 괜찮다. 오히려 그런 칸이 '오래된 자리'로 읽힌다. */
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const tx = tx0 + i - 1, ty = ty0 + j - 1;
    if (hash2(tx * 7 + 3, ty * 11 + 5) >= .86)
      Sprites.drawTile("floordeco", i * TW, j * TW, Math.floor(hash2(tx + 41, ty + 17) * 4), TW, floorCtx);
    if (hash2(tx * 13 + 29, ty * 5 + 61) >= .89)
      Sprites.drawTile("floordeco2", i * TW, j * TW, Math.floor(hash2(tx + 7, ty + 53) * 4), TW, floorCtx);
  }
}

function drawBackground() {
  if (!Sprites.ready || !ATLAS_FRAMES.floor) {
    // 아틀라스가 없을 때의 폴백 — 예전 방식
    ctx.fillStyle = "#12121f"; ctx.fillRect(0, 0, W, H);
    const T = FLOOR_T;
    const x0 = Math.floor(cam.x / T) - 1, x1 = Math.floor((cam.x + W) / T) + 1;
    const y0 = Math.floor(cam.y / T) - 1, y1 = Math.floor((cam.y + H) / T) + 1;
    for (let tx = x0; tx <= x1; tx++) for (let ty = y0; ty <= y1; ty++) {
      ctx.fillStyle = (tx + ty) % 2 === 0 ? "#15152400" : "#1a1a2b40";
      ctx.fillRect(tx * T - cam.x, ty * T - cam.y, T, T);
    }
    return;
  }
  const tx0 = Math.floor(cam.x / FLOOR_T), ty0 = Math.floor(cam.y / FLOOR_T);
  if (tx0 !== floorTx || ty0 !== floorTy) { paintFloorCache(tx0, ty0); floorTx = tx0; floorTy = ty0; }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(floorCv, 0, 0, floorCv.width, floorCv.height,
    Math.round(-(cam.x - tx0 * FLOOR_T) - FLOOR_T),
    Math.round(-(cam.y - ty0 * FLOOR_T) - FLOOR_T),
    floorCv.width / FLOOR_K, floorCv.height / FLOOR_K);
}

const GEM_COLOR = ["#4fd1ff", "#7cff8f", "#ffd34d"], GEM_R = [4.5, 6, 8];

/* 화면에서 캐릭터가 차지하는 비율.

   레퍼런스 그림의 기사는 화면 폭의 8% 안팎인데 우리는 2.5% 였다.
   판을 64·128칸으로 올려 놓고도 조밀함이 잘 안 보였던 이유가 여기 있다 —
   32px 안에서는 아무리 촘촘해도 촘촘함이 보이지 않는다.

   카메라를 당기면 캐릭터는 커지지만 몰려오는 떼가 덜 보인다. 그건 이 장르의 재미를
   깎는 거래다. 그래서 카메라는 그대로 두고 **보이는 크기만** 키운다.

   충돌 반경(r)은 건드리지 않는다. 이건 '보이는 크기'지 '맞는 크기'가 아니다 —
   그림이 판정보다 조금 큰 쪽은 관대한 방향이라 문제가 되지 않는다(그 반대가 문제다). */
const CHAR_SCALE = 1.25;

function drawShadow(sx, sy, r) {
  ctx.fillStyle = "rgba(0,0,0,.28)";
  ctx.beginPath(); pxEllipse(sx, sy + r * .85, r * .8, r * .32); ctx.fill();
}

function drawEnemy(e) {
  const sx = e.x - cam.x, sy = e.y - cam.y;
  if (sx < -70 || sx > W + 70 || sy < -70 || sy > H + 70) return;
  const T = e.type, bob = Math.sin(e.wob) * (T.shape === "ghost" ? 4 : 2);
  // 아틀라스가 로드돼 있으면 스프라이트로, 아니면 아래 도형 렌더링으로 폴백
  if (Sprites.ready && Sprites.frames[T.sprite]) {
    /* 그림자 — 예전에는 주인공에게만 있었다. 없으면 몹이 바닥에 붙지 않고 떠 있다.
       나는 것(박쥐·유령)은 그림자가 작고 아래로 떨어져 있어야 '떠 있다'가 읽힌다. */
    const fly = T.shape === "bat" || T.shape === "ghost";
    ctx.fillStyle = "rgba(0,0,0," + (fly ? .18 : .3) + ")";
    ctx.beginPath();
    pxEllipse(sx, sy + e.r * (fly ? 1.15 : .8), e.r * (fly ? .5 : .8), e.r * (fly ? .2 : .3));
    ctx.fill();
  }
  if (Sprites.draw(T.sprite, sx, sy + bob, e.r / 14 * CHAR_SCALE, e.wob * .16, e.x > player.x)) {
    if (!Attract.on && (e.boss || e.sigilKey || (e.rank && e.rank.ring))) drawEnemyHpBar(e, sx, sy);
    return;
  }
  if (e.burn > 0) {
    ctx.save();
    ctx.globalAlpha = .3 + Math.sin(e.wob * 3) * .12;
    ctx.fillStyle = "#ff7a1c";
    ctx.beginPath(); pxEllipse(sx, sy + bob, e.r * 1.3, e.r * 1.3); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(sx, sy + bob);
  // 좌우 비대칭 실루엣은 진행 방향을 향하게 뒤집는다
  if (T.shape === "hound" && e.x > player.x) ctx.scale(-1, 1);
  // 둔화된 적은 푸르게 얼어붙는다
  const col = e.flash > 0 ? "#ffffff" : (e.slow > 0 ? "#9fd6f5" : T.color);
  ctx.fillStyle = col;

  if (T.shape === "bat") {
    const flap = Math.sin(e.wob * 2) * .5;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.quadraticCurveTo(-e.r * 1.6, -e.r * (1 + flap), -e.r * 2.1, e.r * .2);
    ctx.quadraticCurveTo(-e.r * 1.2, e.r * .1, 0, e.r * .5);
    ctx.quadraticCurveTo(e.r * 1.2, e.r * .1, e.r * 2.1, e.r * .2);
    ctx.quadraticCurveTo(e.r * 1.6, -e.r * (1 + flap), 0, 0);
    ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, e.r * .62, 0, TAU); ctx.fill();
  } else if (T.shape === "blob") {
    const sq = 1 + Math.sin(e.wob) * .12;
    ctx.beginPath(); ctx.ellipse(0, e.r * .1, e.r * sq, e.r / sq, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.22)";
    ctx.beginPath(); ctx.ellipse(-e.r * .3, -e.r * .35, e.r * .28, e.r * .18, -.5, 0, TAU); ctx.fill();
  } else if (T.shape === "ghost") {
    ctx.globalAlpha = .88;
    ctx.beginPath();
    ctx.arc(0, 0, e.r, Math.PI, 0);
    const n = 4;
    for (let i = 0; i <= n; i++) {
      const x = e.r - (2 * e.r) * (i / n);
      ctx.lineTo(x, e.r * (i % 2 ? .55 : 1.05));
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (T.shape === "hound") {
    const run = Math.sin(e.wob * 2) * e.r * .35;
    ctx.beginPath();                       // 몸통
    ctx.ellipse(0, 0, e.r * 1.15, e.r * .62, 0, 0, TAU); ctx.fill();
    ctx.beginPath();                       // 머리
    ctx.arc(e.r * .95, -e.r * .28, e.r * .5, 0, TAU); ctx.fill();
    ctx.beginPath();                       // 주둥이
    ctx.moveTo(e.r * 1.25, -e.r * .35); ctx.lineTo(e.r * 1.85, -e.r * .1);
    ctx.lineTo(e.r * 1.2, e.r * .12); ctx.closePath(); ctx.fill();
    ctx.beginPath();                       // 귀
    ctx.moveTo(e.r * .78, -e.r * .68); ctx.lineTo(e.r * .95, -e.r * 1.25);
    ctx.lineTo(e.r * 1.15, -e.r * .6); ctx.closePath(); ctx.fill();
    for (const lx of [-e.r * .6, e.r * .5]) {   // 다리
      ctx.fillRect(lx, e.r * .3, e.r * .28, e.r * .7 + run);
      ctx.fillRect(lx + e.r * .2, e.r * .3, e.r * .24, e.r * .7 - run);
    }
    ctx.beginPath();                       // 꼬리
    ctx.moveTo(-e.r * 1.1, -e.r * .1); ctx.lineTo(-e.r * 1.8, -e.r * .7 + run);
    ctx.lineTo(-e.r * 1.5, -e.r * .05); ctx.closePath(); ctx.fill();
  } else if (T.shape === "boss") {
    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, e.r + 6 + Math.sin(e.wob) * 3, 0, TAU); ctx.stroke();
    const dark = e.flash > 0 ? "#fff" : "#20101c";
    ctx.fillStyle = dark;
    if (T.bossStyle === "plague") {
      // 역병 군주 — 부풀어 오른 포자 덩어리
      for (let i = 0; i < 5; i++) {
        const a = e.wob * .4 + i / 5 * TAU;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * e.r * .62, Math.sin(a) * e.r * .62, e.r * .3, 0, TAU);
        ctx.fill();
      }
    } else if (T.bossStyle === "iron") {
      // 강철 처형자 — 각진 투구와 도끼날
      ctx.fillRect(-e.r * .8, -e.r * .95, e.r * 1.6, e.r * .5);
      ctx.beginPath();
      ctx.moveTo(e.r * .7, -e.r * .2); ctx.lineTo(e.r * 1.5, -e.r * .9);
      ctx.lineTo(e.r * 1.5, e.r * .5); ctx.closePath(); ctx.fill();
    } else if (T.bossStyle === "abyss") {
      // 심연의 왕 — 커다란 외눈
      ctx.beginPath(); ctx.arc(0, 0, e.r * .52, 0, TAU); ctx.fill();
      ctx.fillStyle = e.hp < e.maxHp * .5 ? "#ff3b6b" : "#ffe066";
      ctx.beginPath(); ctx.ellipse(0, 0, e.r * .2, e.r * .38, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      for (let i = 0; i < 6; i++) {                 // 촉수
        const a = e.wob * .5 + i / 6 * TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * e.r * .9, Math.sin(a) * e.r * .9);
        ctx.lineTo(Math.cos(a + .18) * e.r * 1.5, Math.sin(a + .18) * e.r * 1.5);
        ctx.lineTo(Math.cos(a - .1) * e.r * .95, Math.sin(a - .1) * e.r * .95);
        ctx.closePath(); ctx.fill();
      }
    } else {
      for (const sg of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(sg * e.r * .55, -e.r * .7);
        ctx.lineTo(sg * e.r * 1.05, -e.r * 1.5);
        ctx.lineTo(sg * e.r * .25, -e.r * .95);
        ctx.closePath(); ctx.fill();
      }
    }
  } else { // humanoid
    ctx.fillRect(-e.r * .62, -e.r * .2, e.r * 1.24, e.r * 1.2);
    ctx.beginPath(); ctx.arc(0, -e.r * .55, e.r * .58, 0, TAU); ctx.fill();
    ctx.fillStyle = col;
    const sw = Math.sin(e.wob) * e.r * .3;
    ctx.fillRect(-e.r * .95, -e.r * .1 + sw, e.r * .35, e.r * .7);
    ctx.fillRect(e.r * .6, -e.r * .1 - sw, e.r * .35, e.r * .7);
  }

  // 종류별 표식 — 무엇을 조심해야 하는지가 실루엣에서 읽혀야 한다
  ctx.fillStyle = e.flash > 0 ? "#000" : "rgba(0,0,0,.55)";
  if (T.sprite === "archer") {                    // 사수 — 활
    ctx.strokeStyle = e.flash > 0 ? "#000" : "rgba(20,20,30,.8)";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(e.r * .7, -e.r * .1, e.r * .8, -1.1, 1.1); ctx.stroke();
  } else if (T.sprite === "charger") {            // 돌진자 — 앞으로 뻗은 뿔
    ctx.beginPath();
    ctx.moveTo(e.r * .5, -e.r * .5); ctx.lineTo(e.r * 1.5, 0); ctx.lineTo(e.r * .5, e.r * .2);
    ctx.closePath(); ctx.fill();
    if (e.state === 1) {                          // 예비동작 — 경고선
      ctx.save();
      ctx.globalAlpha = .5 + Math.sin(Game.time * 30) * .4;
      ctx.strokeStyle = "#ff5b6b"; ctx.lineWidth = 3;
      const a = Math.atan2(player.y - e.y, player.x - e.x);
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * 260, Math.sin(a) * 260);
      ctx.stroke();
      ctx.restore();
    }
  } else if (T.sprite === "shaman") {             // 주술사 — 떠 있는 구슬
    ctx.fillStyle = e.flash > 0 ? "#fff" : "#e0b0ff";
    ctx.beginPath(); ctx.arc(0, -e.r * 1.5 + Math.sin(e.wob) * 3, e.r * .32, 0, TAU); ctx.fill();
  } else if (T.sprite === "bomber") {             // 폭발체 — 심지
    ctx.strokeStyle = e.flash > 0 ? "#fff" : "#7a5a2a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -e.r * .9); ctx.lineTo(e.r * .3, -e.r * 1.5); ctx.stroke();
    ctx.fillStyle = "#ff8a3c";
    ctx.beginPath(); ctx.arc(e.r * .3, -e.r * 1.5, 3 + Math.sin(Game.time * 14) * 1.4, 0, TAU); ctx.fill();
  } else if (T.sprite === "splitter") {           // 분열체 — 갈라진 선
    ctx.strokeStyle = e.flash > 0 ? "#000" : "rgba(10,30,30,.7)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -e.r * .8); ctx.lineTo(0, e.r * .8); ctx.stroke();
  }

  // 눈
  if (T.shape !== "bat" || true) {
    ctx.fillStyle = e.flash > 0 ? "#000" : "#20102a";
    const ey = T.shape === "humanoid" ? -e.r * .6 : -e.r * .15;
    ctx.beginPath(); ctx.arc(-e.r * .28, ey, e.r * .13, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(e.r * .28, ey, e.r * .13, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // 등급 표시 — 같은 몬스터라도 등급이 다르면 즉시 구분되어야 한다
  if (e.rank && e.rank.ring) {
    ctx.save();
    const pl = .55 + Math.sin(Game.time * 3 + e.id) * .35;
    ctx.globalAlpha = pl;
    ctx.strokeStyle = e.rank.ring; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sx, sy, e.r + 6, 0, TAU); ctx.stroke();
    if (e.rank === RANKS.rare) {
      ctx.globalAlpha = pl * .5;
      ctx.beginPath(); ctx.arc(sx, sy, e.r + 11, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.font = "700 9px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = e.rank.ring;
    ctx.fillText(e.rank.name + " " + (e.type.name || ""), sx, sy - e.r - 20);
    ctx.restore();
  }
  // 방패병 — 방패가 남아 있으면 앞에 띠를 그린다
  if (e.shieldHp > 0) {
    const f = clamp(e.shieldHp / e.shieldMax, 0, 1);
    ctx.save();
    ctx.globalAlpha = .55 + f * .35;
    ctx.strokeStyle = "#cfd6e6"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sx, sy, e.r + 4, -2.1, -1.05); ctx.stroke();
    ctx.beginPath(); ctx.arc(sx, sy, e.r + 4, 1.05, 2.1); ctx.stroke();
    ctx.restore();
  }
  // 보스/정예 체력바
  if (e.boss || e.sigilKey || (e.rank && e.rank.ring)) drawEnemyHpBar(e, sx, sy);
}

/* 몬스터 이름표.
   400마리에 전부 붙이면 글자가 서로 겹쳐 오히려 안 읽힌다.
   그래서 (1) 등급·보스는 자기 라벨에 이름을 이미 달고 있으므로 건너뛰고,
   (2) 나머지는 플레이어에게 가까운 순으로 상한선까지만 그린다.
   N 키로 끌 수 있다. */
const NAME_LIMIT = 26;
function drawEnemyNames() {
  if (!Opt.names) return;
  const pick = [];
  for (const e of enemies) {
    if (!e.active) continue;
    if (e.boss || e.sigilKey || (e.rank && e.rank.ring)) continue;   // 이미 라벨이 있다
    const sx = e.x - cam.x, sy = e.y - cam.y;
    if (sx < 0 || sx > W || sy < 0 || sy > H) continue;
    pick.push([dist2(e.x, e.y, player.x, player.y), e, sx, sy]);
  }
  pick.sort((a, b) => a[0] - b[0]);
  ctx.save();
  ctx.font = "600 9px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(226,232,246,.62)";
  // 겹치면 오히려 못 읽는다 — 이미 글자가 놓인 자리 근처는 건너뛴다
  const px = [], py = [];
  let drawn = 0;
  for (let i = 0; i < pick.length && drawn < NAME_LIMIT; i++) {
    const [, e, sx, sy] = pick[i];
    const ly = sy - e.r - 11;
    let clash = false;
    for (let j = 0; j < px.length; j++)
      if (Math.abs(px[j] - sx) < 40 && Math.abs(py[j] - ly) < 13) { clash = true; break; }
    if (clash) continue;
    px.push(sx); py.push(ly);
    ctx.fillText(e.type.name || "", sx, ly);
    drawn++;
  }
  ctx.restore();
}

function drawEnemyHpBar(e, sx, sy) {
  const bw = e.r * 2.4, hpf = clamp(e.hp / e.maxHp, 0, 1);
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(sx - bw / 2, sy - e.r - 16, bw, 6);
  ctx.fillStyle = "#ff4d6d"; ctx.fillRect(sx - bw / 2, sy - e.r - 16, bw * hpf, 6);
}

function drawPlayer() {
  const sx = player.sx, sy = player.sy;
  drawShadow(sx, sy, player.r);
  const blink = player.iframe > 0 && Math.floor(player.iframe * 20) % 2 === 0;
  const tier = player.advance.length;
  const tint = tier ? advColor() : "#c9243f";
  // 전직할수록 몸에서 빛이 난다 — 지금 내가 무엇인지가 화면에 보여야 한다
  if (tier) {
    ctx.save();
    const pulse = .5 + Math.sin(Game.time * (2 + tier)) * .5;
    ctx.globalAlpha = (.06 + tier * .05) * (.6 + pulse * .4);
    ctx.fillStyle = tint;
    ctx.beginPath(); ctx.arc(sx, sy, 26 + tier * 9, 0, TAU); ctx.fill();
    if (tier >= 3) {
      ctx.globalAlpha = .5 + pulse * .3;
      ctx.strokeStyle = tint; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const a = Game.time * 1.3 + i / 3 * TAU;
        ctx.beginPath();
        ctx.arc(sx, sy, 30, a, a + .9);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  /* 스프라이트 — 직업 4종 × 동작 4종(대기·이동·공격·영창).
     아틀라스가 없으면 예전 도형 그리기로 그대로 떨어진다. */
  const st = player.castT > 0 ? "cast"
    : (player.actT > 0 || player.dash > 0) ? "attack"
    : player.moving ? "walk" : "idle";
  // 공격·영창은 한 바퀴만 돌도록 남은 시간을 경과 시간으로 바꿔 넣는다
  const at = st === "cast" ? CAST_DUR - player.castT
    : st === "attack" ? (player.dash > 0 ? .07 : ACT_DUR - player.actT)
    : st === "walk" ? player.walk / 10 : Game.time;
  ctx.save();
  ctx.globalAlpha = blink ? .45 : 1;
  if (player.cls && Sprites.draw("hero_" + player.cls.key + "_" + st,
        sx, sy - 3, player.r / 14 * 1.15 * CHAR_SCALE, at, player.flip)) {
    // 피격 — 스프라이트는 색을 갈아입을 수 없으니 붉은 테로 알린다
    if (player.hurtFlash > 0) {
      ctx.globalAlpha = Math.min(.8, player.hurtFlash / .35);
      ctx.strokeStyle = "#ff5f6d"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sx, sy - 2, player.r + 4, 0, TAU); ctx.stroke();
    }
    ctx.restore();
    return;
  }
  ctx.translate(sx, sy);
  const bob = Math.sin(player.walk) * 2;
  // 망토 — 전직 색으로 물든다
  ctx.fillStyle = tint;
  ctx.beginPath();
  ctx.moveTo(-10, -6 + bob); ctx.quadraticCurveTo(-16, 10 + bob, -6, 14 + bob);
  ctx.lineTo(6, 14 + bob); ctx.quadraticCurveTo(16, 10 + bob, 10, -6 + bob);
  ctx.closePath(); ctx.fill();
  // 몸
  ctx.fillStyle = player.hurtFlash > 0 ? "#ffb4b4" : "#e8e5da";
  ctx.fillRect(-8, -6 + bob, 16, 15);
  ctx.fillStyle = tint;
  ctx.fillRect(-1.6, -6 + bob, 3.2, 15);
  ctx.fillRect(-8, -1 + bob, 16, 3);
  // 머리
  ctx.fillStyle = player.hurtFlash > 0 ? "#fff" : "#f0d5b0";
  ctx.beginPath(); ctx.arc(0, -13 + bob, 7.5, 0, TAU); ctx.fill();
  ctx.fillStyle = "#3a2a1e";
  ctx.beginPath(); ctx.arc(0, -15 + bob, 7.5, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#2b1c14";
  const fx = clamp(player.faceX, -1, 1) * 2;
  ctx.beginPath(); ctx.arc(-2.6 + fx, -12.5 + bob, 1.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(2.6 + fx, -12.5 + bob, 1.2, 0, TAU); ctx.fill();
  ctx.restore();
}

/* 자세를 눈에 보이게 만든다 — 규칙이 아무리 좋아도 화면에서 안 보이면 없는 것이다 */
function drawStanceWorld() {
  const C = player.cls;
  if (!C || Game.state === "title" || Game.state === "altar") return;
  const sx = player.sx, sy = player.sy;

  if (C.key === "paladin") {
    const need = .6 - .15 * traitLv("bulwark");
    const charge = clamp(player.stillTime / need, 0, 1);
    const R = 40;
    // 충전 중: 테두리가 시계처럼 차오른다
    if (player.bulwark < 1 && charge > .02) {
      ctx.save();
      ctx.strokeStyle = "rgba(255,211,110,.55)"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(sx, sy, R, -Math.PI / 2, -Math.PI / 2 + TAU * charge);
      ctx.stroke();
      ctx.restore();
    }
    // 전개 완료: 육각 방벽
    if (player.bulwark > 0) {
      const a = player.bulwark, rr = R + 6 * a;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const ang = i / 6 * TAU - Math.PI / 2;
        const px = sx + Math.cos(ang) * rr, py = sy + Math.sin(ang) * rr;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = "rgba(255,211,110,.10)"; ctx.fill();
      ctx.strokeStyle = "rgba(255,225,150,.85)"; ctx.lineWidth = 2.5; ctx.stroke();
      // 접전 스택이 쌓일수록 테두리가 두꺼워진다
      if (player.press > 0) {
        ctx.globalAlpha = a * Math.min(1, player.press / 14) * .8;
        ctx.strokeStyle = "#ff9f6b"; ctx.lineWidth = 2 + player.press * .35;
        ctx.stroke();
      }
      ctx.restore();
    }
  } else if (C.key === "mage") {
    const st = Math.floor(player.channel), frac = player.channel - st;
    const maxStage = 3 + traitLv("deepMana");
    for (let i = 0; i < st; i++) {
      const r = 30 + i * 12;
      ctx.save();
      ctx.globalAlpha = .75;
      ctx.strokeStyle = i >= 3 ? "#e0b0ff" : "#9bb8ff";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      // 회전하는 룬 고리 — 단계가 오를수록 고리가 늘어난다
      const seg = 6 + i * 2, spin = Game.time * (i % 2 ? -1.1 : 1.4) + i;
      for (let k = 0; k < seg; k++) {
        const a0 = spin + k / seg * TAU, a1 = a0 + TAU / seg * .55;
        ctx.moveTo(sx + Math.cos(a0) * r, sy + Math.sin(a0) * r);
        ctx.arc(sx, sy, r, a0, a1);
      }
      ctx.stroke();
      ctx.restore();
    }
    // 다음 단계까지의 진행
    if (st < maxStage && frac > .02) {
      ctx.save();
      ctx.globalAlpha = .5;
      ctx.strokeStyle = "#9bb8ff"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, sy, 30 + st * 12, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
      ctx.stroke();
      ctx.restore();
    }
    if (st >= maxStage) {
      ctx.save();
      ctx.globalAlpha = .18 + Math.sin(Game.time * 6) * .06;
      ctx.fillStyle = "#bcd0ff";
      ctx.beginPath(); ctx.arc(sx, sy, 30 + maxStage * 12, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
}

function drawWorld() {
  // 보석 — 화면에 수백 개가 깔리므로 티어별로 한 패스에 몰아 그린다
  for (let tier = 0; tier < 3; tier++) {
    const col = GEM_COLOR[tier], br = GEM_R[tier];
    // 격자 마름모 — 위가 밝고 아래가 어둡다. 수백 개라 색깔별로 한 패스에 몰아 그린다.
    let any = false;
    ctx.beginPath();
    for (const g of gems) {
      if (!g.active || g.tier !== tier) continue;
      const sx = g.x - cam.x, sy = g.y - cam.y;
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
      const r = br + Math.sin(g.bob) * .6;
      const gx = Math.round(sx / PIX) * PIX, gy = Math.round(sy / PIX) * PIX;
      const rows = Math.max(1, Math.round(r / PIX));
      for (let i = -rows; i <= rows; i++) {
        const w = Math.max(PIX, Math.round((r - Math.abs(i * PIX)) * .8 / PIX) * PIX);
        ctx.rect(gx - w, gy + i * PIX, w * 2, PIX);
      }
      any = true;
    }
    if (!any) continue;
    ctx.fillStyle = col; ctx.fill();
    ctx.beginPath();                                    // 윗면 광택
    for (const g of gems) {
      if (!g.active || g.tier !== tier) continue;
      const sx = g.x - cam.x, sy = g.y - cam.y;
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
      const gx = Math.round(sx / PIX) * PIX, gy = Math.round(sy / PIX) * PIX;
      ctx.rect(gx - PIX, gy - PIX, PIX, PIX);
    }
    ctx.fillStyle = "#ffffff"; ctx.globalAlpha = .8; ctx.fill(); ctx.globalAlpha = 1;
  }
  // 아이템
  for (const pk of pickups) {
    if (!pk.active) continue;
    const sx = pk.x - cam.x, sy = pk.y - cam.y + Math.sin(pk.bob) * 3;
    ctx.save();
    const isItem = pk.kind.startsWith("item:");
    const C = isItem ? CONSUMABLES[pk.kind.slice(5)] : null;
    const glow = pk.kind === "heart" ? "#ff5b7a" : pk.kind === "sigil" ? "#ffd34d"
               : C ? C.color : "#7fd2ff";
    // 이모지는 폰트라 픽셀이 아니다. 도형으로 직접 찍는다.
    const P2 = PIX, gx = Math.round(sx / P2) * P2, gy = Math.round(sy / P2) * P2;
    const R2 = (x, y, w, h) => ctx.rect(gx + x * P2, gy + y * P2, w * P2, h * P2);
    ctx.globalAlpha = .22 + .1 * Math.sin(Game.time * 4 + pk.bob);
    ctx.fillStyle = glow; ctx.beginPath();
    pxEllipse(gx, gy, pk.kind === "sigil" ? 24 : 18, pk.kind === "sigil" ? 24 : 18);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = glow; ctx.beginPath();
    if (pk.kind === "heart") {                       // 고기 — 회복
      R2(-3, -1, 6, 3); R2(-2, -2, 4, 1); R2(-4, 0, 1, 2); R2(3, 0, 1, 2);
      ctx.fill();
      ctx.fillStyle = "#f2e3c8"; ctx.beginPath(); R2(-1, 2, 2, 2); ctx.fill();  // 뼈
    } else if (pk.kind === "sigil") {                // 징표 — 육각 문양
      for (let i = -4; i <= 4; i++) {
        const w = 5 - Math.abs(i) * .55;
        ctx.rect(gx - Math.round(w) * P2, gy + i * P2, Math.round(w) * 2 * P2, P2);
      }
      ctx.fill();
      ctx.fillStyle = "#fff8dc"; ctx.beginPath();
      R2(-1, -3, 2, 6); R2(-3, -1, 6, 2);
      ctx.fill();
    } else if (C) {                                  // 소모품 — 약병
      R2(-2, -1, 4, 4); R2(-1, -3, 2, 2); R2(-2, -4, 4, 1);
      ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.globalAlpha = .55; ctx.beginPath();
      R2(-1, 0, 1, 2); ctx.fill(); ctx.globalAlpha = 1;
    } else {                                         // 자석
      R2(-3, -3, 2, 5); R2(1, -3, 2, 5); R2(-3, -4, 6, 1);
      ctx.fill();
      ctx.fillStyle = "#ff5b5b"; ctx.beginPath(); R2(-3, 2, 2, 1); ctx.fill();
      ctx.fillStyle = "#e8e8f0"; ctx.beginPath(); R2(1, 2, 2, 1); ctx.fill();
    }
    ctx.restore();
  }

  // 보스 대형 범위기 예고 — 밟고 있으면 죽는다는 걸 미리 보여준다
  for (const e of enemies) {
    if (!e.active || !e.telT || e.telT <= 0) continue;
    const sx = e.telX - cam.x, sy = e.telY - cam.y;
    const f = 1 - e.telT / 1.5;
    ctx.save();
    ctx.globalAlpha = .18 + f * .3;
    ctx.fillStyle = "#a8e04a";
    ctx.beginPath(); pxEllipse(sx, sy, e.telR * f, e.telR * f); ctx.fill();
    ctx.globalAlpha = .85;
    pxRing(sx, sy, e.telR, PIX * 2, pxPal("#d4ff7a"));
    ctx.restore();
  }

  // 지형 — 종류마다 실루엣이 다르다. 무엇이 막고 무엇이 튕기는지 한눈에 보여야 한다.
  for (const o of obstacles) {
    if (o.struct) continue;                    // 구조물은 따로 그린다
    const sx = o.x - cam.x, sy = o.y - cam.y;
    if (sx < -100 || sx > W + 100 || sy < -100 || sy > H + 100) continue;
    ctx.save();
    // 늪은 바닥에 깔린 것이라 그림자를 지지 않는다
    if (o.kind !== "bog") {
      ctx.fillStyle = "rgba(0,0,0,.32)";
      ctx.beginPath(); pxEllipse(sx, sy + o.r * .55, o.r * .95, o.r * .36); ctx.fill();
    }
    /* 지형은 전부 격자 렌더다. arc / stroke / 다각형 fill 을 쓰면
       그 지형만 가장자리가 부드러워져 주변의 픽셀과 어긋난다.
       색은 세 겹으로 쓴다 — 겉(어두움) · 몸통 · 윗면(밝음). 위에서 빛이 온다. */
    /* 톤은 다섯 단계다. 예전엔 세 단계(겉·몸통·윗면)뿐이라 지형이 전부 평면이었다 —
       스프라이트를 64·128칸으로 올리고 나니 그 차이가 눈에 띄게 벌어졌다.
       빛은 스프라이트와 같은 방향(왼쪽 위)에서 온다. 어긋나면 빛이 두 개로 보인다. */
    const deep = mixHex(o.K.color, "#0d0d16", .74);
    const dark = mixHex(o.K.color, "#0d0d16", .5);
    const mid  = mixHex(o.K.color, "#0d0d16", .22);
    const lit  = mixHex(o.K.color, "#ffffff", .28);
    const hot  = mixHex(o.K.color, "#ffffff", .55);
    const BONE = "#ded2b4", BONE_D = "#9d8c6f";       // 중립색 — 한 지형에 한 군데만
    const blob = (n, jitter, squash, col, ox, oy, rr) => {
      ctx.fillStyle = col; ctx.beginPath();
      pxBlob(sx + (ox || 0), sy + (oy || 0), rr || o.r, n, jitter, squash, Math.floor(o.x));
      ctx.fill();
    };
    const rects = (col, list) => {
      ctx.fillStyle = col; ctx.beginPath();
      for (const [x, y, w, h] of list) pxR(sx + x, sy + y, w, h);
      ctx.fill();
    };
    const lines = (col, list) => {
      ctx.fillStyle = col; ctx.beginPath();
      for (const [x0, y0, x1, y1, t] of list) pxLineQ(sx + x0, sy + y0, sx + x1, sy + y1, t);
      ctx.fill();
    };
    const rnd = k => hash2(Math.floor(o.x) + k * 37, Math.floor(o.y) + k * 91);

    if (o.kind === "pillar") {
      /* 신전 기둥 — 세로로 길고, 발사체를 막는다.
         원통은 '왼쪽 밝음 → 오른쪽 어두움' 한 줄만 넣어도 둥글게 선다. */
      const h = o.r * 2.6, w = o.r * .52;
      rects(mid, [[-w, -h, w * 2, h]]);
      rects(lit, [[-w, -h, w * .7, h]]);                         // 빛 받는 면
      rects(dark, [[w * .42, -h, w * .58, h]]);                  // 그늘 면
      rects(deep, [[w * .86, -h, w * .14, h]]);
      for (let i = -2; i <= 2; i++)                              // 홈
        rects(i < 0 ? mid : deep, [[i * w * .34, -h + o.r * .2, PIX, h - o.r * .4]]);
      for (const [yy, hh] of [[-h - o.r * .3, o.r * .34], [-o.r * .28, o.r * .34]]) {
