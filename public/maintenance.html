<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>누리플랜 — 시스템 점검 중</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      }
      .card {
        max-width: 26rem;
        margin: 1.5rem;
        padding: 2.5rem 2rem;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        text-align: center;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      }
      h1 { font-size: 1.15rem; margin: 1rem 0 0.5rem; }
      p { font-size: 0.9rem; color: #64748b; line-height: 1.6; margin: 0; }
      .icon { font-size: 2.5rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden>🛠️</div>
      <h1>시스템 점검 중입니다</h1>
      <p>
        더 나은 서비스를 위해 잠시 점검을 진행하고 있습니다.<br />
        작성하신 계획안과 견적 데이터는 안전하게 보관됩니다.<br />
        잠시 후 다시 접속해 주세요.
      </p>
    </main>
  </body>
</html>
