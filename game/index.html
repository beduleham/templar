    ctx.beginPath(); ctx.arc(sx, sy, e.r + 4, 1.05, 2.1); ctx.stroke();
    ctx.restore();
  }
  // 보스/정예 체력바
  if (e.boss || e.sigilKey || (e.rank && e.rank.ring)) drawEnemyHpBar(e, sx, sy);
}

function drawEnemyHpBar(e, sx, sy) {
  const bw = e.r * 2.4, hpf = clamp(e.hp / e.maxHp, 0, 1);
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(sx - bw / 2, sy - e.r - 16, bw, 6);
  ctx.fillStyle = "#ff4d6d"; ctx.fillRect(sx - bw / 2, sy - e.r - 16, bw * hpf, 6);
}

function drawPlayer() {
  const sx = player.sx, sy = player.sy;
  drawShadow(sx, sy, player.r);
  const blink = player.iframe > 0 && Math.floor(player.iframe * 20) % 2 === 0;
  const tier = player.advance.length;
  const tint = tier ? advColor() : "#c9243f";
  // 전직할수록 몸에서 빛이 난다 — 지금 내가 무엇인지가 화면에 보여야 한다
  if (tier) {
    ctx.save();
    const pulse = .5 + Math.sin(Game.time * (2 + tier)) * .5;
    ctx.globalAlpha = (.06 + tier * .05) * (.6 + pulse * .4);
    ctx.fillStyle = tint;
    ctx.beginPath(); ctx.arc(sx, sy, 26 + tier * 9, 0, TAU); ctx.fill();
    if (tier >= 3) {
      ctx.globalAlpha = .5 + pulse * .3;
      ctx.strokeStyle = tint; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const a = Game.time * 1.3 + i / 3 * TAU;
        ctx.beginPath();
        ctx.arc(sx, sy, 30, a, a + .9);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  ctx.save();
  ctx.translate(sx, sy);
  ctx.globalAlpha = blink ? .45 : 1;
  const bob = Math.sin(player.walk) * 2;
  // 망토 — 전직 색으로 물든다
  ctx.fillStyle = tint;
  ctx.beginPath();
  ctx.moveTo(-10, -6 + bob); ctx.quadraticCurveTo(-16, 10 + bob, -6, 14 + bob);
  ctx.lineTo(6, 14 + bob); ctx.quadraticCurveTo(16, 10 + bob, 10, -6 + bob);
  ctx.closePath(); ctx.fill();
  // 몸
  ctx.fillStyle = player.hurtFlash > 0 ? "#ffb4b4" : "#e8e5da";
  ctx.fillRect(-8, -6 + bob, 16, 15);
  ctx.fillStyle = tint;
  ctx.fillRect(-1.6, -6 + bob, 3.2, 15);
  ctx.fillRect(-8, -1 + bob, 16, 3);
  // 머리
  ctx.fillStyle = player.hurtFlash > 0 ? "#fff" : "#f0d5b0";
  ctx.beginPath(); ctx.arc(0, -13 + bob, 7.5, 0, TAU); ctx.fill();
  ctx.fillStyle = "#3a2a1e";
  ctx.beginPath(); ctx.arc(0, -15 + bob, 7.5, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#2b1c14";
  const fx = clamp(player.faceX, -1, 1) * 2;
  ctx.beginPath(); ctx.arc(-2.6 + fx, -12.5 + bob, 1.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(2.6 + fx, -12.5 + bob, 1.2, 0, TAU); ctx.fill();
  ctx.restore();
}

/* 자세를 눈에 보이게 만든다 — 규칙이 아무리 좋아도 화면에서 안 보이면 없는 것이다 */
function drawStanceWorld() {
  const C = player.cls;
  if (!C || Game.state === "title" || Game.state === "altar") return;
  const sx = player.sx, sy = player.sy;

  if (C.key === "paladin") {
    const need = .6 - .15 * traitLv("bulwark");
    const charge = clamp(player.stillTime / need, 0, 1);
    const R = 40;
    // 충전 중: 테두리가 시계처럼 차오른다
    if (player.bulwark < 1 && charge > .02) {
      ctx.save();
      ctx.strokeStyle = "rgba(255,211,110,.55)"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(sx, sy, R, -Math.PI / 2, -Math.PI / 2 + TAU * charge);
      ctx.stroke();
      ctx.restore();
    }
    // 전개 완료: 육각 방벽
    if (player.bulwark > 0) {
      const a = player.bulwark, rr = R + 6 * a;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const ang = i / 6 * TAU - Math.PI / 2;
        const px = sx + Math.cos(ang) * rr, py = sy + Math.sin(ang) * rr;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = "rgba(255,211,110,.10)"; ctx.fill();
      ctx.strokeStyle = "rgba(255,225,150,.85)"; ctx.lineWidth = 2.5; ctx.stroke();
      // 접전 스택이 쌓일수록 테두리가 두꺼워진다
      if (player.press > 0) {
        ctx.globalAlpha = a * Math.min(1, player.press / 14) * .8;
        ctx.strokeStyle = "#ff9f6b"; ctx.lineWidth = 2 + player.press * .35;
        ctx.stroke();
      }
      ctx.restore();
    }
  } else if (C.key === "mage") {
    const st = Math.floor(player.channel), frac = player.channel - st;
    const maxStage = 3 + traitLv("deepMana");
    for (let i = 0; i < st; i++) {
      const r = 30 + i * 12;
      ctx.save();
      ctx.globalAlpha = .75;
      ctx.strokeStyle = i >= 3 ? "#e0b0ff" : "#9bb8ff";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      // 회전하는 룬 고리 — 단계가 오를수록 고리가 늘어난다
      const seg = 6 + i * 2, spin = Game.time * (i % 2 ? -1.1 : 1.4) + i;
      for (let k = 0; k < seg; k++) {
        const a0 = spin + k / seg * TAU, a1 = a0 + TAU / seg * .55;
        ctx.moveTo(sx + Math.cos(a0) * r, sy + Math.sin(a0) * r);
        ctx.arc(sx, sy, r, a0, a1);
      }
      ctx.stroke();
      ctx.restore();
    }
    // 다음 단계까지의 진행
    if (st < maxStage && frac > .02) {
      ctx.save();
      ctx.globalAlpha = .5;
      ctx.strokeStyle = "#9bb8ff"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, sy, 30 + st * 12, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
      ctx.stroke();
      ctx.restore();
    }
    if (st >= maxStage) {
      ctx.save();
      ctx.globalAlpha = .18 + Math.sin(Game.time * 6) * .06;
      ctx.fillStyle = "#bcd0ff";
      ctx.beginPath(); ctx.arc(sx, sy, 30 + maxStage * 12, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
}

function drawWorld() {
  // 보석 — 화면에 수백 개가 깔리므로 티어별로 한 패스에 몰아 그린다
  for (let tier = 0; tier < 3; tier++) {
    const col = GEM_COLOR[tier], br = GEM_R[tier];
    let any = false;
    ctx.beginPath();
    for (const g of gems) {
      if (!g.active || g.tier !== tier) continue;
      const sx = g.x - cam.x, sy = g.y - cam.y;
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
      const r = (br + Math.sin(g.bob) * .6) * 1.9;
      ctx.moveTo(sx + r, sy);
      ctx.arc(sx, sy, r, 0, TAU);
      any = true;
    }
    if (!any) continue;
    ctx.globalAlpha = .2; ctx.fillStyle = col; ctx.fill();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    for (const g of gems) {
      if (!g.active || g.tier !== tier) continue;
      const sx = g.x - cam.x, sy = g.y - cam.y;
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
      const r = br + Math.sin(g.bob) * .6;
      ctx.moveTo(sx, sy - r);
      ctx.lineTo(sx + r * .75, sy);
      ctx.lineTo(sx, sy + r);
      ctx.lineTo(sx - r * .75, sy);
      ctx.closePath();
    }
    ctx.fillStyle = col; ctx.fill();
  }
  // 아이템
  for (const pk of pickups) {
    if (!pk.active) continue;
    const sx = pk.x - cam.x, sy = pk.y - cam.y + Math.sin(pk.bob) * 3;
    ctx.save();
    const isItem = pk.kind.startsWith("item:");
    const C = isItem ? CONSUMABLES[pk.kind.slice(5)] : null;
    const glow = pk.kind === "heart" ? "#ff5b7a" : pk.kind === "sigil" ? "#ffd34d"
               : C ? C.color : "#7fd2ff";
    ctx.globalAlpha = .3; ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(sx, sy, pk.kind === "sigil" ? 28 : 22, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = (pk.kind === "sigil" ? "30px " : "26px ") + FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(pk.kind === "heart" ? "🍗" : pk.kind === "sigil" ? "🔯" : C ? C.icon : "🧲", sx, sy);
    ctx.restore();
  }

  // 지형 — 벽과 바위
  for (const o of obstacles) {
    const sx = o.x - cam.x, sy = o.y - cam.y;
    if (sx < -80 || sx > W + 80 || sy < -80 || sy > H + 80) continue;
    ctx.save();
    // 그림자
    ctx.fillStyle = "rgba(0,0,0,.32)";
    ctx.beginPath(); ctx.ellipse(sx, sy + o.r * .55, o.r * .95, o.r * .36, 0, 0, TAU); ctx.fill();
    if (o.wall) {
      // 부술 수 없는 석벽 — 각진 실루엣으로 구분한다
      ctx.fillStyle = "#4a4a5c";
      ctx.beginPath();
      const n = 6;
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU + o.seed * 6;
        const rr = o.r * (.86 + hash2(i, Math.floor(o.x)) * .28);
        const px = sx + Math.cos(a) * rr, py = sy + Math.sin(a) * rr * .92;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#5f5f75"; ctx.lineWidth = 2; ctx.stroke();
      // 벽돌 결
      ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 1;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(sx - o.r * .7, sy + i * o.r * .4);
        ctx.lineTo(sx + o.r * .7, sy + i * o.r * .4);
        ctx.stroke();
      }
    } else {
      // 부술 수 있는 바위 — 피해를 입으면 금이 간다
      const f = clamp(o.st.hp / o.st.max, 0, 1);
      ctx.fillStyle = f > .5 ? "#6b6b7d" : f > .2 ? "#7a6a62" : "#8a5f52";
      ctx.beginPath();
      const n = 7;
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU + o.seed * 9;
        const rr = o.r * (.8 + hash2(i * 3, Math.floor(o.y)) * .36);
        const px = sx + Math.cos(a) * rr, py = sy + Math.sin(a) * rr * .88;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1.5; ctx.stroke();
      if (f < 1) {
        ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(sx - o.r * .5, sy - o.r * .3);
        ctx.lineTo(sx - o.r * .1, sy + o.r * .1);
        ctx.lineTo(sx + o.r * .4, sy - o.r * .2);
        ctx.stroke();
        if (f < .5) {
          ctx.beginPath();
          ctx.moveTo(sx + o.r * .1, sy + o.r * .5);
          ctx.lineTo(sx - o.r * .05, sy);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  // 지형지물 — 적보다 아래에 깔린다
  for (const lm of landmarks) {
    const sx = lm.x - cam.x, sy = lm.y - cam.y;
    if (sx < -80 || sx > W + 80 || sy < -80 || sy > H + 80) continue;
    const pulse = .6 + Math.sin(Game.time * 2 + lm.x * .01) * .25;
    ctx.save();
    // 바닥 표식
    ctx.globalAlpha = .22 * pulse;
    ctx.fillStyle = lm.T.color;
    ctx.beginPath(); ctx.ellipse(sx, sy + lm.r * .5, lm.r * 1.7, lm.r * .8, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;

    if (lm.type === "chest") {
      ctx.fillStyle = "#6b4a26";
      ctx.fillRect(sx - 18, sy - 6, 36, 20);
      ctx.fillStyle = "#8a6234";
      ctx.beginPath(); ctx.arc(sx, sy - 6, 18, Math.PI, 0); ctx.fill();
      ctx.fillStyle = "#e8c96a";
      ctx.fillRect(sx - 18, sy - 8, 36, 4);
      ctx.fillRect(sx - 4, sy - 4, 8, 10);
    } else if (lm.type === "shrine") {
      ctx.fillStyle = "#4a4560";
      ctx.fillRect(sx - 24, sy - 30, 8, 44);
      ctx.fillRect(sx + 16, sy - 30, 8, 44);
      ctx.fillRect(sx - 28, sy - 38, 56, 10);
      // 봉인 문양
      ctx.globalAlpha = lm.fighting ? .25 : .55 + Math.sin(Game.time * 3) * .25;
      ctx.strokeStyle = "#c9a3ff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sx, sy - 10, 13, 0, TAU); ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = Game.time * .6 + i / 5 * TAU;
        ctx.moveTo(sx, sy - 10);
        ctx.lineTo(sx + Math.cos(a) * 13, sy - 10 + Math.sin(a) * 13);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
      // 아직 못 여는 제단이면 미리 알려준다 — 닿고 나서야 알면 헛걸음이 된다
      if (!lm.fighting && player.level < SHRINE_MIN_LEVEL) {
        ctx.font = "bold 12px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#c9a3ff";
        ctx.fillText("🔒 Lv" + SHRINE_MIN_LEVEL, sx, sy - 48);
      }
    } else {
      ctx.fillStyle = "#3f4a5c";
      ctx.beginPath();
      ctx.moveTo(sx - 14, sy + 14); ctx.lineTo(sx - 10, sy - 34);
      ctx.lineTo(sx + 10, sy - 34); ctx.lineTo(sx + 14, sy + 14);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = .5 + Math.sin(Game.time * 2.2) * .3;
      ctx.strokeStyle = "#8fd0ff"; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const yy = sy - 24 + i * 12;
        ctx.beginPath(); ctx.moveTo(sx - 6, yy); ctx.lineTo(sx + 6, yy - 4); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  // 그림자는 색이 같으므로 한 번의 패스로 모아 그린다 (적 360마리 × fill 을 1회로)
  ctx.fillStyle = "rgba(0,0,0,.28)";
  ctx.beginPath();
  for (const e of enemies) {
    if (!e.active) continue;
    const sx = e.x - cam.x, sy = e.y - cam.y;
    if (sx < -70 || sx > W + 70 || sy < -70 || sy > H + 70) continue;
    const rx = e.r * .8, ry = e.r * .32, cy = sy + e.r * .85;
    ctx.moveTo(sx + rx, cy);
    ctx.ellipse(sx, cy, rx, ry, 0, 0, TAU);
  }
  ctx.fill();

  for (const e of enemies) if (e.active) drawEnemy(e);

  // 지속형 무기(오라)는 플레이어 아래에 깔린다
  for (const w of player.weapons) {
    const def = WEAPONS[w.key];
    if (def.draw && w.key === "aura") def.draw(player, w);
  }

  drawStanceWorld();
  drawPlayer();

  for (const w of player.weapons) {
    const def = WEAPONS[w.key];
    if (def.draw && w.key !== "aura") def.draw(player, w);
  }

  // 참격
  for (const sl of slashes) {
    if (!sl.active) continue;
    const t = 1 - sl.life / sl.maxLife;
    const sx = sl.x - cam.x, sy = sl.y - cam.y;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(sl.ang);
    ctx.globalAlpha = (1 - t) * .85;
    const grad = ctx.createLinearGradient(0, 0, sl.len, 0);
    grad.addColorStop(0, "rgba(255,255,255,0)");
    grad.addColorStop(.6, "rgba(255,240,200,.9)");
    grad.addColorStop(1, "rgba(255,180,90,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, sl.len * (.5 + t * .6), -.62, .62);
    ctx.arc(0, 0, sl.len * (.15 + t * .3), .62, -.62, true);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 바닥 장판 — 밟으면 아프다
  for (const h of hazards) {
    if (!h.active) continue;
    const sx = h.x - cam.x, sy = h.y - cam.y;
    if (sx < -160 || sx > W + 160 || sy < -160 || sy > H + 160) continue;
    const t = h.life / h.maxLife;
    ctx.save();
    ctx.globalAlpha = .16 + .16 * t;
    ctx.fillStyle = h.color;
    ctx.beginPath(); ctx.arc(sx, sy, h.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = .35 + .3 * Math.abs(Math.sin(Game.time * 4));
    ctx.strokeStyle = h.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, sy, h.r, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // 파동
  for (const wv of waves) {
    if (!wv.active) continue;
    const t = 1 - wv.life / wv.maxLife;
    const sx = wv.x - cam.x, sy = wv.y - cam.y;
    ctx.save();
    ctx.globalAlpha = (1 - t) * .85;
    ctx.strokeStyle = wv.color; ctx.lineWidth = 5 + (1 - t) * 8;
    ctx.shadowColor = wv.color; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(sx, sy, wv.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = (1 - t) * .16;
    ctx.fillStyle = wv.color;
    ctx.beginPath(); ctx.arc(sx, sy, wv.r, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // 발사체
  for (const p of projectiles) {
    if (!p.active) continue;
    const sx = p.x - cam.x, sy = p.y - cam.y;
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(p.angle);
    if (p.kind === "flame") {
      const t = clamp(p.life / p.maxLife, 0, 1);
      ctx.globalAlpha = t * .3;
      ctx.fillStyle = "#ff7a1c";
      ctx.beginPath(); ctx.arc(0, 0, p.r * 1.8, 0, TAU); ctx.fill();
      ctx.globalAlpha = t * .9;
      ctx.fillStyle = "#ff9a3c";
      ctx.beginPath(); ctx.arc(0, 0, p.r * (1.25 - t * .35), 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffe08a";
      ctx.beginPath(); ctx.arc(0, 0, p.r * .45 * t, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.kind === "dagger") {
      ctx.fillStyle = "#cfd6e6";
      ctx.beginPath(); ctx.moveTo(p.r * 1.7, 0); ctx.lineTo(-p.r * .5, -p.r * .45); ctx.lineTo(-p.r * .5, p.r * .45);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#8a6a3a"; ctx.fillRect(-p.r * 1.2, -p.r * .22, p.r * .8, p.r * .44);
      ctx.fillStyle = "#e8c96a"; ctx.fillRect(-p.r * .62, -p.r * .6, p.r * .22, p.r * 1.2);
    } else {
      ctx.globalAlpha = .25; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(0, 0, p.r * 1.8, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.beginPath(); ctx.arc(0, 0, p.r * .45, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // 번개
  for (const b of bolts) {
    if (!b.active) continue;
    const sx = b.x - cam.x, sy = b.y - cam.y;
    ctx.save();
    ctx.globalAlpha = clamp(b.life / .3, 0, 1);
    ctx.strokeStyle = "#cfe9ff"; ctx.lineWidth = 3;
    ctx.shadowColor = "#7fd2ff"; ctx.shadowBlur = 18;
    ctx.beginPath();
    let y = sy - 400, x = sx + (hash2(b.seed | 0, 7) - .5) * 60;
    ctx.moveTo(x, y);
    for (let i = 1; i <= 8; i++) {
      y = sy - 400 + (400 * i / 8);
      x = sx + (hash2((b.seed | 0) + i, i * 13) - .5) * 60 * (1 - i / 8);
      ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = "rgba(180,225,255,.35)";
    ctx.beginPath(); ctx.arc(sx, sy, 34 * (1 - b.life / .3) + 8, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // 적이 쏜 탄 — 아군 탄과 헷갈리지 않게 붉은 테두리를 두른다
  for (const p of eshots) {
    if (!p.active) continue;
    const sx = p.x - cam.x, sy = p.y - cam.y;
    if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) continue;
    ctx.globalAlpha = .3; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(sx, sy, p.r * 2.1, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(sx, sy, p.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#ff4d6d"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, sy, p.r + 2, 0, TAU); ctx.stroke();
  }

  // 파티클
  for (const p of particles) {
    if (!p.active) continue;
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x - cam.x, p.y - cam.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 데미지 숫자
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.75)";
  for (const n of numbers) {
    if (!n.active) continue;
    const nx = n.x - cam.x, ny = n.y - cam.y;
    if (nx < -40 || nx > W + 40 || ny < -30 || ny > H + 30) continue;
    ctx.globalAlpha = clamp(n.life / .7, 0, 1);
    ctx.font = "700 " + n.size + "px " + FONT;
    ctx.strokeText(n.text, nx, ny);
    ctx.fillStyle = n.color;
    ctx.fillText(n.text, nx, ny);
  }
  ctx.globalAlpha = 1;
}

/* ---------- 직업 전용 특성 ----------
   직업이 '가끔 누르는 버튼'이 아니라 '매 순간의 규칙'이 되도록,
   레벨업 카드 풀에 직업 전용 카드를 섞는다.
   수치를 올리는 게 아니라 규칙을 바꾸는 카드만 여기에 둔다. */
const TRAITS = {
  paladin: [
    { key: "bulwark", name: "강철 방벽", icon: "🛡️", max: 3,
      desc: "방벽이 더 빨리 서고, 더 많이 막고, 더 많이 회복한다.",
      detail: l => "전개 " + (.6 - .15 * l).toFixed(2) + "초 · 피해 감소 " + Math.round((.52 + .08 * l) * 100) + "%~ · 초당 회복 " + ((.015 + .005 * l) * 100).toFixed(1) + "%~" },
    { key: "taunt", name: "도발", icon: "📢", max: 2,
      desc: "방벽을 세우면 주변의 적이 끌려온다. 더 둘러싸일수록 강해진다.",
      detail: l => "흡인력 " + l + "단계" },
    { key: "crusade", name: "성전", icon: "✝️", max: 3,
      desc: "곁에 붙은 적 하나마다 피해가 오른다.",
      detail: l => "적 1마리당 피해 +" + (6 + 2.5 * l) + "%" },
    { key: "thorns", name: "가시 갑옷", icon: "🌵", max: 3,
      desc: "방벽으로 막은 피해를 주변의 적에게 되돌린다.",
      detail: l => "반사 " + (40 * l) + "%" },
    { key: "resolve", name: "불굴", icon: "💢", max: 2,
      desc: "체력이 바닥일수록 단단해지고 빨라진다.",
      detail: l => "HP 40% 이하: 피해 -" + (22 * l) + "% · 이동 +" + (14 * l) + "%" },
  ],
  mage: [
    { key: "focus", name: "집중 영창", icon: "🎯", max: 3,
      desc: "영창 단계가 더 빨리 오른다.",
      detail: l => "영창 속도 +" + (30 * l) + "%" },
    { key: "deepMana", name: "심층 마력", icon: "🌌", max: 2,
      desc: "영창을 한 단계 더 쌓을 수 있다.",
      detail: l => "최대 " + (3 + l) + "단계" },
    { key: "residue", name: "잔류 마력", icon: "💫", max: 1,
      desc: "움직여도 1단계는 남는다. 자리를 옮기며 싸울 수 있다.",
      detail: () => "이동 중 1단계 유지" },
    { key: "overload", name: "비전 과부하", icon: "⚡", max: 2,
      desc: "3단계 이상에서 발사체가 적을 더 꿰뚫는다.",
      detail: l => "관통 +" + (2 * l) },
    { key: "meltdown", name: "마력 폭주", icon: "☄️", max: 3,
      desc: "최대 단계를 유지하면 주변이 주기적으로 터진다.",
      detail: l => (1.8 - .3 * l).toFixed(1) + "초마다 폭발" },
  ],
};

function traitLv(key) {
  const t = player.traits.find(t => t.key === key);
  return t ? t.level : 0;
}
// 전직으로 열린 특성까지 합친 목록
function traitList() {
  const out = (player.cls && TRAITS[player.cls.key]) ? TRAITS[player.cls.key].slice() : [];
  for (const a of player.advance) if (a.traits) out.push(...a.traits);
  return out;
}
function traitDefByKey(key) {
  return traitList().find(t => t.key === key);
}
function traitDef(clsKey, key) {   // 이전 호출부 호환
  return traitDefByKey(key);
}

/* ---------- 능동 스킬 빌더 ----------
   전직마다 스킬이 바뀌어야 하는데 24개를 손으로 쓰면 관리가 안 된다.
   형태별로 만들어 쓰고, 수치만 전직 데이터에 둔다. */
function skWave(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    spawnWave({ x: p.x, y: p.y, maxR: o.r * p.stats.area,
      dmg: (o.dmg + p.level * (o.perLv || 10)) * p.stats.damage * p.dynDmg,
      life: o.life || .5, color: o.color, element: o.elem, heal: o.heal || 0 });
    if (o.iframe) p.iframe = Math.max(p.iframe, o.iframe);
    if (o.healPct) p.hp = Math.min(p.stats.maxHp, p.hp + p.stats.maxHp * o.healPct);
    cam.shake = o.shake || 12;
    spawnParticles(p.x, p.y, 34, o.color, 320, .8, 5);
    Sfx.play(o.freq || 320, .45, "triangle", 1, o.slide || 500);
  } };
}

function skBurst(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const targets = nearestEnemies(p.x, p.y, 900, o.n);
    for (let i = 0; i < o.n; i++) {
      const t = targets[i % Math.max(1, targets.length)];
      const a = t ? Math.atan2(t.y - p.y, t.x - p.x) + rnd(-.22, .22)
                  : i / o.n * TAU;
      const sp = (o.speed || 380) * p.stats.projSpeed;
      spawnProjectile({
        x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: (o.r || 11) * p.stats.area,
        dmg: (o.dmg + p.level * (o.perLv || 8)) * p.stats.damage * p.dynDmg,
        pierce: o.pierce || 2, life: o.life || 2.2, kind: o.kind || "orb",
        angle: a, color: o.color, element: o.elem,
        homing: o.homing || 0, target: t || null,
      });
    }
    cam.shake = 8;
    Sfx.play(o.freq || 540, .3, "triangle", .9, 400);
  } };
}

function skStrike(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const pool = nearestEnemies(p.x, p.y, 800, o.n * 2);
    const dmg = (o.dmg + p.level * (o.perLv || 14)) * p.stats.damage * p.dynDmg;
    for (let i = 0; i < o.n; i++) {
      const e = pool[i % Math.max(1, pool.length)];
      if (!e || !e.active) continue;
      spawnBolt(e.x, e.y);
      damageEnemy(e, dmg, e.x, e.y - 60, 0, o.elem);
      spawnWave({ x: e.x, y: e.y, maxR: (o.splash || 90) * p.stats.area,
        dmg: dmg * .5, life: .28, color: o.color, element: o.elem });
    }
    cam.shake = 10;
    Sfx.play(200, .3, "sawtooth", .8, 700);
  } };
}

function skSlash(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const base = Math.atan2(p.faceY, p.faceX);
    const dmg = (o.dmg + p.level * (o.perLv || 12)) * p.stats.damage * p.dynDmg;
    for (let i = 0; i < o.n; i++)
      spawnSlash(p, base + (i - (o.n - 1) / 2) * (o.spread || .55), dmg,
                 o.len * p.stats.area, 1.4, o.elem);
    if (o.iframe) p.iframe = Math.max(p.iframe, o.iframe);
    cam.shake = 10;
    spawnParticles(p.x + p.faceX * 40, p.y + p.faceY * 40, 20, o.color, 260, .5, 4);
    Sfx.play(280, .3, "sawtooth", .8, 260);
  } };
}

function skDash(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    p.dash = o.dur; p.dashX = p.faceX; p.dashY = p.faceY;
    p.dashDmg = (o.dmg + p.level * (o.perLv || 12)) * p.stats.damage * p.dynDmg;
    p.dashHit.clear();
    p.iframe = Math.max(p.iframe, o.dur + .2);
    cam.shake = 8;
    Sfx.play(190, .3, "sawtooth", .85, 320);
  } };
}

function skBlink(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const ox = p.x, oy = p.y;
    p.x += p.faceX * o.dist; p.y += p.faceY * o.dist;
    p.iframe = Math.max(p.iframe, o.iframe || .9);
    const dmg = (o.dmg + p.level * (o.perLv || 8)) * p.stats.damage * p.dynDmg;
    for (const [bx, by] of [[ox, oy], [p.x, p.y]]) {
      spawnParticles(bx, by, 22, o.color, 280, .6, 4);
      for (let i = 0; i < o.n; i++) {
        const a = i / o.n * TAU, sp = 540 * p.stats.projSpeed;
        spawnProjectile({
          x: bx, y: by, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          r: 8 * p.stats.area, dmg, pierce: o.pierce || 2, life: 1.0,
          kind: o.kind || "dagger", angle: a, color: o.color, element: o.elem,
        });
      }
    }
    Sfx.play(760, .2, "sine", .8, -420);
  } };
}

   영혼을 모아 영구 강화를 사고, 그 강화가 다음 판의 시작 지점을 올린다. */
const ALTAR = [

  { key: "swift",   name: "민첩",   icon: "🪶", desc: "이동 속도 +4%",       max: 5, cost: l => 60 + l * 70 },
  { key: "avarice", name: "탐욕",   icon: "💰", desc: "경험치 획득 +6%",     max: 5, cost: l => 70 + l * 80 },
  { key: "zeal",    name: "신념",   icon: "🔔", desc: "직업 자원을 25 채운 채 시작", max: 3, cost: l => 130 + l * 150 },
  { key: "rebirth", name: "부활",   icon: "🕊️", desc: "쓰러질 때 한 번 되살아난다", max: 1, cost: () => 900 },
];

const Meta = {
  souls: 0, levels: {},
  load() {
    try {
      this.souls = Number(localStorage.getItem("ts_souls") || 0) || 0;
      this.levels = JSON.parse(localStorage.getItem("ts_altar") || "{}") || {};
    } catch (e) { this.souls = 0; this.levels = {}; }
  },
  save() {
    try {
      localStorage.setItem("ts_souls", String(this.souls));
      localStorage.setItem("ts_altar", JSON.stringify(this.levels));
    } catch (e) { /* 저장 불가여도 게임은 돈다 */ }
  },
  lv(k) { return this.levels[k] || 0; },
  costOf(u) { return u.cost(this.lv(u.key)); },
  buy(k) {
    const u = ALTAR.find(a => a.key === k);
    if (!u) return false;
    const l = this.lv(k);
    if (l >= u.max) return false;
    const c = this.costOf(u);
    if (this.souls < c) return false;
    this.souls -= c;
    this.levels[k] = l + 1;
    this.save();
    return true;
  },
};
Meta.load();

function advanceOptions(tier) {
  const prev = player.advance[tier - 2];
  const from = tier === 1 ? (player.cls && player.cls.key) : (prev && prev.key);
  return ADVANCES.filter(a => a.tier === tier && a.from === from);
}
// 전직 스탯/자세/스킬은 나중에 얻은 것이 이긴다
function curSkill() {
  for (let i = player.advance.length - 1; i >= 0; i--)
    if (player.advance[i].skill) return player.advance[i].skill;
  return player.cls ? player.cls.skill : null;
}
function advVal(key, def) {
  let v = def;
  for (const a of player.advance)
    if (a.stanceMod && a.stanceMod[key] !== undefined) v = a.stanceMod[key];
  return v;
}
function advName() {
  return player.advance.length ? player.advance[player.advance.length - 1].name
                               : (player.cls ? player.cls.name : "");
}
function advIcon() {
  return player.advance.length ? player.advance[player.advance.length - 1].icon
                               : (player.cls ? player.cls.icon : "");
}
function advColor() {
  return player.advance.length ? player.advance[player.advance.length - 1].color
                               : (player.cls ? player.cls.color : "#fff");
}

let selectedClass = 0;

/* ---------- HUD ---------- */
function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ":" + String(s).padStart(2, "0");
}

function drawHUD() {
  const s = player.stats;
  // 선택 화면 위에는 전투 배너를 띄우지 않는다. (반드시 사용 지점보다 먼저 선언할 것 —
  // 아래쪽에 두었더니 조합 해금 배너가 뜨는 프레임마다 TDZ 예외가 나서 화면이 멈췄다)
  const overlay = Game.state === "levelup" || Game.state === "advance" || Game.state === "paused";

  // 경험치 바 (상단 전체)
  const xpf = clamp(player.xp / player.xpNext, 0, 1);
  ctx.fillStyle = "#0d0d18"; ctx.fillRect(0, 0, W, 14);
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "#3fa9ff"); g.addColorStop(1, "#7ce7ff");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W * xpf, 14);
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(0, 0, W, 4);
  ctx.font = "700 11px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff"; ctx.fillText("LV " + player.level, 34, 7);

  // 체력
  const hpf = clamp(player.hp / s.maxHp, 0, 1);
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(14, 24, 240, 20);
  ctx.fillStyle = hpf > .3 ? "#3ddc84" : "#ff5b6b";
  ctx.fillRect(16, 26, 236 * hpf, 16);
  ctx.font = "700 13px " + FONT; ctx.fillStyle = "#fff"; ctx.textAlign = "left";
  ctx.fillText(Math.ceil(player.hp) + " / " + Math.round(s.maxHp), 22, 34);

  // 직업 자원
  const C = player.cls;
  if (C) {
    const R = C.resource, rf = clamp(player.res / RES_MAX, 0, 1);
    const ready = player.res >= curSkill().cost;
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(14, 47, 240, 13);
    ctx.fillStyle = R.color;
    ctx.globalAlpha = ready ? 1 : .62;
    ctx.fillRect(16, 49, 236 * rf, 9);
    ctx.globalAlpha = 1;
    // 스킬 발동에 필요한 지점을 눈금으로 표시
    const markX = 16 + 236 * (curSkill().cost / RES_MAX);
    ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.fillRect(markX - 1, 46, 2, 15);
    ctx.font = "700 10px " + FONT; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.fillText(R.name + "  " + Math.floor(player.res), 20, 53);
    if (player.advance.length) {
      ctx.textAlign = "right";
      ctx.font = "700 11px " + FONT; ctx.fillStyle = advColor();
      ctx.fillText(advIcon() + " " + advName(), 248, 53);
      ctx.textAlign = "left";
    }
  }

  // 직업 자세 상태 — 지금 강해지고 있는지 한눈에 보여야 한다
  let cy = 68;
  if (C && C.stance) {
    ctx.fillStyle = "rgba(10,10,20,.6)";
    ctx.beginPath(); ctx.roundRect(14, cy, 240, 22, 6); ctx.fill();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    if (C.key === "paladin") {
      const on = player.bulwark > .5;
      ctx.font = "700 12px " + FONT;
      ctx.fillStyle = on ? "#ffd36e" : "rgba(255,255,255,.35)";
      ctx.fillText("🛡 방벽 " + (on ? "-" + Math.round((1 - player.dynArmor) * 100) + "%" : "대기"), 22, cy + 11);
      ctx.textAlign = "right";
      ctx.fillStyle = player.press > 0 ? "#ff9f6b" : "rgba(255,255,255,.3)";
      ctx.fillText("접전 ×" + player.press + "  (+" + Math.round((player.dynDmg - 1) * 100) + "%)", 248, cy + 11);
    } else {
      const st = Math.floor(player.channel), maxStage = 3 + traitLv("deepMana");
      ctx.font = "700 12px " + FONT;
      ctx.fillStyle = st > 0 ? "#9bb8ff" : "rgba(255,255,255,.35)";
      ctx.fillText("✦ 영창", 22, cy + 11);
      for (let i = 0; i < maxStage; i++) {
        ctx.fillStyle = i < st ? "#9bb8ff" : "rgba(255,255,255,.13)";
        ctx.beginPath(); ctx.roundRect(76 + i * 17, cy + 6, 13, 10, 3); ctx.fill();
      }
      ctx.textAlign = "right";
      ctx.fillStyle = st > 0 ? "#9bb8ff" : "rgba(255,255,255,.3)";
      ctx.fillText("피해 +" + Math.round((player.dynDmg - 1) * 100) + "%", 248, cy + 11);
    }
    cy += 26;
  }

  // 활성화된 속성 조합 — 지금 일하고 있는지가 보여야 한다
  for (const cb of COMBOS) {
    if (!player.combos.has(cb.key)) continue;
    const pr = comboProcs[cb.key];
    const fl = pr ? clamp(pr.flash, 0, 1) : 0;
    if (pr && pr.flash > 0) pr.flash -= 1 / 60;
    const ea = ELEMENTS[cb.a], eb = ELEMENTS[cb.b];
    ctx.fillStyle = fl > 0 ? "rgba(56,44,20," + (.6 + fl * .35).toFixed(2) + ")" : "rgba(10,10,20,.62)";
    ctx.beginPath(); ctx.roundRect(14, cy, 240, 24, 7); ctx.fill();
    ctx.strokeStyle = fl > 0 ? "rgba(255,225,150," + (.4 + fl * .6).toFixed(2) + ")" : "rgba(255,210,140,.28)";
    ctx.lineWidth = fl > 0 ? 2 : 1; ctx.stroke();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "11px " + FONT;
    ctx.fillStyle = ea.color; ctx.fillText(ea.icon, 21, cy + 12);
    ctx.fillStyle = "rgba(255,255,255,.3)"; ctx.fillText("+", 36, cy + 12);
    ctx.fillStyle = eb.color; ctx.fillText(eb.icon, 46, cy + 12);
    const done = player.mastered.has(cb.key);
    ctx.font = "700 11.5px " + FONT;
    ctx.fillStyle = done ? "#ffe9a8" : (fl > 0 ? "#fff3d0" : "#ffd9a0");
    ctx.fillText((done ? "★ " : "") + cb.name, 66, cy + 12);
    // 오른쪽은 한 줄로 합쳐 한 번만 정렬한다 (따로 그리면 긴 이름과 겹친다)
    const cnt = pr && pr.count ? "×" + pr.count.toLocaleString("ko-KR") : "";
    const prog = done ? "★" + MASTER_POWER + "배"
      : Math.min(elemLevel(cb.a), COMBO_MASTER) + "+" + Math.min(elemLevel(cb.b), COMBO_MASTER)
        + "/" + (COMBO_MASTER * 2);
    ctx.textAlign = "right";
    ctx.font = "700 10px " + FONT;
    ctx.fillStyle = done ? "#ffd34d" : "rgba(255,255,255,.42)";
    ctx.fillText((cnt ? cnt + "  ·  " : "") + prog, 246, cy + 12);
    ctx.textAlign = "left";
    cy += 27;
  }

  // 아직 안 열린 조합의 진행도 — 무엇을 얼마나 더 올려야 하는지 항상 떠 있게 한다
  const pending = combosPending();
  for (let i = 0; i < Math.min(3, pending.length); i++) {
    const { c, la, lb } = pending[i];
    const ea = ELEMENTS[c.a], eb = ELEMENTS[c.b];
    ctx.fillStyle = "rgba(10,10,20,.42)";
    ctx.beginPath(); ctx.roundRect(14, cy, 240, 22, 7); ctx.fill();
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.lineWidth = 1; ctx.stroke();
    ctx.setLineDash([]);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "700 10px " + FONT;
    ctx.fillStyle = la >= COMBO_LEVEL ? ea.color : "rgba(255,255,255,.32)";
    ctx.fillText(ea.icon + " " + la + "/" + COMBO_LEVEL, 21, cy + 11);
    ctx.fillStyle = lb >= COMBO_LEVEL ? eb.color : "rgba(255,255,255,.32)";
    ctx.fillText(eb.icon + " " + lb + "/" + COMBO_LEVEL, 76, cy + 11);
    ctx.textAlign = "right";
    ctx.font = "600 10.5px " + FONT; ctx.fillStyle = "rgba(255,255,255,.4)";
    ctx.fillText(c.name, 246, cy + 11);
    ctx.textAlign = "left";
    cy += 25;
  }

  // 타이머
  ctx.textAlign = "center";
  ctx.font = "800 30px " + FONT;
  ctx.lineWidth = 5; ctx.strokeStyle = "rgba(0,0,0,.7)";
  ctx.strokeText(fmtTime(Game.time), W / 2, 42);
  ctx.fillStyle = "#fff"; ctx.fillText(fmtTime(Game.time), W / 2, 42);

  // 처치 수 / 기록
  ctx.textAlign = "right"; ctx.font = "700 14px " + FONT;
  ctx.fillStyle = "rgba(255,255,255,.85)";
  ctx.fillText("☠ " + Game.kills, W - 16, 32);
  ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.font = "600 12px " + FONT;
  ctx.fillText("최고 기록 " + fmtTime(Game.bestTime), W - 16, 50);

  // 보유 무기 / 패시브
  let ix = 14;
  const drawSlot = (icon, level, tint) => {
    ctx.fillStyle = "rgba(10,10,20,.66)";
    ctx.beginPath(); ctx.roundRect(ix, H - 54, 40, 40, 8); ctx.fill();
    ctx.strokeStyle = tint; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.font = "20px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff"; ctx.fillText(icon, ix + 20, H - 35);
    ctx.font = "700 10px " + FONT; ctx.textAlign = "right";
    ctx.fillStyle = level >= MAX_LEVEL ? "#ffd34d" : "rgba(255,255,255,.8)";
    ctx.fillText(level >= MAX_LEVEL ? "MAX" : "Lv" + level, ix + 37, H - 20);
    ix += 46;
  };
  for (const w of player.weapons) drawSlot(WEAPONS[w.key].icon, w.level, "rgba(255,210,120,.5)");
  ix += 12;
  for (const p of player.passives) drawSlot(PASSIVES[p.key].icon, p.level, "rgba(140,200,255,.4)");
  if (player.traits.length) {
    ix += 12;
    for (const t of player.traits) {
      const d = traitDefByKey(t.key);
      if (d) drawSlot(d.icon, t.level, (advColor() || "#c9a3ff") + "88");
    }
  }

  // ── 미니맵 — 어디에 뭐가 있는지 한눈에
  {
    const MM = 152, mx = W - MM - 16, my = H - MM - 76;
    const RANGE = 2400, sc = (MM / 2 - 6) / RANGE;
    ctx.save();
    ctx.fillStyle = "rgba(8,8,16,.78)";
    ctx.beginPath(); ctx.roundRect(mx, my, MM, MM, 10); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.roundRect(mx + 1, my + 1, MM - 2, MM - 2, 9); ctx.clip();
    const ccx = mx + MM / 2, ccy = my + MM / 2;

    // 적 밀도 — 전부 찍으면 무의미하므로 표본만
    ctx.fillStyle = "rgba(255,120,120,.32)";
    for (let i = 0; i < enemies.length; i += 4) {
      const e = enemies[i];
      if (!e.active || e.boss || e.sigilKey) continue;
      const dx = (e.x - player.x) * sc, dy = (e.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 || Math.abs(dy) > MM / 2) continue;
      ctx.fillRect(ccx + dx - 1, ccy + dy - 1, 2, 2);
    }
    // 지형 — 벽만 옅게
    ctx.fillStyle = "rgba(150,150,175,.30)";
    for (const o of obstacles) {
      if (!o.wall) continue;
      const dx = (o.x - player.x) * sc, dy = (o.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 - 3 || Math.abs(dy) > MM / 2 - 3) continue;
      ctx.fillRect(ccx + dx - 2, ccy + dy - 2, 4, 4);
    }
    // 지형지물
    for (const lm of landmarks) {
      const dx = (lm.x - player.x) * sc, dy = (lm.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 - 4 || Math.abs(dy) > MM / 2 - 4) continue;
      ctx.fillStyle = lm.T.color;
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, lm.type === "shrine" ? 4 : 3, 0, TAU); ctx.fill();
    }
    // 징표·아이템
    for (const pk of pickups) {
      if (!pk.active) continue;
      const dx = (pk.x - player.x) * sc, dy = (pk.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 - 4 || Math.abs(dy) > MM / 2 - 4) continue;
      const crit = pk.kind === "sigil";
      ctx.fillStyle = crit ? "#ffd34d" : "rgba(255,255,255,.5)";
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, crit ? 4 : 2, 0, TAU); ctx.fill();
    }
    // 보스·파수꾼 — 가장 크게, 맥동
    const bp = .6 + Math.sin(performance.now() / 180) * .4;
    for (const e of enemies) {
      if (!e.active || (!e.boss && !e.sigilKey)) continue;
      const dx = clamp((e.x - player.x) * sc, -MM / 2 + 6, MM / 2 - 6);
      const dy = clamp((e.y - player.y) * sc, -MM / 2 + 6, MM / 2 - 6);
      ctx.globalAlpha = bp;
      ctx.fillStyle = e.boss ? "#ff3b6b" : "#c9a3ff";
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, 6, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = e.boss ? "#ff3b6b" : "#c9a3ff"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, 9, 0, TAU); ctx.stroke();
    }
    // 플레이어
    ctx.fillStyle = "#fff";
    ctx.save(); ctx.translate(ccx, ccy); ctx.rotate(Math.atan2(player.faceY, player.faceX));
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.restore();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "700 9px " + FONT; ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.fillText(Math.round(RANGE / 10) + "m", mx + 6, my + MM - 9);
  }

  // ── 보스 체력바 — 살아 있는 동안 화면 위에
  {
    let boss = null;
    for (const e of enemies) if (e.active && (e.boss || e.sigilKey)) { boss = e; if (e.boss) break; }
    if (boss) {
      const bw = 420, bx = W / 2 - bw / 2, by = 64;
      const f = clamp(boss.hp / boss.maxHp, 0, 1);
      ctx.fillStyle = "rgba(0,0,0,.6)";
      ctx.beginPath(); ctx.roundRect(bx, by, bw, 16, 5); ctx.fill();
      ctx.fillStyle = boss.boss ? "#ff3b6b" : "#c9a3ff";
      ctx.beginPath(); ctx.roundRect(bx + 2, by + 2, (bw - 4) * f, 12, 4); ctx.fill();
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "700 11px " + FONT; ctx.fillStyle = "#fff";
      ctx.fillText((boss.boss ? (boss.type.title || "보스") : "제단의 파수꾼") + "  " + Math.ceil(boss.hp).toLocaleString("ko-KR"), W / 2, by + 8);
      // 화면 밖이면 방향까지
      const sx = boss.x - cam.x, sy = boss.y - cam.y;
      if (sx < 0 || sx > W || sy < 0 || sy > H) {
        const d = Math.round(Math.hypot(boss.x - player.x, boss.y - player.y) / 10);
        ctx.font = "700 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.6)";
        ctx.fillText(d + "m 떨어져 있음", W / 2, by + 28);
      }
    }
  }

  // 화면 밖 보스·파수꾼 방향 — 지형지물보다 강하게
  for (const e of enemies) {
    if (!e.active || (!e.boss && !e.sigilKey)) continue;
    const sx = e.x - cam.x, sy = e.y - cam.y;
    const m = 58;
    if (sx > m && sx < W - m && sy > m && sy < H - m) continue;
    const ax = clamp(sx, m, W - m), ay = clamp(sy, m, H - m);
    const ang = Math.atan2(sy - player.sy, sx - player.sx);
    const col = e.boss ? "#ff3b6b" : "#c9a3ff";
    ctx.save();
    ctx.globalAlpha = .7 + Math.sin(performance.now() / 170) * .3;
    ctx.translate(ax, ay); ctx.rotate(ang);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(24, 0); ctx.lineTo(-8, -13); ctx.lineTo(-8, 13); ctx.closePath(); ctx.fill();
    ctx.rotate(-ang);
    ctx.font = "800 12px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = col;
    ctx.fillText(e.boss ? (e.type.title || "보스") : "파수꾼", 0, -26);
    ctx.font = "700 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.fillText(Math.round(Math.hypot(e.x - player.x, e.y - player.y) / 10) + "m", 0, 26);
    ctx.restore();
  }

  // 화면 밖 지형지물 방향 표시 — 어디로 갈지 모르면 돌아다닐 수 없다
  for (const lm of landmarks) {
    const sx = lm.x - cam.x, sy = lm.y - cam.y;
    const m = 46;
    if (sx > m && sx < W - m && sy > m && sy < H - m) continue;
    const d = Math.hypot(lm.x - player.x, lm.y - player.y);
    if (d > 1500) continue;
    const ax = clamp(sx, m, W - m), ay = clamp(sy, m, H - m);
    const ang = Math.atan2(sy - player.sy, sx - player.sx);
    ctx.save();
    ctx.globalAlpha = clamp(1.4 - d / 1500, .3, .95);
    ctx.translate(ax, ay);
    ctx.rotate(ang);
    ctx.fillStyle = lm.T.color;
    ctx.beginPath();
    ctx.moveTo(14, 0); ctx.lineTo(-6, -8); ctx.lineTo(-6, 8);
    ctx.closePath(); ctx.fill();
    ctx.rotate(-ang);
    ctx.font = "17px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(lm.T.icon, 0, -20);
    ctx.font = "700 9px " + FONT; ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.fillText(Math.round(d / 10) + "m", 0, 18);
    ctx.restore();
  }

  // 소지품 (Q 로 사용)
  {
    const bw = 40, gap = 6;
    const bx0 = W - 16 - (bw * MAX_ITEMS + gap * (MAX_ITEMS - 1));
    for (let i = 0; i < MAX_ITEMS; i++) {
      const bx = bx0 + i * (bw + gap), by = H - 54;
      const key = player.items[i], C = key ? CONSUMABLES[key] : null;
      ctx.fillStyle = C ? "rgba(24,22,38,.92)" : "rgba(10,10,20,.5)";
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bw, 8); ctx.fill();
      ctx.strokeStyle = C ? (i === 0 ? C.color : C.color + "66") : "rgba(255,255,255,.1)";
      ctx.lineWidth = C && i === 0 ? 2 : 1; ctx.stroke();
      if (C) {
        ctx.font = "21px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(C.icon, bx + bw / 2, by + bw / 2);
      }
    }
    ctx.font = "600 10px " + FONT; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillStyle = player.items.length ? "rgba(255,255,255,.6)" : "rgba(255,255,255,.25)";
    ctx.fillText("Q 사용", W - 16, H - 66);
    if (player.items.length) {
      const C0 = CONSUMABLES[player.items[0]];
      ctx.font = "600 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.45)";
      ctx.fillText(C0.name, W - 16, H - 6);
    }
  }

  // 징표 · 버프
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.font = "700 14px " + FONT;
  ctx.fillStyle = player.sigils > 0 ? "#ffd34d" : "rgba(255,255,255,.28)";
  ctx.fillText("🔯 " + player.sigils, W - 16, 68);
  let by2 = 90;
  if (player.buffFury > 0) {
    ctx.font = "700 12px " + FONT; ctx.fillStyle = "#ff6b4a";
    ctx.fillText("🧪 광란 " + player.buffFury.toFixed(1) + "s", W - 16, by2); by2 += 20;
  }
  if (player.buffWard > 0) {
    ctx.font = "700 12px " + FONT; ctx.fillStyle = "#8fd0ff";
    ctx.fillText("🔰 수호 " + player.buffWard.toFixed(1) + "s", W - 16, by2); by2 += 20;
  }

  // 전직 대기 — 레벨은 됐는데 징표가 없을 때
  if (Game.advancePending) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const a = .65 + Math.sin(performance.now() / 320) * .3;
    ctx.globalAlpha = a;
    ctx.font = "800 17px " + FONT; ctx.fillStyle = "#ffd34d";
    ctx.fillText("⛩️ 전직 가능 — 전직의 징표가 필요하다", W / 2, 108);
    ctx.font = "600 12px " + FONT; ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillText("봉인된 제단의 파수꾼이나 보스를 쓰러뜨려라", W / 2, 128);
    ctx.globalAlpha = 1;
  }

  // 지형지물 알림
  if (Game.lmFlash > 0 && !overlay) {
    ctx.globalAlpha = Math.min(1, Game.lmFlash / 3 * 1.6);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 20px " + FONT; ctx.fillStyle = "#ffe9a8";
    ctx.fillText(Game.lmFlashText, W / 2, 206);
    ctx.globalAlpha = 1;
  }

  // 능동 스킬
  if (player.cls) {
    const C = player.cls, ready = player.res >= curSkill().cost;
    const bw = 62, bx = W / 2 - bw / 2, by = H - 106;
    ctx.save();
    if (ready) { ctx.shadowColor = C.resource.color; ctx.shadowBlur = 16; }
    ctx.fillStyle = ready ? "rgba(28,26,42,.95)" : "rgba(12,12,20,.7)";
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bw, 12); ctx.fill();
    ctx.strokeStyle = ready ? C.resource.color : "rgba(255,255,255,.14)";
    ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = ready ? 1 : .4;
    ctx.font = "30px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff"; ctx.fillText(curSkill().icon, bx + bw / 2, by + 28);
    ctx.font = "700 11px " + FONT;
    ctx.fillStyle = ready ? C.resource.color : "rgba(255,255,255,.55)";
    ctx.fillText(Math.min(100, Math.floor(player.res)) + " / " + curSkill().cost, bx + bw / 2, by + 50);
    ctx.globalAlpha = 1;
    // 이름과 단축키는 박스 밖에 — 62px 안에 한글 이름은 들어가지 않는다
    ctx.font = "700 12px " + FONT;
    ctx.fillStyle = ready ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.4)";
    ctx.fillText(curSkill().name, bx + bw / 2, by + bw + 12);
    ctx.font = "600 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.3)";
    ctx.fillText("SPACE", bx + bw / 2, by + bw + 27);
  }

  // 새 조합 해금 배너
  if (Game.comboFlash > 0 && !overlay) {
    const a = clamp(Game.comboFlash / 2.6, 0, 1);
    ctx.globalAlpha = Math.min(1, a * 1.6);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const last = COMBOS.filter(c => (Game.comboFlashMaster ? player.mastered : player.combos).has(c.key)).slice(-1)[0];
    const txt = last ? last.icon + " " + last.name + " — " + last.desc : "";
    ctx.font = "600 14px " + FONT;
    const bwid = Math.max(300, ctx.measureText(txt).width + 60);
    ctx.fillStyle = "rgba(10,8,18,.82)";
    ctx.beginPath(); ctx.roundRect(W / 2 - bwid / 2, 82, bwid, 62, 12); ctx.fill();
    ctx.strokeStyle = "rgba(255,217,160,.4)"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.font = "800 20px " + FONT; ctx.fillStyle = Game.comboFlashMaster ? "#ffe9a8" : "#ffd9a0";
    ctx.fillText(Game.comboFlashMaster ? "★ 조합 완성! 효과가 강해졌다" : "속성 조합 발동!", W / 2, 104);
    ctx.font = "600 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.8)";
    if (last) ctx.fillText(txt, W / 2, 128);
    ctx.globalAlpha = 1;
  }

  // 전직 연출
  if (Game.advanceFlash > 0 && !overlay) {
    const a = clamp(Game.advanceFlash / 3.2, 0, 1);
    ctx.globalAlpha = Math.min(1, a * 1.5);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 40px " + FONT; ctx.fillStyle = advColor();
    ctx.fillText(advIcon() + "  " + advName(), W / 2, 132);
    ctx.font = "700 15px " + FONT; ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillText(player.advance.length >= 3 ? "★ 각성 완료 — 규칙이 바뀌었다"
                                            : "전직 완료 — 스킬과 특성이 새로 열렸다", W / 2, 164);
    ctx.globalAlpha = 1;
  }

  // 사냥개 무리 경고
  if (Game.houndWarn > 0 && !overlay) {
    ctx.globalAlpha = Math.min(1, Game.houndWarn / 2.4 * 1.8) * (.6 + Math.abs(Math.sin(Game.time * 8)) * .4);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 24px " + FONT; ctx.fillStyle = "#ff9f6b";
    ctx.fillText("🐺 사냥개 무리가 온다 — 도망칠 수 없다", W / 2, 178);
    ctx.globalAlpha = 1;
  }

  // 조작 안내 (초반에만)
  if (Game.time < 8) {
    ctx.globalAlpha = clamp((8 - Game.time) / 3, 0, 1);
    ctx.textAlign = "center"; ctx.font = "600 15px " + FONT;
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.fillText("WASD 이동  ·  공격은 자동  ·  SPACE 직업 스킬  ·  Q 아이템  ·  맵의 🧰⛩️🗿 을 찾아라", W / 2, H - 100);
    ctx.globalAlpha = 1;
  }
}

/* ---------- 오버레이 ---------- */
function panel(x, y, w, h, r = 14, fill = "rgba(12,12,22,.92)", stroke = "rgba(255,255,255,.14)") {
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke();
}
const inRect = (mx, my, x, y, w, h) => mx >= x && mx <= x + w && my >= y && my <= y + h;

function drawTitle() {
  ctx.fillStyle = "rgba(8,8,16,.82)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  ctx.font = "800 62px " + FONT;
  ctx.fillStyle = "#ffd36e";
  ctx.fillText("TEMPLAR SURVIVORS", W / 2, 96);
  ctx.font = "600 16px " + FONT; ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.fillText("중세 판타지 오토배틀 서바이벌 · 15분을 버텨라", W / 2, 134);

  ctx.font = "700 18px " + FONT; ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.fillText("직업 선택", W / 2, 186);

  // 제단 진입 버튼
  const abx = W - 232, aby = 28, abw = 204, abh = 46;
  const aHover = inRect(mouse.x, mouse.y, abx, aby, abw, abh);
  panel(abx, aby, abw, abh, 12,
    aHover ? "rgba(38,28,58,.98)" : "rgba(16,14,28,.9)",
    aHover ? "#c9a3ff" : "rgba(201,163,255,.3)");
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.font = "20px " + FONT; ctx.fillStyle = "#fff";
  ctx.fillText("🔮", abx + 16, aby + 23);
  ctx.font = "700 14px " + FONT; ctx.fillStyle = "#c9a3ff";
  ctx.fillText("영혼의 제단", abx + 44, aby + 16);
  ctx.font = "600 12px " + FONT; ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.fillText(Meta.souls.toLocaleString("ko-KR") + " 영혼  ·  TAB", abx + 44, aby + 33);
  if (aHover && mouse.clicked) { Game.state = "altar"; return; }
  ctx.textAlign = "center";

  const cw = 268, ch = 348, gap = 18;
  const total = CLASSES.length * cw + (CLASSES.length - 1) * gap;
  const x0 = (W - total) / 2, y0 = 206;

  for (let i = 0; i < CLASSES.length; i++) {
    const c = CLASSES[i], x = x0 + i * (cw + gap);
    const hovered = inRect(mouse.x, mouse.y, x, y0, cw, ch);
    if (hovered) selectedClass = i;
    const sel = selectedClass === i;
    const oy = sel ? -6 : 0;
    panel(x, y0 + oy, cw, ch, 16,
      sel ? "rgba(30,26,48,.97)" : "rgba(14,14,24,.9)",
      sel ? c.color : "rgba(255,255,255,.12)");

    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "40px " + FONT; ctx.fillStyle = "#fff";
    ctx.fillText(c.icon, x + cw / 2, y0 + 46 + oy);
    ctx.font = "800 23px " + FONT; ctx.fillStyle = c.color;
    ctx.fillText(c.name, x + cw / 2, y0 + 86 + oy);
    ctx.font = "600 11.5px " + FONT; ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.fillText(c.tagline, x + cw / 2, y0 + 107 + oy);

    // 구분선
    ctx.strokeStyle = "rgba(255,255,255,.1)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 22, y0 + 124 + oy); ctx.lineTo(x + cw - 22, y0 + 124 + oy); ctx.stroke();

    const row = (label, value, vy, valColor) => {
      ctx.textAlign = "left";
      ctx.font = "700 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.38)";
      ctx.fillText(label, x + 22, vy);
      ctx.textAlign = "right";
      ctx.font = "600 12.5px " + FONT; ctx.fillStyle = valColor || "rgba(255,255,255,.92)";
      ctx.fillText(value, x + cw - 22, vy);
    };
    const W_ = WEAPONS[c.start], E = ELEMENTS[W_.element];
    let ry = y0 + 140 + oy;
    if (c.stance) { row("자세", "⚜ " + c.stanceName, ry, c.color); ry += 20; }
    row("무기", W_.icon + " " + W_.name, ry); ry += 20;
    row("속성", E.icon + " " + E.name, ry, E.color); ry += 20;
    row("자원", c.resource.name, ry, c.resource.color); ry += 20;
    row("스킬", c.skill.icon + " " + c.skill.name, ry); ry += 26;

    // 자세와 자원이 차는 방식 — 직업의 성격이 여기서 갈린다
    ctx.textAlign = "center";
    if (c.stance) {
      ctx.font = "600 11px " + FONT; ctx.fillStyle = c.color;
      wrapText(c.stanceHint, x + cw / 2, ry, cw - 36, 15);
      ry += 30;
    }
    ctx.font = "500 11px " + FONT; ctx.fillStyle = "rgba(255,255,255,.5)";
    wrapText(c.resource.hint, x + cw / 2, ry, cw - 40, 15);
    ry += c.stance ? 26 : 32;

    ctx.font = "500 11px " + FONT; ctx.fillStyle = "rgba(255,255,255,.4)";
    wrapText(c.desc, x + cw / 2, ry, cw - 36, 15);

    ctx.font = "700 12px " + FONT; ctx.fillStyle = "rgba(255,255,255,.3)";
    ctx.fillText("[" + (i + 1) + "]", x + cw / 2, y0 + ch - 16 + oy);

    if (hovered && mouse.clicked) { selectedClass = i; Game.reset(); }
  }

  // 속성 조합 레시피 — 공개해야 플레이어가 '설계'를 한다
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "700 12px " + FONT; ctx.fillStyle = "rgba(255,255,255,.42)";
  ctx.fillText("서로 다른 속성의 무기를 " + COMBO_LEVEL + "레벨까지 올리면 조합이 열리고, "
    + "둘 다 " + COMBO_MASTER + "레벨이면 ★완성되어 효과가 " + MASTER_POWER + "배가 된다", W / 2, 578);

  const chipW = 176, chipGap = 8;
  const cTotal = COMBOS.length * chipW + (COMBOS.length - 1) * chipGap;
  let cx = (W - cTotal) / 2;
  for (const cb of COMBOS) {
    panel(cx, 596, chipW, 34, 8, "rgba(14,14,24,.8)", "rgba(255,255,255,.1)");
    ctx.textAlign = "left"; ctx.font = "600 11px " + FONT;
    const ea = ELEMENTS[cb.a], eb = ELEMENTS[cb.b];
    ctx.fillStyle = ea.color; ctx.fillText(ea.icon, cx + 12, 613);
    ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillText("+", cx + 30, 613);
    ctx.fillStyle = eb.color; ctx.fillText(eb.icon, cx + 42, 613);
    ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.font = "700 12px " + FONT;
    ctx.fillText(cb.name, cx + 66, 613);
    cx += chipW + chipGap;
  }

  ctx.font = "700 17px " + FONT;
  ctx.fillStyle = "rgba(255,255,255," + (.55 + Math.sin(performance.now() / 400) * .3).toFixed(2) + ")";
  ctx.fillText("SPACE 또는 클릭으로 시작   ·   게임 중 SPACE 로 직업 스킬   ·   M 음소거", W / 2, H - 38);
}

function wrapText(text, cx, y, maxW, lh) {
  const words = text.split(" ");
  let line = "", yy = y;
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, cx, yy); line = w; yy += lh; }
    else line = test;
  }
  if (line) ctx.fillText(line, cx, yy);
}

function drawAltar() {
  ctx.fillStyle = "rgba(8,8,16,.9)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  ctx.font = "800 46px " + FONT; ctx.fillStyle = "#c9a3ff";
  ctx.fillText("영혼의 제단", W / 2, 78);
  ctx.font = "600 14px " + FONT; ctx.fillStyle = "rgba(255,255,255,.55)";
  ctx.fillText("판이 끝나도 남는 강화. 다음 판의 시작 지점이 올라간다.", W / 2, 110);

  ctx.font = "800 24px " + FONT; ctx.fillStyle = "#ffd34d";
  ctx.fillText("🔮 " + Meta.souls.toLocaleString("ko-KR") + " 영혼", W / 2, 152);

  const cw = 380, ch = 132, gap = 22, cols = 3;
  const total = cols * cw + (cols - 1) * gap;
  const x0 = (W - total) / 2, y0 = 240;

  for (let i = 0; i < ALTAR.length; i++) {
    const u = ALTAR[i];
    const col = i % cols, rowi = Math.floor(i / cols);
    const x = x0 + col * (cw + gap), y = y0 + rowi * (ch + gap);
    const lv = Meta.lv(u.key), maxed = lv >= u.max;
    const cost = Meta.costOf(u);
    const afford = !maxed && Meta.souls >= cost;
    const hovered = inRect(mouse.x, mouse.y, x, y, cw, ch);

    panel(x, y, cw, ch, 14,
      hovered && afford ? "rgba(34,28,52,.98)" : "rgba(14,14,24,.92)",
      maxed ? "rgba(255,211,77,.5)" : afford ? (hovered ? "#c9a3ff" : "rgba(201,163,255,.35)") : "rgba(255,255,255,.1)");

    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "34px " + FONT; ctx.fillStyle = "#fff";
    ctx.globalAlpha = maxed || afford ? 1 : .45;
    ctx.fillText(u.icon, x + 22, y + 44);

    ctx.font = "800 19px " + FONT; ctx.fillStyle = maxed ? "#ffd34d" : "#fff";
    ctx.fillText(u.name, x + 68, y + 36);
    ctx.font = "500 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.6)";
    ctx.fillText(u.desc, x + 68, y + 58);
    ctx.globalAlpha = 1;

    // 레벨 눈금
    for (let k = 0; k < u.max; k++) {
      const px = x + 68 + k * 20;
      ctx.fillStyle = k < lv ? "#c9a3ff" : "rgba(255,255,255,.13)";
      ctx.beginPath(); ctx.roundRect(px, y + 78, 14, 8, 3); ctx.fill();
    }

    ctx.textAlign = "right";
    if (maxed) {
      ctx.font = "800 15px " + FONT; ctx.fillStyle = "#ffd34d";
      ctx.fillText("최대", x + cw - 22, y + 82);
    } else {
      ctx.font = "700 16px " + FONT;
      ctx.fillStyle = afford ? "#ffd34d" : "rgba(255,255,255,.3)";
      ctx.fillText("🔮 " + cost, x + cw - 22, y + 82);
    }

    ctx.textAlign = "left";
    ctx.font = "700 11px " + FONT; ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.fillText("[" + (i + 1) + "]", x + 22, y + ch - 16);

    if (hovered && mouse.clicked) {
      if (Meta.buy(u.key)) Sfx.play(880, .14, "triangle", .8, 300);
      else Sfx.play(150, .1, "square", .35, -40);
    }
  }

  ctx.textAlign = "center";
  ctx.font = "700 16px " + FONT; ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.fillText("TAB / ESC 로 돌아가기", W / 2, H - 44);
}

function drawAdvance() {
  ctx.fillStyle = "rgba(4,4,10,.88)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  const tier = player.advance.length + 1;
  ctx.font = "800 52px " + FONT;
  ctx.fillStyle = tier === 3 ? "#ff8ad8" : "#ffd34d";
  ctx.fillText(tier === 3 ? "★ 3차 각성 ★" : tier + "차 전직", W / 2, 78);
  ctx.font = "600 15px " + FONT; ctx.fillStyle = "rgba(255,255,255,.62)";
  ctx.fillText(tier === 3
    ? advName() + " · 마지막 각성 — 규칙 자체가 바뀝니다"
    : advName() + " · 앞으로 무엇이 될지 고르세요 — 스킬과 특성이 통째로 바뀝니다", W / 2, 112);

  const n = Game.choices.length;
  // 3차 각성 카드는 특성·지급무기가 없어 아래가 비므로 높이를 줄인다
  const hasExtra = Game.choices.some(a => (a.traits && a.traits.length) || a.grant);
  const cw = 400, ch = hasExtra ? 470 : 372, gap = 30;
  const total = n * cw + (n - 1) * gap;
  const x0 = (W - total) / 2, y0 = 150;

  for (let i = 0; i < n; i++) {
    const a = Game.choices[i]; if (!a) continue;
    const x = x0 + i * (cw + gap);
    const hovered = inRect(mouse.x, mouse.y, x, y0, cw, ch);
    const oy = hovered ? -10 : 0;
    panel(x, y0 + oy, cw, ch, 20,
      hovered ? "rgba(32,28,50,.99)" : "rgba(13,13,22,.96)",
      hovered ? a.color : "rgba(255,255,255,.13)");

    ctx.textAlign = "center";
    ctx.font = "60px " + FONT; ctx.fillStyle = "#fff";
    ctx.fillText(a.icon, x + cw / 2, y0 + 72 + oy);
    ctx.font = "800 34px " + FONT; ctx.fillStyle = a.color;
    ctx.fillText(a.name, x + cw / 2, y0 + 132 + oy);
    ctx.font = "600 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.fillText(a.tagline, x + cw / 2, y0 + 158 + oy);

    ctx.strokeStyle = "rgba(255,255,255,.1)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 28, y0 + 178 + oy); ctx.lineTo(x + cw - 28, y0 + 178 + oy); ctx.stroke();

    ctx.font = "500 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.75)";
    wrapText(a.desc, x + cw / 2, y0 + 204 + oy, cw - 52, 19);

    // 새 스킬
    let sy = y0 + 288 + oy;
    ctx.fillStyle = "rgba(255,255,255,.05)";
    ctx.beginPath(); ctx.roundRect(x + 24, sy - 26, cw - 48, 58, 10); ctx.fill();
    ctx.textAlign = "left";
    ctx.font = "26px " + FONT; ctx.fillStyle = "#fff";
    ctx.fillText(a.skill.icon, x + 40, sy - 2);
    ctx.font = "700 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.4)";
    ctx.fillText("새 스킬", x + 76, sy - 12);
    ctx.font = "700 15px " + FONT; ctx.fillStyle = a.color;
    ctx.fillText(a.skill.name, x + 76, sy + 5);
    ctx.font = "500 11px " + FONT; ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.fillText(a.skill.desc, x + 76, sy + 22);

    // 새 특성 / 지급 무기
    ctx.textAlign = "center";
    sy = y0 + 364 + oy;
    if (a.traits && a.traits.length) {
      ctx.font = "700 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.fillText("새 특성", x + cw / 2, sy);
      ctx.font = "600 12.5px " + FONT; ctx.fillStyle = "rgba(255,255,255,.8)";
      ctx.fillText(a.traits.map(t => t.icon + " " + t.name).join("   "), x + cw / 2, sy + 20);
    }
    if (a.grant) {
      ctx.font = "600 12px " + FONT; ctx.fillStyle = "#ffd36e";
      ctx.fillText("무기 지급 · " + WEAPONS[a.grant].icon + " " + WEAPONS[a.grant].name, x + cw / 2, sy + 46);
    }

    ctx.font = "700 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.3)";
    ctx.fillText("[" + (i + 1) + "]", x + cw / 2, y0 + ch - 20 + oy);

    if (hovered && mouse.clicked) Game.applyChoice(a);
  }

  ctx.font = "600 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.35)";
  ctx.fillText("한 번 고르면 이번 판에서는 되돌릴 수 없습니다", W / 2, y0 + ch + 30);
}

function drawLevelUp() {
  ctx.fillStyle = "rgba(6,6,14,.78)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const tp = Game.traitPick && player.cls;
  ctx.font = "800 42px " + FONT;
  ctx.fillStyle = tp ? advColor() : "#ffd34d";
  ctx.fillText(tp ? advName() + " 특성" : "LEVEL UP!", W / 2, 108);
  ctx.font = "600 15px " + FONT; ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.fillText(tp ? "레벨 " + player.level + " · 「" + player.cls.stanceName + "」을 어떻게 키울지 고르세요"
                  : "레벨 " + player.level + " · 하나를 선택하세요", W / 2, 142);

  const cw = 300, ch = 356, gap = 26;
  const total = 3 * cw + 2 * gap, x0 = (W - total) / 2, y0 = 178;

  for (let i = 0; i < 3; i++) {
    const c = Game.choices[i]; if (!c) continue;
    const x = x0 + i * (cw + gap);
    const hovered = inRect(mouse.x, mouse.y, x, y0, cw, ch);
    const isW = c.type === "weapon", isT = c.type === "trait";
    const def = c.type === "heal" ? { name: "치유의 성물", icon: "🍖", desc: "체력을 40 회복한다." }
              : isW ? WEAPONS[c.key]
              : isT ? traitDef(player.cls.key, c.key)
              : PASSIVES[c.key];
    const tint = c.type === "heal" ? "#5fe08a" : isW ? "#ffd36e"
               : isT ? advColor() : "#8fd0ff";

    panel(x, y0 - (hovered ? 8 : 0), cw, ch, 18,
      hovered ? "rgba(30,28,46,.98)" : "rgba(14,14,24,.94)",
      hovered ? tint : "rgba(255,255,255,.12)");
    const oy = hovered ? -8 : 0;

    ctx.font = "52px " + FONT; ctx.fillStyle = "#fff";
    ctx.fillText(def.icon, x + cw / 2, y0 + 66 + oy);

    const kind = isW ? "무기" : isT ? advName() + " 전용" : "능력";
    ctx.font = "700 12px " + FONT; ctx.fillStyle = tint;
    ctx.fillText(c.isNew ? "NEW · " + kind : kind + " 강화", x + cw / 2, y0 + 112 + oy);

    ctx.font = "800 23px " + FONT; ctx.fillStyle = "#fff";
    ctx.fillText(def.name, x + cw / 2, y0 + 142 + oy);

    if (c.type !== "heal") {
      ctx.font = "700 14px " + FONT; ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.fillText(c.isNew ? "Lv 1" : "Lv " + (c.level - 1) + " → " + c.level, x + cw / 2, y0 + 168 + oy);
    }
    // 직업 특성은 자세 이름을 배지로 — 이 카드가 왜 이 직업의 것인지 보이게
    if (isT && player.cls) {
      const label = "⚜ " + player.cls.stanceName;
      ctx.font = "700 11px " + FONT;
      const tw = ctx.measureText(label).width + 20;
      ctx.fillStyle = "rgba(255,255,255,.07)";
      ctx.beginPath(); ctx.roundRect(x + cw / 2 - tw / 2, y0 + 178 + oy, tw, 19, 9); ctx.fill();
      ctx.fillStyle = tint;
      ctx.fillText(label, x + cw / 2, y0 + 188 + oy);
    }
    // 무기는 속성과 '이걸 들면 열리는 조합'을 함께 보여준다.
    // 조합이 있다는 걸 아는 것과, 지금 이 카드가 조합을 연다는 걸 아는 건 다르다.
    if (isW) {
      const E = ELEMENTS[def.element];
      const label = E.icon + " " + E.name;
      ctx.font = "700 11px " + FONT;
      const tw = ctx.measureText(label).width + 20;
      ctx.fillStyle = "rgba(255,255,255,.07)";
      ctx.beginPath(); ctx.roundRect(x + cw / 2 - tw / 2, y0 + 178 + oy, tw, 19, 9); ctx.fill();
      ctx.fillStyle = E.color;
      ctx.fillText(label, x + cw / 2, y0 + 188 + oy);

      // 이 카드를 고르면 열리는 조합 / 아직 모자란 조합을 함께 보여준다.
      // 조합이 최대 레벨을 요구하므로, "몇 단계 남았는지"가 보여야 강화할 마음이 생긴다.
      const opens = combosAfterPick(c.key, c.level);
      const rows = [];
      for (const cb of opens) rows.push({ cb, done: true, master: false });
      // 이 카드로 조합이 '완성'되는지도 따로 보여준다
      if (c.level >= COMBO_MASTER) {
        for (const cb of COMBOS) {
          if (!player.combos.has(cb.key) || player.mastered.has(cb.key)) continue;
          if (cb.a !== def.element && cb.b !== def.element) continue;
          const other = cb.a === def.element ? cb.b : cb.a;
          if (elemLevel(other) >= COMBO_MASTER) rows.push({ cb, done: true, master: true });
        }
      }
      if (rows.length < 2) {
        for (const pd of combosPending()) {
          if (rows.some(r => r.cb.key === pd.c.key)) continue;
          if (pd.c.a !== def.element && pd.c.b !== def.element) continue;
          rows.push({ cb: pd.c, done: false, la: pd.la, lb: pd.lb });
          if (rows.length >= 2) break;
        }
      }
      for (let k = 0; k < Math.min(2, rows.length); k++) {
        const r = rows[k], cb = r.cb, by = y0 + 292 + k * 30 + oy;
        const ea = ELEMENTS[cb.a], eb2 = ELEMENTS[cb.b];
        ctx.save();
        if (r.done) {
          ctx.globalAlpha = .72 + Math.sin(performance.now() / 240) * .28;
          ctx.fillStyle = "rgba(70,52,16,.85)";
          ctx.beginPath(); ctx.roundRect(x + 20, by - 12, cw - 40, 26, 8); ctx.fill();
          ctx.strokeStyle = "#ffd34d"; ctx.lineWidth = 1.5; ctx.stroke();
        } else {
          ctx.fillStyle = "rgba(255,255,255,.05)";
          ctx.beginPath(); ctx.roundRect(x + 20, by - 12, cw - 40, 26, 8); ctx.fill();
          ctx.setLineDash([3, 3]);
          ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = 1; ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.restore();
        ctx.textAlign = "left";
        ctx.font = "700 10px " + FONT;
        // 조합에 필요한 두 속성의 진행도. 이 카드를 고른 뒤의 값으로 보여준다.
        const la = r.done ? COMBO_LEVEL : (cb.a === def.element ? c.level : r.la);
        const lb = r.done ? COMBO_LEVEL : (cb.b === def.element ? c.level : r.lb);
        ctx.fillStyle = ea.color;
        ctx.fillText(ea.icon + " " + la + "/" + COMBO_LEVEL, x + 30, by + 1);
        ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillText("+", x + 78, by + 1);
        ctx.fillStyle = eb2.color;
        ctx.fillText(eb2.icon + " " + lb + "/" + COMBO_LEVEL, x + 90, by + 1);
        ctx.font = r.done ? "800 12px " + FONT : "700 11px " + FONT;
        ctx.fillStyle = r.master ? "#ffe9a8" : r.done ? "#ffd34d" : "rgba(255,255,255,.55)";
        ctx.fillText(r.master ? "★ " + cb.name + " 완성!" : r.done ? cb.name + " 열림!" : cb.name, x + 146, by + 1);
        ctx.textAlign = "center";
      }
    }

    ctx.font = "500 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.68)";
    wrapText(def.desc, x + cw / 2, y0 + (isW || isT ? 216 : 202) + oy, cw - 44, 18);

    // 특성은 실제 수치를 함께 보여준다
    if (isT && def.detail) {
      ctx.font = "600 12px " + FONT; ctx.fillStyle = tint;
      wrapText(def.detail(c.level), x + cw / 2, y0 + 262 + oy, cw - 34, 16);
    }

    // 강화 시 실제 수치 변화
    if (isW && !c.isNew) {
      const d = WEAPONS[c.key];
      const parts = [];
      if (d.dmg && d.dmg[c.level - 1] !== d.dmg[c.level - 2]) parts.push("피해 " + d.dmg[c.level - 2] + "→" + d.dmg[c.level - 1]);
      if (d.count && d.count[c.level - 1] !== d.count[c.level - 2]) parts.push("개수 " + d.count[c.level - 2] + "→" + d.count[c.level - 1]);
      if (d.radius && d.radius[c.level - 1] !== d.radius[c.level - 2]) parts.push("범위 +" + (d.radius[c.level - 1] - d.radius[c.level - 2]));
      if (d.cd && d.cd[c.level - 1] !== d.cd[c.level - 2]) parts.push("쿨다운 " + d.cd[c.level - 1].toFixed(2) + "초");
      ctx.font = "600 12px " + FONT; ctx.fillStyle = "#ffd36e";
      wrapText(parts.join(" · "), x + cw / 2, y0 + 258 + oy, cw - 34, 16);
    }

    ctx.font = "700 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.fillText("[" + (i + 1) + "]", x + cw / 2, y0 + ch - 20 + oy);

    if (hovered && mouse.clicked) Game.applyChoice(c);
  }
}

function drawPaused() {
  ctx.fillStyle = "rgba(6,6,14,.75)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "800 46px " + FONT; ctx.fillStyle = "#fff";
  ctx.fillText("일시정지", W / 2, H / 2 - 30);
  ctx.font = "600 16px " + FONT; ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.fillText("ESC 로 계속", W / 2, H / 2 + 16);
}

function drawEnd(win) {
  ctx.fillStyle = win ? "rgba(20,14,6,.85)" : "rgba(20,6,10,.85)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "800 58px " + FONT; ctx.fillStyle = win ? "#ffd34d" : "#ff5b6b";
  ctx.fillText(win ? "생존 성공!" : "쓰러졌다...", W / 2, H / 2 - 96);

  const rows = [
    ["생존 시간", fmtTime(Game.time)],
    ["처치 수", String(Game.kills)],
    ["레벨", String(player.level)],
    ["직업", player.cls ? advIcon() + " " + advName() + (player.advance.length ? " (" + player.cls.name + ")" : "") : "-"],
    ["누적 피해량", Math.round(Game.dmgDealt).toLocaleString("ko-KR")],
    ["획득 영혼", "🔮 +" + Game.soulsEarned],
  ];
  ctx.font = "600 18px " + FONT;
  rows.forEach((r, i) => {
    const y = H / 2 - 26 + i * 32;
    ctx.textAlign = "right"; ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.fillText(r[0], W / 2 - 16, y);
    ctx.textAlign = "left"; ctx.fillStyle = "#fff";
    ctx.fillText(r[1], W / 2 + 16, y);
  });

  ctx.textAlign = "center";
  ctx.font = "700 17px " + FONT;
  ctx.fillStyle = "rgba(255,255,255," + (.55 + Math.sin(performance.now() / 400) * .3).toFixed(2) + ")";
  ctx.fillText("SPACE / R 로 다시 시작", W / 2, H / 2 + 150);
  ctx.font = "600 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.4)";
  ctx.fillText("보유 영혼 " + Meta.souls.toLocaleString("ko-KR") + " — 타이틀의 제단에서 영구 강화를 살 수 있다", W / 2, H / 2 + 180);
}

/* ---------- 메인 루프 ---------- */
let acc = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > .25) dt = .25;            // 탭 전환 후 폭주 방지
  // 연출 타이머는 시뮬레이션이 멈춰 있어도(레벨업·전직 화면) 흘러야 한다
  if (Game.comboFlash > 0) Game.comboFlash = Math.max(0, Game.comboFlash - dt);
  if (Game.advanceFlash > 0) Game.advanceFlash = Math.max(0, Game.advanceFlash - dt);
  if (Game.houndWarn > 0) Game.houndWarn = Math.max(0, Game.houndWarn - dt);
  if (Game.lmFlash > 0) Game.lmFlash = Math.max(0, Game.lmFlash - dt);

  // 전직 순간의 슬로모션 — 연출 타이머는 실시간, 시뮬레이션만 늦춘다
  let simDt = dt;
  if (Game.slowmo > 0) {
    Game.slowmo = Math.max(0, Game.slowmo - dt);
    simDt *= .34;
  }
  if (Game.whiteFlash > 0) Game.whiteFlash = Math.max(0, Game.whiteFlash - dt * 1.6);

  acc += simDt;
  let guard = 0;
  while (acc >= STEP && guard++ < 5) { update(STEP); acc -= STEP; }

  // 렌더
  const shx = cam.shake ? rnd(-cam.shake, cam.shake) : 0;
  const shy = cam.shake ? rnd(-cam.shake, cam.shake) : 0;
  ctx.save();
  ctx.translate(shx, shy);
  drawBackground();
  if (Game.state !== "title" && Game.state !== "altar") drawWorld();
  ctx.restore();

  if (Game.state !== "title" && Game.state !== "altar") {
    drawHUD();
    // 붉은 비네트.
    // 기사는 설계상 상시 피격당하므로 세기를 '남은 체력'에 연동한다 —
    // 건강할 때는 옅게, 죽기 직전에만 강하게. 화면이 늘 빨갛기만 하면 정보가 아니다.
    const hpFrac = clamp(player.hp / player.stats.maxHp, 0, 1);
    const hitA = player.hurtFlash > 0 ? (player.hurtFlash / .35) * (.12 + .26 * (1 - hpFrac)) : 0;
    const lowA = hpFrac < .3 ? (.3 - hpFrac) / .3 * (.14 + Math.sin(performance.now() / 260) * .05) : 0;
    const a = Math.min(.5, hitA + lowA);
    if (a > .004) {
      const g = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
      g.addColorStop(0, "rgba(255,0,40,0)");
      g.addColorStop(1, "rgba(255,0,40," + a.toFixed(3) + ")");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }

  if (Game.whiteFlash > 0) {
    ctx.fillStyle = "rgba(255,248,230," + (Game.whiteFlash * .55).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }

  if (Game.state === "title") drawTitle();
  else if (Game.state === "altar") drawAltar();
  else if (Game.state === "advance") drawAdvance();
  else if (Game.state === "levelup") drawLevelUp();
  else if (Game.state === "paused") drawPaused();
  else if (Game.state === "dead") drawEnd(false);
  else if (Game.state === "won") drawEnd(true);

  mouse.clicked = false;
}

recomputeStats();
player.hp = player.stats.maxHp;
resize();
requestAnimationFrame(frame);
</script>
