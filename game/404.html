/* 아이콘 다섯 단계. pxPal 은 세 단계라 여기서 위아래로 한 칸씩 더 만든다.
   '0' 윤곽 · '1' 그늘 · '2' 몸통 · '3' 빛 · '4' 광. 색은 호출할 때 정해진다 —
   아이콘은 같은 그림이 속성색·직업색·강조색으로 다시 칠해지므로 아틀라스에 구울 수가 없다. */
const iconPalCache = {};
function iconPal(col) {
  let c = iconPalCache[col];
  if (!c) {
    const p = pxPal(col);                        // [밝음, 몸통, 바탕]
    const hx = h => h.length === 4 ? [1, 2, 3].map(i => parseInt(h[i] + h[i], 16))
                                   : [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
    const mix = (a, b, k) => "#" + a.map((v, i) => Math.round(v + (b[i] - v) * k)
      .toString(16).padStart(2, "0")).join("");
    c = iconPalCache[col] = [
      mix(hx(p[2]), [8, 8, 16], .55),            // 0 윤곽 — 배경과 확실히 가른다
      p[2],                                      // 1 그늘
      p[1],                                      // 2 몸통
      p[0],                                      // 3 빛
      mix(hx(p[1]), [255, 255, 255], .72),       // 4 광
    ];
  }
  return c;
}
/* 32칸용 재질 팔레트.

   예전에는 호출 색 하나에서 일곱 단계를 뽑았다. 그래서 칸을 아무리 늘려도
   검도 파랗고 물약도 파랗고 해골도 파랬다 — 세밀해 보이지 않는 진짜 이유가
   칸 수가 아니라 색 수였다.

   지금은 칸마다 '무엇으로 만들어졌는가'를 적는다.
   0~7 은 호출 색의 여덟 단계(속성색이 뜻인 자리), 나머지는 고정 재질이다.
   한 아이콘에 서른세 색까지 오른다.

   호출 색을 남긴 이유: 속성 표시와 조합 칸은 색 자체가 정보다.
   그래서 검은 어떤 색으로 불러도 강철이지만, 불꽃과 마력탄은 부르는 색을 따른다. */
const iconPalHiCache = {};
function iconPalHi(col) {
  let c = iconPalHiCache[col];
  if (!c) {
    const p = pxPal(col);                        // [밝음, 몸통, 바탕]
    const hx = h => h.length === 4 ? [1, 2, 3].map(i => parseInt(h[i] + h[i], 16))
                                   : [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
    const mix = (a, b, k) => "#" + a.map((v, i) => Math.round(v + (b[i] - v) * k)
      .toString(16).padStart(2, "0")).join("");
    const lite = hx(p[0]), body = hx(p[1]), dark = hx(p[2]), ink = [7, 7, 14], white = [255, 255, 255];
    c = iconPalHiCache[col] = {
      "0": mix(dark, ink, .58), "1": mix(dark, ink, .26), "2": p[2],
      "3": mix(dark, body, .5), "4": p[1], "5": mix(body, lite, .55),
      "6": p[0], "7": mix(lite, white, .5),
      a: "#1b2030", b: "#2f3849", c: "#4a5568", d: "#7b8699", e: "#b7c0d0",   // 강철
      f: "#2a1c12", g: "#46311f", h: "#6a4a2e", i: "#8f6a44",                 // 나무·가죽
      j: "#4a3208", k: "#916715", l: "#cf9c2c", m: "#f2dc86",                 // 금
      n: "#443f33", o: "#7a7059", p: "#b3a98d", q: "#eae2cb",                 // 뼈·돌
      r: "#4a0d14", s: "#961d28", t: "#d64450",                               // 피
      u: "#1e3320", v: "#3f6134", w: "#74a04a",                               // 풀빛
      x: mix(dark, ink, .82), z: "#fbfcff",                                   // 윤곽 · 광
    };
  }
  return c;
}
/* 아이콘 하나를 칠할 때 32×32 를 문자 종류만큼 훑으면 서른세 번 도는 셈이다.
   칸 목록을 한 번만 만들어 두고 그 뒤로는 재사용한다. */
const iconPlanCache = new WeakMap();
function iconPlan(rows) {
  let plan = iconPlanCache.get(rows);
  if (!plan) {
    plan = [];
    const at = {};
    for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[r].length; c++) {
      const ch = rows[r][c];
      if (ch === ".") continue;
      (at[ch] || (at[ch] = plan[plan.push({ ch, cells: [] }) - 1].cells)).push(r, c);
    }
    iconPlanCache.set(rows, plan);
  }
  return plan;
}
/* 판이 커져도 화면 크기는 그대로여야 한다 — 스프라이트의 s 와 같은 규칙이다.
   기준은 예전 격자인 7칸. 16칸짜리 글리프는 칸 크기를 그만큼 줄여 쓴다.
   덕분에 7칸과 16칸 글리프가 섞여 있어도 호출부는 아무것도 몰라도 된다. */
function iconCell(rows, cell) {
  return Math.max(1, Math.round(cell * 7 / rows[0].length));
}
/* 어느 한 벌을 쓸 것인가.

   두 벌이 화면에서 차지하는 크기는 정확히 같아야 한다. 그런데 각자 반올림하게
   두면 어긋난다 — cell 6 이면 16칸은 한 칸 3px(48px), 32칸은 한 칸 1px(32px) 이
   되어 같은 아이콘이 자리에 따라 커졌다 작아졌다 한다.

   그래서 16칸의 칸 크기를 먼저 정하고, 32칸은 '그 절반'만 쓴다. 절반이 정수로
   떨어질 때(짝수일 때)만 32칸을 쓰는 이유가 그것이다. 칸 크기가 정수가 아니면
   칸 사이에 실금이 생긴다.

   결과: 글자 옆(cell 2~3)은 16칸, 카드와 제단(cell 4 이상)은 32칸. */
function iconPick(kind, cell) {
  let k = Math.max(1, Math.round(cell * 7 / 16));
  const hi = MENU_ICONS_HI[kind];
  /* 홀수로 떨어지면 절반이 정수가 아니라 32칸을 못 쓴다. 그런데 그 자리는
     하필 큰 자리(48px · 80px)라, 거기서만 성긴 그림이 나오면 제일 눈에 띈다.
     한 칸 올려 짝수로 맞춘다 — 아이콘이 16칸 하나만큼 커지지만, 큰 자리는
     전부 카드 한가운데나 제단 위라 커져도 넘칠 곳이 없다. */
  if (hi && k >= 3 && k % 2) k++;
  if (hi && k >= 2) return { rows: hi, k: k / 2, hi: true };
  const lo = MENU_ICONS[kind];
  return lo ? { rows: lo, k, hi: false } : null;
}
function menuIconW(kind, cell) {
  const p = iconPick(kind, cell);
  return p ? p.k * p.rows[0].length : cell * 7;
}
function drawMenuIcon(kind, x, y, col, cell = PIX) {
  const p = iconPick(kind, cell);
  if (!p) return false;
  const rows = p.rows, k = p.k;
  const h = rows.length, w = rows[0].length;
  const x0 = Math.round((x - w * k / 2) / k) * k;
  const y0 = Math.round((y - h * k / 2) / k) * k;
  if (p.hi) {
    const pal = iconPalHi(col);
    for (const g of iconPlan(rows)) {
      const col2 = pal[g.ch];
      if (!col2) continue;                       // 모르는 재질은 그리지 않는다
      ctx.beginPath();
      for (let i = 0; i < g.cells.length; i += 2)
        ctx.rect(x0 + g.cells[i + 1] * k, y0 + g.cells[i] * k, k, k);
      ctx.fillStyle = col2; ctx.fill();
    }
    return true;
  }
  const pal = iconPal(col);
  for (let t = 0; t < pal.length; t++) {
    const ch = String(t);
    let any = false;
    ctx.beginPath();
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++)
      if (rows[r][c] === ch) { ctx.rect(x0 + c * k, y0 + r * k, k, k); any = true; }
    if (any) { ctx.fillStyle = pal[t]; ctx.fill(); }
  }
  return true;
}

/* 메뉴 세 화면의 공통 바탕.
   뒤에서는 어트랙트 데모가 실제로 굴러간다 — 덮어 가리되 지우지는 않는다.
   시작 · 직업 선택 · 제단이 같은 재질로 보이도록 한 곳에 모아 둔다. */
function menuScrim(a) {
  Game.introT += 1 / 60;
  const t = Game.introT;
  ctx.fillStyle = "rgba(7,7,13," + a + ")";
  ctx.fillRect(0, 0, W, H);
  // 위아래를 조금 더 눌러 글자가 앉을 자리를 만든다 (그라디언트 대신 띠로)
  for (let i = 0; i < 10; i++) {
    ctx.globalAlpha = .055;
    ctx.fillStyle = "#05050a";
    ctx.fillRect(0, i * 9, W, 9);
    ctx.fillRect(0, H - 90 + i * 9, W, 9);
  }
  ctx.globalAlpha = 1;
  // 불티
  for (let i = 0; i < 40; i++) {
    const p = (i * 97.3) % 1, sp = 14 + p * 30;
    const yy = H - ((t * sp + p * H) % (H + 60)) + 30;
    const xx = (i * 137.5) % W + Math.sin(t * .7 + i) * 14;
    ctx.globalAlpha = .10 + p * .2;
    ctx.fillStyle = "#ffb35c";
    ctx.fillRect(xx, yy, 2, 2 + p * 3);
  }
  ctx.globalAlpha = 1;
}

function drawIntro() {
  menuScrim(.52);
  const t = Game.introT;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  // 문장(紋章) — 방패와 검
  const cx = W / 2, cy = 150;
  /* 문장 — 방패와 십자. 베지어와 그라디언트로 그리면 이 화면만 매끈해서 뜬다.
     방패 폭을 높이별로 구해 가로줄로 쌓는다(테두리는 한 겹 크게 깔고 그 위에 속). */
  const bob = Math.round(Math.sin(t * 1.3) * 4 / PIX) * PIX;
  const shieldW = (y, k) => {                     // y = -46 .. 52
    if (y < -40) return (38 + k) * (1 - (-40 - y) / 9);   // 윗변 모서리
    if (y <= 14) return 38 + k;
    const u = (y - 14) / 38;
    return (38 + k) * Math.sqrt(Math.max(0, 1 - u * u));  // 아래로 좁아져 뾰족해진다
  };
  const shield = (k, col) => {
    ctx.fillStyle = col; ctx.beginPath();
    for (let y = -49; y <= 53 + k; y += PIX) {
      const w = shieldW(y, k);
      if (w < PIX * .5) continue;
      pxR(cx - w, cy + bob + y, w * 2, PIX);
    }
    ctx.fill();
  };
  ctx.save();
  // 맥동하는 후광 — 방패 모서리(중심에서 68)보다 밖에 둬야 겹쳐 잘려 보이지 않는다
  ctx.globalAlpha = .26 + Math.sin(t * 2) * .09;

  ctx.fillStyle = "#ffe9b8"; ctx.beginPath();     // 십자

  ctx.fillStyle = "#ffd36e";
  ctx.fillText("템플러 서바이버즈", cx, 262);
  ctx.font = "600 15px " + FONT;
  ctx.fillStyle = "rgba(255,255,255,.62)";

  ctx.font = "700 16px " + FONT;
  ctx.fillStyle = "#ff9a5c";
  ctx.fillText("15분을 버텨라", cx, 328);

  // 기록
  ctx.font = "600 13px " + FONT;
  ctx.fillStyle = "rgba(255,255,255,.5)";
  ctx.fillText("최고 기록 " + fmtTime(Game.bestTime)
    + "   ·   모은 영혼 " + Meta.souls.toLocaleString("ko-KR"), cx, 358);

  /* 버튼 두 개. 나란히 놓으면 538px 이 필요해 세로 화면(520)에서 잘린다 —
     좁으면 위아래로 쌓는다. */
  const two = W >= 580;

  const sw = 130, sh = 30, sx = cx - sw / 2, sy = by2 + bh + 10;

    ["cards", "레벨업마다 3택", "무기 6칸 · 능력 6칸 — 무엇을 포기할지가 빌드가 된다"],
    ["steps", "각성 4단계", "3:00 · 6:00 · 9:00 · 12:00 — 레벨과 징표를 함께 채워야 열린다"],

/* ---------- 직업 카드의 무기 무대 ----------
   카드는 원래 수치 표였다 — 자세 · 무기 · 속성 · 자원 · 스킬 · 전리품 여섯 줄.
   고르는 사람이 알고 싶은 건 그 표가 아니라 「무엇을 들고 어떻게 싸우는가」다.
   그래서 시작 무기가 실제로 도는 작은 무대를 놓았다.

   바닥 타일도 적 스프라이트도 이펙트도 게임의 것을 그대로 쓴다.
   여기서만 따로 그리면 고르고 난 뒤에 다른 게 나온다 — 그러면 미리보기가 아니라 거짓말이다. */
const STAGE = {
  // 성역은 결계라 적이 둘러싸야 한다. 나머지는 앞을 보고 싸운다.
  aura:   { hx: .50, hy: .50, mobs: [["zombie", -46, -4, 15], ["slime", 40, -18, 13], ["bat", 28, 30, 12]] },
  whip:   { hx: .28, hy: .55, mobs: [["zombie",  58, -16, 15], ["slime", 40, 20, 13], ["bat", 86,  4, 12]] },
  dagger: { hx: .20, hy: .55, mobs: [["zombie",  92, -18, 15], ["slime", 66, 18, 13], ["bat", 118, 0, 12]] },
  orb:    { hx: .20, hy: .55, mobs: [["zombie",  92, -18, 15], ["slime", 66, 18, 13], ["bat", 118, 0, 12]] },
};
const STAGE_CYCLE = 1.55;                      // 한 바퀴. 무기마다 실제 쿨다운은 다르지만 카드는 리듬만 보여준다

function drawWeaponStage(c, x, y, w, h, t) {
  const WP = WEAPONS[c.start], S = STAGE[c.start] || STAGE.dagger;
  const cols = pxPal(ELEMENTS[WP.element].color);
  const u = (t % STAGE_CYCLE) / STAGE_CYCLE;
  const hx = Math.round(x + w * S.hx), hy = Math.round(y + h * S.hy);
  const hitAt = [-9, -9, -9];                 // 적마다 '맞는 순간'(주기 안의 위치)

  ctx.save();
  ctx.beginPath(); pxChipPath(x, y, w, h, 10); ctx.clip();

  // 바닥 — 게임의 타일 그대로
  let tiled = false;
  for (let i = 0; i * FLOOR_T < w + FLOOR_T; i++)
    for (let j = 0; j * FLOOR_T < h + FLOOR_T; j++)
      tiled = Sprites.drawTile("floor", x + i * FLOOR_T, y + j * FLOOR_T, (i + j * 3) % 4, FLOOR_T) || tiled;
  if (!tiled) { ctx.fillStyle = "#12121e"; ctx.fillRect(x, y, w, h); }
  ctx.fillStyle = "rgba(6,6,14,.44)"; ctx.fillRect(x, y, w, h);   // 카드 안이라 한 겹 눌러 글자와 다투지 않게

  // 그림자를 먼저 깐다 — 없으면 전부 공중에 뜬다
  ctx.fillStyle = "rgba(0,0,0,.34)";
  ctx.beginPath();
  for (const m of S.mobs) pxEllipse(hx + m[1], hy + m[2] + m[3] * .85, m[3] * .95, m[3] * .4);
  pxEllipse(hx, hy + 14, 13, 5);
  ctx.fill();

  for (let k = 0; k < S.mobs.length; k++) {
    const m = S.mobs[k];
    Sprites.draw(m[0], hx + m[1], hy + m[2] + Math.sin(t * 3 + k * 2.1) * 2,
      m[3] / 14, t * .9 + k, m[1] < 0);
  }

  // 주인공 — 무기가 나가는 동안만 공격 자세. 한 바퀴에 정확히 한 번 돈다.
  const swing = u < .4;
  Sprites.draw("hero_" + c.key + "_" + (swing ? "attack" : "idle"), hx, hy, 2,
    swing ? u / .4 * .48 : t, false);

  // ── 무기. 게임이 쓰는 픽셀 함수를 그대로 부른다 ──
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  if (c.start === "aura") {
    // 성역은 상시 결계다. 주기마다 밝아지고, 그때 안에 든 적이 탄다.
    const R = 46, ph = (u * 3) % 1, pulse = Math.max(0, 1 - ph / .38);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = (.13 + .16 * pulse) * .55;
    ctx.fillStyle = "#ffcd6e";
    ctx.beginPath(); ctx.arc(hx, hy, R, 0, TAU); ctx.fill();
    ctx.globalAlpha = Math.min(1, (.13 + .16 * pulse) * 3.4);
    ctx.globalCompositeOperation = "lighter";
    pxRing(hx, hy, R, pulse > 0 ? 7 : 4, pxPal("#ffcd6e"));
    for (let k = 0; k < 3; k++)
      if (Math.hypot(S.mobs[k][1], S.mobs[k][2]) < R + S.mobs[k][3])
        hitAt[k] = Math.floor(u * 3) / 3;
  } else if (c.start === "whip") {
    // 부채꼴 참격 — 사거리 안이고 각도 안이면 맞는다(판정과 같은 규칙)
    const len = 88, SW = .2;
    if (u < SW) {
      const tt = u / SW;
      ctx.globalAlpha = (1 - tt) * .95;
      pxArc(hx, hy, len * (.55 + tt * .5), -(.55 + tt * 1.5) / 2, (.55 + tt * 1.5) / 2,
        (7 + len * .05) * (1 - tt * .55), cols);
    }
    for (let k = 0; k < 3; k++) {
      const m = S.mobs[k], d = Math.hypot(m[1], m[2]);
      if (Math.abs(Math.atan2(m[2], m[1])) > .62) continue;
      const tt = ((d - m[3]) / len - .55) / .5;
      if (tt >= 0 && tt <= 1) hitAt[k] = tt * SW;
    }
  } else if (c.start === "dagger") {
    // 단검은 관통한다 — 첫 적을 지나 계속 난다
    const m = S.mobs[1], ang = Math.atan2(m[2], m[1]), reach = Math.hypot(m[1], m[2]);
    const fly = (u - .06) / .34;
    if (fly >= 0 && fly <= 1.5) {
      const d = reach * fly, px0 = hx + Math.cos(ang) * d, py0 = hy + Math.sin(ang) * d;
      const r = 7, ca = Math.cos(ang), sa = Math.sin(ang);
      const rot = (X, Y, o) => { pxOut[o] = px0 + X * ca - Y * sa; pxOut[o + 1] = py0 + X * sa + Y * ca; };
      rot(r * 1.7, 0, 0); rot(-r * .5, -r * .45, 2); rot(-r * .5, r * .45, 4); rot(r * 1.7, 0, 6);
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = PJ_STEEL[2];
      ctx.beginPath(); ctx.moveTo(pxOut[0], pxOut[1]);
      ctx.lineTo(pxOut[2], pxOut[3]); ctx.lineTo(pxOut[4], pxOut[5]);
      ctx.closePath(); ctx.fill();
      pxEdge(pxOut, 8); pxFlush(PJ_STEEL);
      ctx.save(); ctx.translate(px0, py0); ctx.rotate(ang);
      ctx.fillStyle = "#6d4c33"; ctx.fillRect(-r * 1.2, -r * .22, r * .8, r * .44);
      ctx.restore();
    }
    hitAt[1] = .06 + .34;
    hitAt[2] = .06 + .34 * (Math.hypot(S.mobs[2][1], S.mobs[2][2]) / reach);
  } else {
    // 마력탄은 쫓아간다 — 곧게 가면 유도라는 게 안 보인다
    const m = S.mobs[0], fly = (u - .08) / .5;
    if (fly >= 0 && fly <= 1) {
      const ang = Math.atan2(m[2], m[1]), bend = Math.sin(fly * Math.PI) * 26;
      pxDisc(hx + m[1] * fly - Math.sin(ang) * bend, hy + m[2] * fly + Math.cos(ang) * bend,
        9, pxPal("#9be7ff"));
    }
    hitAt[0] = .58;
  }
  ctx.restore();

  // 맞은 자리에 타격 이펙트 — 게임에서 쓰는 그 프레임이다
  const key = fxKey("hit", WP.element);
  for (let k = 0; k < 3; k++) {
    const age = u - hitAt[k];
    if (age < 0 || age > .18) continue;
    const m = S.mobs[k];
    // 판 크기에서 화면 크기를 역산한다 — 판이 커져도 그림 크기는 그대로여야 한다
    Sprites.draw(key, hx + m[1], hy + m[2], 26 / ATLAS_FRAMES[key].w, age / .18 * (3 / 22), false);
  }
  ctx.restore();

  // 창틀 — 없으면 카드 바탕에 녹아 '무대'로 안 읽힌다
  pxChip(x, y, w, h, null, "rgba(255,255,255,.11)", 10);
}

/* 견줌 막대 — 직업 4종 안에서만 견준다.
   0 부터 그리면 공격이 1.0~1.2 라 네 막대가 똑같아 보여 고르는 데 아무 도움이 안 된다.
   그래서 최소~최대를 막대 폭에 펼친다. 절대값이 아니라 '누가 더 센가'를 읽는 그림이다. */
const CLASS_AXES = [
  { key: "surv", name: "생존", color: "#ff8a9c" },
  { key: "atk",  name: "공격", color: "#ffd36e" },
  { key: "move", name: "기동", color: "#8ef0b0" },
  { key: "area", name: "범위", color: "#8fd0ff" },
  { key: "loot", name: "전리품", color: "#c9a3ff" },
];
let classBars = null;
function computeClassBars() {
  const raw = CLASSES.map(c => {
    const m = c.mods;
    return {
      surv: (100 + (m.maxHp || 0)) / (1 - (m.armor || 0)) * (1 + (m.regen || 0) * .25),
      atk: (1 + (m.damage || 0)) / (1 + (m.cooldown || 0)) * (1 + (.10 + (m.crit || 0)) * 1.4),
      move: 1 + (m.speed || 0),
      area: 1 + (m.area || 0),
      loot: c.gemChance,
    };
  });
  classBars = CLASSES.map(() => ({}));
  for (const a of CLASS_AXES) {
    let lo = Infinity, hi = -Infinity;
    for (const r of raw) { if (r[a.key] < lo) lo = r[a.key]; if (r[a.key] > hi) hi = r[a.key]; }
    // 바닥을 .18 로 띄운다 — 가장 낮은 것이 빈 칸이면 '없다'로 읽힌다
    raw.forEach((r, i) => classBars[i][a.key] = hi > lo ? .18 + (r[a.key] - lo) / (hi - lo) * .82 : .6);
  }
}

function drawTitle() {
  menuScrim(.68);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  /* 넓으면 제목 · 부제 · 「직업 선택」 이 세 줄로 서고 제단 버튼이 오른쪽 위에 붙는다.
     좁으면 그 자리가 없다 — 부제를 빼고 제단 버튼을 가운데 아래로 내린다. */
  const big = W >= 800;
  fitFont("800", big ? 62 : 38, "템플러 서바이버즈", W - (big ? 480 : 40));
  ctx.fillStyle = "#ffd36e";
  ctx.fillText("템플러 서바이버즈", W / 2, big ? 96 : 40);
  if (big) {
    ctx.font = "600 16px " + FONT; ctx.fillStyle = "rgba(255,255,255,.6)";
    ctx.fillText("중세 판타지 오토배틀 서바이벌 · 15분을 버텨라", W / 2, 134);
  }
  ctx.font = "700 18px " + FONT; ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.fillText("직업 선택", W / 2, big ? 166 : 114);

  // 제단 진입 버튼
  const abw = big ? 204 : Math.min(250, W - 48), abh = 46;
  const abx = big ? W - abw - 28 : (W - abw) / 2, aby = big ? 28 : 62;
  const aHover = inRect(mouse.x, mouse.y, abx, aby, abw, abh);
  panel(abx, aby, abw, abh, 12,
    aHover ? "rgba(38,28,58,.98)" : "rgba(16,14,28,.9)",
    aHover ? "#c9a3ff" : "rgba(201,163,255,.3)");
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  drawMenuIcon("orb", abx + 22, aby + 23, "#c9a3ff", 3);
  ctx.font = "700 14px " + FONT; ctx.fillStyle = "#c9a3ff";
  ctx.fillText("영혼의 제단", abx + 44, aby + 16);
  ctx.font = "600 12px " + FONT; ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.fillText(Meta.souls.toLocaleString("ko-KR") + " 영혼  ·  탭", abx + 44, aby + 33);
  if (aHover && mouse.clicked) { Game.introFrom = "title"; Game.state = "altar"; return; }
  ctx.textAlign = "center";

  /* 네 장을 한 줄로 놓으면 1,126px 이 필요하다. 세로 화면(520)에서는 가운데 두 장만
     보이고 양끝이 잘려 나갔다 — 고를 수 없는 화면이었다. 좁으면 2×2 로 접는다. */
  const cols = W >= 1180 ? 4 : W >= 620 ? 2 : 2;
  const gap = 16;
  const cw = Math.min(268, Math.floor((W - (cols + 1) * gap) / cols));
  const rows = Math.ceil(CLASSES.length / cols);
  const tall = rows === 1;
  const ch = tall ? 406 : 392;                 // 두 줄이면 카드를 조금 낮춰 화면에 담는다
  const total = cols * cw + (cols - 1) * gap;
  const x0 = (W - total) / 2, y0 = tall ? 182 : 134;
  if (y0 + rows * ch + (rows - 1) * gap > H - 40) {   // 그래도 넘치면 그릴 수 없다
    ctx.font = "700 15px " + FONT; ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillText("화면이 너무 작습니다 — 기기를 돌려 주세요", W / 2, H / 2);
    return;
  }
  if (!classBars) computeClassBars();

  for (let i = 0; i < CLASSES.length; i++) {
    const c = CLASSES[i];
    const x = x0 + (i % cols) * (cw + gap);
    const yRow = y0 + Math.floor(i / cols) * (ch + gap);
    const hovered = inRect(mouse.x, mouse.y, x, yRow, cw, ch);
    if (hovered) selectedClass = i;
    const sel = selectedClass === i;
    const oy = sel ? -6 : 0;
    panel(x, yRow + oy, cw, ch, 16,
      sel ? "rgba(30,26,48,.97)" : "rgba(14,14,24,.9)",
      sel ? c.color : "rgba(255,255,255,.12)");

    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 23px " + FONT; ctx.fillStyle = c.color;
    ctx.fillText(c.name, x + cw / 2, yRow + 26 + oy);
    ctx.font = "600 11.5px " + FONT; ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.fillText(c.tagline, x + cw / 2, yRow + 46 + oy);

    /* 무기 무대 — 초상화 대신 이걸 놓는다.
       주인공은 무대 안에서 실제로 싸우므로 따로 세워 둘 이유가 없다.
       카드마다 위상을 어긋나게 해 네 장이 한꺼번에 번쩍이지 않게 한다. */
    const stageH = tall ? 104 : 92;
    drawWeaponStage(c, x + 14, yRow + 58 + oy, cw - 28, stageH,
      performance.now() / 1000 + i * .47);

    // 무대 아래 이름표 — 무엇을 들고 있었는지
    const WP = WEAPONS[c.start], E = ELEMENTS[WP.element];
    ctx.font = "700 12.5px " + FONT;
    const nw = ctx.measureText(WP.name).width;
    ctx.font = "600 11px " + FONT;
    const ew = ctx.measureText(" · " + E.name).width;
    let tx = x + cw / 2 - (16 + nw + ew) / 2;
    const capY = yRow + 62 + stageH + 16 + oy;
    drawMenuIcon("element", tx + 6, capY, E.color, 2);
    tx += 16;
    ctx.textAlign = "left";
    ctx.font = "700 12.5px " + FONT; ctx.fillStyle = "rgba(255,255,255,.92)";
    ctx.fillText(WP.name, tx, capY);
    ctx.font = "600 11px " + FONT; ctx.fillStyle = E.color;
    ctx.fillText(" · " + E.name, tx + nw, capY);

    // 견줌 막대
    let by = capY + 22;
    for (const a of CLASS_AXES) {
      ctx.textAlign = "left"; ctx.font = "700 9.5px " + FONT;
      ctx.fillStyle = "rgba(255,255,255,.4)";
      ctx.fillText(a.name, x + 22, by);
      const bx = x + 68, bw = cw - 92, pal = pxPal(a.color);
      ctx.fillStyle = "rgba(255,255,255,.07)";
      ctx.beginPath(); pxR(bx, by - 4, bw, 8); ctx.fill();
      ctx.fillStyle = pal[2];
      ctx.beginPath(); pxR(bx, by - 4, bw * classBars[i][a.key], 8); ctx.fill();
      ctx.fillStyle = pal[1];                       // 윗면 — 위에서 빛이 온다
      ctx.beginPath(); pxR(bx, by - 4, bw * classBars[i][a.key], 3); ctx.fill();
      by += 14;
    }

    // 스킬과 자원 — 이 직업의 리듬
    by += 14;
    ctx.textAlign = "left";
    drawMenuIcon("skill", x + 27, by, c.color, 2);
    ctx.font = "700 12px " + FONT; ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.fillText(c.skill.name, x + 42, by);
    ctx.textAlign = "right";
    ctx.font = "700 9.5px " + FONT; ctx.fillStyle = "rgba(255,255,255,.3)";
    ctx.fillText("SPACE", x + cw - 22, by);
    by += 21;

    ctx.textAlign = "left";
    drawMenuIcon("orb", x + 27, by, c.resource.color, 2);
    ctx.font = "700 12px " + FONT; ctx.fillStyle = c.resource.color;
    ctx.fillText(c.resource.name, x + 42, by);
    by += 18;
    ctx.textAlign = "center";
    ctx.font = "500 10.5px " + FONT; ctx.fillStyle = "rgba(255,255,255,.45)";
    wrapText(c.resource.hint, x + cw / 2, by, cw - 44, 14);

    // 자세가 있는 직업만 — 없는 직업은 그 자리를 비워 둔다
    if (c.stance) {
      ctx.font = "600 10.5px " + FONT; ctx.fillStyle = c.color;
      wrapText(c.stanceHint, x + cw / 2, by + 32, cw - 22, 14);
    }

    /* 넓으면 번호가 카드 아래에 앉는다. 좁으면 그 자리를 자세 설명에 내주고
       번호를 이름 옆으로 올린다 — 안 그러면 세 줄짜리 설명이 카드 밖으로 넘친다. */
    if (tall) {
      ctx.font = "700 12px " + FONT; ctx.fillStyle = "rgba(255,255,255,.3)";
      ctx.fillText("[" + (i + 1) + "]", x + cw / 2, yRow + ch - 14 + oy);
    } else {
      ctx.font = "800 23px " + FONT;
      const nw2 = ctx.measureText(c.name).width;
      ctx.font = "700 11px " + FONT; ctx.fillStyle = "rgba(255,255,255,.3)";
      ctx.fillText("[" + (i + 1) + "]", x + cw / 2 + nw2 / 2 + 13, yRow + 28 + oy);
    }

    if (hovered && mouse.clicked) { selectedClass = i; Game.reset(); }
  }

  // 막대는 절대값이 아니다 — 그렇게 읽으면 '마법사는 범위가 반쪽'이 된다
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "600 10.5px " + FONT; ctx.fillStyle = "rgba(255,255,255,.3)";
  /* 가로로 든 폰은 높이가 652 다 — 카드 아래에 조합 칩까지 놓을 자리가 없어
     안내 줄과 칩이 시작 문구 위에 겹쳐 찍혔다. 자리가 없으면 참고 정보를 접는다. */
  const gridBottom = y0 + rows * ch + (rows - 1) * gap;
  const chipRows = Math.ceil(COMBOS.length / Math.max(1, Math.min(COMBOS.length,
    Math.floor((W - 24 + 8) / 126))));
  const showCombo = H - gridBottom >= 58 + chipRows * 40 + 60;
  if (!showCombo) { ctx.textAlign = "center"; return drawTitleFoot(); }

  ctx.fillText("막대는 네 직업끼리 견준 값이다", W / 2, gridBottom + 14);

  // 속성 조합 레시피 — 공개해야 플레이어가 '설계'를 한다
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(255,255,255,.42)";
  fitFont("700", 12, "서로 다른 속성의 무기를 4레벨까지 올리면 조합이 열리고, 둘 다 8레벨이면 ★완성되어 효과가 1.7배가 된다", W - 32);
  ctx.fillText("서로 다른 속성의 무기를 " + COMBO_LEVEL + "레벨까지 올리면 조합이 열리고, "
    + "둘 다 " + COMBO_MASTER + "레벨이면 ★완성되어 효과가 " + MASTER_POWER + "배가 된다", W / 2, gridBottom + 40);

  /* 여섯 개를 한 줄로 놓으면 1,096px 이다. 좁으면 여러 줄로 접는다. */
  const chipGap = 8;
  const perRow = Math.max(1, Math.min(COMBOS.length,
    Math.floor((W - 24 + chipGap) / (118 + chipGap))));
  const chipW = Math.min(176, Math.floor((W - 24 - (perRow - 1) * chipGap) / perRow));
  const chipY = gridBottom + 58;
  for (let i = 0; i < COMBOS.length; i++) {
    const cb = COMBOS[i], r = Math.floor(i / perRow);
    const inRow = Math.min(perRow, COMBOS.length - r * perRow);
    const rowW = inRow * chipW + (inRow - 1) * chipGap;
    const cx = (W - rowW) / 2 + (i % perRow) * (chipW + chipGap);
    const cy = chipY + r * 40;
    panel(cx, cy, chipW, 34, 8, "rgba(14,14,24,.8)", "rgba(255,255,255,.1)");
    ctx.textAlign = "left"; ctx.font = "600 11px " + FONT;
    const ea = ELEMENTS[cb.a], eb = ELEMENTS[cb.b];
    drawMenuIcon("element", cx + 16, cy + 17, ea.color, 2);
    ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillText("+", cx + 27, cy + 20);
    drawMenuIcon("element", cx + 44, cy + 17, eb.color, 2);
    ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.font = "700 12px " + FONT;
    ctx.fillText(cb.name, cx + 58, cy + 17);
  }

  drawTitleFoot();
}

function drawTitleFoot() {
  const hint = narrow() ? "탭 하면 시작  ·  M 음소거"
    : "스페이스 또는 클릭으로 시작   ·   스페이스 직업 스킬   ·   M 음소거   ·   N 이름표";
  fitFont("700", 17, hint, W - 40);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(255,255,255," + (.55 + Math.sin(performance.now() / 400) * .3).toFixed(2) + ")";
  ctx.fillText(hint, W / 2, H - 26);
}

/* 「[그림] 글자」를 한 덩어리로 가운데에 놓는다.
   이모지를 글자 사이에 끼워 넣던 자리를 대신한다 — 폭을 재서 그림 자리를 먼저 비운다. */
function iconText(px, text, cx, y, col, cell) {
  // 글리프 격자가 7칸일 수도 16칸일 수도 있다 — 폭을 물어봐야 글자와 안 겹친다
  const g = menuIconW(px, cell || 2), gap = 5;
  const tw = ctx.measureText(text).width;
  const x0 = cx - (g + gap + tw) / 2;
  const keep = ctx.textAlign;
  drawMenuIcon(px, x0 + g / 2, y, col, cell || 2);
  ctx.textAlign = "left";
  ctx.fillText(text, x0 + g + gap, y);
  ctx.textAlign = keep;
}

/* 글자가 칸을 넘으면 글꼴을 줄인다.
   좁은 화면에서 제목이 화면 밖으로 잘려 나가는 것을 막는다 —
   자리를 넓힐 수 없을 때 줄일 수 있는 건 글자뿐이다. */
function fitFont(weight, size, text, maxW) {
  let px = size;
  for (let i = 0; i < 12; i++) {
    ctx.font = weight + " " + px.toFixed(1) + "px " + FONT;
    if (ctx.measureText(text).width <= maxW) break;
    px *= .92;
  }
  return px;
}

function wrapText(text, cx, y, maxW, lh) {
  const words = text.split(" ");
  let line = "", yy = y;
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, cx, yy); line = w; yy += lh; }
    else line = test;
  }
  if (line) ctx.fillText(line, cx, yy);
}

/* ---------- 제단 ----------
   「영혼의 제단」이라면서 화면에 제단이 없었다. 강화 카드 여섯 장이 허공에 떠 있고
   그 아래는 빈 판이었다. 돌 받침 · 기둥 · 대접, 그 위에 뜬 영혼 구슬을 격자로 찍는다.
   모은 영혼도 숫자 줄이 아니라 이 구슬이 들고 있게 한다 — 그래야 장식이 아니라 물건이다. */
/* k 는 배율. 세로 화면에서는 카드 여섯 장을 한 줄로 세우느라 제단에 줄 높이가 줄어든다 —
   빼 버리는 대신 작게 세운다. */
function drawAltarStone(cx, floorY, lit, hoard, k) {
  k = k || 1;
  const t = Game.introT;
  /* 돌색은 pxPal 에 맡기지 않는다. 자주색 계열은 밝기 판정에 걸려 세 톤이 전부
     밝은 쪽으로 몰리고, 제단이 돌이 아니라 젖은 비누처럼 보였다. */
  const st = ["#7a7392", "#4a4460", "#2b2540"]; // [윗면, 앞면, 그늘]
  const bob = Math.round(Math.sin(t * 1.2) * 4 / PIX) * PIX;
  const oy = floorY - 170 * k + bob;                // 구슬 중심 — 후광이 대접을 덮지 않는 높이

  // 바닥 그림자
  ctx.fillStyle = "rgba(0,0,0,.5)";
  ctx.beginPath(); pxEllipse(cx, floorY - 3, 92 * k, 15 * k); ctx.fill();

  /* 돌은 세 겹으로 쌓는다 — 앞면 · 윗면 · 그늘.
     한 색으로 칠하면 계단이 아니라 사각형 더미가 된다. */
  const slab = (w0, top, h0) => {
    const w = w0 * k, h = Math.max(PIX * 2, h0 * k);
    ctx.fillStyle = st[1]; ctx.beginPath(); pxR(cx - w, top, w * 2, h); ctx.fill();
    ctx.fillStyle = st[0]; ctx.beginPath(); pxR(cx - w, top, w * 2, PIX); ctx.fill();
    ctx.fillStyle = st[2]; ctx.beginPath();
    pxR(cx - w, top + h - PIX, w * 2, PIX); pxR(cx + w - PIX, top, PIX, h); ctx.fill();
  };
  slab(88, floorY - 18 * k, 18);                    // 아래 계단
  slab(70, floorY - 33 * k, 15);
  slab(54, floorY - 46 * k, 13);
  slab(26, floorY - 112 * k, 66);                   // 기둥
  // 기둥에 세로 홈 — 밋밋한 기둥은 상자로 보인다
  ctx.fillStyle = st[2]; ctx.beginPath();
  for (let i = -1; i <= 1; i++) pxR(cx + i * 15 * k - PIX / 2, floorY - 106 * k, PIX, 54 * k);
  ctx.fill();
  slab(42, floorY - 126 * k, 14);                   // 대접 받침
  // 대접 안쪽 — 파여 있어야 무언가를 담은 것으로 읽힌다
  ctx.fillStyle = "#241f33"; ctx.beginPath(); pxR(cx - 30 * k, floorY - 126 * k, 60 * k, PIX * 2); ctx.fill();

  // 구슬 — 켜지면(구입 직후) 확 밝아진다
  const glow = .3 + Math.sin(t * 2.1) * .1 + lit * .7;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = Math.min(.85, glow);
  // 곳간이 찰수록 구슬이 자란다 — 숫자를 안 읽어도 얼마나 모았는지 보인다
  const h = hoard || 0;
  pxRing(cx, oy, (30 + h * 16 + lit * 22) * k, PIX * 2, pxPal("#c9a3ff"));
  ctx.globalAlpha = 1;
  ctx.restore();
  drawMenuIcon("orb", cx, oy, "#c9a3ff", Math.max(3, Math.round((4 + h * 4) * k)));

  /* 영혼 부스러기가 기둥을 타고 올라 구슬로 빨려 든다.
     대접에서 구슬까지만 띄웠더니 거리가 24px 뿐이라 아무것도 안 보였다 — 기둥 전체를 쓴다. */
  const rise = floorY - 40 * k - (oy + 14);
  for (let i = 0; i < 22; i++) {
    const a = (i * 61.7) % 1, ph = (t * (.32 + a * .3) + a) % 1;
    const y = floorY - 40 * k - ph * rise;
    ctx.globalAlpha = (ph < .12 ? ph / .12 : 1) * (1 - ph * .8) * .95;
    ctx.fillStyle = "#d9c2ff";
    // 오를수록 가운데로 모인다 — 구슬이 빨아들이는 것으로 읽힌다
    ctx.fillRect(Math.round(cx + Math.sin(a * 19 + ph * 2.4) * 44 * k * (1 - ph * .86)),
                 Math.round(y), PIX, PIX);
  }
  ctx.globalAlpha = 1;
}

function drawAltar() {
  menuScrim(.7);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  fitFont("800", 42, "영혼의 제단", W - 40);
  ctx.fillStyle = "#c9a3ff";
  ctx.fillText("영혼의 제단", W / 2, narrow() ? 30 : 52);
  if (!narrow()) {
    ctx.font = "600 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.fillText("판이 끝나도 남는 강화. 다음 판의 시작 지점이 올라간다.", W / 2, 78);
  }

  /* 세 줄로 놓으면 1,184px 이 필요하다 — 세로 화면(520)에서는 가운데 한 줄만 보이고
     양옆 네 장이 통째로 잘렸다. 좁으면 한 줄로 세우고 카드를 낮춘다. */
  const cols = W >= 1180 ? 3 : W >= 800 ? 2 : 1;
  const gap = cols === 1 ? 14 : 22;
  const cw = Math.min(380, Math.floor((W - (cols + 1) * 24) / cols));
  const ch = cols === 1 ? 112 : 128;
  const rows = Math.ceil(ALTAR.length / cols);
  const total = cols * cw + (cols - 1) * gap;
  const x0 = (W - total) / 2, y0 = cols === 1 ? 84 : 104;

  /* 제단(돌 + 영혼 수 + 안내)이 아래를 차지하고 남는 만큼이 격자 자리다.
     820×1180 태블릿을 세로로 들면 논리 520×748 이라 여섯 장이 그대로는 안 들어간다 —
     레벨업 화면과 같은 방식으로 통째로 줄인다. */
  const stoneK = cols === 1 ? .62 : 1;
  const footY = H - 26, soulY = footY - 30, stoneFloor = soulY - 34;
  const gridTop = y0, gridNeed = rows * ch + (rows - 1) * gap;
  const gk = Math.min(1, (stoneFloor - 200 * stoneK - 12 - gridTop) / gridNeed);
  const amx = (mouse.x - W / 2) / gk + W / 2, amy = (mouse.y - gridTop) / gk + gridTop;
  ctx.save();
  if (gk < 1) { ctx.translate(W / 2, gridTop); ctx.scale(gk, gk); ctx.translate(-W / 2, -gridTop); }

  for (let i = 0; i < ALTAR.length; i++) {
    const u = ALTAR[i];
    const x = x0 + (i % cols) * (cw + gap);
    const y = y0 + Math.floor(i / cols) * (ch + gap);
    const lv = Meta.lv(u.key), maxed = lv >= u.max;
    const cost = Meta.costOf(u);
    const afford = !maxed && Meta.souls >= cost;
    const hovered = inRect(amx, amy, x, y, cw, ch);

    panel(x, y, cw, ch, 14,
      hovered && afford ? "rgba(34,28,52,.98)" : "rgba(14,14,24,.92)",
      maxed ? "rgba(255,211,77,.5)" : afford ? (hovered ? "#c9a3ff" : "rgba(201,163,255,.35)") : "rgba(255,255,255,.1)");

    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    /* 못 사는 칸도 '지금 몇 %인지 · 얼마나 더 모아야 하는지'는 읽혀야 한다.
       예전처럼 .45 로 눌러 버리면 모으는 동안 정작 볼 것이 안 보인다. */
    ctx.globalAlpha = maxed || afford ? 1 : .72;
    drawMenuIcon(u.key, x + 40, y + 42, maxed ? "#ffd34d" : "#c9a3ff", 4);

    ctx.font = "800 19px " + FONT; ctx.fillStyle = maxed ? "#ffd34d" : "#fff";
    ctx.fillText(u.name, x + 68, y + 30);
    const nameW = ctx.measureText(u.name).width;          // 이름 폭을 이름 글꼴로 재야 한다
    ctx.font = "700 11px " + FONT; ctx.fillStyle = "rgba(255,255,255,.26)";
    ctx.fillText("[" + (i + 1) + "]", x + 76 + nameW, y + 31);

    /* 「최대 체력 +8%」만 적어 두면 지금 내가 몇 %인지, 하나 더 사면 몇 %가 되는지
       머리로 곱해야 한다. 지금 값과 다음 값을 나란히 보여준다. */
    ctx.font = "600 13px " + FONT;
    if (!u.step) {                                  // 부활처럼 수치가 없는 것
      ctx.fillStyle = lv ? "#ffd34d" : "rgba(255,255,255,.55)";
      ctx.fillText(lv ? u.desc + " — 준비됨" : u.desc, x + 68, y + 52);
    } else {
      const cur = "+" + (u.step * lv) + u.unit;
      ctx.fillStyle = "rgba(255,255,255,.4)";
      ctx.fillText(u.per, x + 68, y + 52);
      let tx = x + 68 + ctx.measureText(u.per).width + 8;
      ctx.font = "800 14px " + FONT;
      ctx.fillStyle = lv ? "#c9a3ff" : "rgba(255,255,255,.3)";
      ctx.fillText(cur, tx, y + 52);
      if (!maxed) {
        tx += ctx.measureText(cur).width + 6;
        ctx.font = "700 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.3)";
        ctx.fillText("→", tx, y + 52);
        ctx.font = "800 14px " + FONT; ctx.fillStyle = afford ? "#ffd34d" : "rgba(255,255,255,.42)";
        ctx.fillText("+" + (u.step * (lv + 1)) + u.unit, tx + 18, y + 52);
      }
    }
    ctx.globalAlpha = 1;

    // 레벨 눈금 — 여기만 둥근 모서리를 쓰면 나머지 픽셀과 재질이 어긋난다
    for (let k = 0; k < u.max; k++) {
      const px = x + 68 + k * 20;
      ctx.fillStyle = k < lv ? "#c9a3ff" : "rgba(255,255,255,.13)";
      ctx.beginPath(); pxR(px, y + 70, 15, 9); ctx.fill();
      if (k < lv) { ctx.fillStyle = "#efe4ff"; ctx.beginPath(); pxR(px, y + 70, 15, PIX); ctx.fill(); }
    }

    ctx.textAlign = "right";
    if (maxed) {
      ctx.font = "800 15px " + FONT; ctx.fillStyle = "#ffd34d";
      ctx.fillText("최대", x + cw - 22, y + 74);
    } else {
      ctx.font = "700 16px " + FONT;
      ctx.fillStyle = afford ? "#ffd34d" : "rgba(255,255,255,.3)";
      ctx.fillText(cost.toLocaleString("ko-KR"), x + cw - 22, y + (ch < 120 ? 70 : 74));
      ctx.globalAlpha = afford ? 1 : .4;
      drawMenuIcon("orb", x + cw - 30 - ctx.measureText(cost.toLocaleString("ko-KR")).width - 9, y + (ch < 120 ? 70 : 74), "#c9a3ff", 2);
      ctx.globalAlpha = 1;
    }

    /* 모으는 중이라는 걸 보여주는 막대. '얼마나 더 모아야 하나'가 숫자 뺄셈이 아니라
       눈에 보여야 제단에 다시 올 이유가 생긴다. */
    ctx.textAlign = "left";
    if (!maxed) {
      const bx = x + 22, bw = cw - 44, p = Math.min(1, Meta.souls / cost);
      ctx.fillStyle = "rgba(255,255,255,.07)";
      ctx.beginPath(); pxR(bx, y + ch - 22, bw, 6); ctx.fill();
      const pal = pxPal(afford ? "#ffd34d" : "#c9a3ff");
      ctx.fillStyle = pal[2];
      ctx.beginPath(); pxR(bx, y + ch - 22, Math.max(PIX, bw * p), 6); ctx.fill();
      ctx.fillStyle = pal[1];
      ctx.beginPath(); pxR(bx, y + ch - 22, Math.max(PIX, bw * p), PIX); ctx.fill();
      // 낮은 카드에서는 값과 겹친다 — 막대가 이미 같은 것을 보여주므로 글자는 생략한다
      if (!afford && ch >= 120) {
        ctx.font = "700 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.34)";
        ctx.textAlign = "right";
        ctx.fillText((cost - Meta.souls).toLocaleString("ko-KR") + " 더", x + cw - 22, y + ch - 34);
        ctx.textAlign = "left";
      }
    }

    if (hovered && mouse.clicked) Game.buyAltar(u.key);
  }
  ctx.restore();

  // 제단 자체 — 구슬이 곧 곳간이라 모을수록 커진다
  drawAltarStone(W / 2, stoneFloor, Game.altarFlash, Math.min(1, Meta.souls / 4000), stoneK);

  // 모은 영혼 — 제단이 들고 있다
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "800 24px " + FONT;
  ctx.fillStyle = Game.altarFlash > 0 ? "#fff" : "#ffd34d";
  ctx.fillText(Meta.souls.toLocaleString("ko-KR") + " 영혼", W / 2, soulY);

  const last = Game.lastEarned > 0 ? "지난 판 +" + Game.lastEarned.toLocaleString("ko-KR") + "   ·   " : "";
  const foot = last + (narrow() ? "탭 하면 돌아가기" : "TAB / ESC 로 돌아가기");
  fitFont("700", 12, foot, W - 32);
  ctx.fillStyle = "rgba(255,255,255,.4)";
  ctx.fillText(foot, W / 2, footY);
}

function drawAdvance() {
  ctx.fillStyle = "rgba(4,4,10,.88)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  const tier = player.advance.length + 1;
  const ttl = tier === 3 ? "★ 3차 각성 ★" : tier + "차 전직";
  fitFont("800", 52, ttl, W - 40);
  ctx.fillStyle = tier === 3 ? "#ff8ad8" : "#ffd34d";
  ctx.fillText(ttl, W / 2, narrow() ? 60 : 78);
  const sub = tier === 3
    ? advName() + " · 마지막 각성 — 규칙 자체가 바뀝니다"
    : advName() + " · 앞으로 무엇이 될지 고르세요 — 스킬과 특성이 통째로 바뀝니다";
  fitFont("600", 15, sub, W - 32);
  ctx.fillStyle = "rgba(255,255,255,.62)";
  ctx.fillText(sub, W / 2, narrow() ? 92 : 112);

  const n = Game.choices.length;
  // 3차 각성 카드는 특성·지급무기가 없어 아래가 비므로 높이를 줄인다
  const hasExtra = Game.choices.some(a => (a.traits && a.traits.length) || a.grant);
  /* 레벨업 화면과 같은 문제 — 카드 셋이면 1,260px 이다. 좁으면 세로로 쌓고 한 번 줄인다. */
  const stack = narrow();
  const cw = 400, ch = hasExtra ? 470 : 372, gap = stack ? 14 : 30;
  const total = n * cw + (n - 1) * gap;
  const x0 = (W - total) / 2, yTop = stack ? 116 : 150;
  const k = stack ? Math.min(1, (H - yTop - 46) / (n * ch + (n - 1) * gap)) : 1;
  const mx = stack ? (mouse.x - W / 2) / k + cw / 2 : mouse.x;
  const my = stack ? (mouse.y - yTop) / k : mouse.y;

  ctx.save();
  if (stack) { ctx.translate(W / 2, yTop); ctx.scale(k, k); ctx.translate(-cw / 2, 0); }

  for (let i = 0; i < n; i++) {
    const a = Game.choices[i]; if (!a) continue;
    const x = stack ? 0 : x0 + i * (cw + gap);
    const y0 = stack ? i * (ch + gap) : yTop;      // 카드 기준선
    const hovered = inRect(mx, my, x, y0, cw, ch);
    const oy = hovered ? -10 : 0;
    panel(x, y0 + oy, cw, ch, 20,
      hovered ? "rgba(32,28,50,.99)" : "rgba(13,13,22,.96)",
      hovered ? a.color : "rgba(255,255,255,.13)");

    ctx.textAlign = "center";
    ctx.font = "60px " + FONT; ctx.fillStyle = "#fff";
    drawMenuIcon("stance", x + cw / 2, y0 + 68 + oy, a.color, 8);
    ctx.font = "800 34px " + FONT; ctx.fillStyle = a.color;
    ctx.fillText(a.name, x + cw / 2, y0 + 132 + oy);
    ctx.font = "600 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.fillText(a.tagline, x + cw / 2, y0 + 158 + oy);

    ctx.strokeStyle = "rgba(255,255,255,.1)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 28, y0 + 178 + oy); ctx.lineTo(x + cw - 28, y0 + 178 + oy); ctx.stroke();

    ctx.font = "500 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.75)";
    wrapText(a.desc, x + cw / 2, y0 + 204 + oy, cw - 52, 19);

    // 새 스킬
    let sy = y0 + 288 + oy;
    pxChip(x + 24, sy - 26, cw - 48, 58, "rgba(255,255,255,.05)", null, 10);
    ctx.textAlign = "left";
    ctx.font = "26px " + FONT; ctx.fillStyle = "#fff";
    drawMenuIcon("skill", x + 40, sy - 4, a.color, 4);
    ctx.font = "700 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.4)";
    ctx.fillText("새 스킬", x + 76, sy - 12);
    ctx.font = "700 15px " + FONT; ctx.fillStyle = a.color;
    ctx.fillText(a.skill.name, x + 76, sy + 5);
    ctx.font = "500 11px " + FONT; ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.fillText(a.skill.desc, x + 76, sy + 22);

    // 새 특성 / 지급 무기
    ctx.textAlign = "center";
    sy = y0 + 364 + oy;
    if (a.traits && a.traits.length) {
      ctx.font = "700 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.35)";
      ctx.fillText("새 특성", x + cw / 2, sy);
      ctx.font = "600 12.5px " + FONT; ctx.fillStyle = "rgba(255,255,255,.8)";
      ctx.fillText(a.traits.map(t => t.name).join("   ·   "), x + cw / 2, sy + 20);
    }
    if (a.grant) {
      ctx.font = "600 12px " + FONT; ctx.fillStyle = "#ffd36e";
      iconText(WEAPONS[a.grant].px, "무기 지급 · " + WEAPONS[a.grant].name, x + cw / 2, sy + 46,
        ELEMENTS[WEAPONS[a.grant].element].color, 2);
    }

    ctx.font = "700 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.3)";
    ctx.fillText("[" + (i + 1) + "]", x + cw / 2, y0 + ch - 20 + oy);

    if (hovered && mouse.clicked) Game.applyChoice(a);
  }
  ctx.restore();

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "600 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.35)";
  ctx.fillText("한 번 고르면 이번 판에서는 되돌릴 수 없습니다",
    W / 2, Math.min(H - 18, stack ? H - 22 : yTop + ch + 30));
}


/* 이 카드를 고르면 열리는(또는 완성되는) 조합.
   그리는 중에 계산하면 카드 높이를 미리 알 수 없다 — 석 장이 높이를 공유하므로
   가장 큰 카드에 맞춰야 하고, 그래서 그리기 전에 한 번 뽑아 둔다. */
function comboRowsFor(c) {
  if (!c || c.type !== "weapon") return [];
  const def = WEAPONS[c.key];
  const rows = [];
  for (const cb of combosAfterPick(c.key, c.level)) rows.push({ cb, done: true, master: false });
  if (c.level >= COMBO_MASTER) {
    for (const cb of COMBOS) {
      if (!player.combos.has(cb.key) || player.mastered.has(cb.key)) continue;
      if (cb.a !== def.element && cb.b !== def.element) continue;
      const other = cb.a === def.element ? cb.b : cb.a;
      if (elemLevel(other) >= COMBO_MASTER) rows.push({ cb, done: true, master: true });
    }
  }
  if (rows.length < 2) {
    for (const pd of combosPending()) {
      if (rows.some(r => r.cb.key === pd.c.key)) continue;
      if (pd.c.a !== def.element && pd.c.b !== def.element) continue;
      rows.push({ cb: pd.c, done: false, la: pd.la, lb: pd.lb });
      if (rows.length >= 2) break;
    }
  }
  return rows;
}

function drawLevelUp() {
  ctx.fillStyle = "rgba(6,6,14,.78)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const tp = Game.traitPick && player.cls;
  const ttl = tp ? advName() + " 특성" : "레벨 업!";
  fitFont("800", 42, ttl, W - 40);
  ctx.fillStyle = tp ? advColor() : "#ffd34d";
  ctx.fillText(ttl, W / 2, narrow() ? 92 : 108);
  const sub = tp ? "레벨 " + player.level + " · 「" + player.cls.stanceName + "」을 어떻게 키울지 고르세요"
                 : "레벨 " + player.level + " · 하나를 선택하세요";
  fitFont("600", 15, sub, W - 32);
  ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.fillText(sub, W / 2, narrow() ? 122 : 142);

  /* 카드 석 장을 한 줄로 놓으면 952px 이 필요하다 — 세로 화면에서는 가운데 한 장만 보였다.
     내용이 빽빽해서 다시 짜는 대신, 세로로 쌓고 화면에 맞게 한 번 줄인다.
     좌표계를 통째로 옮기므로 마우스도 같은 계로 옮겨야 한다. */
  const stack = narrow();
  /* 예전에는 ch 가 356 고정이었다. 조합 줄이 없는 카드는 아래 절반이 통째로 비어
     '내용을 채우다 만 판'처럼 보였다. 석 장 중 가장 큰 것에 맞춰 자른다. */
  let maxRows = 0;
  for (const c of Game.choices) maxRows = Math.max(maxRows, comboRowsFor(c).length);
  // 조합 줄은 y0+292 부터 30 간격, 높이 26. 그 아래에 [번호] 자리를 남긴다.
  const bottom = maxRows ? 292 + (Math.min(2, maxRows) - 1) * 30 + 13 : 276;
  const cw = 300, ch = bottom + 30, gap = stack ? 14 : 26;
  const total = 3 * cw + 2 * gap, x0 = (W - total) / 2, y0 = stack ? 148 : 178;
  const k = stack ? Math.min(1, (H - y0 - 22) / (3 * ch + 2 * gap)) : 1;
  const mx = stack ? (mouse.x - W / 2) / k + cw / 2 : mouse.x;
  const my = stack ? (mouse.y - y0) / k : mouse.y;

  ctx.save();
  if (stack) { ctx.translate(W / 2, y0); ctx.scale(k, k); ctx.translate(-cw / 2, 0); }

  for (let i = 0; i < 3; i++) {
    const c = Game.choices[i]; if (!c) continue;
    const x = stack ? 0 : x0 + i * (cw + gap);
    const y0 = stack ? i * (ch + gap) : 178;      // 카드 기준선 — 쌓으면 행마다 내려간다
    const hovered = inRect(mx, my, x, y0, cw, ch);
    const isW = c.type === "weapon", isT = c.type === "trait";
    const def = c.type === "heal" ? { name: "치유의 성물", icon: "🍖", desc: "체력을 40 회복한다." }
              : isW ? WEAPONS[c.key]
              : isT ? traitDef(player.cls.key, c.key)
              : PASSIVES[c.key];
    const tint = c.type === "heal" ? "#5fe08a" : isW ? "#ffd36e"
               : isT ? advColor() : "#8fd0ff";

    panel(x, y0 - (hovered ? 8 : 0), cw, ch, 18,
      hovered ? "rgba(30,28,46,.98)" : "rgba(14,14,24,.94)",
      hovered ? tint : "rgba(255,255,255,.12)");
    const oy = hovered ? -8 : 0;

    /* 한 판에 스물몇 번 뜨는 화면의 한가운데다 — 여기가 마지막 이모지였다.
       직업 특성은 68종이라 판을 따로 뜨지 않고 각성 색을 입힌 문장으로 묶는다. */
    const pxKey = c.type === "heal" ? "vigor" : isT ? "stance" : def.px || "gem";
    drawMenuIcon(pxKey, x + cw / 2, y0 + 62 + oy, tint, 8);

    const kind = isW ? "무기" : isT ? advName() + " 전용" : "능력";
    ctx.font = "700 12px " + FONT; ctx.fillStyle = tint;
    ctx.fillText(c.isNew ? "새 " + kind : kind + " 강화", x + cw / 2, y0 + 112 + oy);

    ctx.font = "800 23px " + FONT; ctx.fillStyle = "#fff";
    ctx.fillText(def.name, x + cw / 2, y0 + 142 + oy);

    if (c.type !== "heal") {
      ctx.font = "700 14px " + FONT; ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.fillText(c.isNew ? "1레벨" : (c.level - 1) + "레벨 → " + c.level + "레벨", x + cw / 2, y0 + 168 + oy);
    }
    // 직업 특성은 자세 이름을 배지로 — 이 카드가 왜 이 직업의 것인지 보이게
    if (isT && player.cls) {
      ctx.font = "700 11px " + FONT;
      const tw = ctx.measureText(player.cls.stanceName).width + 34;
      pxChip(x + cw / 2 - tw / 2, y0 + 178 + oy, tw, 19, "rgba(255,255,255,.07)", null, 6);
      ctx.fillStyle = tint;
      iconText("stance", player.cls.stanceName, x + cw / 2, y0 + 188 + oy, tint, 2);
    }
    // 무기는 속성과 '이걸 들면 열리는 조합'을 함께 보여준다.
    // 조합이 있다는 걸 아는 것과, 지금 이 카드가 조합을 연다는 걸 아는 건 다르다.
    if (isW) {
      const E = ELEMENTS[def.element];
      ctx.font = "700 11px " + FONT;
      const tw = ctx.measureText(E.name).width + 34;
      pxChip(x + cw / 2 - tw / 2, y0 + 178 + oy, tw, 19, "rgba(255,255,255,.07)", null, 6);
      ctx.fillStyle = E.color;
      iconText("element", E.name, x + cw / 2, y0 + 188 + oy, E.color, 2);

      // 이 카드를 고르면 열리는 조합 / 아직 모자란 조합을 함께 보여준다.
      // 조합이 최대 레벨을 요구하므로, "몇 단계 남았는지"가 보여야 강화할 마음이 생긴다.
      const rows = comboRowsFor(c);
      for (let k = 0; k < Math.min(2, rows.length); k++) {
        const r = rows[k], cb = r.cb, by = y0 + 292 + k * 30 + oy;
        const ea = ELEMENTS[cb.a], eb2 = ELEMENTS[cb.b];
        ctx.save();
        if (r.done) {
          ctx.globalAlpha = .72 + Math.sin(performance.now() / 240) * .28;
          pxChip(x + 20, by - 12, cw - 40, 26, "rgba(70,52,16,.85)", "#ffd34d", 8);
        } else {
          pxChip(x + 20, by - 12, cw - 40, 26, "rgba(255,255,255,.05)", "rgba(255,255,255,.18)", 8);
        }
        ctx.restore();
        ctx.textAlign = "left";
        ctx.font = "700 10px " + FONT;
        // 조합에 필요한 두 속성의 진행도. 이 카드를 고른 뒤의 값으로 보여준다.
        const la = r.done ? COMBO_LEVEL : (cb.a === def.element ? c.level : r.la);
        const lb = r.done ? COMBO_LEVEL : (cb.b === def.element ? c.level : r.lb);
        ctx.fillStyle = ea.color;
        drawMenuIcon("element", x + 33, by - 3, ea.color, 2); ctx.fillText(la + "/" + COMBO_LEVEL, x + 45, by + 1);
        ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillText("+", x + 78, by + 1);
        ctx.fillStyle = eb2.color;
        drawMenuIcon("element", x + 93, by - 3, eb2.color, 2); ctx.fillText(lb + "/" + COMBO_LEVEL, x + 105, by + 1);
        ctx.font = r.done ? "800 12px " + FONT : "700 11px " + FONT;
        ctx.fillStyle = r.master ? "#ffe9a8" : r.done ? "#ffd34d" : "rgba(255,255,255,.55)";
        ctx.fillText(r.master ? "★ " + cb.name + " 완성!" : r.done ? cb.name + " 열림!" : cb.name, x + 146, by + 1);
        ctx.textAlign = "center";
      }
    }

    ctx.font = "500 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.68)";
    wrapText(def.desc, x + cw / 2, y0 + (isW || isT ? 216 : 202) + oy, cw - 44, 18);

    // 특성은 실제 수치를 함께 보여준다
    if (isT && def.detail) {
      ctx.font = "600 12px " + FONT; ctx.fillStyle = tint;
      wrapText(def.detail(c.level), x + cw / 2, y0 + 262 + oy, cw - 34, 16);
    }

    // 강화 시 실제 수치 변화
    if (isW && !c.isNew) {
      const d = WEAPONS[c.key];
      const parts = [];
      if (d.dmg && d.dmg[c.level - 1] !== d.dmg[c.level - 2]) parts.push("피해 " + d.dmg[c.level - 2] + "→" + d.dmg[c.level - 1]);
      if (d.count && d.count[c.level - 1] !== d.count[c.level - 2]) parts.push("개수 " + d.count[c.level - 2] + "→" + d.count[c.level - 1]);
      if (d.radius && d.radius[c.level - 1] !== d.radius[c.level - 2]) parts.push("범위 +" + (d.radius[c.level - 1] - d.radius[c.level - 2]));
      if (d.cd && d.cd[c.level - 1] !== d.cd[c.level - 2]) parts.push("쿨다운 " + d.cd[c.level - 1].toFixed(2) + "초");
      ctx.font = "600 12px " + FONT; ctx.fillStyle = "#ffd36e";
      wrapText(parts.join(" · "), x + cw / 2, y0 + 258 + oy, cw - 34, 16);
    }

    ctx.font = "700 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.fillText("[" + (i + 1) + "]", x + cw / 2, y0 + ch - 20 + oy);

    if (hovered && mouse.clicked) Game.applyChoice(c);
  }
  ctx.restore();
}

/* ---------- 설정 ----------
   값은 칸으로 보여준다. 슬라이더는 터치에서 잡기 어렵고 이 정도 항목에는 과하다.
   칸을 직접 눌러도 되고 방향키로 옮겨도 된다 — 마우스·터치·키보드가 같은 것을 본다. */
function drawOptions() {
  const back = Game.optFrom === "paused";
  menuScrim(back ? .82 : .7);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  fitFont("800", 42, "설정", W - 40);
  ctx.fillStyle = "#8fd0ff";
  ctx.fillText("설정", W / 2, narrow() ? 44 : 76);

  const n = OPT_ROWS.length + 1;                 // 마지막은 기록 지우기
  const cw = Math.min(560, W - 48), ch = 56, gap = 10;
  const x0 = (W - cw) / 2;
  const top = narrow() ? 92 : 140;
  const y0 = Math.max(top, (H - (n * ch + (n - 1) * gap)) / 2);

  for (let i = 0; i < n; i++) {
    const R = OPT_ROWS[i], y = y0 + i * (ch + gap);
    const hovered = inRect(mouse.x, mouse.y, x0, y, cw, ch);
    if (hovered) Game.optRow = i;
    const sel = Game.optRow === i;

    panel(x0, y, cw, ch, 12,
      sel ? "rgba(28,26,48,.97)" : "rgba(14,14,24,.9)",
      sel ? "#8fd0ff" : "rgba(255,255,255,.12)");

    if (!R) {                                    // 기록 지우기
      ctx.textAlign = "left";
      ctx.font = "700 15px " + FONT;
      ctx.fillStyle = Game.wipeArm > 0 ? "#ff9a5c" : "rgba(255,255,255,.75)";
      ctx.fillText("기록 지우기", x0 + 22, y + ch / 2);
      ctx.textAlign = "right";
      ctx.font = "700 13px " + FONT;
      ctx.fillStyle = Game.wipeArm > 0 ? "#ff9a5c" : "rgba(255,255,255,.35)";
      ctx.fillText(Game.wipeArm > 0 ? "한 번 더 — 영혼·강화·최고 기록이 사라진다"
                                    : "영혼 · 제단 강화 · 최고 기록", x0 + cw - 22, y + ch / 2);
      if (hovered && mouse.clicked) Game.wipeAsk();
      continue;
    }

    ctx.textAlign = "left";
    ctx.font = "700 15px " + FONT; ctx.fillStyle = "rgba(255,255,255,.8)";
    ctx.fillText(R.name, x0 + 22, y + ch / 2);

    /* 음량은 막대(찬 만큼 켜진다), 나머지는 라디오(고른 것 하나만 켜진다).
       둘을 같은 규칙으로 그렸더니 음량 50% 인데 다섯 칸 중 셋이 켜져 60% 로 보였다 —
       0 도 하나의 칸을 차지하고 있었기 때문이다. 음량은 0 을 칸에서 뺀다. */
    const bar = R.max >= 3;
    const segs = bar ? R.max : R.max + 1;
    const segW = Math.min(46, (cw - 250) / segs), sgap = 5;
    const bw = segs * segW + (segs - 1) * sgap;
    const bx = x0 + cw - 22 - bw - 74;
    for (let k = 0; k < segs; k++) {
      const sx = bx + k * (segW + sgap);
      const on = bar ? k < Opt[R.key] : k === Opt[R.key];
      ctx.fillStyle = on ? "#8fd0ff" : "rgba(255,255,255,.1)";
      ctx.beginPath(); pxR(sx, y + ch / 2 - 9, segW, 18); ctx.fill();
      if (on) {
        ctx.fillStyle = "#d6ecff";
        ctx.beginPath(); pxR(sx, y + ch / 2 - 9, segW, PIX); ctx.fill();
      }
      if (inRect(mouse.x, mouse.y, sx - 2, y + 8, segW + 4, ch - 16) && mouse.clicked) {
        // 막대에서 이미 켜진 마지막 칸을 다시 누르면 끈다 — 그래야 0 에 닿는다
        const v = bar ? (Opt[R.key] === k + 1 ? k : k + 1) : k;
        Opt[R.key] = v; Opt.apply(); Sfx.play(520, .04, "square", .3);
      }
    }

    ctx.textAlign = "right";
    ctx.font = "700 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.fillText(R.labels ? R.labels[Opt[R.key]]
      : Opt[R.key] === 0 ? "끔" : Math.round(Opt[R.key] / R.max * 100) + "%",
      x0 + cw - 22, y + ch / 2);
  }

  ctx.textAlign = "center";
  ctx.font = "600 12px " + FONT; ctx.fillStyle = "rgba(255,255,255,.4)";
  const foot = narrow() ? "칸을 눌러 바꾼다  ·  ESC 로 돌아가기"
    : "방향키 또는 클릭으로 바꾼다   ·   ESC / O 로 돌아가기   ·   M 빠른 음소거";
  fitFont("600", 12, foot, W - 32);
  ctx.fillText(foot, W / 2, Math.min(H - 20, y0 + n * (ch + gap) + 22));
}

function drawPaused() {
  ctx.fillStyle = "rgba(6,6,14,.75)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  fitFont("800", 46, "일시정지", W - 40);
  ctx.fillStyle = "#fff";
  ctx.fillText("일시정지", W / 2, H / 2 - 96);

  /* 줄을 눌러서도 쓸 수 있어야 한다 — 폰에는 ESC 도 R 도 O 도 없다. */
  const bw = Math.min(300, W - 56), bh = 44, bx = W / 2 - bw / 2;
  const rows = [
    ["계속", "ESC", () => { Game.state = "playing"; Game.quitArm = 0; }],
    ["설정", "O", () => { Game.optFrom = "paused"; Game.state = "options"; }],
    [Game.quitArm > 0 ? "한 번 더 — 이 판을 버린다" : "포기하고 다시 시작", "R",
      () => { if (Game.quitArm > 0) { Game.quitArm = 0; Game.reset(); } else { Game.quitArm = 2.5; Sfx.play(300, .08, "square", .4, -60); } }],
  ];
  for (let i = 0; i < rows.length; i++) {
    const [label, key, act] = rows[i], y = H / 2 - 34 + i * (bh + 10);
    const hov = inRect(mouse.x, mouse.y, bx, y, bw, bh);
    const warn = i === 2 && Game.quitArm > 0;
    panel(bx, y, bw, bh, 10,
      hov ? "rgba(30,28,46,.98)" : "rgba(14,14,24,.9)",
      warn ? "#ff9a5c" : hov ? "#ffd36e" : "rgba(255,255,255,.14)");
    ctx.textAlign = "left"; ctx.font = "700 15px " + FONT;
    ctx.fillStyle = warn ? "#ff9a5c" : "rgba(255,255,255,.85)";
    ctx.fillText(label, bx + 20, y + bh / 2);
    ctx.textAlign = "right"; ctx.font = "700 12px " + FONT;
    ctx.fillStyle = "rgba(255,255,255,.3)";
    ctx.fillText(key, bx + bw - 20, y + bh / 2);
    if (hov && mouse.clicked) { act(); return; }
  }
  ctx.textAlign = "center";
}

function drawEnd(win) {
  ctx.fillStyle = win ? "rgba(20,14,6,.85)" : "rgba(20,6,10,.85)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "800 58px " + FONT; ctx.fillStyle = win ? "#ffd34d" : "#ff5b6b";
  ctx.fillText(win ? "생존 성공!" : "쓰러졌다...", W / 2, H / 2 - 150);

  /* 결과는 판 없이 글자만 띄워 두었었다. 어둡게 덮어도 세계가 비쳐서
     주인공의 후광이 숫자 한가운데를 지나갔다 — 읽을 곳에는 바닥이 있어야 한다. */
  const pw = Math.min(W - 40, 430), ph = 240;   // 아래 안내 줄(H/2+148)에 걸치지 않게
  panel(W / 2 - pw / 2, H / 2 - 106, pw, ph, 16,
        win ? "rgba(26,20,10,.94)" : "rgba(22,12,16,.94)",
        win ? "rgba(255,211,77,.4)" : "rgba(255,120,120,.28)");

  const rows = [
    ["생존 시간", fmtTime(Game.time)],
    ["처치 수", String(Game.kills)],
    ["레벨", String(player.level)],
    ["직업", player.cls ? advName() + (player.advance.length ? " (" + player.cls.name + ")" : "") : "-"],
    ["누적 피해량", Math.round(Game.dmgDealt).toLocaleString("ko-KR")],
    ["획득 영혼", "+" + Game.soulsEarned],
  ];
  ctx.font = "600 18px " + FONT;
  rows.forEach((r, i) => {
    const y = H / 2 - 66 + i * 32;
    ctx.textAlign = "right"; ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.fillText(r[0], W / 2 - 16, y);
    ctx.textAlign = "left"; ctx.fillStyle = "#fff";
    ctx.fillText(r[1], W / 2 + 16, y);
    if (r[0] === "획득 영혼")
      drawMenuIcon("orb", W / 2 + 24 + ctx.measureText(r[1]).width, y, "#c9a3ff", 2);
  });

  ctx.textAlign = "center";

  /* 영혼이 어디서 왔는지 보여준다. 합계만 던지면 다음 판에 무엇을 더 해야
     많이 버는지 알 수가 없다 — 버틴 시간이 주 수입이라는 게 여기서 읽혀야 한다. */
  const sp = Game.soulParts;
  if (sp) {
    const parts = ["버팀 " + fmtTime(Game.time) + " → +" + sp.time,
                   "처치 " + Game.kills.toLocaleString("ko-KR") + " → +" + sp.kills];
    if (sp.win) parts.push("클리어 → +" + sp.win);
    ctx.font = "600 12.5px " + FONT;
    ctx.fillStyle = "rgba(255,255,255,.42)";
    ctx.fillText(parts.join("   ·   "), W / 2, H / 2 + 116);
  }

  ctx.font = "700 17px " + FONT;
  ctx.fillStyle = "rgba(255,255,255," + (.55 + Math.sin(performance.now() / 400) * .3).toFixed(2) + ")";
  ctx.fillText("SPACE / R  같은 직업으로 다시", W / 2, H / 2 + 148);
  ctx.font = "700 14px " + FONT; ctx.fillStyle = "rgba(255,255,255,.5)";
  ctx.fillText("ESC  직업 다시 고르기   ·   TAB  영혼의 제단", W / 2, H / 2 + 176);
  ctx.font = "600 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.4)";
  ctx.textAlign = "center";
  const have = "보유 영혼 " + Meta.souls.toLocaleString("ko-KR");
  ctx.fillText(have, W / 2 + 12, H / 2 + 208);
  drawMenuIcon("orb", W / 2 - ctx.measureText(have).width / 2 + 1, H / 2 + 208, "#c9a3ff", 2);
}

/* ---------- 메인 루프 ---------- */
let acc = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > .25) dt = .25;            // 탭 전환 후 폭주 방지
  // 연출 타이머는 시뮬레이션이 멈춰 있어도(레벨업·전직 화면) 흘러야 한다
  if (Game.comboFlash > 0) Game.comboFlash = Math.max(0, Game.comboFlash - dt);
  if (Game.advanceFlash > 0) Game.advanceFlash = Math.max(0, Game.advanceFlash - dt);
  if (Game.houndWarn > 0) Game.houndWarn = Math.max(0, Game.houndWarn - dt);
  if (Game.lmFlash > 0) Game.lmFlash = Math.max(0, Game.lmFlash - dt);
  if (Game.altarFlash > 0) Game.altarFlash = Math.max(0, Game.altarFlash - dt * 1.8);
  if (Game.quitArm > 0) Game.quitArm = Math.max(0, Game.quitArm - dt);
  if (Game.wipeArm > 0) Game.wipeArm = Math.max(0, Game.wipeArm - dt);

  // 전직 순간의 슬로모션 — 연출 타이머는 실시간, 시뮬레이션만 늦춘다
  let simDt = dt;
  if (Game.slowmo > 0) {
    Game.slowmo = Math.max(0, Game.slowmo - dt);
    simDt *= .34;
  }
  if (Game.whiteFlash > 0) Game.whiteFlash = Math.max(0, Game.whiteFlash - dt * 1.6);

  // 메뉴에서는 어트랙트 데모가, 판 중에는 진짜가 같은 고정 타임스텝으로 돈다
  const inMenu = Game.state === "intro" || Game.state === "title" || Game.state === "altar"
    || (Game.state === "options" && Game.optFrom !== "paused");
  if (inMenu) { if (!Attract.on) Attract.start(); }
  else if (Attract.on) Attract.stop();

  acc += simDt;
  let guard = 0;
  while (acc >= STEP && guard++ < 5) {
    if (inMenu) Attract.update(STEP); else update(STEP);
    acc -= STEP;
  }

  // 렌더
  // 흔들림을 넣는 곳은 스물일곱 군데다 — 배수는 '읽는 한 곳'에서 곱한다
  const sk = cam.shake * Opt.shakeMul();
  const shx = sk ? rnd(-sk, sk) : 0;
  const shy = sk ? rnd(-sk, sk) : 0;
  ctx.save();
  ctx.translate(shx, shy);
  drawBackground();
  // 메뉴에서도 월드를 그린다 — 그 위를 각 메뉴가 반투명하게 덮는다
  drawWorld();
  ctx.restore();

  drawLighting();

  // 메뉴에서는 HUD 를 그리지 않는다. 뒤에서 데모가 굴러가도 그건 '배경'이지 내 판이 아니다.
  if (!inMenu) {
    drawHUD();
    // 붉은 비네트.
    // 기사는 설계상 상시 피격당하므로 세기를 '남은 체력'에 연동한다 —
    // 건강할 때는 옅게, 죽기 직전에만 강하게. 화면이 늘 빨갛기만 하면 정보가 아니다.
    const hpFrac = clamp(player.hp / player.stats.maxHp, 0, 1);
    const hitA = player.hurtFlash > 0 ? (player.hurtFlash / .35) * (.12 + .26 * (1 - hpFrac)) : 0;
    const lowA = hpFrac < .3 ? (.3 - hpFrac) / .3 * (.14 + Math.sin(performance.now() / 260) * .05) : 0;
    const a = Math.min(.5, hitA + lowA);
    if (a > .004) {
      const g = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
      g.addColorStop(0, "rgba(255,0,40,0)");
      g.addColorStop(1, "rgba(255,0,40," + a.toFixed(3) + ")");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }

  if (Game.whiteFlash > 0) {
    ctx.fillStyle = "rgba(255,248,230," + (Game.whiteFlash * .55).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }

  if (Game.state === "intro") drawIntro();
  else if (Game.state === "title") drawTitle();
  else if (Game.state === "altar") drawAltar();
  else if (Game.state === "options") drawOptions();
  else if (Game.state === "advance") drawAdvance();
  else if (Game.state === "levelup") drawLevelUp();
  else if (Game.state === "paused") drawPaused();
  else if (Game.state === "dead") drawEnd(false);
  else if (Game.state === "won") drawEnd(true);

  mouse.clicked = false;
}

recomputeStats();
player.hp = player.stats.maxHp;
resize();
requestAnimationFrame(frame);
</script>
