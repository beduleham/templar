<script>
"use strict";
/* ==========================================================================
   Templar Survivors — 뱀파이어 서바이버즈 스타일 오토배틀러
   의존성 없음. Canvas 2D + WebAudio 만 사용.
   ========================================================================== */

/* ---------- 설정 ---------- */
const W = 1280, H = 720;          // 논리 해상도 (실제 크기는 CSS로 스케일)
const STEP = 1 / 60;              // 고정 타임스텝
const RUN_TIME = 15 * 60;         // 15분 생존 = 클리어
const MAX_WEAPONS = 6, MAX_PASSIVES = 6, MAX_LEVEL = 8;
const ADV_LV1 = 10, ADV_LV2 = 22;   // 전직 레벨

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });

// roundRect 미지원 브라우저 대비
if (!ctx.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * scale) + "px";
  canvas.style.height = Math.floor(H * scale) + "px";
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
window.addEventListener("resize", resize);

/* ---------- 유틸 ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndInt = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };

// 타일 장식용 결정적 해시 (같은 좌표는 항상 같은 값)
function hash2(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}

/* ---------- 사운드 (에셋 없이 합성) ---------- */
const Sfx = {
  ctx: null, on: true, last: {},
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = .25; this.master.connect(this.ctx.destination); }
  },
  play(freq, dur, type = "square", vol = 1, slide = 0) {
    if (!this.on || !this.ctx) return;
    if (this.ctx.state === "suspended") this.ctx.resume();
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol * .3, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(g); g.connect(this.master); osc.start(t); osc.stop(t + dur + .02);
  },
  // 같은 소리가 초당 수십 번 나지 않도록 제한
  throttled(key, ms, fn) {
    const now = performance.now();
    if (this.last[key] && now - this.last[key] < ms) return;
    this.last[key] = now; fn();
  },
  hit()     { this.throttled("hit", 45, () => this.play(rnd(420, 540), .05, "square", .35, -200)); },
  shoot()   { this.throttled("shoot", 70, () => this.play(700, .05, "triangle", .3, -300)); },
  hurt()    { this.play(150, .22, "sawtooth", .9, -90); },
  pickup()  { this.throttled("pickup", 55, () => this.play(880, .05, "sine", .35, 300)); },
  levelup() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.play(f, .13, "triangle", .8), i * 70)); },
  boss()    { this.play(70, .8, "sawtooth", 1, 40); },
  dead()    { [400, 330, 260, 180].forEach((f, i) => setTimeout(() => this.play(f, .3, "sawtooth", .8), i * 130)); },
};

/* ---------- 입력 ---------- */
const keys = new Set();
const mouse = { x: W / 2, y: H / 2, down: false, clicked: false };
const touch = { active: false, ox: 0, oy: 0, x: 0, y: 0 };

addEventListener("keydown", e => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Tab"].includes(e.key)) e.preventDefault();
  keys.add(e.key.toLowerCase());
  Sfx.init();
  Game.onKey(e.key.toLowerCase());
});
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());

function canvasPos(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: (clientX - r.left) / r.width * W, y: (clientY - r.top) / r.height * H };
}
canvas.addEventListener("mousemove", e => { const p = canvasPos(e.clientX, e.clientY); mouse.x = p.x; mouse.y = p.y; });
canvas.addEventListener("mousedown", e => { Sfx.init(); mouse.down = true; mouse.clicked = true; const p = canvasPos(e.clientX, e.clientY); mouse.x = p.x; mouse.y = p.y; });
addEventListener("mouseup", () => mouse.down = false);
canvas.addEventListener("contextmenu", e => { e.preventDefault(); Sfx.init(); useSkill(); });

// 모바일: 화면을 누른 지점 기준 가상 조이스틱
canvas.addEventListener("touchstart", e => {
  e.preventDefault(); Sfx.init();
  const t = e.changedTouches[0], p = canvasPos(t.clientX, t.clientY);
  mouse.x = p.x; mouse.y = p.y; mouse.clicked = true;
  touch.active = true; touch.ox = p.x; touch.oy = p.y; touch.x = p.x; touch.y = p.y;
}, { passive: false });
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  const t = e.changedTouches[0], p = canvasPos(t.clientX, t.clientY);
  touch.x = p.x; touch.y = p.y;
}, { passive: false });
canvas.addEventListener("touchend", e => { e.preventDefault(); touch.active = false; }, { passive: false });

function inputVector() {
  let dx = 0, dy = 0;
  if (keys.has("a") || keys.has("arrowleft"))  dx -= 1;
  if (keys.has("d") || keys.has("arrowright")) dx += 1;
  if (keys.has("w") || keys.has("arrowup"))    dy -= 1;
  if (keys.has("s") || keys.has("arrowdown"))  dy += 1;
  if (!dx && !dy && touch.active) {
    const tx = touch.x - touch.ox, ty = touch.y - touch.oy;
    const len = Math.hypot(tx, ty);
    if (len > 12) { dx = tx / len; dy = ty / len; }
  }
  const l = Math.hypot(dx, dy);
  return l > 0 ? { x: dx / l, y: dy / l } : { x: 0, y: 0 };
}

/* ---------- 공간 해시 (적 300마리 충돌을 O(n²) 없이) ---------- */
class SpatialHash {
  constructor(cell = 64) { this.cell = cell; this.map = new Map(); }
  clear() { this.map.clear(); }
  key(cx, cy) { return cx * 73856093 ^ cy * 19349663; }
  insert(e) {
    const cx = Math.floor(e.x / this.cell), cy = Math.floor(e.y / this.cell);
    const k = this.key(cx, cy);
    let bucket = this.map.get(k);
    if (!bucket) { bucket = []; this.map.set(k, bucket); }
    bucket.push(e);
  }
  // 반경 r 안의 후보를 out 배열에 채워서 반환 (할당 최소화)
  query(x, y, r, out) {
    out.length = 0;
    const c = this.cell;
    const x0 = Math.floor((x - r) / c), x1 = Math.floor((x + r) / c);
    const y0 = Math.floor((y - r) / c), y1 = Math.floor((y + r) / c);
    for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
      const bucket = this.map.get(this.key(cx, cy));
      if (bucket) for (let i = 0; i < bucket.length; i++) out.push(bucket[i]);
    }
    return out;
  }
}

/* ---------- 스프라이트 레이어 ----------
   지금은 이미지 에셋이 하나도 없어서 전부 도형으로 그린다.
   나중에 아틀라스 1장 + 프레임 정의만 넣으면 그림만 갈아끼울 수 있도록,
   '무엇을 그릴지(key)'와 '어떻게 그릴지(도형 or 스프라이트)'를 여기서 분리해 둔다.

   사용 예:
     Sprites.load("atlas.png", { bat: { x:0, y:0, w:32, h:32, n:4, fps:8 }, ... });
   이후로는 draw() 가 자동으로 스프라이트를 쓰고, 없는 key 만 도형으로 폴백한다. */
const Sprites = {
  atlas: null, frames: {}, ready: false,

  load(url, frames) {
    const img = new Image();
    img.onload = () => { this.atlas = img; this.frames = frames || {}; this.ready = true; };
    img.onerror = () => { this.ready = false; };   // 실패해도 도형 렌더링으로 계속 돈다
    img.src = url;
  },

  // 그렸으면 true, 프레임이 없으면 false → 호출부가 도형으로 폴백한다
  draw(key, sx, sy, scale, time, flip) {
    if (!this.ready || !key) return false;
    const f = this.frames[key];
    if (!f) return false;
    const n = f.n || 1;
    const idx = n > 1 ? Math.floor(time * (f.fps || 8)) % n : 0;
    const w = f.w, h = f.h;
    ctx.save();
    ctx.translate(sx, sy);
    if (flip) ctx.scale(-1, 1);
    ctx.imageSmoothingEnabled = false;          // 픽셀아트는 보간하지 않는다
    ctx.drawImage(this.atlas, f.x + idx * w, f.y, w, h,
                  -w * scale / 2, -h * scale / 2, w * scale, h * scale);
    ctx.restore();
    return true;
  },
};

/* ---------- 무기 정의 ----------
   각 무기는 stats(레벨별 수치) + fire()를 가진다.
   fire는 실제 발사체를 스폰하고, 지속형(오라/궤도)은 update에서 처리한다. */
const WEAPONS = {
  dagger: {
    name: "투척 단검", icon: "🗡️", element: "physical", desc: "가장 가까운 적에게 단검을 던진다. 관통.",
    cd: [1.0, .9, .82, .75, .68, .62, .56, .5],
    dmg: [12, 16, 21, 27, 35, 45, 58, 74],
    count: [1, 1, 2, 2, 3, 3, 4, 5],
    pierce: [1, 1, 1, 2, 2, 2, 3, 3],
    fire(p, w) {
      const n = this.count[w.level - 1], dmg = this.dmg[w.level - 1] * p.stats.damage;
      const targets = nearestEnemies(p.x, p.y, 900, n);
      for (let i = 0; i < n; i++) {
        let ang;
        if (targets[i]) ang = Math.atan2(targets[i].y - p.y, targets[i].x - p.x);
        else if (targets[0]) ang = Math.atan2(targets[0].y - p.y, targets[0].x - p.x) + (i - n / 2) * .18;
        else ang = Math.atan2(p.faceY, p.faceX) + (i - n / 2) * .18;
        const sp = 520 * p.stats.projSpeed;
        spawnProjectile({
          x: p.x, y: p.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
          r: 7 * p.stats.area, dmg, pierce: this.pierce[w.level - 1], life: 1.6,
          kind: "dagger", angle: ang, color: "#ffe9a8", element: "physical",
        });
      }
      Sfx.shoot();
    },
  },

  aura: {
    name: "성역", icon: "✨", element: "holy", desc: "몸 주위에 신성한 결계를 둘러 접근한 적을 태운다.",
    cd: [.55, .5, .46, .42, .38, .34, .3, .26],
    dmg: [9, 12, 16, 21, 27, 35, 45, 58],
    radius: [78, 90, 102, 114, 128, 142, 158, 176],
    fire(p, w) {
      const R = this.radius[w.level - 1] * p.stats.area;
      const dmg = this.dmg[w.level - 1] * p.stats.damage;
      const found = hash.query(p.x, p.y, R + 30, scratch);
      let any = false;
      for (let i = 0; i < found.length; i++) {
        const e = found[i];
        if (!e.active) continue;
        if (dist2(e.x, e.y, p.x, p.y) < (R + e.r) * (R + e.r)) {
          damageEnemy(e, dmg, p.x, p.y, 40, "holy");
          any = true;
        }
      }
      w.fx = .25;                       // 링 이펙트 표시 시간
      if (any) Sfx.hit();
    },
    draw(p, w) {
      const R = this.radius[w.level - 1] * p.stats.area;
      const a = .13 + (w.fx > 0 ? .16 * (w.fx / .25) : 0);
      ctx.save();
      const g = ctx.createRadialGradient(p.sx, p.sy, R * .25, p.sx, p.sy, R);
      g.addColorStop(0, "rgba(255,225,150,0)");
      g.addColorStop(1, "rgba(255,205,110," + a.toFixed(3) + ")");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, R, 0, TAU); ctx.fill();
      ctx.strokeStyle = "rgba(255,220,140," + (a * 2.2).toFixed(3) + ")";
      ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    },
  },

  whip: {
    name: "쇠사슬 플레일", icon: "⛓️", element: "physical", desc: "바라보는 방향으로 넓게 후려친다.",

/* ---------- 오브젝트 풀 ---------- */
function makePool(size, factory) {
  const arr = new Array(size);
  for (let i = 0; i < size; i++) { arr[i] = factory(); arr[i].active = false; }
  return arr;
}
function alloc(pool) {
  for (let i = 0; i < pool.length; i++) if (!pool[i].active) return pool[i];
  return null;               // 풀이 가득 차면 스폰을 건너뛴다 (프레임 드랍 방지)
}

const enemies    = makePool(540, () => ({ x: 0, y: 0, vx: 0, vy: 0, r: 10, hp: 1, maxHp: 1, spd: 0, dmg: 0, xp: 1, type: null, id: 0, flash: 0, kx: 0, ky: 0, wob: 0, boss: false, slow: 0, burn: 0, burnDps: 0 }));
const projectiles= makePool(320, () => ({ x: 0, y: 0, vx: 0, vy: 0, r: 6, dmg: 0, pierce: 1, life: 0, kind: "", angle: 0, color: "#fff", homing: 0, target: null, hitIds: new Set(), spin: 0, element: "physical", maxLife: 1, retarget: 0 }));
const slashes    = makePool(24,  () => ({ x: 0, y: 0, ang: 0, len: 0, life: 0, maxLife: 0, dmg: 0, hitIds: new Set(), element: "physical" }));
const waves      = makePool(40,  () => ({ x: 0, y: 0, r: 0, maxR: 0, life: 0, maxLife: 1, dmg: 0, color: "#fff", element: "physical", heal: 0, hitIds: new Set() }));
const gems       = makePool(700, () => ({ x: 0, y: 0, vx: 0, vy: 0, value: 1, tier: 0, pulled: false, bob: 0 }));
const pickups    = makePool(24,  () => ({ x: 0, y: 0, kind: "heart", bob: 0 }));
const particles  = makePool(500, () => ({ x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, r: 3, color: "#fff", drag: .92 }));
const numbers    = makePool(120, () => ({ x: 0, y: 0, vy: 0, life: 0, text: "", color: "#fff", size: 14 }));
const bolts      = makePool(24,  () => ({ x: 0, y: 0, life: 0, seed: 0 }));

let enemyIdSeq = 1;
const hash = new SpatialHash(70);
const scratch = [], scratch2 = [], scratch3 = [];
const cam = { x: 0, y: 0, shake: 0 };

/* ---------- 스폰 헬퍼 ---------- */
function spawnProjectile(o) {
  const p = alloc(projectiles); if (!p) return null;
  p.active = true;
  p.x = o.x; p.y = o.y; p.vx = o.vx; p.vy = o.vy; p.r = o.r; p.dmg = o.dmg;
  p.pierce = o.pierce + (player.dynPierce || 0); p.life = o.life; p.kind = o.kind; p.angle = o.angle;
  p.color = o.color; p.homing = o.homing || 0; p.target = o.target || null;
  p.element = o.element || "physical"; p.maxLife = o.life; p.retarget = 0;
  const ps = player.dynProjSpeed || 1;
  if (ps !== 1) { p.vx *= ps; p.vy *= ps; }
  if (!p.homing && player.dynHoming) p.homing = player.dynHoming;
  p.spin = o.kind === "dagger" ? 0 : rnd(-4, 4);
  p.hitIds.clear();
  return p;
}
function spawnSlash(p, ang, dmg, len, life, element) {
  const s = alloc(slashes); if (!s) return;
  s.active = true; s.x = p.x; s.y = p.y; s.ang = ang; s.len = len;
  s.life = s.maxLife = life * .28; s.dmg = dmg; s.hitIds.clear();
  s.element = element || "physical";
}

function spawnWave(o) {
  const w = alloc(waves); if (!w) return;
  w.active = true; w.x = o.x; w.y = o.y; w.r = 0; w.maxR = o.maxR;
  w.life = w.maxLife = o.life; w.dmg = o.dmg; w.color = o.color;
  w.element = o.element || "physical"; w.heal = o.heal || 0;
  w.hitIds.clear();
}
function spawnBolt(x, y) {
  const b = alloc(bolts); if (!b) return;
  b.active = true; b.x = x; b.y = y; b.life = .3; b.seed = rnd(1000);
}
function spawnParticles(x, y, n, color, speed = 120, life = .5, r = 3) {
  for (let i = 0; i < n; i++) {
    const p = alloc(particles); if (!p) return;
    const a = rnd(TAU), s = rnd(speed * .3, speed);
    p.active = true; p.x = x; p.y = y; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
    p.life = p.maxLife = rnd(life * .5, life); p.r = rnd(r * .6, r); p.color = color; p.drag = .9;
  }
}
function spawnNumber(x, y, text, color, size = 14) {
  const n = alloc(numbers); if (!n) return;
  n.active = true; n.x = x + rnd(-6, 6); n.y = y; n.vy = -46; n.life = .7;
  n.text = text; n.color = color; n.size = size;
}
function spawnGem(x, y, value) {
  const g = alloc(gems); if (!g) return;
  g.active = true; g.x = x; g.y = y;
  const a = rnd(TAU); g.vx = Math.cos(a) * 60; g.vy = Math.sin(a) * 60;
  g.value = value; g.tier = value >= 40 ? 2 : value >= 8 ? 1 : 0;
  g.pulled = false; g.bob = rnd(TAU);
}
function spawnPickup(x, y, kind) {
  const p = alloc(pickups); if (!p) return;
  p.active = true; p.x = x; p.y = y; p.kind = kind; p.bob = rnd(TAU);
}

/* ---------- 적 조회 ---------- */
/* 가장 가까운 적 k개.
   탐색 반경이 800~1200 이라 공간 해시는 오히려 수백 개 셀을 훑게 된다.
   대신 풀을 한 번 선형 순회하며 상위 k개만 삽입 정렬로 유지한다 —
   할당도 정렬도 없고, k 는 항상 작다(1~14).
   반환 배열을 호출부가 잠시 들고 있으므로 버퍼를 라운드로빈으로 돌려 재진입에 대비한다. */
const NEAR_BUFS = 6;
const nearBufs = [], nearDists = [];
for (let i = 0; i < NEAR_BUFS; i++) { nearBufs.push([]); nearDists.push([]); }
let nearIdx = 0;

function nearestEnemies(x, y, maxDist, count) {
  const buf = nearBufs[nearIdx], dists = nearDists[nearIdx];
  nearIdx = (nearIdx + 1) % NEAR_BUFS;
  buf.length = 0;
  const md2 = maxDist * maxDist;
  let n = 0;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (!e.active) continue;
    const d = dist2(e.x, e.y, x, y);
    if (d > md2) continue;
    if (n < count) {
      let j = n++;
      while (j > 0 && dists[j - 1] > d) { dists[j] = dists[j - 1]; buf[j] = buf[j - 1]; j--; }
      dists[j] = d; buf[j] = e;
    } else if (d < dists[count - 1]) {
      let j = count - 1;
      while (j > 0 && dists[j - 1] > d) { dists[j] = dists[j - 1]; buf[j] = buf[j - 1]; j--; }
      dists[j] = d; buf[j] = e;
    }
  }
  buf.length = n;
  return buf;
}

function damageEnemy(e, dmg, fromX, fromY, knock, elem) {
  if (!e.active) return;
  elem = elem || "physical";
  const s = player.stats, C = player.combos;

  // 속성 고유 효과
  if (elem === "frost") e.slow = Math.max(e.slow, 1.5);
  if (elem === "fire") { e.burn = Math.max(e.burn, 2.5); e.burnDps = Math.max(e.burnDps, dmg * .35); }

  // 조합: 정화의 불길 — 속성을 가리지 않고 화상을 남긴다
  if (C && C.has("pyre") && elem !== "fire") { e.burn = Math.max(e.burn, 2.0); e.burnDps = Math.max(e.burnDps, dmg * .22); procCombo("pyre", e.x, e.y); }

  let mul = 1;
  // 조합: 빙결 처형 — 둔화된 적에게 물리 피해 증폭
  if (C && C.has("shatter") && elem === "physical" && e.slow > 0) { mul *= 1.45; procCombo("shatter", e.x, e.y); }
  // 전직: 속성 증폭 / 둔화된 적 추가 피해
  if (elem !== "physical") mul *= 1 + advVal("elemAmp", 0) + .12 * traitLv("attune");
  if (e.slow > 0 && (advVal("deepFreeze", false) || traitLv("chronos")))
    mul *= 1 + .18 * traitLv("chronos") + (advVal("deepFreeze", false) ? .2 : 0);
  // 조합: 학살 — 처치 누적 버프
  if (C && C.has("carnage") && player.carnage > 0) { mul *= 1 + player.carnage; procCombo("carnage", e.x, e.y); }
  // 직업 자세(진영의 접전 스택 / 영창 단계)는 매 프레임 변하므로 여기서 곱한다
  mul *= player.dynDmg;

  const crit = Math.random() < ((s ? s.crit : .1) + player.dynCrit);
  const final = dmg * mul * (crit ? player.dynCritMul : 1);
  e.hp -= final;
  e.flash = .12;
  Game.dmgDealt += final;

  // 조합: 흡혈 전환
  if (C && C.has("leech") && player.leechBudget > 0) {
    const heal = Math.min(player.leechBudget, final * .015);
    player.leechBudget -= heal;
    player.hp = Math.min(s.maxHp, player.hp + heal);
    procCombo("leech", player.x, player.y);
  }

  const col = crit ? "#ffd34d" : (ELEMENTS[elem] ? ELEMENTS[elem].color : "#ffffff");
  spawnNumber(e.x, e.y - e.r, Math.round(final), col, crit ? 19 : 14);
  if (knock) {
    const a = Math.atan2(e.y - fromY, e.x - fromX);
    e.kx += Math.cos(a) * knock; e.ky += Math.sin(a) * knock;
  }
  // 전직: 처형 — 체력이 바닥난 적을 즉시 끝낸다
  const exe = advVal("execute", 0);
  if (exe > 0 && !e.boss && e.hp > 0 && e.hp < e.maxHp * (exe + .04 * traitLv("reap"))) {
    spawnNumber(e.x, e.y - e.r - 14, "처형!", "#e0426a", 20);
    e.hp = 0;
  }
  // 전직: 중독 — 모든 공격이 지속 피해를 남긴다
  if (advVal("poison", false)) {
    e.burn = Math.max(e.burn, 3);
    e.burnDps = Math.max(e.burnDps, dmg * .3);
  }
  // 전직: 파괴자 — 타격이 확률적으로 터진다
  const sh = advVal("shatterHit", 0);
  if (sh > 0 && Math.random() < sh + .08 * traitLv("demolish"))
    spawnWave({ x: e.x, y: e.y, maxR: 90 * player.stats.area, dmg: final * .6,
      life: .26, color: "#c94a2a", element: "fire" });
  if (e.hp <= 0) killEnemy(e, elem);
  else spawnParticles(e.x, e.y, 2, e.type.color, 90, .3, 2.5);
}

function killEnemy(e, elem) {
  const wasSlowed = e.slow > 0;
  e.active = false;
  Game.kills++;
  player.onKill(e);
  // 전직: 피의 갈증 — 처치할 때마다 회복
  if (traitLv("bloodlust"))
    player.hp = Math.min(player.stats.maxHp, player.hp + player.stats.maxHp * .006 * traitLv("bloodlust"));

  const C = player.combos;
  if (C) {
    // 폭발 연쇄 — 화염 + 뇌전
    if (C.has("blast") && Math.random() < .28 * (1 + .3 * traitLv("prism"))) {
      spawnWave({ x: e.x, y: e.y, maxR: 100 * player.stats.area, dmg: e.maxHp * .35 + 20,
                  life: .3, color: "#ff8a3c", element: "fire" });
      procCombo("blast", e.x, e.y);
      Sfx.throttled("blast", 90, () => Sfx.play(120, .18, "sawtooth", .5, -60));
    }
    // 감전 폭풍 — 뇌전 + 냉기 (둔화된 적이 죽을 때)
    if (C.has("surge") && wasSlowed) {
      const near = nearestEnemies(e.x, e.y, 220, 2);
      for (const o of near) { spawnBolt(o.x, o.y); damageEnemy(o, 30 + e.maxHp * .25, e.x, e.y, 40, "storm"); }
      if (near.length) procCombo("surge", e.x, e.y);
    }
  }
  spawnParticles(e.x, e.y, e.boss ? 40 : 8, e.type.color, e.boss ? 320 : 150, .6, e.boss ? 6 : 3.5);
  spawnGem(e.x, e.y, e.type.xp);
  if (e.boss) {
    cam.shake = 16; Sfx.boss();
    spawnPickup(e.x, e.y, "vacuum");
    spawnPickup(e.x + 40, e.y, "heart");
  } else if (Math.random() < .012) {
    spawnPickup(e.x, e.y, Math.random() < .75 ? "heart" : "vacuum");
  }
  Sfx.hit();
}

  dynCrit: 0, dynCritMul: 2, dynProjSpeed: 1, dynHoming: 0, dynBurnAmp: 1,
  stillTime: 0, bulwark: 0, press: 0, channel: 0, meltTimer: 0, blocked: 0,
  carnage: 0, carnageTimer: 0, leechBudget: 0,
  dash: 0, dashX: 1, dashY: 0, dashDmg: 0, dashHit: new Set(),
};

/* ---------- 직업 자원 · 능동 스킬 ----------
   순수 오토배틀에 '언제 쓰느냐'의 판단을 하나 추가한다.
   자원이 차는 방식이 직업마다 달라서 플레이 리듬 자체가 갈린다. */
const RES_MAX = 100;

player.onKill = function (e) {
  const R = player.cls && player.cls.resource;
  if (R && R.onKill) player.res = clamp(player.res + R.onKill * advVal("rageGain", 1) * (e.boss ? 10 : 1), 0, RES_MAX);
  if (player.combos.has("carnage")) {
    player.carnage = Math.min(.35, player.carnage + .014);
    player.carnageTimer = 3.5;
  }
};

player.onHurt = function () {
  const R = player.cls && player.cls.resource;
  player.noHit = 0;
  if (!R) return;
  if (R.onHurt) player.res = clamp(player.res + R.onHurt, 0, RES_MAX);
  if (R.resetOnHurt) player.res = 0;
};

function updateResource(dt) {
  const R = player.cls && player.cls.resource;
  if (!R) return;
  player.noHit += dt;
  let d = 0;
  if (R.perSec) d += R.perSec;
  if (R.decay) d -= R.decay;
  if (R.noHitPerSec && player.noHit > 1.6) d += R.noHitPerSec;
  if (d) player.res = clamp(player.res + d * dt, 0, RES_MAX);
}

function useSkill() {
  const C = player.cls;
  if (!C || Game.state !== "playing") return;
  if (player.res < curSkill().cost) {
    Sfx.throttled("nores", 260, () => Sfx.play(130, .09, "square", .3, -40));
    return;
  }
  player.res -= curSkill().cost;
  curSkill().use(player);
}

/* ---------- 속성 조합 판정 ---------- */
/* 조합이 실제로 몇 번 터졌는지 세고, 터질 때 화면에 띄운다.
   "조합이 열렸다"만 알려주고 끝내면 플레이어는 그게 일하고 있는지 알 수 없다. */
const comboProcs = {};
function procCombo(key, x, y) {
  let e = comboProcs[key];
  if (!e) e = comboProcs[key] = { count: 0, flash: 0 };
  e.count++; e.flash = .9;
  if (x !== undefined && Math.random() < .22) {
    const c = COMBOS.find(c => c.key === key);
    if (c) spawnNumber(x, y - 34, c.icon + " " + c.name, "#ffd9a0", 15);
  }
}
function resetCombos() { for (const k in comboProcs) delete comboProcs[k]; }

/* 이 속성을 들이면 어떤 조합이 열리는지 — 레벨업 카드에서 미리 보여준다 */
function combosIfAdded(elem) {
  const els = new Set();
  for (const w of player.weapons) els.add(WEAPONS[w.key].element);
  if (els.has(elem)) return [];
  const out = [];
  for (const c of COMBOS) {
    if (player.combos.has(c.key)) continue;
    if ((c.a === elem && els.has(c.b)) || (c.b === elem && els.has(c.a))) out.push(c);
  }
  return out;
}
/* 무기 하나만 더 있으면 열리는 조합 — HUD 힌트용 */
function combosOneAway() {
  const els = new Set();
  for (const w of player.weapons) els.add(WEAPONS[w.key].element);
  const out = [];
  for (const c of COMBOS) {
    if (player.combos.has(c.key)) continue;
    if (els.has(c.a) && !els.has(c.b)) out.push({ c, need: c.b });
    else if (els.has(c.b) && !els.has(c.a)) out.push({ c, need: c.a });
  }
  return out;
}

function recomputeCombos() {
  const els = new Set();
  for (const w of player.weapons) els.add(WEAPONS[w.key].element);
  const before = player.combos.size;
  player.combos = new Set();
  for (const c of COMBOS) if (els.has(c.a) && els.has(c.b)) player.combos.add(c.key);
  if (player.combos.size > before) {
    Game.comboFlash = 2.6;
    Sfx.play(660, .3, "triangle", .9, 500);
  }
}

function recomputeStats() {
  const s = {
    damage: 1, cooldown: 1, area: 1, speed: 1, armor: 1, projSpeed: 1,
    maxHp: player.base.maxHp, regen: 0, magnet: 1, xpGain: 1, crit: .10,
  };
  // 직업 보정을 먼저 적용하고, 그 위에 패시브를 곱한다
  const C = player.cls;
  if (C) {
    const m = C.mods;
    if (m.maxHp)    s.maxHp += m.maxHp;
    if (m.speed)    s.speed *= 1 + m.speed;
    if (m.damage)   s.damage *= 1 + m.damage;
    if (m.area)     s.area *= 1 + m.area;
    if (m.cooldown) s.cooldown *= 1 + m.cooldown;
    if (m.armor)    s.armor *= 1 - m.armor;
    if (m.regen)    s.regen += m.regen;
    if (m.crit)     s.crit += m.crit;
    if (m.xpGain)   s.xpGain *= 1 + m.xpGain;
  }
  // 전직 보정 — 직업 보정과 같은 방식으로 누적된다
  for (const a of player.advance) {
    const m = a.mods || {};
    if (m.maxHp)    s.maxHp += m.maxHp;
    if (m.speed)    s.speed *= 1 + m.speed;
    if (m.damage)   s.damage *= 1 + m.damage;
    if (m.area)     s.area *= 1 + m.area;
    if (m.cooldown) s.cooldown *= 1 + m.cooldown;
    if (m.armor)    s.armor *= 1 - m.armor;
    if (m.regen)    s.regen += m.regen;
    if (m.crit)     s.crit += m.crit;
    if (m.xpGain)   s.xpGain *= 1 + m.xpGain;
  }
  for (const p of player.passives) PASSIVES[p.key].apply(s, p.level);
  // 제단(영구 강화)은 마지막에 곱한다
  s.maxHp  *= 1 + .08 * Meta.lv("vigor");
  s.damage *= 1 + .05 * Meta.lv("edge");
  s.speed  *= 1 + .04 * Meta.lv("swift");
  s.xpGain *= 1 + .06 * Meta.lv("avarice");
  player.stats = s;
  player.hp = Math.min(player.hp, s.maxHp);
}

function addWeapon(key) {
  const w = player.weapons.find(w => w.key === key);
  if (w) { w.level++; return; }
  player.weapons.push({ key, level: 1, timer: 0, angle: 0, fx: 0 });
  recomputeCombos();
}
function addTrait(key) {
  const t = player.traits.find(t => t.key === key);
  if (t) t.level++;
  else player.traits.push({ key, level: 1 });
}

/* 자세가 없는 직업(전사·추적자)과, 자세 밖에서 도는 전직 효과를 여기서 처리한다.
   매 프레임 dyn* 배수에 곱해지고, 프레임마다 초기화되므로 상태가 남지 않는다. */
function applyAdvanceEffects(p, dt, moving) {
  const s = p.stats;

  // 광전사 계열 — 피가 마를수록 빨라지고 세진다
  if (advVal("lowHpFury", false)) {
    const f = 1 - clamp(p.hp / s.maxHp, 0, 1);
    const amp = advVal("furyAmp", 1) * (1 + .25 * traitLv("warcry"));
    p.dynDmg *= 1 + .85 * f * amp;
    p.dynCd *= 1 - .38 * f;
  }
  // 검투사 계열 — 포위될수록 단단해진다
  const ca = advVal("crowdArmor", 0);
  if (ca) {
    const per = ca + traitLv("champion") * .008;
    p.dynArmor *= 1 - Math.min(.72, per * p.press);
    const cr = advVal("crowdRegen", 0);
    if (cr) p.hp = Math.min(s.maxHp, p.hp + s.maxHp * cr * p.press * dt);
  }
  if (traitLv("showman")) p.dynDmg *= 1 + .015 * traitLv("showman") * p.press;

  // 마검사 계열 — 곁의 적에게 추가 피해
  const mb = advVal("meleeBonus", 0);
  if (mb > 0 && p.press > 0)
    p.dynDmg *= 1 + (mb + .25 * traitLv("bladeDance")) * Math.min(1, p.press / 6);

  // 암살자 계열 — 집중이 찰수록 치명타
  if (advVal("focusCrit", false))
    p.dynCrit += (p.res / RES_MAX) * .35 * advVal("focusAmp", 1);
  if (traitLv("manaEdge")) p.dynCrit += .04 * traitLv("manaEdge") * Math.floor(p.channel);
  if (traitLv("shadowstep")) p.dynDmg *= 1 + .08 * traitLv("shadowstep") * Math.min(4, p.noHit / 5);
  if (traitLv("onehit")) p.dynCritMul = 2 + .4 * traitLv("onehit");

  // 사냥꾼 계열 — 발사체 강화
  const pb = advVal("projBoost", 0);
  if (pb) p.dynProjSpeed *= 1 + pb;
  p.dynPierce += advVal("pierceBonus", 0);
  if (advVal("allHoming", false)) p.dynHoming = 6.5;

  // 화상·중독 증폭
  p.dynBurnAmp = 1 + .45 * traitLv("pyreLord") + .5 * traitLv("virulence");
}

function applyAdvance(a) {
  player.advance.push(a);
  recomputeStats();
  player.hp = Math.min(player.stats.maxHp, player.hp + (a.mods && a.mods.maxHp > 0 ? a.mods.maxHp : 0));
  if (a.grant) addWeapon(a.grant);
  Game.advanceFlash = 3.2;
  cam.shake = 18;
  spawnParticles(player.x, player.y, 60, a.color, 400, 1.2, 6);
  spawnWave({ x: player.x, y: player.y, maxR: 360, dmg: 0, life: .7, color: a.color, element: "holy" });
  player.iframe = Math.max(player.iframe, 1.5);
  [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => Sfx.play(f, .18, "triangle", .9), i * 80));
}

function addPassive(key) {
  const p = player.passives.find(p => p.key === key);
  if (p) p.level++;
  else player.passives.push({ key, level: 1 });
  const before = player.stats.maxHp;
  recomputeStats();
  if (key === "vitality") player.hp = Math.min(player.stats.maxHp, player.hp + (player.stats.maxHp - before));
}

/* ---------- 게임 상태 ---------- */
const Game = {
  state: "title",        // title | playing | levelup | paused | dead | won
  time: 0, kills: 0, dmgDealt: 0,
  spawnAcc: 0, bossIdx: 0,
  choices: [], hover: -1, comboFlash: 0,
  usedRebirth: false, soulsEarned: 0, houndWarn: 0, traitPick: false, advanceFlash: 0,
  bestTime: Number(localStorage.getItem("ts_best") || 0),

  // 판이 끝나면 영혼을 정산한다 (다음 판의 시작 지점이 올라간다)
  endRun() {
    saveBest();
    this.soulsEarned = Math.floor(this.kills / 8) + Math.floor(this.time / 10) + (this.state === "won" ? 150 : 0);
    Meta.souls += this.soulsEarned;
    Meta.save();
  },

  reset() {
    for (const pool of [enemies, projectiles, slashes, waves, gems, pickups, particles, numbers, bolts])
      for (const o of pool) o.active = false;
    this.time = 0; this.kills = 0; this.dmgDealt = 0; this.spawnAcc = 0; this.bossIdx = 0;
    player.x = 0; player.y = 0; player.level = 1; player.xp = 0; player.xpNext = 5;
    player.iframe = 0; player.hurtFlash = 0; player.faceX = 1; player.faceY = 0;
    player.weapons.length = 0; player.passives.length = 0;
    player.res = clamp(25 * Meta.lv("zeal"), 0, RES_MAX);
    player.noHit = 0; player.combos = new Set();
    player.carnage = 0; player.carnageTimer = 0; player.leechBudget = 0;
    player.dash = 0; player.dashHit.clear();
    player.traits.length = 0; player.advance.length = 0; this.advanceFlash = 0;
    player.stillTime = 0; player.bulwark = 0; player.press = 0;
    player.channel = 0; player.meltTimer = 0;
    player.dynDmg = 1; player.dynCd = 1; player.dynArmor = 1;
    player.dynPierce = 0; player.dynSpeed = 1; player.dynMagnet = 1;
    this.comboFlash = 0; resetCombos(); this.usedRebirth = false; this.soulsEarned = 0; this.houndWarn = 0;
    player.cls = CLASSES[selectedClass];
    recomputeStats();
    player.hp = player.stats.maxHp;
    addWeapon(player.cls.start);
    cam.x = player.x - W / 2; cam.y = player.y - H / 2; cam.shake = 0;
    this.state = "playing";
  },

  onKey(k) {
    if (k === "m") { Sfx.on = !Sfx.on; return; }
    if (this.state === "title") {
      if (k === "tab") { this.state = "altar"; return; }
      const i = "1234".indexOf(k);
      if (i >= 0 && CLASSES[i]) { selectedClass = i; return this.reset(); }
      if (k === " " || k === "enter") return this.reset();
      return;
    }
    if (this.state === "altar") {
      if (k === "tab" || k === "escape") { this.state = "title"; return; }
      const i = "123456".indexOf(k);
      if (i >= 0 && ALTAR[i]) {
        if (Meta.buy(ALTAR[i].key)) Sfx.play(880, .14, "triangle", .8, 300);
        else Sfx.play(150, .1, "square", .35, -40);
      }
      return;
    }
    if ((this.state === "dead" || this.state === "won") && (k === " " || k === "enter" || k === "r")) return this.reset();
    if (this.state === "playing" && (k === " " || k === "shift")) { useSkill(); return; }
    if (this.state === "playing" && (k === "escape" || k === "p")) { this.state = "paused"; return; }
    if (this.state === "paused" && (k === "escape" || k === "p")) { this.state = "playing"; return; }
    if (this.state === "levelup" || this.state === "advance") {
      const i = "123".indexOf(k);
      if (i >= 0 && this.choices[i]) this.applyChoice(this.choices[i]);
    }
  },

  /* --- 레벨업 --- */
  levelUp() {
    player.level++;
    player.xp -= player.xpNext;
    // 15분에 레벨 70 이 나오면 무기·패시브가 전부 최대치가 되어 아무것도 플레이어에게 닿지 못한다.
    // 곡선을 세워 한 판의 상한을 40대 초반으로 낮춘다 — 무엇을 포기할지 고르게 만드는 게 핵심이다.
    player.xpNext = Math.floor(5 + (player.level - 1) * 5.5 + Math.pow(player.level, 2) * .55);
    player.hp = Math.min(player.stats.maxHp, player.hp + 3);
    // 전직 관문 — 여기서만은 무기·특성이 아니라 '앞으로 무엇이 될지'를 고른다
    for (const [lv, tier] of [[ADV_LV1, 1], [ADV_LV2, 2]]) {
      if (player.level >= lv && player.advance.length < tier) {
        const opts = advanceOptions(tier);
        if (opts.length) {
          this.choices = opts;
          this.state = "advance";
          this.hover = -1;
          Sfx.levelup();
          return;
        }
      }
    }
    this.choices = this.rollChoices();
    this.state = "levelup";
    this.hover = -1;
    Sfx.levelup();
    spawnParticles(player.x, player.y, 24, "#ffe37a", 220, .8, 4);
  },

  rollChoices() {
    // 직업 전용 특성을 일반 카드와 같은 슬롯에서 경쟁시키면, 특성이 있는 직업만
    // 무기 강화를 덜 받아 화력이 뒤처진다(측정으로 확인). 그래서 트랙을 분리한다 —
    // 3레벨마다 한 번은 특성만 나오는 판이고, 나머지는 무기·능력만 나온다.
    const list = traitList();
    const traitPool = [];
    for (const t of list) {
      const lv = traitLv(t.key);
      if (lv < t.max) traitPool.push({ type: "trait", key: t.key, level: lv + 1, isNew: lv === 0 });
    }
    const take = arr => arr.length ? arr.splice(Math.floor(rnd(arr.length)), 1)[0] : null;

    if (player.level % 3 === 0 && traitPool.length) {
      this.traitPick = true;
      const out = [];
      while (out.length < 3 && traitPool.length) out.push(take(traitPool));
      while (out.length < 3) out.push({ type: "heal" });
      return out;
    }
    this.traitPick = false;

    const weaponPool = [], passivePool = [];
    for (const key in WEAPONS) {
      const owned = player.weapons.find(w => w.key === key);
      if (owned) { if (owned.level < MAX_LEVEL) weaponPool.push({ type: "weapon", key, level: owned.level + 1 }); }
      else if (player.weapons.length < MAX_WEAPONS) weaponPool.push({ type: "weapon", key, level: 1, isNew: true });
    }
    for (const key in PASSIVES) {
      const owned = player.passives.find(p => p.key === key);
      if (owned) { if (owned.level < MAX_LEVEL) passivePool.push({ type: "passive", key, level: owned.level + 1 }); }
      else if (player.passives.length < MAX_PASSIVES) passivePool.push({ type: "passive", key, level: 1, isNew: true });
    }

    const out = [];
    // 화력이 고사하지 않도록 무기를 최소 1개 보장
    if (weaponPool.length) out.push(take(weaponPool));
    const rest = weaponPool.concat(passivePool);
    while (out.length < 3 && rest.length) {
      const c = take(rest);
      if (c && !out.includes(c)) out.push(c);
    }
    while (out.length < 3) out.push({ type: "heal" });
    return out;
  },

  applyChoice(c) {
    if (c.tier) { applyAdvance(c); this.state = "playing"; if (player.xp >= player.xpNext) this.levelUp(); return; }
    if (c.type === "weapon") addWeapon(c.key);
    else if (c.type === "passive") addPassive(c.key);
    else if (c.type === "trait") addTrait(c.key);
    else player.hp = Math.min(player.stats.maxHp, player.hp + 40);
    this.state = "playing";
    // 레벨업 직후 경험치가 또 넘쳐 있으면 연속 레벨업
    if (player.xp >= player.xpNext) this.levelUp();
  },

  /* --- 적 스폰 --- */
  currentTypes() {
    let types = SPAWN_TABLE[0].types;
    for (const row of SPAWN_TABLE) if (this.time >= row.t) types = row.types;
    return types;
  },
  difficulty() {
    const m = this.time / 60;
    return { hp: 1 + m * .7 + Math.pow(m, 2.55) * .031, spd: 1 + m * .04, dmg: 1 + m * .3 };
  },
  targetCount() {
    return Math.min(440, Math.floor(30 + this.time / 60 * 28));
  },

  spawnEnemy(typeKey, forceX, forceY) {
    const e = alloc(enemies); if (!e) return null;
    const T = ENEMY_TYPES[typeKey], d = this.difficulty();
    let x, y;
    if (forceX !== undefined) { x = forceX; y = forceY; }
    else {
      // 화면 바깥 링에서 스폰 (플레이어가 보는 곳에서 튀어나오지 않게)
      const a = rnd(TAU), rad = rnd(760, 900);
      x = player.x + Math.cos(a) * rad;
      y = player.y + Math.sin(a) * rad;
    }
    e.active = true; e.id = enemyIdSeq++;
    e.x = x; e.y = y; e.vx = 0; e.vy = 0; e.kx = 0; e.ky = 0;
    e.type = T; e.r = T.r; e.boss = !!T.boss;
    e.maxHp = e.hp = T.hp * (e.boss ? Math.max(1, d.hp * .7) : d.hp);
    e.spd = T.speed * d.spd * rnd(.92, 1.08);
    e.dmg = T.dmg * d.dmg;
    e.flash = 0; e.wob = rnd(TAU); e.slow = 0; e.burn = 0; e.burnDps = 0;
    return e;
  },

  updateSpawning(dt) {
    // 보스 웨이브
    while (this.bossIdx < BOSS_TIMES.length && this.time >= BOSS_TIMES[this.bossIdx]) {
      this.bossIdx++;
      const b = this.spawnEnemy("boss");
      // 1번째 보스는 배수 없음, 이후 보스만 강해진다 (5분 구간의 난이도 스파이크 완화)
      if (b) { b.maxHp = b.hp = b.hp * (1 + (this.bossIdx - 1) * .6); cam.shake = 12; Sfx.boss(); }
      for (let i = 0; i < 8 + this.bossIdx * 6; i++) this.spawnEnemy(pick(this.currentTypes()));
    }

    let alive = 0;
    for (const e of enemies) if (e.active) alive++;
    const want = this.targetCount();
    if (alive < want) {
      this.spawnAcc += dt * (8 + this.time / 60 * 6);
      while (this.spawnAcc >= 1 && alive < want) {
        this.spawnAcc -= 1; alive++;
        this.spawnEnemy(pick(this.currentTypes()));
      }
    } else this.spawnAcc = 0;

    // 7분 이후 45초마다 사냥개 무리 — 플레이어보다 빨라서 계속 도망만 칠 수 없다
    const ht = Math.floor(this.time), pht = Math.floor(this.time - dt);
    if (ht !== pht && this.time >= 240 && ht % 32 === 0) {
      const a = rnd(TAU), n = 8 + Math.floor((this.time - 240) / 55);
      for (let i = 0; i < n; i++) {
        const aa = a + rnd(-.7, .7), rad = rnd(820, 980);
        this.spawnEnemy("hound", player.x + Math.cos(aa) * rad, player.y + Math.sin(aa) * rad);
      }
      this.houndWarn = 2.4;
      Sfx.play(240, .5, "sawtooth", .7, -120);
    }


    // 30초마다 소규모 러시 (한쪽 방향에서 몰려옴)
    const t = Math.floor(this.time), pt = Math.floor(this.time - dt);
    if (t !== pt && t > 0 && t % 24 === 0) {
      const a = rnd(TAU);
      for (let i = 0; i < 18 + t / 14; i++) {
        const aa = a + rnd(-.5, .5), rad = rnd(780, 950);
        this.spawnEnemy(pick(this.currentTypes()), player.x + Math.cos(aa) * rad, player.y + Math.sin(aa) * rad);
      }
    }
  },
};

/* ---------- 업데이트 ---------- */
function update(dt) {
  if (Game.state !== "playing") return;

  Game.time += dt;
  if (Game.time >= RUN_TIME) { Game.state = "won"; Game.endRun(); return; }
  Game.updateSpawning(dt);

  const s = player.stats;

  /* 1. 플레이어 이동 · 자원 */
  const mv = inputVector();
  if (mv.x || mv.y) { player.faceX = mv.x; player.faceY = mv.y; player.walk += dt * 10; }
  if (player.dash > 0) {
    // 돌진 중에는 입력을 무시하고 고정 방향으로 밀려난다
    player.dash -= dt;
    player.x += player.dashX * 940 * dt;
    player.y += player.dashY * 940 * dt;
    spawnParticles(player.x, player.y, 1, "#ff8a5c", 60, .3, 3);
  } else {
    player.x += mv.x * player.base.speed * s.speed * player.dynSpeed * dt;
    player.y += mv.y * player.base.speed * s.speed * player.dynSpeed * dt;
  }
  // 정지 지속 시간 — 기사의 방벽과 마법사의 영창이 모두 여기에 걸린다
  const moving = !!(mv.x || mv.y) || player.dash > 0;
  player.stillTime = moving ? 0 : player.stillTime + dt;
  player.iframe = Math.max(0, player.iframe - dt);
  player.hurtFlash = Math.max(0, player.hurtFlash - dt);
  if (s.regen) player.hp = Math.min(s.maxHp, player.hp + s.regen * dt);
  updateResource(dt);
  // 흡혈은 초당 상한을 둬서 무한 회복이 되지 않게 한다
  player.leechBudget = Math.min(s.maxHp * .05, player.leechBudget + s.maxHp * .05 * dt);
  if (player.carnageTimer > 0) player.carnageTimer -= dt;
  else if (player.carnage > 0) player.carnage = Math.max(0, player.carnage - dt * .12);


  /* 2. 공간 해시 재구축 */
  hash.clear();
  for (const e of enemies) if (e.active) hash.insert(e);

  /* 2-b. 직업 자세 · 전직 효과 — 매 프레임 다시 계산되는 배수 */
  player.dynDmg = 1; player.dynCd = 1; player.dynArmor = 1;
  player.dynPierce = 0; player.dynSpeed = 1; player.dynMagnet = 1;
  player.dynCrit = 0; player.dynCritMul = 2; player.dynProjSpeed = 1;
  player.dynHoming = 0; player.dynBurnAmp = 1;
  // 곁에 붙은 적 수는 여러 직업·전직이 함께 쓰므로 공용으로 한 번만 센다
  {
    const R = 155 * s.area;
    const found = hash.query(player.x, player.y, R, scratch3);
    let n = 0;
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (e.active && dist2(e.x, e.y, player.x, player.y) < R * R) n++;
    }
    player.press = Math.min(14, n);
  }
  if (player.cls && player.cls.stance) player.cls.stance.update(player, dt, moving);
  if (player.advance.length) applyAdvanceEffects(player, dt, moving);

  /* 3. 무기 */
  for (const w of player.weapons) {
    const def = WEAPONS[w.key];
    if (def.passiveUpdate) { def.passiveUpdate(player, w, dt); continue; }
    if (w.fx > 0) w.fx -= dt;
    w.timer -= dt;
    if (w.timer <= 0) {
      w.timer += Math.max(.06, def.cd[w.level - 1] * s.cooldown * player.dynCd);
      def.fire(player, w);
    }
  }

  /* 4. 발사체 */
  for (const p of projectiles) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; continue; }
    if (p.homing) {
      p.retarget -= dt;
      if ((!p.target || !p.target.active) && p.retarget <= 0) {
        p.retarget = .2;                     // 재탐색은 초당 5회로 제한
        p.target = nearestEnemies(p.x, p.y, 800, 1)[0] || null;
      }
      if (p.target) {
        const want = Math.atan2(p.target.y - p.y, p.target.x - p.x);
        const cur = Math.atan2(p.vy, p.vx);
        let diff = ((want - cur + Math.PI * 3) % TAU) - Math.PI;
        const na = cur + clamp(diff, -p.homing * dt, p.homing * dt);
        const sp = Math.hypot(p.vx, p.vy);
        p.vx = Math.cos(na) * sp; p.vy = Math.sin(na) * sp;
        p.angle = na;
      }
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === "dagger") p.angle = Math.atan2(p.vy, p.vx);
    else p.angle += p.spin * dt;

    const found = hash.query(p.x, p.y, p.r + 26, scratch);
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (!e.active || p.hitIds.has(e.id)) continue;
      const rr = p.r + e.r;
      if (dist2(p.x, p.y, e.x, e.y) < rr * rr) {
        p.hitIds.add(e.id);
        damageEnemy(e, p.dmg, p.x, p.y, p.kind === "flame" ? 40 : 150, p.element);
        spawnParticles(p.x, p.y, 3, p.color, 130, .25, 2.5);
        if (--p.pierce <= 0) { p.active = false; break; }
      }
    }
  }

  /* 5. 채찍 참격 */
  for (const sl of slashes) {
    if (!sl.active) continue;
    sl.life -= dt;
    if (sl.life <= 0) { sl.active = false; continue; }
    sl.x = player.x; sl.y = player.y;
    const cx = sl.x + Math.cos(sl.ang) * sl.len * .5;
    const cy = sl.y + Math.sin(sl.ang) * sl.len * .5;
    const found = hash.query(cx, cy, sl.len * .6, scratch);
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (!e.active || sl.hitIds.has(e.id)) continue;
      // 부채꼴 판정: 거리 + 각도
      const dx = e.x - sl.x, dy = e.y - sl.y;
      const d = Math.hypot(dx, dy);
      if (d > sl.len + e.r) continue;
      let da = Math.abs(((Math.atan2(dy, dx) - sl.ang + Math.PI * 3) % TAU) - Math.PI);
      if (da < .62) {
        sl.hitIds.add(e.id);
        damageEnemy(e, sl.dmg, sl.x, sl.y, 260, sl.element);
      }
    }
  }

  /* 5-b. 파동 (피의 낫 · 스킬 · 폭발 연쇄) */
  for (const wv of waves) {
    if (!wv.active) continue;
    wv.life -= dt;
    if (wv.life <= 0) { wv.active = false; continue; }
    const t = 1 - wv.life / wv.maxLife;
    wv.r = wv.maxR * Math.sqrt(t);          // 처음엔 빠르게, 끝에선 천천히 퍼진다
    const found = hash.query(wv.x, wv.y, wv.r + 30, scratch);
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (!e.active || wv.hitIds.has(e.id)) continue;
      const rr = wv.r + e.r;
      if (dist2(e.x, e.y, wv.x, wv.y) < rr * rr) {
        wv.hitIds.add(e.id);
        damageEnemy(e, wv.dmg, wv.x, wv.y, 200, wv.element);
        if (wv.heal) player.hp = Math.min(s.maxHp, player.hp + wv.heal);
      }
    }
  }

  /* 5-c. 돌진 충돌 */
  if (player.dash > 0) {
    const found = hash.query(player.x, player.y, 46, scratch);
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (!e.active || player.dashHit.has(e.id)) continue;
      const rr = 34 + e.r;
      if (dist2(e.x, e.y, player.x, player.y) < rr * rr) {
        player.dashHit.add(e.id);
        damageEnemy(e, player.dashDmg * (1 + .4 * traitLv("charge")), player.x, player.y, 420, "physical");
      }
    }
  }

  /* 6. 적 */
  const sepR = 26;
  for (const e of enemies) {
    if (!e.active) continue;
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;

    // 너무 멀어지면 반대편 링으로 재배치 (스폰 비용 절약)
    if (d > 1500) {
      const a = rnd(TAU), rad = rnd(760, 880);
      e.x = player.x + Math.cos(a) * rad; e.y = player.y + Math.sin(a) * rad;
      continue;
    }

    e.wob += dt * 6;
    if (e.slow > 0) e.slow -= dt;
    if (e.burn > 0) {
      e.burn -= dt;
      e.hp -= e.burnDps * (player.dynBurnAmp || 1) * dt;
      if (Math.random() < dt * 7) spawnParticles(e.x, e.y, 1, "#ff8a3c", 70, .3, 2);
      if (e.hp <= 0) { killEnemy(e, "fire"); continue; }
    }
    const spd = e.slow > 0 ? e.spd * SLOW_MUL : e.spd;
    let vx = dx / d * spd, vy = dy / d * spd;

    // 서로 겹치지 않도록 밀어내기
    const near = hash.query(e.x, e.y, sepR + e.r, scratch2);
    for (let i = 0; i < near.length; i++) {
      const o = near[i];
      if (o === e || !o.active) continue;
      const ox = e.x - o.x, oy = e.y - o.y;
      const od2 = ox * ox + oy * oy;
      const min = (e.r + o.r) * .85;
      if (od2 < min * min && od2 > .01) {
        const od = Math.sqrt(od2), push = (min - od) / min * 90;
        vx += ox / od * push; vy += oy / od * push;
      }
    }

    e.x += (vx + e.kx) * dt; e.y += (vy + e.ky) * dt;
    e.kx *= .86; e.ky *= .86;
    if (e.flash > 0) e.flash -= dt;

  }

  /* 6-b. 접촉 피해 — 몇 마리에게 둘러싸였는지가 피해량을 정한다.
     무적 시간만 두면 1마리든 300마리든 위험이 같아져, 이 장르의 핵심 위협이 사라진다. */
  if (player.iframe <= 0 && player.dash <= 0) {
    const touch = hash.query(player.x, player.y, player.r + 46, scratch);
    let count = 0, worst = 0;
    for (let i = 0; i < touch.length; i++) {
      const e = touch[i];
      if (!e.active) continue;
      const rr = e.r + player.r;
      if (dist2(e.x, e.y, player.x, player.y) < rr * rr) { count++; if (e.dmg > worst) worst = e.dmg; }
    }
    if (count > 0) {
      const crowd = Math.min(4.2, 1 + .34 * (count - 1));
      const raw = worst * crowd * player.stats.armor;
      const reduced = raw * player.dynArmor;      // 방벽 등 자세로 줄인 값
      // 한 대에 풀피가 날아가면 플레이어는 대응할 기회 없이 억울하게 죽는다.
      // 최대 체력의 45% 로 상한을 둬서, 풀피에서는 항상 최소 두 대를 버틴다.
      const dmg = Math.min(reduced, player.stats.maxHp * .45);
      const blocked = raw - reduced;
      player.hp -= dmg;
      player.iframe = .6; player.hurtFlash = .35;
      player.onHurt();
      // 전직: 룬나이트 — 맞으면 룬이 터진다
      if (advVal("runeBurst", false))
        spawnWave({ x: player.x, y: player.y, maxR: 220 * player.stats.area,
          dmg: (40 + player.level * 6) * player.stats.damage * (1 + .5 * traitLv("runeGuard")),
          life: .35, color: "#9fb8ff", element: "frost" });
      cam.shake = Math.min(16, 4 + dmg * .22);
      spawnNumber(player.x, player.y - 22, "-" + Math.round(dmg) + (count > 2 ? " ×" + count : ""), "#ff6b6b", 17);
      Sfx.hurt();
      if (blocked > 0 && player.cls && player.cls.stance && player.cls.stance.onBlocked)
        player.cls.stance.onBlocked(player, blocked);
      if (player.hp <= 0) { onPlayerDown(); if (Game.state === "dead") return; }
    }
  }

  /* 7. 경험치 보석 */
  const magnetR = 92 * s.magnet * player.dynMagnet;
  for (const g of gems) {
    if (!g.active) continue;
    g.bob += dt * 5;
    const d2 = dist2(g.x, g.y, player.x, player.y);
    if (g.pulled || d2 < magnetR * magnetR) {
      g.pulled = true;
      const a = Math.atan2(player.y - g.y, player.x - g.x);
      const sp = 260 + 700 / (Math.sqrt(d2) + 40) * 40;
      g.vx = lerp(g.vx, Math.cos(a) * sp, .25);
      g.vy = lerp(g.vy, Math.sin(a) * sp, .25);
    } else { g.vx *= .9; g.vy *= .9; }
    g.x += g.vx * dt; g.y += g.vy * dt;
    if (d2 < 400) {
      g.active = false;
      player.xp += g.value * s.xpGain;
      Sfx.pickup();
      if (player.xp >= player.xpNext) { Game.levelUp(); return; }
    }
  }

  /* 8. 아이템 */
  for (const pk of pickups) {
    if (!pk.active) continue;
    pk.bob += dt * 4;
    if (dist2(pk.x, pk.y, player.x, player.y) < 900) {
      pk.active = false;
      if (pk.kind === "heart") {
        const heal = Math.round(s.maxHp * .3);
        player.hp = Math.min(s.maxHp, player.hp + heal);
        spawnNumber(player.x, player.y - 26, "+" + heal, "#5fe08a", 18);
      } else {
        for (const g of gems) if (g.active) g.pulled = true;      // 화면의 모든 보석을 끌어옴
        spawnNumber(player.x, player.y - 26, "영혼 흡수!", "#9be7ff", 18);
      }
      Sfx.play(1046, .12, "sine", .8, 400);
    }
  }

  /* 9. 이펙트 */
  for (const p of particles) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= p.drag; p.vy *= p.drag;
  }
  for (const n of numbers) {
    if (!n.active) continue;
    n.life -= dt;
    if (n.life <= 0) { n.active = false; continue; }
    n.y += n.vy * dt; n.vy *= .93;
  }
  for (const b of bolts) {
    if (!b.active) continue;
    b.life -= dt;
    if (b.life <= 0) b.active = false;
  }

  /* 10. 카메라 */
  cam.x = lerp(cam.x, player.x - W / 2, .16);
  cam.y = lerp(cam.y, player.y - H / 2, .16);
  cam.shake *= .88;
  player.sx = player.x - cam.x; player.sy = player.y - cam.y;
}

// 제단의 '부활'을 한 번 쓰거나, 없으면 게임 오버
function onPlayerDown() {
  if (Meta.lv("rebirth") > 0 && !Game.usedRebirth) {
    Game.usedRebirth = true;
    player.hp = player.stats.maxHp * .5;
    player.iframe = 3;
    spawnWave({ x: player.x, y: player.y, maxR: 420, dmg: 400, life: .6, color: "#ffe9b8", element: "holy" });
    cam.shake = 20;
    spawnNumber(player.x, player.y - 40, "부활!", "#ffd34d", 26);
    Sfx.levelup();
    return;
  }
  player.hp = 0;
  Game.state = "dead";
  Game.endRun();
  Sfx.dead();
}

function saveBest() {
  if (Game.time > Game.bestTime) {
    Game.bestTime = Game.time;
    try { localStorage.setItem("ts_best", String(Math.floor(Game.time))); } catch (e) { /* 저장 불가여도 무시 */ }
  }
}

/* ---------- 렌더 ---------- */
const FONT = '"Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif';

function drawBackground() {
  ctx.fillStyle = "#12121f";
  ctx.fillRect(0, 0, W, H);
  const T = 80;
  const x0 = Math.floor(cam.x / T) - 1, x1 = Math.floor((cam.x + W) / T) + 1;
  const y0 = Math.floor(cam.y / T) - 1, y1 = Math.floor((cam.y + H) / T) + 1;
  for (let tx = x0; tx <= x1; tx++) for (let ty = y0; ty <= y1; ty++) {
    const h = hash2(tx, ty);
    const sx = tx * T - cam.x, sy = ty * T - cam.y;
    ctx.fillStyle = (tx + ty) % 2 === 0 ? "#15152400" : "#1a1a2b40";
    ctx.fillRect(sx, sy, T, T);
    if (h > .93) {          // 묘비
      ctx.fillStyle = "#2b2b3d";
      const gx = sx + h * 40, gy = sy + hash2(ty, tx) * 40;
      ctx.fillRect(gx, gy, 14, 20);
      ctx.beginPath(); ctx.arc(gx + 7, gy, 7, Math.PI, 0); ctx.fill();
    } else if (h > .86) {   // 풀
      ctx.strokeStyle = "#1f2a1f"; ctx.lineWidth = 2;
      const gx = sx + h * 60, gy = sy + hash2(ty * 3, tx) * 60;
      ctx.beginPath();
      ctx.moveTo(gx, gy); ctx.lineTo(gx - 4, gy - 9);
      ctx.moveTo(gx, gy); ctx.lineTo(gx + 4, gy - 8);
      ctx.stroke();
    }
  }
  ctx.strokeStyle = "rgba(255,255,255,.025)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let tx = x0; tx <= x1; tx++) { const sx = Math.floor(tx * T - cam.x) + .5; ctx.moveTo(sx, 0); ctx.lineTo(sx, H); }
  for (let ty = y0; ty <= y1; ty++) { const sy = Math.floor(ty * T - cam.y) + .5; ctx.moveTo(0, sy); ctx.lineTo(W, sy); }
  ctx.stroke();
}

const GEM_COLOR = ["#4fd1ff", "#7cff8f", "#ffd34d"], GEM_R = [4.5, 6, 8];

function drawShadow(sx, sy, r) {
  ctx.fillStyle = "rgba(0,0,0,.28)";
  ctx.beginPath(); ctx.ellipse(sx, sy + r * .85, r * .8, r * .32, 0, 0, TAU); ctx.fill();
}

function drawEnemy(e) {
  const sx = e.x - cam.x, sy = e.y - cam.y;
  if (sx < -70 || sx > W + 70 || sy < -70 || sy > H + 70) return;
  const T = e.type, bob = Math.sin(e.wob) * (T.shape === "ghost" ? 4 : 2);
  // 아틀라스가 로드돼 있으면 스프라이트로, 아니면 아래 도형 렌더링으로 폴백
  if (Sprites.draw(T.sprite, sx, sy + bob, e.r / 14, e.wob * .16, e.x > player.x)) {
    if (e.boss || e.maxHp > 300) drawEnemyHpBar(e, sx, sy);
    return;
  }
  if (e.burn > 0) {
    ctx.save();
    ctx.globalAlpha = .35 + Math.sin(e.wob * 3) * .12;
    ctx.fillStyle = "#ff7a1c";
    ctx.beginPath(); ctx.arc(sx, sy + bob, e.r * 1.35, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(sx, sy + bob);
  // 좌우 비대칭 실루엣은 진행 방향을 향하게 뒤집는다
  if (T.shape === "hound" && e.x > player.x) ctx.scale(-1, 1);
  // 둔화된 적은 푸르게 얼어붙는다
  const col = e.flash > 0 ? "#ffffff" : (e.slow > 0 ? "#9fd6f5" : T.color);
  ctx.fillStyle = col;

  if (T.shape === "bat") {
    const flap = Math.sin(e.wob * 2) * .5;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.quadraticCurveTo(-e.r * 1.6, -e.r * (1 + flap), -e.r * 2.1, e.r * .2);
    ctx.quadraticCurveTo(-e.r * 1.2, e.r * .1, 0, e.r * .5);
    ctx.quadraticCurveTo(e.r * 1.2, e.r * .1, e.r * 2.1, e.r * .2);
    ctx.quadraticCurveTo(e.r * 1.6, -e.r * (1 + flap), 0, 0);
    ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, e.r * .62, 0, TAU); ctx.fill();
  } else if (T.shape === "blob") {
    const sq = 1 + Math.sin(e.wob) * .12;
    ctx.beginPath(); ctx.ellipse(0, e.r * .1, e.r * sq, e.r / sq, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.22)";
    ctx.beginPath(); ctx.ellipse(-e.r * .3, -e.r * .35, e.r * .28, e.r * .18, -.5, 0, TAU); ctx.fill();
  } else if (T.shape === "ghost") {
    ctx.globalAlpha = .88;
    ctx.beginPath();
    ctx.arc(0, 0, e.r, Math.PI, 0);
    const n = 4;
    for (let i = 0; i <= n; i++) {
      const x = e.r - (2 * e.r) * (i / n);
      ctx.lineTo(x, e.r * (i % 2 ? .55 : 1.05));
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (T.shape === "hound") {
    const run = Math.sin(e.wob * 2) * e.r * .35;
    ctx.beginPath();                       // 몸통
    ctx.ellipse(0, 0, e.r * 1.15, e.r * .62, 0, 0, TAU); ctx.fill();
    ctx.beginPath();                       // 머리
    ctx.arc(e.r * .95, -e.r * .28, e.r * .5, 0, TAU); ctx.fill();
    ctx.beginPath();                       // 주둥이
    ctx.moveTo(e.r * 1.25, -e.r * .35); ctx.lineTo(e.r * 1.85, -e.r * .1);
    ctx.lineTo(e.r * 1.2, e.r * .12); ctx.closePath(); ctx.fill();
    ctx.beginPath();                       // 귀
    ctx.moveTo(e.r * .78, -e.r * .68); ctx.lineTo(e.r * .95, -e.r * 1.25);
    ctx.lineTo(e.r * 1.15, -e.r * .6); ctx.closePath(); ctx.fill();
    for (const lx of [-e.r * .6, e.r * .5]) {   // 다리
      ctx.fillRect(lx, e.r * .3, e.r * .28, e.r * .7 + run);
      ctx.fillRect(lx + e.r * .2, e.r * .3, e.r * .24, e.r * .7 - run);
    }
    ctx.beginPath();                       // 꼬리
    ctx.moveTo(-e.r * 1.1, -e.r * .1); ctx.lineTo(-e.r * 1.8, -e.r * .7 + run);
    ctx.lineTo(-e.r * 1.5, -e.r * .05); ctx.closePath(); ctx.fill();
  } else if (T.shape === "boss") {
    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, e.r + 6 + Math.sin(e.wob) * 3, 0, TAU); ctx.stroke();
    ctx.fillStyle = e.flash > 0 ? "#fff" : "#2a0a12";
    for (const s of [-1, 1]) {   // 뿔
      ctx.beginPath();
      ctx.moveTo(s * e.r * .55, -e.r * .7);
      ctx.lineTo(s * e.r * 1.05, -e.r * 1.5);
      ctx.lineTo(s * e.r * .25, -e.r * .95);
      ctx.closePath(); ctx.fill();
    }
  } else { // humanoid
    ctx.fillRect(-e.r * .62, -e.r * .2, e.r * 1.24, e.r * 1.2);
    ctx.beginPath(); ctx.arc(0, -e.r * .55, e.r * .58, 0, TAU); ctx.fill();
    ctx.fillStyle = col;
    const sw = Math.sin(e.wob) * e.r * .3;
    ctx.fillRect(-e.r * .95, -e.r * .1 + sw, e.r * .35, e.r * .7);
    ctx.fillRect(e.r * .6, -e.r * .1 - sw, e.r * .35, e.r * .7);
  }

  // 눈
  if (T.shape !== "bat" || true) {
    ctx.fillStyle = e.flash > 0 ? "#000" : "#20102a";
    const ey = T.shape === "humanoid" ? -e.r * .6 : -e.r * .15;
    ctx.beginPath(); ctx.arc(-e.r * .28, ey, e.r * .13, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(e.r * .28, ey, e.r * .13, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // 보스/정예 체력바
  if (e.boss || e.maxHp > 300) drawEnemyHpBar(e, sx, sy);
}

function drawEnemyHpBar(e, sx, sy) {
  const bw = e.r * 2.4, hpf = clamp(e.hp / e.maxHp, 0, 1);
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(sx - bw / 2, sy - e.r - 16, bw, 6);
  ctx.fillStyle = "#ff4d6d"; ctx.fillRect(sx - bw / 2, sy - e.r - 16, bw * hpf, 6);
}

function drawPlayer() {
  const sx = player.sx, sy = player.sy;
  drawShadow(sx, sy, player.r);
  const blink = player.iframe > 0 && Math.floor(player.iframe * 20) % 2 === 0;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.globalAlpha = blink ? .45 : 1;
  const bob = Math.sin(player.walk) * 2;
  // 망토
  ctx.fillStyle = "#c9243f";
  ctx.beginPath();
  ctx.moveTo(-10, -6 + bob); ctx.quadraticCurveTo(-16, 10 + bob, -6, 14 + bob);
  ctx.lineTo(6, 14 + bob); ctx.quadraticCurveTo(16, 10 + bob, 10, -6 + bob);
  ctx.closePath(); ctx.fill();
  // 몸
  ctx.fillStyle = player.hurtFlash > 0 ? "#ffb4b4" : "#e8e5da";
  ctx.fillRect(-8, -6 + bob, 16, 15);
  ctx.fillStyle = "#c9243f";
  ctx.fillRect(-1.6, -6 + bob, 3.2, 15);
  ctx.fillRect(-8, -1 + bob, 16, 3);
  // 머리
  ctx.fillStyle = player.hurtFlash > 0 ? "#fff" : "#f0d5b0";
  ctx.beginPath(); ctx.arc(0, -13 + bob, 7.5, 0, TAU); ctx.fill();
  ctx.fillStyle = "#3a2a1e";
  ctx.beginPath(); ctx.arc(0, -15 + bob, 7.5, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#2b1c14";
  const fx = clamp(player.faceX, -1, 1) * 2;
  ctx.beginPath(); ctx.arc(-2.6 + fx, -12.5 + bob, 1.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(2.6 + fx, -12.5 + bob, 1.2, 0, TAU); ctx.fill();
  ctx.restore();
}

/* 자세를 눈에 보이게 만든다 — 규칙이 아무리 좋아도 화면에서 안 보이면 없는 것이다 */
function drawStanceWorld() {
  const C = player.cls;
  if (!C || Game.state === "title" || Game.state === "altar") return;
  const sx = player.sx, sy = player.sy;

  if (C.key === "paladin") {
    const need = .6 - .15 * traitLv("bulwark");
    const charge = clamp(player.stillTime / need, 0, 1);
    const R = 40;
    // 충전 중: 테두리가 시계처럼 차오른다
    if (player.bulwark < 1 && charge > .02) {
      ctx.save();
      ctx.strokeStyle = "rgba(255,211,110,.55)"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(sx, sy, R, -Math.PI / 2, -Math.PI / 2 + TAU * charge);
      ctx.stroke();
      ctx.restore();
    }
    // 전개 완료: 육각 방벽
    if (player.bulwark > 0) {
      const a = player.bulwark, rr = R + 6 * a;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const ang = i / 6 * TAU - Math.PI / 2;
        const px = sx + Math.cos(ang) * rr, py = sy + Math.sin(ang) * rr;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = "rgba(255,211,110,.10)"; ctx.fill();
      ctx.strokeStyle = "rgba(255,225,150,.85)"; ctx.lineWidth = 2.5; ctx.stroke();
      // 접전 스택이 쌓일수록 테두리가 두꺼워진다
      if (player.press > 0) {
        ctx.globalAlpha = a * Math.min(1, player.press / 14) * .8;
        ctx.strokeStyle = "#ff9f6b"; ctx.lineWidth = 2 + player.press * .35;
        ctx.stroke();
      }
      ctx.restore();
    }
  } else if (C.key === "mage") {
    const st = Math.floor(player.channel), frac = player.channel - st;
    const maxStage = 3 + traitLv("deepMana");
    for (let i = 0; i < st; i++) {
      const r = 30 + i * 12;
      ctx.save();
      ctx.globalAlpha = .75;
      ctx.strokeStyle = i >= 3 ? "#e0b0ff" : "#9bb8ff";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      // 회전하는 룬 고리 — 단계가 오를수록 고리가 늘어난다
      const seg = 6 + i * 2, spin = Game.time * (i % 2 ? -1.1 : 1.4) + i;
      for (let k = 0; k < seg; k++) {
        const a0 = spin + k / seg * TAU, a1 = a0 + TAU / seg * .55;
        ctx.moveTo(sx + Math.cos(a0) * r, sy + Math.sin(a0) * r);
        ctx.arc(sx, sy, r, a0, a1);
      }
      ctx.stroke();
      ctx.restore();
    }
    // 다음 단계까지의 진행
    if (st < maxStage && frac > .02) {
      ctx.save();
      ctx.globalAlpha = .5;
      ctx.strokeStyle = "#9bb8ff"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, sy, 30 + st * 12, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
      ctx.stroke();
      ctx.restore();
    }
    if (st >= maxStage) {
      ctx.save();
      ctx.globalAlpha = .18 + Math.sin(Game.time * 6) * .06;
      ctx.fillStyle = "#bcd0ff";
      ctx.beginPath(); ctx.arc(sx, sy, 30 + maxStage * 12, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
}

function drawWorld() {
  // 보석 — 화면에 수백 개가 깔리므로 티어별로 한 패스에 몰아 그린다
  for (let tier = 0; tier < 3; tier++) {
    const col = GEM_COLOR[tier], br = GEM_R[tier];
    let any = false;
    ctx.beginPath();
    for (const g of gems) {
      if (!g.active || g.tier !== tier) continue;
      const sx = g.x - cam.x, sy = g.y - cam.y;
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
      const r = (br + Math.sin(g.bob) * .6) * 1.9;
      ctx.moveTo(sx + r, sy);
      ctx.arc(sx, sy, r, 0, TAU);
      any = true;
    }
    if (!any) continue;
    ctx.globalAlpha = .2; ctx.fillStyle = col; ctx.fill();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    for (const g of gems) {
      if (!g.active || g.tier !== tier) continue;
      const sx = g.x - cam.x, sy = g.y - cam.y;
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
      const r = br + Math.sin(g.bob) * .6;
      ctx.moveTo(sx, sy - r);
      ctx.lineTo(sx + r * .75, sy);
      ctx.lineTo(sx, sy + r);
      ctx.lineTo(sx - r * .75, sy);
      ctx.closePath();
    }
    ctx.fillStyle = col; ctx.fill();
  }
  // 아이템
  for (const pk of pickups) {
    if (!pk.active) continue;
    const sx = pk.x - cam.x, sy = pk.y - cam.y + Math.sin(pk.bob) * 3;
    ctx.save();
    ctx.globalAlpha = .3; ctx.fillStyle = pk.kind === "heart" ? "#ff5b7a" : "#7fd2ff";
    ctx.beginPath(); ctx.arc(sx, sy, 22, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = "26px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(pk.kind === "heart" ? "🍗" : "🧲", sx, sy);
    ctx.restore();
  }

  // 그림자는 색이 같으므로 한 번의 패스로 모아 그린다 (적 360마리 × fill 을 1회로)
  ctx.fillStyle = "rgba(0,0,0,.28)";
  ctx.beginPath();
  for (const e of enemies) {
    if (!e.active) continue;
    const sx = e.x - cam.x, sy = e.y - cam.y;
    if (sx < -70 || sx > W + 70 || sy < -70 || sy > H + 70) continue;
    const rx = e.r * .8, ry = e.r * .32, cy = sy + e.r * .85;
    ctx.moveTo(sx + rx, cy);
    ctx.ellipse(sx, cy, rx, ry, 0, 0, TAU);
  }
  ctx.fill();

  for (const e of enemies) if (e.active) drawEnemy(e);

  // 지속형 무기(오라)는 플레이어 아래에 깔린다
  for (const w of player.weapons) {
    const def = WEAPONS[w.key];
    if (def.draw && w.key === "aura") def.draw(player, w);
  }

  drawStanceWorld();
  drawPlayer();

  for (const w of player.weapons) {
    const def = WEAPONS[w.key];
    if (def.draw && w.key !== "aura") def.draw(player, w);
  }

  // 참격
  for (const sl of slashes) {
    if (!sl.active) continue;
    const t = 1 - sl.life / sl.maxLife;
    const sx = sl.x - cam.x, sy = sl.y - cam.y;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(sl.ang);
    ctx.globalAlpha = (1 - t) * .85;
    const grad = ctx.createLinearGradient(0, 0, sl.len, 0);
    grad.addColorStop(0, "rgba(255,255,255,0)");
    grad.addColorStop(.6, "rgba(255,240,200,.9)");
    grad.addColorStop(1, "rgba(255,180,90,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, sl.len * (.5 + t * .6), -.62, .62);
    ctx.arc(0, 0, sl.len * (.15 + t * .3), .62, -.62, true);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 파동
  for (const wv of waves) {
    if (!wv.active) continue;
    const t = 1 - wv.life / wv.maxLife;
    const sx = wv.x - cam.x, sy = wv.y - cam.y;
    ctx.save();
    ctx.globalAlpha = (1 - t) * .85;
    ctx.strokeStyle = wv.color; ctx.lineWidth = 5 + (1 - t) * 8;
    ctx.shadowColor = wv.color; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(sx, sy, wv.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = (1 - t) * .16;
    ctx.fillStyle = wv.color;
    ctx.beginPath(); ctx.arc(sx, sy, wv.r, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // 발사체
  for (const p of projectiles) {
    if (!p.active) continue;
    const sx = p.x - cam.x, sy = p.y - cam.y;
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(p.angle);
    if (p.kind === "flame") {
      const t = clamp(p.life / p.maxLife, 0, 1);
      ctx.globalAlpha = t * .3;
      ctx.fillStyle = "#ff7a1c";
      ctx.beginPath(); ctx.arc(0, 0, p.r * 1.8, 0, TAU); ctx.fill();
      ctx.globalAlpha = t * .9;
      ctx.fillStyle = "#ff9a3c";
      ctx.beginPath(); ctx.arc(0, 0, p.r * (1.25 - t * .35), 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffe08a";
      ctx.beginPath(); ctx.arc(0, 0, p.r * .45 * t, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.kind === "dagger") {
      ctx.fillStyle = "#cfd6e6";
      ctx.beginPath(); ctx.moveTo(p.r * 1.7, 0); ctx.lineTo(-p.r * .5, -p.r * .45); ctx.lineTo(-p.r * .5, p.r * .45);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#8a6a3a"; ctx.fillRect(-p.r * 1.2, -p.r * .22, p.r * .8, p.r * .44);
      ctx.fillStyle = "#e8c96a"; ctx.fillRect(-p.r * .62, -p.r * .6, p.r * .22, p.r * 1.2);
    } else {
      ctx.globalAlpha = .25; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(0, 0, p.r * 1.8, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.beginPath(); ctx.arc(0, 0, p.r * .45, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // 번개
  for (const b of bolts) {
    if (!b.active) continue;
    const sx = b.x - cam.x, sy = b.y - cam.y;
    ctx.save();
    ctx.globalAlpha = clamp(b.life / .3, 0, 1);
    ctx.strokeStyle = "#cfe9ff"; ctx.lineWidth = 3;
    ctx.shadowColor = "#7fd2ff"; ctx.shadowBlur = 18;
    ctx.beginPath();
    let y = sy - 400, x = sx + (hash2(b.seed | 0, 7) - .5) * 60;
    ctx.moveTo(x, y);
    for (let i = 1; i <= 8; i++) {
      y = sy - 400 + (400 * i / 8);
      x = sx + (hash2((b.seed | 0) + i, i * 13) - .5) * 60 * (1 - i / 8);
      ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = "rgba(180,225,255,.35)";
    ctx.beginPath(); ctx.arc(sx, sy, 34 * (1 - b.life / .3) + 8, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // 파티클
  for (const p of particles) {
    if (!p.active) continue;
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x - cam.x, p.y - cam.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 데미지 숫자
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.75)";
  for (const n of numbers) {
    if (!n.active) continue;
    const nx = n.x - cam.x, ny = n.y - cam.y;
    if (nx < -40 || nx > W + 40 || ny < -30 || ny > H + 30) continue;
    ctx.globalAlpha = clamp(n.life / .7, 0, 1);
    ctx.font = "700 " + n.size + "px " + FONT;
    ctx.strokeText(n.text, nx, ny);
    ctx.fillStyle = n.color;
    ctx.fillText(n.text, nx, ny);
  }
  ctx.globalAlpha = 1;
}

/* ---------- 직업 전용 특성 ----------
   직업이 '가끔 누르는 버튼'이 아니라 '매 순간의 규칙'이 되도록,
   레벨업 카드 풀에 직업 전용 카드를 섞는다.
   수치를 올리는 게 아니라 규칙을 바꾸는 카드만 여기에 둔다. */
const TRAITS = {
  paladin: [
    { key: "bulwark", name: "강철 방벽", icon: "🛡️", max: 3,
      desc: "방벽이 더 빨리 서고, 더 많이 막고, 더 많이 회복한다.",
      detail: l => "전개 " + (.6 - .15 * l).toFixed(2) + "초 · 피해 감소 " + Math.round((.52 + .08 * l) * 100) + "%~ · 초당 회복 " + ((.015 + .005 * l) * 100).toFixed(1) + "%~" },
    { key: "taunt", name: "도발", icon: "📢", max: 2,
      desc: "방벽을 세우면 주변의 적이 끌려온다. 더 둘러싸일수록 강해진다.",
      detail: l => "흡인력 " + l + "단계" },
    { key: "crusade", name: "성전", icon: "✝️", max: 3,
      desc: "곁에 붙은 적 하나마다 피해가 오른다.",
      detail: l => "적 1마리당 피해 +" + (6 + 2.5 * l) + "%" },
    { key: "thorns", name: "가시 갑옷", icon: "🌵", max: 3,
      desc: "방벽으로 막은 피해를 주변의 적에게 되돌린다.",
      detail: l => "반사 " + (40 * l) + "%" },
    { key: "resolve", name: "불굴", icon: "💢", max: 2,
      desc: "체력이 바닥일수록 단단해지고 빨라진다.",
      detail: l => "HP 40% 이하: 피해 -" + (22 * l) + "% · 이동 +" + (14 * l) + "%" },
  ],
  mage: [
    { key: "focus", name: "집중 영창", icon: "🎯", max: 3,
      desc: "영창 단계가 더 빨리 오른다.",
      detail: l => "영창 속도 +" + (30 * l) + "%" },
    { key: "deepMana", name: "심층 마력", icon: "🌌", max: 2,
      desc: "영창을 한 단계 더 쌓을 수 있다.",
      detail: l => "최대 " + (3 + l) + "단계" },
    { key: "residue", name: "잔류 마력", icon: "💫", max: 1,
      desc: "움직여도 1단계는 남는다. 자리를 옮기며 싸울 수 있다.",
      detail: () => "이동 중 1단계 유지" },
    { key: "overload", name: "비전 과부하", icon: "⚡", max: 2,
      desc: "3단계 이상에서 발사체가 적을 더 꿰뚫는다.",
      detail: l => "관통 +" + (2 * l) },
    { key: "meltdown", name: "마력 폭주", icon: "☄️", max: 3,
      desc: "최대 단계를 유지하면 주변이 주기적으로 터진다.",
      detail: l => (1.8 - .3 * l).toFixed(1) + "초마다 폭발" },
  ],
};

function traitLv(key) {
  const t = player.traits.find(t => t.key === key);
  return t ? t.level : 0;
}
// 전직으로 열린 특성까지 합친 목록
function traitList() {
  const out = (player.cls && TRAITS[player.cls.key]) ? TRAITS[player.cls.key].slice() : [];
  for (const a of player.advance) if (a.traits) out.push(...a.traits);
  return out;
}
function traitDefByKey(key) {
  return traitList().find(t => t.key === key);
}
function traitDef(clsKey, key) {   // 이전 호출부 호환
  return traitDefByKey(key);
}

/* ---------- 능동 스킬 빌더 ----------
   전직마다 스킬이 바뀌어야 하는데 24개를 손으로 쓰면 관리가 안 된다.
   형태별로 만들어 쓰고, 수치만 전직 데이터에 둔다. */
function skWave(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    spawnWave({ x: p.x, y: p.y, maxR: o.r * p.stats.area,
      dmg: (o.dmg + p.level * (o.perLv || 10)) * p.stats.damage * p.dynDmg,
      life: o.life || .5, color: o.color, element: o.elem, heal: o.heal || 0 });
    if (o.iframe) p.iframe = Math.max(p.iframe, o.iframe);
    if (o.healPct) p.hp = Math.min(p.stats.maxHp, p.hp + p.stats.maxHp * o.healPct);
    cam.shake = o.shake || 12;
    spawnParticles(p.x, p.y, 34, o.color, 320, .8, 5);
    Sfx.play(o.freq || 320, .45, "triangle", 1, o.slide || 500);
  } };
}

function skBurst(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const targets = nearestEnemies(p.x, p.y, 900, o.n);
    for (let i = 0; i < o.n; i++) {
      const t = targets[i % Math.max(1, targets.length)];
      const a = t ? Math.atan2(t.y - p.y, t.x - p.x) + rnd(-.22, .22)
                  : i / o.n * TAU;
      const sp = (o.speed || 380) * p.stats.projSpeed;
      spawnProjectile({
        x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: (o.r || 11) * p.stats.area,
        dmg: (o.dmg + p.level * (o.perLv || 8)) * p.stats.damage * p.dynDmg,
        pierce: o.pierce || 2, life: o.life || 2.2, kind: o.kind || "orb",
        angle: a, color: o.color, element: o.elem,
        homing: o.homing || 0, target: t || null,
      });
    }
    cam.shake = 8;
    Sfx.play(o.freq || 540, .3, "triangle", .9, 400);
  } };
}

function skStrike(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const pool = nearestEnemies(p.x, p.y, 800, o.n * 2);
    const dmg = (o.dmg + p.level * (o.perLv || 14)) * p.stats.damage * p.dynDmg;
    for (let i = 0; i < o.n; i++) {
      const e = pool[i % Math.max(1, pool.length)];
      if (!e || !e.active) continue;
      spawnBolt(e.x, e.y);
      damageEnemy(e, dmg, e.x, e.y - 60, 0, o.elem);
      spawnWave({ x: e.x, y: e.y, maxR: (o.splash || 90) * p.stats.area,
        dmg: dmg * .5, life: .28, color: o.color, element: o.elem });
    }
    cam.shake = 10;
    Sfx.play(200, .3, "sawtooth", .8, 700);
  } };
}

function skSlash(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const base = Math.atan2(p.faceY, p.faceX);
    const dmg = (o.dmg + p.level * (o.perLv || 12)) * p.stats.damage * p.dynDmg;
    for (let i = 0; i < o.n; i++)
      spawnSlash(p, base + (i - (o.n - 1) / 2) * (o.spread || .55), dmg,
                 o.len * p.stats.area, 1.4, o.elem);
    if (o.iframe) p.iframe = Math.max(p.iframe, o.iframe);
    cam.shake = 10;
    spawnParticles(p.x + p.faceX * 40, p.y + p.faceY * 40, 20, o.color, 260, .5, 4);
    Sfx.play(280, .3, "sawtooth", .8, 260);
  } };
}

function skDash(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    p.dash = o.dur; p.dashX = p.faceX; p.dashY = p.faceY;
    p.dashDmg = (o.dmg + p.level * (o.perLv || 12)) * p.stats.damage * p.dynDmg;
    p.dashHit.clear();
    p.iframe = Math.max(p.iframe, o.dur + .2);
    cam.shake = 8;
    Sfx.play(190, .3, "sawtooth", .85, 320);
  } };
}

function skBlink(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const ox = p.x, oy = p.y;
    p.x += p.faceX * o.dist; p.y += p.faceY * o.dist;
    p.iframe = Math.max(p.iframe, o.iframe || .9);
    const dmg = (o.dmg + p.level * (o.perLv || 8)) * p.stats.damage * p.dynDmg;
    for (const [bx, by] of [[ox, oy], [p.x, p.y]]) {
      spawnParticles(bx, by, 22, o.color, 280, .6, 4);
      for (let i = 0; i < o.n; i++) {
        const a = i / o.n * TAU, sp = 540 * p.stats.projSpeed;
        spawnProjectile({
          x: bx, y: by, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          r: 8 * p.stats.area, dmg, pierce: o.pierce || 2, life: 1.0,
          kind: o.kind || "dagger", angle: a, color: o.color, element: o.elem,
        });
      }
    }
    Sfx.play(760, .2, "sine", .8, -420);
  } };
}

/* ---------- 메타 진행 : 제단 ----------
   판이 끝나도 남는 것이 있어야 다시 시작하게 된다.
   영혼을 모아 영구 강화를 사고, 그 강화가 다음 판의 시작 지점을 올린다. */
const ALTAR = [
  { key: "vigor",   name: "강건함", icon: "🫀", desc: "최대 체력 +8%",       max: 5, cost: l => 60 + l * 70 },
  { key: "edge",    name: "예리함", icon: "🔪", desc: "모든 피해 +5%",       max: 5, cost: l => 80 + l * 95 },
  { key: "swift",   name: "민첩",   icon: "🪶", desc: "이동 속도 +4%",       max: 5, cost: l => 60 + l * 70 },
  { key: "avarice", name: "탐욕",   icon: "💰", desc: "경험치 획득 +6%",     max: 5, cost: l => 70 + l * 80 },
  { key: "zeal",    name: "신념",   icon: "🔔", desc: "직업 자원을 25 채운 채 시작", max: 3, cost: l => 130 + l * 150 },
  { key: "rebirth", name: "부활",   icon: "🕊️", desc: "쓰러질 때 한 번 되살아난다", max: 1, cost: () => 900 },
];

const Meta = {
  souls: 0, levels: {},
  load() {
    try {
      this.souls = Number(localStorage.getItem("ts_souls") || 0) || 0;
      this.levels = JSON.parse(localStorage.getItem("ts_altar") || "{}") || {};
    } catch (e) { this.souls = 0; this.levels = {}; }
  },
  save() {
    try {
      localStorage.setItem("ts_souls", String(this.souls));
      localStorage.setItem("ts_altar", JSON.stringify(this.levels));
    } catch (e) { /* 저장 불가여도 게임은 돈다 */ }
  },
  lv(k) { return this.levels[k] || 0; },
  costOf(u) { return u.cost(this.lv(u.key)); },
  buy(k) {
    const u = ALTAR.find(a => a.key === k);
    if (!u) return false;
    const l = this.lv(k);
    if (l >= u.max) return false;
    const c = this.costOf(u);
    if (this.souls < c) return false;
    this.souls -= c;
    this.levels[k] = l + 1;
    this.save();
    return true;
  },
};
Meta.load();

      use(p) {
        const targets = nearestEnemies(p.x, p.y, 900, 14);
        const n = Math.max(10, targets.length);
        for (let i = 0; i < n; i++) {
          const t = targets[i % Math.max(1, targets.length)];
          const a = t ? Math.atan2(t.y - p.y, t.x - p.x) + rnd(-.2, .2) : rnd(TAU);
          const sp = 330 * p.stats.projSpeed;
          spawnProjectile({
            x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            r: 12 * p.stats.area, dmg: 75 * p.stats.damage + p.level * 10,
            pierce: 2, life: 2.2, kind: "orb", angle: a,
            color: "#bcd0ff", element: "frost", homing: 8, target: t || null,
          });
        }
        cam.shake = 8;
        Sfx.play(540, .35, "triangle", .9, 420);
      },
    },
  },
