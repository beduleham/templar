    const spd = (e.slow > 0 ? e.spd * SLOW_MUL : e.spd) * (e.hasteT > 0 ? 1.45 : 1);
    let vx = dx / d * spd, vy = dy / d * spd;

    // 서로 겹치지 않도록 밀어내기
    const near = hash.query(e.x, e.y, sepR + e.r, scratch2);
    for (let i = 0; i < near.length; i++) {
      const o = near[i];
      if (o === e || !o.active) continue;
      const ox = e.x - o.x, oy = e.y - o.y;
      const od2 = ox * ox + oy * oy;
      const min = (e.r + o.r) * .85;
      if (od2 < min * min && od2 > .01) {
        const od = Math.sqrt(od2), push = (min - od) / min * 90;
        vx += ox / od * push; vy += oy / od * push;
      }
    }

    e.x += (vx + e.kx) * dt; e.y += (vy + e.ky) * dt;
    if (obstacles.length) pushOutOfObstacles(e, e.r);
    e.kx *= .86; e.ky *= .86;
    if (e.flash > 0) e.flash -= dt;

  }

  /* 6-b. 접촉 피해 — 몇 마리에게 둘러싸였는지가 피해량을 정한다.
     무적 시간만 두면 1마리든 300마리든 위험이 같아져, 이 장르의 핵심 위협이 사라진다. */
  if (player.iframe <= 0 && player.dash <= 0) {
    const touch = hash.query(player.x, player.y, player.r + 46, scratch);
    let count = 0, worst = 0;
    for (let i = 0; i < touch.length; i++) {
      const e = touch[i];
      if (!e.active) continue;
      const rr = e.r + player.r;
      if (dist2(e.x, e.y, player.x, player.y) < rr * rr) { count++; if (e.dmg > worst) worst = e.dmg; }
    }
    if (count > 0) {
      // 포위 위협은 90초에 걸쳐 서서히 켠다. 시작 직후엔 무기 레벨이 0이라
      // 4.2배를 그대로 받으면 체력이 낮은 직업이 20초 안에 죽는다.
      const ramp = Math.min(1, Game.time / 90);
      const crowd = Math.min(4.2, 1 + .34 * (count - 1) * ramp);
      hurtPlayer(worst * crowd, count > 2 ? " ×" + count : "");
      if (Game.state === "dead") return;
    }
  }

  /* 6-c. 적이 쏜 탄 */
  for (const p of eshots) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; continue; }
    // 서리 장막 — 영창 2단계부터 날아오는 탄도 얼어붙는다.
    // 사수는 430px 밖에서 쏘는데 영창의 냉기는 160px 까지밖에 안 닿는다.
    // 즉 마법사의 유일한 방어 수단이 자기 천적에게는 원리상 닿지 않았다.
    // 계측하면 마법사가 받는 피해의 대부분이 적 탄이었다 — 멈춰 있는 자세를 벌하는 게
    // 설계 의도지만, 대응할 방법이 아예 없으면 그건 벌이 아니라 사고다.
    let veil = 1;
    if (player.frostVeil > 0 && dist2(p.x, p.y, player.x, player.y) < player.frostVeil * player.frostVeil)
      veil = .45;
    p.x += p.vx * veil * dt; p.y += p.vy * veil * dt;
    // 적 탄도 지형을 지킨다 — 기둥 뒤로 숨는 것이 대응 수단이 된다
    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      if (!ob.K.stop && !ob.K.reflect) continue;
      const rr = 6 + ob.r;
      if (dist2(p.x, p.y, ob.x, ob.y) >= rr * rr) continue;
      if (ob.K.reflect) {                     // 수정에 튕긴 적 탄은 적을 때린다
        const L = Math.hypot(p.x - ob.x, p.y - ob.y) || 1;
        const nx = (p.x - ob.x) / L, ny = (p.y - ob.y) / L;
        const dot = p.vx * nx + p.vy * ny;
        if (dot < 0) {
          p.vx -= 2 * dot * nx; p.vy -= 2 * dot * ny;
          p.x = ob.x + nx * (rr + 1); p.y = ob.y + ny * (rr + 1);
          spawnParticles(p.x, p.y, 3, "#bfefff", 140, .3, 3);
        }
      } else { p.active = false; }
      break;
    }
    if (!p.active) continue;
    const rr = p.r + player.r;
    if (dist2(p.x, p.y, player.x, player.y) < rr * rr) {
      p.active = false;
      hurtPlayer(p.dmg);
      spawnParticles(p.x, p.y, 6, p.color, 140, .3, 3);
      if (Game.state === "dead") return;
    }
  }

  /* 6-d. 바닥 장판 */
  for (const h of hazards) {
    if (!h.active) continue;
    h.life -= dt;
    if (h.life <= 0) { h.active = false; continue; }
    h.tick -= dt;
    if (h.tick <= 0 && dist2(h.x, h.y, player.x, player.y) < (h.r + player.r) * (h.r + player.r)) {
      h.tick = .5;
      hurtPlayer(h.dmg);
      if (Game.state === "dead") return;
    }
  }

  /* 7. 경험치 보석 */
  const magnetR = 92 * s.magnet * player.dynMagnet;
  for (const g of gems) {
    if (!g.active) continue;
    g.bob += dt * 5;
    const d2 = dist2(g.x, g.y, player.x, player.y);
    if (g.pulled || d2 < magnetR * magnetR) {
      g.pulled = true;
      const a = Math.atan2(player.y - g.y, player.x - g.x);
      const sp = 260 + 700 / (Math.sqrt(d2) + 40) * 40;
      g.vx = lerp(g.vx, Math.cos(a) * sp, .25);
      g.vy = lerp(g.vy, Math.sin(a) * sp, .25);
    } else { g.vx *= .9; g.vy *= .9; }
    g.x += g.vx * dt; g.y += g.vy * dt;
    if (d2 < 400) {
      g.active = false;
      player.xp += g.value * s.xpGain * XP_RATE;
      Sfx.pickup();
      if (player.xp >= player.xpNext) { Game.levelUp(); return; }
    }
  }

  /* 8. 아이템 */
  for (const pk of pickups) {
    if (!pk.active) continue;
    pk.bob += dt * 4;
    if (dist2(pk.x, pk.y, player.x, player.y) < 900) {
      pk.active = false;
      if (pk.kind === "heart") {
        const heal = Math.round(s.maxHp * .3);
        player.hp = Math.min(s.maxHp, player.hp + heal);
        spawnNumber(player.x, player.y - 26, "+" + heal, "#5fe08a", 18);
      } else if (pk.kind === "vacuum") {
        for (const g of gems) if (g.active) g.pulled = true;      // 화면의 모든 보석을 끌어옴
        spawnNumber(player.x, player.y - 26, "영혼 흡수!", "#9be7ff", 18);
      } else if (pk.kind === "sigil") {
        player.sigils++;
        spawnNumber(player.x, player.y - 30, "🔯 전직의 징표!", "#ffd34d", 21);
        Game.lmFlash = 3; Game.lmFlashText = "전직의 징표를 얻었다 (" + player.sigils + "개)";
        Game.checkAdvance();
      } else if (pk.kind.startsWith("item:")) {
        const key = pk.kind.slice(5), C = CONSUMABLES[key];
        if (player.items.length < MAX_ITEMS) {
          player.items.push(key);
          spawnNumber(player.x, player.y - 26, C.icon + " " + C.name, C.color, 17);
        } else {
          // 소지품이 가득 차 있으면 그 자리에서 쓴다 — 주웠는데 사라지면 억울하다
          C.use(player);
          spawnNumber(player.x, player.y - 26, C.icon + " 즉시 사용", C.color, 17);
        }
      }
      Sfx.play(1046, .12, "sine", .8, 400);
    }
  }

  /* 9. 이펙트 */
  for (const p of particles) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= p.drag; p.vy *= p.drag;
  }
  for (const n of numbers) {
    if (!n.active) continue;
    n.life -= dt;
    if (n.life <= 0) { n.active = false; continue; }
    n.y += n.vy * dt; n.vy *= .93;
  }
  for (const b of bolts) {
    if (!b.active) continue;
    b.life -= dt;
    if (b.life <= 0) b.active = false;
  }

  /* 10. 카메라 */
  cam.x = lerp(cam.x, player.x - W / 2, .16);
  cam.y = lerp(cam.y, player.y - H / 2, .16);
  cam.shake *= .88;
  player.sx = player.x - cam.x; player.sy = player.y - cam.y;
}

/* 접촉·적 탄·장판이 모두 같은 규칙을 통과하도록 한 곳에 모은다.
   raw 는 방어력 적용 전 값. */
function hurtPlayer(raw, tag) {
  if (player.iframe > 0 || player.dash > 0 || Game.state !== "playing") return;
  const base = raw * player.stats.armor;
  const reduced = base * player.dynArmor;      // 방벽 등 자세로 줄인 값
  // 한 대에 풀피가 날아가면 대응할 기회 없이 억울하게 죽는다.
  // 최대 체력의 28% 로 상한을 둬서 풀피에서 최소 네 대를 버틴다.
  // 45% 로 뒀더니 체력 80 인 추적자만 파수꾼 접촉 두 대(=60)에 무너졌다.
  // 위협은 '한 대'가 아니라 '계속 맞는 것'에서 나와야 한다.
  let dmg = Math.min(reduced, player.stats.maxHp * .28);
  const blocked = base - reduced;
  // 3차 각성의 방패 — 한 대를 통째로 무시한다
  if (player.shieldOn > 0) {
    player.shieldOn = 0;
    dmg = 0;
    spawnNumber(player.x, player.y - 30, "방어!", "#8fd0ff", 20);
    spawnWave({ x: player.x, y: player.y, maxR: 220, dmg: 0, life: .3, color: "#8fd0ff", element: "frost" });
  }
  player.hp -= dmg;
  player.iframe = .6; player.hurtFlash = .35;
  player.onHurt();
  if (advVal("runeBurst", false))
    spawnWave({ x: player.x, y: player.y, maxR: 220 * player.stats.area,
      dmg: (40 + player.level * 6) * player.stats.damage * (1 + .5 * traitLv("runeGuard")),
      life: .35, color: "#9fb8ff", element: "frost" });
  cam.shake = Math.min(16, 4 + dmg * .22);
  spawnNumber(player.x, player.y - 22, "-" + Math.round(dmg) + (tag || ""), "#ff6b6b", 17);
  Sfx.hurt();
  if (blocked > 0 && player.cls && player.cls.stance && player.cls.stance.onBlocked)
    player.cls.stance.onBlocked(player, blocked);
  if (player.hp <= 0) onPlayerDown();
}

// 제단의 '부활'을 한 번 쓰거나, 없으면 게임 오버
function onPlayerDown() {
  Music.setMode("menu");
  if (Meta.lv("rebirth") > 0 && !Game.usedRebirth) {
    Game.usedRebirth = true;
    player.hp = player.stats.maxHp * .5;
    player.iframe = 3;
    spawnWave({ x: player.x, y: player.y, maxR: 420, dmg: 400, life: .6, color: "#ffe9b8", element: "holy" });
    cam.shake = 20;
    spawnNumber(player.x, player.y - 40, "부활!", "#ffd34d", 26);
    Sfx.levelup();
    return;
  }
  player.hp = 0;
  Game.state = "dead";
  Game.endRun();
  Sfx.dead();
}

function saveBest() {
  if (Game.time > Game.bestTime) {
    Game.bestTime = Game.time;
    try { localStorage.setItem("ts_best", String(Math.floor(Game.time))); } catch (e) { /* 저장 불가여도 무시 */ }
  }
}

/* ---------- 렌더 ---------- */
const FONT = '"Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif';

function drawBackground() {
  ctx.fillStyle = "#12121f";
  ctx.fillRect(0, 0, W, H);
  const T = 80;
  const x0 = Math.floor(cam.x / T) - 1, x1 = Math.floor((cam.x + W) / T) + 1;
  const y0 = Math.floor(cam.y / T) - 1, y1 = Math.floor((cam.y + H) / T) + 1;
  for (let tx = x0; tx <= x1; tx++) for (let ty = y0; ty <= y1; ty++) {
    const h = hash2(tx, ty);
    const sx = tx * T - cam.x, sy = ty * T - cam.y;
    ctx.fillStyle = (tx + ty) % 2 === 0 ? "#15152400" : "#1a1a2b40";
    ctx.fillRect(sx, sy, T, T);
    if (h > .965) {         // 묘비
      ctx.fillStyle = "#2b2b3d";
      const gx = sx + h * 40, gy = sy + hash2(ty, tx) * 40;
      ctx.fillRect(gx, gy, 14, 20);
      ctx.beginPath(); ctx.arc(gx + 7, gy, 7, Math.PI, 0); ctx.fill();
    } else if (h > .915) {  // 풀
      ctx.strokeStyle = "#1f2a1f"; ctx.lineWidth = 2;
      const gx = sx + h * 60, gy = sy + hash2(ty * 3, tx) * 60;
      ctx.beginPath();
      ctx.moveTo(gx, gy); ctx.lineTo(gx - 4, gy - 9);
      ctx.moveTo(gx, gy); ctx.lineTo(gx + 4, gy - 8);
      ctx.stroke();
    }
  }
  ctx.strokeStyle = "rgba(255,255,255,.025)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let tx = x0; tx <= x1; tx++) { const sx = Math.floor(tx * T - cam.x) + .5; ctx.moveTo(sx, 0); ctx.lineTo(sx, H); }
  for (let ty = y0; ty <= y1; ty++) { const sy = Math.floor(ty * T - cam.y) + .5; ctx.moveTo(0, sy); ctx.lineTo(W, sy); }
  ctx.stroke();
}

const GEM_COLOR = ["#4fd1ff", "#7cff8f", "#ffd34d"], GEM_R = [4.5, 6, 8];

function drawShadow(sx, sy, r) {
  ctx.fillStyle = "rgba(0,0,0,.28)";
  ctx.beginPath(); ctx.ellipse(sx, sy + r * .85, r * .8, r * .32, 0, 0, TAU); ctx.fill();
}

function drawEnemy(e) {
  const sx = e.x - cam.x, sy = e.y - cam.y;
  if (sx < -70 || sx > W + 70 || sy < -70 || sy > H + 70) return;
  const T = e.type, bob = Math.sin(e.wob) * (T.shape === "ghost" ? 4 : 2);
  // 아틀라스가 로드돼 있으면 스프라이트로, 아니면 아래 도형 렌더링으로 폴백
  if (Sprites.draw(T.sprite, sx, sy + bob, e.r / 14, e.wob * .16, e.x > player.x)) {
    if (e.boss || e.sigilKey || (e.rank && e.rank.ring)) drawEnemyHpBar(e, sx, sy);
    return;
  }
  if (e.burn > 0) {
    ctx.save();
    ctx.globalAlpha = .35 + Math.sin(e.wob * 3) * .12;
    ctx.fillStyle = "#ff7a1c";
    ctx.beginPath(); ctx.arc(sx, sy + bob, e.r * 1.35, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(sx, sy + bob);
  // 좌우 비대칭 실루엣은 진행 방향을 향하게 뒤집는다
  if (T.shape === "hound" && e.x > player.x) ctx.scale(-1, 1);
  // 둔화된 적은 푸르게 얼어붙는다
  const col = e.flash > 0 ? "#ffffff" : (e.slow > 0 ? "#9fd6f5" : T.color);
  ctx.fillStyle = col;

  if (T.shape === "bat") {
    const flap = Math.sin(e.wob * 2) * .5;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.quadraticCurveTo(-e.r * 1.6, -e.r * (1 + flap), -e.r * 2.1, e.r * .2);
    ctx.quadraticCurveTo(-e.r * 1.2, e.r * .1, 0, e.r * .5);
    ctx.quadraticCurveTo(e.r * 1.2, e.r * .1, e.r * 2.1, e.r * .2);
    ctx.quadraticCurveTo(e.r * 1.6, -e.r * (1 + flap), 0, 0);
    ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, e.r * .62, 0, TAU); ctx.fill();
  } else if (T.shape === "blob") {
    const sq = 1 + Math.sin(e.wob) * .12;
    ctx.beginPath(); ctx.ellipse(0, e.r * .1, e.r * sq, e.r / sq, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.22)";
    ctx.beginPath(); ctx.ellipse(-e.r * .3, -e.r * .35, e.r * .28, e.r * .18, -.5, 0, TAU); ctx.fill();
  } else if (T.shape === "ghost") {
    ctx.globalAlpha = .88;
    ctx.beginPath();
    ctx.arc(0, 0, e.r, Math.PI, 0);
    const n = 4;
    for (let i = 0; i <= n; i++) {
      const x = e.r - (2 * e.r) * (i / n);
      ctx.lineTo(x, e.r * (i % 2 ? .55 : 1.05));
    }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (T.shape === "hound") {
    const run = Math.sin(e.wob * 2) * e.r * .35;
    ctx.beginPath();                       // 몸통
    ctx.ellipse(0, 0, e.r * 1.15, e.r * .62, 0, 0, TAU); ctx.fill();
    ctx.beginPath();                       // 머리
    ctx.arc(e.r * .95, -e.r * .28, e.r * .5, 0, TAU); ctx.fill();
    ctx.beginPath();                       // 주둥이
    ctx.moveTo(e.r * 1.25, -e.r * .35); ctx.lineTo(e.r * 1.85, -e.r * .1);
    ctx.lineTo(e.r * 1.2, e.r * .12); ctx.closePath(); ctx.fill();
    ctx.beginPath();                       // 귀
    ctx.moveTo(e.r * .78, -e.r * .68); ctx.lineTo(e.r * .95, -e.r * 1.25);
    ctx.lineTo(e.r * 1.15, -e.r * .6); ctx.closePath(); ctx.fill();
    for (const lx of [-e.r * .6, e.r * .5]) {   // 다리
      ctx.fillRect(lx, e.r * .3, e.r * .28, e.r * .7 + run);
      ctx.fillRect(lx + e.r * .2, e.r * .3, e.r * .24, e.r * .7 - run);
    }
    ctx.beginPath();                       // 꼬리
    ctx.moveTo(-e.r * 1.1, -e.r * .1); ctx.lineTo(-e.r * 1.8, -e.r * .7 + run);
    ctx.lineTo(-e.r * 1.5, -e.r * .05); ctx.closePath(); ctx.fill();
  } else if (T.shape === "boss") {
    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, e.r + 6 + Math.sin(e.wob) * 3, 0, TAU); ctx.stroke();
    const dark = e.flash > 0 ? "#fff" : "#20101c";
    ctx.fillStyle = dark;
    if (T.bossStyle === "plague") {
      // 역병 군주 — 부풀어 오른 포자 덩어리
      for (let i = 0; i < 5; i++) {
        const a = e.wob * .4 + i / 5 * TAU;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * e.r * .62, Math.sin(a) * e.r * .62, e.r * .3, 0, TAU);
        ctx.fill();
      }
    } else if (T.bossStyle === "iron") {
      // 강철 처형자 — 각진 투구와 도끼날
      ctx.fillRect(-e.r * .8, -e.r * .95, e.r * 1.6, e.r * .5);
      ctx.beginPath();
      ctx.moveTo(e.r * .7, -e.r * .2); ctx.lineTo(e.r * 1.5, -e.r * .9);
      ctx.lineTo(e.r * 1.5, e.r * .5); ctx.closePath(); ctx.fill();
    } else if (T.bossStyle === "abyss") {
      // 심연의 왕 — 커다란 외눈
      ctx.beginPath(); ctx.arc(0, 0, e.r * .52, 0, TAU); ctx.fill();
      ctx.fillStyle = e.hp < e.maxHp * .5 ? "#ff3b6b" : "#ffe066";
      ctx.beginPath(); ctx.ellipse(0, 0, e.r * .2, e.r * .38, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = dark;
      for (let i = 0; i < 6; i++) {                 // 촉수
        const a = e.wob * .5 + i / 6 * TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * e.r * .9, Math.sin(a) * e.r * .9);
        ctx.lineTo(Math.cos(a + .18) * e.r * 1.5, Math.sin(a + .18) * e.r * 1.5);
        ctx.lineTo(Math.cos(a - .1) * e.r * .95, Math.sin(a - .1) * e.r * .95);
        ctx.closePath(); ctx.fill();
      }
    } else {
      for (const sg of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(sg * e.r * .55, -e.r * .7);
        ctx.lineTo(sg * e.r * 1.05, -e.r * 1.5);
        ctx.lineTo(sg * e.r * .25, -e.r * .95);
        ctx.closePath(); ctx.fill();
      }
    }
  } else { // humanoid
    ctx.fillRect(-e.r * .62, -e.r * .2, e.r * 1.24, e.r * 1.2);
    ctx.beginPath(); ctx.arc(0, -e.r * .55, e.r * .58, 0, TAU); ctx.fill();
    ctx.fillStyle = col;
    const sw = Math.sin(e.wob) * e.r * .3;
    ctx.fillRect(-e.r * .95, -e.r * .1 + sw, e.r * .35, e.r * .7);
    ctx.fillRect(e.r * .6, -e.r * .1 - sw, e.r * .35, e.r * .7);
  }

  // 종류별 표식 — 무엇을 조심해야 하는지가 실루엣에서 읽혀야 한다
  ctx.fillStyle = e.flash > 0 ? "#000" : "rgba(0,0,0,.55)";
  if (T.sprite === "archer") {                    // 사수 — 활
    ctx.strokeStyle = e.flash > 0 ? "#000" : "rgba(20,20,30,.8)";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(e.r * .7, -e.r * .1, e.r * .8, -1.1, 1.1); ctx.stroke();
  } else if (T.sprite === "charger") {            // 돌진자 — 앞으로 뻗은 뿔
    ctx.beginPath();
    ctx.moveTo(e.r * .5, -e.r * .5); ctx.lineTo(e.r * 1.5, 0); ctx.lineTo(e.r * .5, e.r * .2);
    ctx.closePath(); ctx.fill();
    if (e.state === 1) {                          // 예비동작 — 경고선
      ctx.save();
      ctx.globalAlpha = .5 + Math.sin(Game.time * 30) * .4;
      ctx.strokeStyle = "#ff5b6b"; ctx.lineWidth = 3;
      const a = Math.atan2(player.y - e.y, player.x - e.x);
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * 260, Math.sin(a) * 260);
      ctx.stroke();
      ctx.restore();
    }
  } else if (T.sprite === "shaman") {             // 주술사 — 떠 있는 구슬
    ctx.fillStyle = e.flash > 0 ? "#fff" : "#e0b0ff";
    ctx.beginPath(); ctx.arc(0, -e.r * 1.5 + Math.sin(e.wob) * 3, e.r * .32, 0, TAU); ctx.fill();
  } else if (T.sprite === "bomber") {             // 폭발체 — 심지
    ctx.strokeStyle = e.flash > 0 ? "#fff" : "#7a5a2a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -e.r * .9); ctx.lineTo(e.r * .3, -e.r * 1.5); ctx.stroke();
    ctx.fillStyle = "#ff8a3c";
    ctx.beginPath(); ctx.arc(e.r * .3, -e.r * 1.5, 3 + Math.sin(Game.time * 14) * 1.4, 0, TAU); ctx.fill();
  } else if (T.sprite === "splitter") {           // 분열체 — 갈라진 선
    ctx.strokeStyle = e.flash > 0 ? "#000" : "rgba(10,30,30,.7)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -e.r * .8); ctx.lineTo(0, e.r * .8); ctx.stroke();
  }

  // 눈
  if (T.shape !== "bat" || true) {
    ctx.fillStyle = e.flash > 0 ? "#000" : "#20102a";
    const ey = T.shape === "humanoid" ? -e.r * .6 : -e.r * .15;
    ctx.beginPath(); ctx.arc(-e.r * .28, ey, e.r * .13, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(e.r * .28, ey, e.r * .13, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // 등급 표시 — 같은 몬스터라도 등급이 다르면 즉시 구분되어야 한다
  if (e.rank && e.rank.ring) {
    ctx.save();
    const pl = .55 + Math.sin(Game.time * 3 + e.id) * .35;
    ctx.globalAlpha = pl;
    ctx.strokeStyle = e.rank.ring; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sx, sy, e.r + 6, 0, TAU); ctx.stroke();
    if (e.rank === RANKS.rare) {
      ctx.globalAlpha = pl * .5;
      ctx.beginPath(); ctx.arc(sx, sy, e.r + 11, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.font = "700 9px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = e.rank.ring;
    ctx.fillText(e.rank.name + " " + (e.type.name || ""), sx, sy - e.r - 20);
    ctx.restore();
  }
  // 방패병 — 방패가 남아 있으면 앞에 띠를 그린다
  if (e.shieldHp > 0) {
    const f = clamp(e.shieldHp / e.shieldMax, 0, 1);
    ctx.save();
    ctx.globalAlpha = .55 + f * .35;
    ctx.strokeStyle = "#cfd6e6"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sx, sy, e.r + 4, -2.1, -1.05); ctx.stroke();
    ctx.beginPath(); ctx.arc(sx, sy, e.r + 4, 1.05, 2.1); ctx.stroke();
    ctx.restore();
  }
  // 보스/정예 체력바
  if (e.boss || e.sigilKey || (e.rank && e.rank.ring)) drawEnemyHpBar(e, sx, sy);
}

/* 몬스터 이름표.
   400마리에 전부 붙이면 글자가 서로 겹쳐 오히려 안 읽힌다.
   그래서 (1) 등급·보스는 자기 라벨에 이름을 이미 달고 있으므로 건너뛰고,
   (2) 나머지는 플레이어에게 가까운 순으로 상한선까지만 그린다.
   N 키로 끌 수 있다. */
const NAME_LIMIT = 26;
function drawEnemyNames() {
  if (!Game.showNames) return;
  const pick = [];
  for (const e of enemies) {
    if (!e.active) continue;
    if (e.boss || e.sigilKey || (e.rank && e.rank.ring)) continue;   // 이미 라벨이 있다
    const sx = e.x - cam.x, sy = e.y - cam.y;
    if (sx < 0 || sx > W || sy < 0 || sy > H) continue;
    pick.push([dist2(e.x, e.y, player.x, player.y), e, sx, sy]);
  }
  pick.sort((a, b) => a[0] - b[0]);
  ctx.save();
  ctx.font = "600 9px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(226,232,246,.62)";
  // 겹치면 오히려 못 읽는다 — 이미 글자가 놓인 자리 근처는 건너뛴다
  const px = [], py = [];
  let drawn = 0;
  for (let i = 0; i < pick.length && drawn < NAME_LIMIT; i++) {
    const [, e, sx, sy] = pick[i];
    const ly = sy - e.r - 11;
    let clash = false;
    for (let j = 0; j < px.length; j++)
      if (Math.abs(px[j] - sx) < 40 && Math.abs(py[j] - ly) < 13) { clash = true; break; }
    if (clash) continue;
    px.push(sx); py.push(ly);
    ctx.fillText(e.type.name || "", sx, ly);
    drawn++;
  }
  ctx.restore();
}

function drawEnemyHpBar(e, sx, sy) {
  const bw = e.r * 2.4, hpf = clamp(e.hp / e.maxHp, 0, 1);
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(sx - bw / 2, sy - e.r - 16, bw, 6);
  ctx.fillStyle = "#ff4d6d"; ctx.fillRect(sx - bw / 2, sy - e.r - 16, bw * hpf, 6);
}

function drawPlayer() {
  const sx = player.sx, sy = player.sy;
  drawShadow(sx, sy, player.r);
  const blink = player.iframe > 0 && Math.floor(player.iframe * 20) % 2 === 0;
  const tier = player.advance.length;
  const tint = tier ? advColor() : "#c9243f";
  // 전직할수록 몸에서 빛이 난다 — 지금 내가 무엇인지가 화면에 보여야 한다
  if (tier) {
    ctx.save();
    const pulse = .5 + Math.sin(Game.time * (2 + tier)) * .5;
    ctx.globalAlpha = (.06 + tier * .05) * (.6 + pulse * .4);
    ctx.fillStyle = tint;
    ctx.beginPath(); ctx.arc(sx, sy, 26 + tier * 9, 0, TAU); ctx.fill();
    if (tier >= 3) {
      ctx.globalAlpha = .5 + pulse * .3;
      ctx.strokeStyle = tint; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const a = Game.time * 1.3 + i / 3 * TAU;
        ctx.beginPath();
        ctx.arc(sx, sy, 30, a, a + .9);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  ctx.save();
  ctx.translate(sx, sy);
  ctx.globalAlpha = blink ? .45 : 1;
  const bob = Math.sin(player.walk) * 2;
  // 망토 — 전직 색으로 물든다
  ctx.fillStyle = tint;
  ctx.beginPath();
  ctx.moveTo(-10, -6 + bob); ctx.quadraticCurveTo(-16, 10 + bob, -6, 14 + bob);
  ctx.lineTo(6, 14 + bob); ctx.quadraticCurveTo(16, 10 + bob, 10, -6 + bob);
  ctx.closePath(); ctx.fill();
  // 몸
  ctx.fillStyle = player.hurtFlash > 0 ? "#ffb4b4" : "#e8e5da";
  ctx.fillRect(-8, -6 + bob, 16, 15);
  ctx.fillStyle = tint;
  ctx.fillRect(-1.6, -6 + bob, 3.2, 15);
  ctx.fillRect(-8, -1 + bob, 16, 3);
  // 머리
  ctx.fillStyle = player.hurtFlash > 0 ? "#fff" : "#f0d5b0";
  ctx.beginPath(); ctx.arc(0, -13 + bob, 7.5, 0, TAU); ctx.fill();
  ctx.fillStyle = "#3a2a1e";
  ctx.beginPath(); ctx.arc(0, -15 + bob, 7.5, Math.PI, 0); ctx.fill();
  ctx.fillStyle = "#2b1c14";
  const fx = clamp(player.faceX, -1, 1) * 2;
  ctx.beginPath(); ctx.arc(-2.6 + fx, -12.5 + bob, 1.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(2.6 + fx, -12.5 + bob, 1.2, 0, TAU); ctx.fill();
  ctx.restore();
}

/* 자세를 눈에 보이게 만든다 — 규칙이 아무리 좋아도 화면에서 안 보이면 없는 것이다 */
function drawStanceWorld() {
  const C = player.cls;
  if (!C || Game.state === "title" || Game.state === "altar") return;
  const sx = player.sx, sy = player.sy;

  if (C.key === "paladin") {
    const need = .6 - .15 * traitLv("bulwark");
    const charge = clamp(player.stillTime / need, 0, 1);
    const R = 40;
    // 충전 중: 테두리가 시계처럼 차오른다
    if (player.bulwark < 1 && charge > .02) {
      ctx.save();
      ctx.strokeStyle = "rgba(255,211,110,.55)"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(sx, sy, R, -Math.PI / 2, -Math.PI / 2 + TAU * charge);
      ctx.stroke();
      ctx.restore();
    }
    // 전개 완료: 육각 방벽
    if (player.bulwark > 0) {
      const a = player.bulwark, rr = R + 6 * a;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const ang = i / 6 * TAU - Math.PI / 2;
        const px = sx + Math.cos(ang) * rr, py = sy + Math.sin(ang) * rr;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = "rgba(255,211,110,.10)"; ctx.fill();
      ctx.strokeStyle = "rgba(255,225,150,.85)"; ctx.lineWidth = 2.5; ctx.stroke();
      // 접전 스택이 쌓일수록 테두리가 두꺼워진다
      if (player.press > 0) {
        ctx.globalAlpha = a * Math.min(1, player.press / 14) * .8;
        ctx.strokeStyle = "#ff9f6b"; ctx.lineWidth = 2 + player.press * .35;
        ctx.stroke();
      }
      ctx.restore();
    }
  } else if (C.key === "mage") {
    const st = Math.floor(player.channel), frac = player.channel - st;
    const maxStage = 3 + traitLv("deepMana");
    for (let i = 0; i < st; i++) {
      const r = 30 + i * 12;
      ctx.save();
      ctx.globalAlpha = .75;
      ctx.strokeStyle = i >= 3 ? "#e0b0ff" : "#9bb8ff";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      // 회전하는 룬 고리 — 단계가 오를수록 고리가 늘어난다
      const seg = 6 + i * 2, spin = Game.time * (i % 2 ? -1.1 : 1.4) + i;
      for (let k = 0; k < seg; k++) {
        const a0 = spin + k / seg * TAU, a1 = a0 + TAU / seg * .55;
        ctx.moveTo(sx + Math.cos(a0) * r, sy + Math.sin(a0) * r);
        ctx.arc(sx, sy, r, a0, a1);
      }
      ctx.stroke();
      ctx.restore();
    }
    // 다음 단계까지의 진행
    if (st < maxStage && frac > .02) {
      ctx.save();
      ctx.globalAlpha = .5;
      ctx.strokeStyle = "#9bb8ff"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, sy, 30 + st * 12, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
      ctx.stroke();
      ctx.restore();
    }
    if (st >= maxStage) {
      ctx.save();
      ctx.globalAlpha = .18 + Math.sin(Game.time * 6) * .06;
      ctx.fillStyle = "#bcd0ff";
      ctx.beginPath(); ctx.arc(sx, sy, 30 + maxStage * 12, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
}

function drawWorld() {
  // 보석 — 화면에 수백 개가 깔리므로 티어별로 한 패스에 몰아 그린다
  for (let tier = 0; tier < 3; tier++) {
    const col = GEM_COLOR[tier], br = GEM_R[tier];
    let any = false;
    ctx.beginPath();
    for (const g of gems) {
      if (!g.active || g.tier !== tier) continue;
      const sx = g.x - cam.x, sy = g.y - cam.y;
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
      const r = (br + Math.sin(g.bob) * .6) * 1.9;
      ctx.moveTo(sx + r, sy);
      ctx.arc(sx, sy, r, 0, TAU);
      any = true;
    }
    if (!any) continue;
    ctx.globalAlpha = .2; ctx.fillStyle = col; ctx.fill();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    for (const g of gems) {
      if (!g.active || g.tier !== tier) continue;
      const sx = g.x - cam.x, sy = g.y - cam.y;
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
      const r = br + Math.sin(g.bob) * .6;
      ctx.moveTo(sx, sy - r);
      ctx.lineTo(sx + r * .75, sy);
      ctx.lineTo(sx, sy + r);
      ctx.lineTo(sx - r * .75, sy);
      ctx.closePath();
    }
    ctx.fillStyle = col; ctx.fill();
  }
  // 아이템
  for (const pk of pickups) {
    if (!pk.active) continue;
    const sx = pk.x - cam.x, sy = pk.y - cam.y + Math.sin(pk.bob) * 3;
    ctx.save();
    const isItem = pk.kind.startsWith("item:");
    const C = isItem ? CONSUMABLES[pk.kind.slice(5)] : null;
    const glow = pk.kind === "heart" ? "#ff5b7a" : pk.kind === "sigil" ? "#ffd34d"
               : C ? C.color : "#7fd2ff";
    ctx.globalAlpha = .3; ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(sx, sy, pk.kind === "sigil" ? 28 : 22, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = (pk.kind === "sigil" ? "30px " : "26px ") + FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(pk.kind === "heart" ? "🍗" : pk.kind === "sigil" ? "🔯" : C ? C.icon : "🧲", sx, sy);
    ctx.restore();
  }

  // 보스 대형 범위기 예고 — 밟고 있으면 죽는다는 걸 미리 보여준다
  for (const e of enemies) {
    if (!e.active || !e.telT || e.telT <= 0) continue;
    const sx = e.telX - cam.x, sy = e.telY - cam.y;
    const f = 1 - e.telT / 1.5;
    ctx.save();
    ctx.globalAlpha = .18 + f * .3;
    ctx.fillStyle = "#a8e04a";
    ctx.beginPath(); ctx.arc(sx, sy, e.telR * f, 0, TAU); ctx.fill();
    ctx.globalAlpha = .8;
    ctx.strokeStyle = "#d4ff7a"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sx, sy, e.telR, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // 지형 — 종류마다 실루엣이 다르다. 무엇이 막고 무엇이 튕기는지 한눈에 보여야 한다.
  for (const o of obstacles) {
    const sx = o.x - cam.x, sy = o.y - cam.y;
    if (sx < -100 || sx > W + 100 || sy < -100 || sy > H + 100) continue;
    ctx.save();
    // 늪은 바닥에 깔린 것이라 그림자를 지지 않는다
    if (o.kind !== "bog") {
      ctx.fillStyle = "rgba(0,0,0,.32)";
      ctx.beginPath(); ctx.ellipse(sx, sy + o.r * .55, o.r * .95, o.r * .36, 0, 0, TAU); ctx.fill();
    }
    const poly = (n, jitter, squash, seedMul) => {
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU + o.seed * seedMul;
        const rr = o.r * (1 - jitter / 2 + hash2(i * 3, Math.floor(o.x)) * jitter);
        const px = sx + Math.cos(a) * rr, py = sy + Math.sin(a) * rr * squash;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
    };

    if (o.kind === "pillar") {
      // 신전 기둥 — 세로로 길고, 발사체를 막는다
      const h = o.r * 2.6;
      ctx.fillStyle = "#8a8264";
      ctx.fillRect(sx - o.r * .52, sy - h, o.r * 1.04, h);
      ctx.fillStyle = "#a09779";
      ctx.fillRect(sx - o.r * .72, sy - h - 9, o.r * 1.44, 11);   // 주두
      ctx.fillRect(sx - o.r * .72, sy - 7, o.r * 1.44, 10);       // 주초
      ctx.strokeStyle = "rgba(0,0,0,.22)"; ctx.lineWidth = 1;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(sx + i * o.r * .26, sy - h + 4); ctx.lineTo(sx + i * o.r * .26, sy - 8);
        ctx.stroke();
      }
    } else if (o.kind === "ruin") {
      // 폐허 — 무너진 건물. 가장 크고 아무것도 통과시키지 않는다
      ctx.fillStyle = "#54505f";
      poly(8, .3, .82, 5); ctx.fill();
      ctx.strokeStyle = "#6b6678"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#3a3745";
      ctx.fillRect(sx - o.r * .34, sy - o.r * .95, o.r * .68, o.r * .8);   // 무너진 입구
      ctx.fillStyle = "#6b6678";
      for (let i = 0; i < 3; i++) {
        const a = o.seed * 11 + i * 2.1;
        ctx.fillRect(sx + Math.cos(a) * o.r * .6 - 5, sy + Math.sin(a) * o.r * .5 - 14, 10, 24);
      }
    } else if (o.kind === "crystal") {
      // 수정 기둥 — 마법을 튕겨낸다. 빛나게 그려서 다르다는 걸 알린다
      const f = clamp(o.st.hp / o.st.max, 0, 1);
      const pulse = .5 + Math.sin(Game.time * 2.6 + o.seed * 9) * .25;
      ctx.globalAlpha = .28 * pulse;
      ctx.fillStyle = "#7fd0e8";
      ctx.beginPath(); ctx.arc(sx, sy - o.r * .5, o.r * 1.7, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = f > .5 ? "#7fd0e8" : "#5fa8c0";
      ctx.beginPath();
      ctx.moveTo(sx, sy - o.r * 2.1);
      ctx.lineTo(sx + o.r * .62, sy - o.r * .5);
      ctx.lineTo(sx + o.r * .3, sy + o.r * .3);
      ctx.lineTo(sx - o.r * .3, sy + o.r * .3);
      ctx.lineTo(sx - o.r * .62, sy - o.r * .5);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#cdf2ff"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx - o.r * .16, sy - o.r * 1.6); ctx.lineTo(sx - o.r * .16, sy);
      ctx.stroke();
    } else if (o.kind === "thorn") {
      // 가시덤불 — 막지 않으므로 낮고 성기게 그린다
      const f = clamp(o.st.hp / o.st.max, 0, 1);
      ctx.fillStyle = f > .5 ? "#3f5c30" : "#54502c";
      poly(9, .5, .5, 7); ctx.fill();
      ctx.strokeStyle = "#6f9450"; ctx.lineWidth = 1.5;
      for (let i = 0; i < 9; i++) {
        const a = i / 9 * TAU + o.seed * 4;
        ctx.beginPath();
        ctx.moveTo(sx + Math.cos(a) * o.r * .3, sy + Math.sin(a) * o.r * .18);
        ctx.lineTo(sx + Math.cos(a) * o.r * .95, sy + Math.sin(a) * o.r * .5);
        ctx.stroke();
      }
    } else if (o.kind === "tree") {
      // 고목 — 세로로 크고 가지가 벌어진다
      const f = clamp(o.st.hp / o.st.max, 0, 1);
      const h = o.r * 2.2;
      ctx.strokeStyle = f > .4 ? "#4a3a2c" : "#5c4636";
      ctx.lineWidth = o.r * .42; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy - h); ctx.stroke();
      ctx.lineWidth = o.r * .2;
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI / 2 + (i - 2) * .5 + o.seed;
        ctx.beginPath();
        ctx.moveTo(sx, sy - h * .62);
        ctx.lineTo(sx + Math.cos(a) * o.r * 1.25, sy - h * .62 + Math.sin(a) * o.r * 1.25);
        ctx.stroke();
      }
      ctx.lineCap = "butt";
    } else if (o.kind === "statue") {
      // 석상 — 받침 위의 인영
      ctx.fillStyle = "#5f5a6e";
      ctx.fillRect(sx - o.r * .9, sy - o.r * .3, o.r * 1.8, o.r * .5);
      ctx.fillStyle = "#7a7488";
      ctx.fillRect(sx - o.r * .42, sy - o.r * 1.9, o.r * .84, o.r * 1.7);
      ctx.beginPath(); ctx.arc(sx, sy - o.r * 2.1, o.r * .34, 0, TAU); ctx.fill();
      ctx.fillRect(sx - o.r * .78, sy - o.r * 1.6, o.r * 1.56, o.r * .22);   // 벌린 팔
      ctx.strokeStyle = "rgba(0,0,0,.3)"; ctx.lineWidth = 1;
      ctx.strokeRect(sx - o.r * .42, sy - o.r * 1.9, o.r * .84, o.r * 1.7);
    } else if (o.kind === "bones") {
      // 거대 유해 — 갈비뼈. 발사체는 사이로 지나간다
      ctx.strokeStyle = "#c8c2b0"; ctx.lineWidth = Math.max(3, o.r * .13);
      ctx.beginPath();
      ctx.moveTo(sx - o.r * .9, sy + o.r * .3); ctx.lineTo(sx + o.r * .9, sy - o.r * .1);
      ctx.stroke();
      for (let i = 0; i < 6; i++) {
        const px = sx - o.r * .8 + i * o.r * .32;
        const py = sy + o.r * .28 - i * o.r * .07;
        ctx.beginPath();
        ctx.arc(px, py - o.r * .5, o.r * .52, Math.PI * .15, Math.PI * .85);
        ctx.stroke();
      }
      ctx.fillStyle = "#ded8c6";
      ctx.beginPath(); ctx.arc(sx + o.r * 1.0, sy - o.r * .16, o.r * .34, 0, TAU); ctx.fill();
    } else if (o.kind === "obelisk") {
      // 첨탑 — 가장 높다. 멀리서도 위치를 잡는 이정표
      const h = o.r * 4.2;
      ctx.fillStyle = "#6a5a86";
      ctx.beginPath();
      ctx.moveTo(sx - o.r * .5, sy);
      ctx.lineTo(sx - o.r * .26, sy - h);
      ctx.lineTo(sx + o.r * .26, sy - h);
      ctx.lineTo(sx + o.r * .5, sy);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#9a86bd"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.globalAlpha = .5 + Math.sin(Game.time * 1.8 + o.seed * 7) * .3;
      ctx.fillStyle = "#c9a3ff";
      for (let i = 1; i <= 3; i++) {
        const yy = sy - h * (i / 4);
        ctx.fillRect(sx - o.r * .16, yy, o.r * .32, 3);
      }
      ctx.globalAlpha = 1;
    } else if (o.kind === "brazier") {
      // 화톳불 — 적을 태운다. 불꽃이 살아 움직여야 '켜져 있다'가 읽힌다
      ctx.fillStyle = "#4a4450";
      ctx.beginPath();
      ctx.moveTo(sx - o.r * .7, sy + o.r * .35);
      ctx.lineTo(sx + o.r * .7, sy + o.r * .35);
      ctx.lineTo(sx + o.r * .45, sy - o.r * .15);
      ctx.lineTo(sx - o.r * .45, sy - o.r * .15);
      ctx.closePath(); ctx.fill();
      for (let i = 0; i < 3; i++) {
        const ph = Game.time * 6 + i * 2.1 + o.seed * 9;
        const fh = o.r * (1.0 + Math.sin(ph) * .3);
        ctx.globalAlpha = .55 + Math.sin(ph * 1.4) * .25;
        ctx.fillStyle = i === 0 ? "#ffd36e" : "#ff8a3c";
        ctx.beginPath();
        ctx.moveTo(sx - o.r * .3 + i * o.r * .3, sy - o.r * .15);
        ctx.quadraticCurveTo(sx - o.r * .1 + i * o.r * .3, sy - fh, sx + i * o.r * .3, sy - o.r * .15);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = .14;
      ctx.fillStyle = "#ff8a3c";
      ctx.beginPath(); ctx.arc(sx, sy, o.r * 1.5, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (o.kind === "bog") {
      // 늪 — 바닥에 깔린다. 지나갈 수 있지만 모두 느려진다
      ctx.globalAlpha = .55;
      ctx.fillStyle = "#3a4a52";
      poly(11, .22, .5, 3); ctx.fill();
      ctx.globalAlpha = .35;
      ctx.strokeStyle = "#6fa090"; ctx.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) {
        const ph = Game.time * .8 + i * 2 + o.seed * 5;
        ctx.beginPath();
        ctx.ellipse(sx + Math.sin(ph) * o.r * .3, sy + Math.cos(ph * .7) * o.r * .12,
                    o.r * (.2 + i * .18), o.r * (.1 + i * .09), 0, 0, TAU);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (o.kind === "wall") {
      ctx.fillStyle = "#4a4a5c";
      poly(6, .28, .92, 6); ctx.fill();
      ctx.strokeStyle = "#5f5f75"; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 1;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(sx - o.r * .7, sy + i * o.r * .4);
        ctx.lineTo(sx + o.r * .7, sy + i * o.r * .4);
        ctx.stroke();
      }
    } else {
      // 바위 — 피해를 입으면 금이 간다
      const f = clamp(o.st.hp / o.st.max, 0, 1);
      ctx.fillStyle = f > .5 ? "#6b6b7d" : f > .2 ? "#7a6a62" : "#8a5f52";
      poly(7, .36, .88, 9); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1.5; ctx.stroke();
      if (f < 1) {
        ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(sx - o.r * .5, sy - o.r * .3);
        ctx.lineTo(sx - o.r * .1, sy + o.r * .1);
        ctx.lineTo(sx + o.r * .4, sy - o.r * .2);
        ctx.stroke();
      }
    }
    // 보스가 세운 것은 테두리로 구분한다
    if (o.spawned) {
      ctx.globalAlpha = .5 + Math.sin(Game.time * 5) * .25;
      ctx.strokeStyle = "#ff6b6b"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, o.r + 5, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  // 지형지물 — 적보다 아래에 깔린다
  for (const lm of landmarks) {
    const sx = lm.x - cam.x, sy = lm.y - cam.y;
    if (sx < -80 || sx > W + 80 || sy < -80 || sy > H + 80) continue;
    const pulse = .6 + Math.sin(Game.time * 2 + lm.x * .01) * .25;
    ctx.save();
    // 바닥 표식
    ctx.globalAlpha = .22 * pulse;
    ctx.fillStyle = lm.T.color;
    ctx.beginPath(); ctx.ellipse(sx, sy + lm.r * .5, lm.r * 1.7, lm.r * .8, 0, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;

    if (lm.type === "chest") {
      ctx.fillStyle = "#6b4a26";
      ctx.fillRect(sx - 18, sy - 6, 36, 20);
      ctx.fillStyle = "#8a6234";
      ctx.beginPath(); ctx.arc(sx, sy - 6, 18, Math.PI, 0); ctx.fill();
      ctx.fillStyle = "#e8c96a";
      ctx.fillRect(sx - 18, sy - 8, 36, 4);
      ctx.fillRect(sx - 4, sy - 4, 8, 10);
    } else if (lm.type === "shrine") {
      ctx.fillStyle = "#4a4560";
      ctx.fillRect(sx - 24, sy - 30, 8, 44);
      ctx.fillRect(sx + 16, sy - 30, 8, 44);
      ctx.fillRect(sx - 28, sy - 38, 56, 10);
      // 봉인 문양
      ctx.globalAlpha = lm.fighting ? .25 : .55 + Math.sin(Game.time * 3) * .25;
      ctx.strokeStyle = "#c9a3ff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sx, sy - 10, 13, 0, TAU); ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = Game.time * .6 + i / 5 * TAU;
        ctx.moveTo(sx, sy - 10);
        ctx.lineTo(sx + Math.cos(a) * 13, sy - 10 + Math.sin(a) * 13);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
      // 아직 못 여는 제단이면 미리 알려준다 — 닿고 나서야 알면 헛걸음이 된다
      if (!lm.fighting && player.level < SHRINE_MIN_LEVEL) {
        ctx.font = "bold 12px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#c9a3ff";
        ctx.fillText("🔒 Lv" + SHRINE_MIN_LEVEL, sx, sy - 48);
      }
    } else {
      ctx.fillStyle = "#3f4a5c";
      ctx.beginPath();
      ctx.moveTo(sx - 14, sy + 14); ctx.lineTo(sx - 10, sy - 34);
      ctx.lineTo(sx + 10, sy - 34); ctx.lineTo(sx + 14, sy + 14);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = .5 + Math.sin(Game.time * 2.2) * .3;
      ctx.strokeStyle = "#8fd0ff"; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const yy = sy - 24 + i * 12;
        ctx.beginPath(); ctx.moveTo(sx - 6, yy); ctx.lineTo(sx + 6, yy - 4); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  // 그림자는 색이 같으므로 한 번의 패스로 모아 그린다 (적 360마리 × fill 을 1회로)
  ctx.fillStyle = "rgba(0,0,0,.28)";
  ctx.beginPath();
  for (const e of enemies) {
    if (!e.active) continue;
    const sx = e.x - cam.x, sy = e.y - cam.y;
    if (sx < -70 || sx > W + 70 || sy < -70 || sy > H + 70) continue;
    const rx = e.r * .8, ry = e.r * .32, cy = sy + e.r * .85;
    ctx.moveTo(sx + rx, cy);
    ctx.ellipse(sx, cy, rx, ry, 0, 0, TAU);
  }
  ctx.fill();

  for (const e of enemies) if (e.active) drawEnemy(e);
  drawEnemyNames();

  // 지속형 무기(오라)는 플레이어 아래에 깔린다
  for (const w of player.weapons) {
    const def = WEAPONS[w.key];
    if (def.draw && w.key === "aura") def.draw(player, w);
  }

  drawStanceWorld();
  drawPlayer();

  for (const w of player.weapons) {
    const def = WEAPONS[w.key];
    if (def.draw && w.key !== "aura") def.draw(player, w);
  }

  // 참격
  for (const sl of slashes) {
    if (!sl.active) continue;
    const t = 1 - sl.life / sl.maxLife;
    const sx = sl.x - cam.x, sy = sl.y - cam.y;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(sl.ang);
    ctx.globalAlpha = (1 - t) * .85;
    const grad = ctx.createLinearGradient(0, 0, sl.len, 0);
    grad.addColorStop(0, "rgba(255,255,255,0)");
    grad.addColorStop(.6, "rgba(255,240,200,.9)");
    grad.addColorStop(1, "rgba(255,180,90,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, sl.len * (.5 + t * .6), -.62, .62);
    ctx.arc(0, 0, sl.len * (.15 + t * .3), .62, -.62, true);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 바닥 장판 — 밟으면 아프다
  for (const h of hazards) {
    if (!h.active) continue;
    const sx = h.x - cam.x, sy = h.y - cam.y;
    if (sx < -160 || sx > W + 160 || sy < -160 || sy > H + 160) continue;
    const t = h.life / h.maxLife;
    ctx.save();
    ctx.globalAlpha = .16 + .16 * t;
    ctx.fillStyle = h.color;
    ctx.beginPath(); ctx.arc(sx, sy, h.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = .35 + .3 * Math.abs(Math.sin(Game.time * 4));
    ctx.strokeStyle = h.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, sy, h.r, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // 파동
  for (const wv of waves) {
    if (!wv.active) continue;
    const t = 1 - wv.life / wv.maxLife;
    const sx = wv.x - cam.x, sy = wv.y - cam.y;
    ctx.save();
    ctx.globalAlpha = (1 - t) * .85;
    ctx.strokeStyle = wv.color; ctx.lineWidth = 5 + (1 - t) * 8;
    ctx.shadowColor = wv.color; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(sx, sy, wv.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = (1 - t) * .16;
    ctx.fillStyle = wv.color;
    ctx.beginPath(); ctx.arc(sx, sy, wv.r, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // 발사체
  for (const p of projectiles) {
    if (!p.active) continue;
    const sx = p.x - cam.x, sy = p.y - cam.y;
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(p.angle);
    if (p.kind === "flame") {
      const t = clamp(p.life / p.maxLife, 0, 1);
      ctx.globalAlpha = t * .3;
      ctx.fillStyle = "#ff7a1c";
      ctx.beginPath(); ctx.arc(0, 0, p.r * 1.8, 0, TAU); ctx.fill();
      ctx.globalAlpha = t * .9;
      ctx.fillStyle = "#ff9a3c";
      ctx.beginPath(); ctx.arc(0, 0, p.r * (1.25 - t * .35), 0, TAU); ctx.fill();
      ctx.fillStyle = "#ffe08a";
      ctx.beginPath(); ctx.arc(0, 0, p.r * .45 * t, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.kind === "dagger") {
      ctx.fillStyle = "#cfd6e6";
      ctx.beginPath(); ctx.moveTo(p.r * 1.7, 0); ctx.lineTo(-p.r * .5, -p.r * .45); ctx.lineTo(-p.r * .5, p.r * .45);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#8a6a3a"; ctx.fillRect(-p.r * 1.2, -p.r * .22, p.r * .8, p.r * .44);
      ctx.fillStyle = "#e8c96a"; ctx.fillRect(-p.r * .62, -p.r * .6, p.r * .22, p.r * 1.2);
    } else {
      ctx.globalAlpha = .25; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(0, 0, p.r * 1.8, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.beginPath(); ctx.arc(0, 0, p.r * .45, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  // 번개
  for (const b of bolts) {
    if (!b.active) continue;
    const sx = b.x - cam.x, sy = b.y - cam.y;
    ctx.save();
    ctx.globalAlpha = clamp(b.life / .3, 0, 1);
    ctx.strokeStyle = "#cfe9ff"; ctx.lineWidth = 3;
    ctx.shadowColor = "#7fd2ff"; ctx.shadowBlur = 18;
    ctx.beginPath();
    let y = sy - 400, x = sx + (hash2(b.seed | 0, 7) - .5) * 60;
    ctx.moveTo(x, y);
    for (let i = 1; i <= 8; i++) {
      y = sy - 400 + (400 * i / 8);
      x = sx + (hash2((b.seed | 0) + i, i * 13) - .5) * 60 * (1 - i / 8);
      ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = "rgba(180,225,255,.35)";
    ctx.beginPath(); ctx.arc(sx, sy, 34 * (1 - b.life / .3) + 8, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // 적이 쏜 탄 — 아군 탄과 헷갈리지 않게 붉은 테두리를 두른다
  for (const p of eshots) {
    if (!p.active) continue;
    const sx = p.x - cam.x, sy = p.y - cam.y;
    if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) continue;
    ctx.globalAlpha = .3; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(sx, sy, p.r * 2.1, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(sx, sy, p.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#ff4d6d"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, sy, p.r + 2, 0, TAU); ctx.stroke();
  }

  // 파티클
  for (const p of particles) {
    if (!p.active) continue;
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x - cam.x, p.y - cam.y, p.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 데미지 숫자
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.75)";
  for (const n of numbers) {
    if (!n.active) continue;
    const nx = n.x - cam.x, ny = n.y - cam.y;
    if (nx < -40 || nx > W + 40 || ny < -30 || ny > H + 30) continue;
    ctx.globalAlpha = clamp(n.life / .7, 0, 1);
    ctx.font = "700 " + n.size + "px " + FONT;
    ctx.strokeText(n.text, nx, ny);
    ctx.fillStyle = n.color;
    ctx.fillText(n.text, nx, ny);
  }
  ctx.globalAlpha = 1;
}

function traitLv(key) {
  const t = player.traits.find(t => t.key === key);
  return t ? t.level : 0;
}
// 전직으로 열린 특성까지 합친 목록
function traitList() {
  const out = (player.cls && TRAITS[player.cls.key]) ? TRAITS[player.cls.key].slice() : [];
  for (const a of player.advance) if (a.traits) out.push(...a.traits);
  return out;
}
function traitDefByKey(key) {
  return traitList().find(t => t.key === key);
}
function traitDef(clsKey, key) {   // 이전 호출부 호환
  return traitDefByKey(key);
}

/* ---------- 능동 스킬 빌더 ----------
   전직마다 스킬이 바뀌어야 하는데 24개를 손으로 쓰면 관리가 안 된다.
   형태별로 만들어 쓰고, 수치만 전직 데이터에 둔다. */
function skWave(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    spawnWave({ x: p.x, y: p.y, maxR: o.r * p.stats.area,
      dmg: (o.dmg + p.level * (o.perLv || 10)) * p.stats.damage * p.dynDmg,
      life: o.life || .5, color: o.color, element: o.elem, heal: o.heal || 0 });
    if (o.iframe) p.iframe = Math.max(p.iframe, o.iframe);
    if (o.healPct) p.hp = Math.min(p.stats.maxHp, p.hp + p.stats.maxHp * o.healPct);
    cam.shake = o.shake || 12;
    spawnParticles(p.x, p.y, 34, o.color, 320, .8, 5);
    Sfx.play(o.freq || 320, .45, "triangle", 1, o.slide || 500);
  } };
}

function skBurst(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const targets = nearestEnemies(p.x, p.y, 900, o.n);
    for (let i = 0; i < o.n; i++) {
      const t = targets[i % Math.max(1, targets.length)];
      const a = t ? Math.atan2(t.y - p.y, t.x - p.x) + rnd(-.22, .22)
                  : i / o.n * TAU;
      const sp = (o.speed || 380) * p.stats.projSpeed;
      spawnProjectile({
        x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: (o.r || 11) * p.stats.area,
        dmg: (o.dmg + p.level * (o.perLv || 8)) * p.stats.damage * p.dynDmg,
        pierce: o.pierce || 2, life: o.life || 2.2, kind: o.kind || "orb",
        angle: a, color: o.color, element: o.elem,
        homing: o.homing || 0, target: t || null,
      });
    }
    cam.shake = 8;
    Sfx.play(o.freq || 540, .3, "triangle", .9, 400);
  } };
}

function skStrike(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const pool = nearestEnemies(p.x, p.y, 800, o.n * 2);
    const dmg = (o.dmg + p.level * (o.perLv || 14)) * p.stats.damage * p.dynDmg;
    for (let i = 0; i < o.n; i++) {
      const e = pool[i % Math.max(1, pool.length)];
      if (!e || !e.active) continue;
      spawnBolt(e.x, e.y);
      damageEnemy(e, dmg, e.x, e.y - 60, 0, o.elem);
      spawnWave({ x: e.x, y: e.y, maxR: (o.splash || 90) * p.stats.area,
        dmg: dmg * .5, life: .28, color: o.color, element: o.elem });
    }
    cam.shake = 10;
    Sfx.play(200, .3, "sawtooth", .8, 700);
  } };
}

function skSlash(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const base = Math.atan2(p.faceY, p.faceX);
    const dmg = (o.dmg + p.level * (o.perLv || 12)) * p.stats.damage * p.dynDmg;
    for (let i = 0; i < o.n; i++)
      spawnSlash(p, base + (i - (o.n - 1) / 2) * (o.spread || .55), dmg,
                 o.len * p.stats.area, 1.4, o.elem);
    if (o.iframe) p.iframe = Math.max(p.iframe, o.iframe);
    cam.shake = 10;
    spawnParticles(p.x + p.faceX * 40, p.y + p.faceY * 40, 20, o.color, 260, .5, 4);
    Sfx.play(280, .3, "sawtooth", .8, 260);
  } };
}

function skDash(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    p.dash = o.dur; p.dashX = p.faceX; p.dashY = p.faceY;
    p.dashDmg = (o.dmg + p.level * (o.perLv || 12)) * p.stats.damage * p.dynDmg;
    p.dashHit.clear();
    p.iframe = Math.max(p.iframe, o.dur + .2);
    cam.shake = 8;
    Sfx.play(190, .3, "sawtooth", .85, 320);
  } };
}

function skBlink(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const ox = p.x, oy = p.y;
    p.x += p.faceX * o.dist; p.y += p.faceY * o.dist;
    p.iframe = Math.max(p.iframe, o.iframe || .9);
    const dmg = (o.dmg + p.level * (o.perLv || 8)) * p.stats.damage * p.dynDmg;
    for (const [bx, by] of [[ox, oy], [p.x, p.y]]) {
      spawnParticles(bx, by, 22, o.color, 280, .6, 4);
      for (let i = 0; i < o.n; i++) {
        const a = i / o.n * TAU, sp = 540 * p.stats.projSpeed;
        spawnProjectile({
          x: bx, y: by, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          r: 8 * p.stats.area, dmg, pierce: o.pierce || 2, life: 1.0,
          kind: o.kind || "dagger", angle: a, color: o.color, element: o.elem,
        });
      }
    }
    Sfx.play(760, .2, "sine", .8, -420);
  } };
}

/* ---------- 메타 진행 : 제단 ----------
   판이 끝나도 남는 것이 있어야 다시 시작하게 된다.
   영혼을 모아 영구 강화를 사고, 그 강화가 다음 판의 시작 지점을 올린다. */
const ALTAR = [
  { key: "vigor",   name: "강건함", icon: "🫀", desc: "최대 체력 +8%",       max: 5, cost: l => 60 + l * 70 },
  { key: "edge",    name: "예리함", icon: "🔪", desc: "모든 피해 +5%",       max: 5, cost: l => 80 + l * 95 },
  { key: "swift",   name: "민첩",   icon: "🪶", desc: "이동 속도 +4%",       max: 5, cost: l => 60 + l * 70 },
  { key: "avarice", name: "탐욕",   icon: "💰", desc: "경험치 획득 +6%",     max: 5, cost: l => 70 + l * 80 },
  { key: "zeal",    name: "신념",   icon: "🔔", desc: "직업 자원을 25 채운 채 시작", max: 3, cost: l => 130 + l * 150 },
  { key: "rebirth", name: "부활",   icon: "🕊️", desc: "쓰러질 때 한 번 되살아난다", max: 1, cost: () => 900 },
];

const Meta = {
  souls: 0, levels: {},
  load() {
    try {
      this.souls = Number(localStorage.getItem("ts_souls") || 0) || 0;
      this.levels = JSON.parse(localStorage.getItem("ts_altar") || "{}") || {};
    } catch (e) { this.souls = 0; this.levels = {}; }
  },
  save() {
    try {
      localStorage.setItem("ts_souls", String(this.souls));
      localStorage.setItem("ts_altar", JSON.stringify(this.levels));
    } catch (e) { /* 저장 불가여도 게임은 돈다 */ }
  },
  lv(k) { return this.levels[k] || 0; },
  costOf(u) { return u.cost(this.lv(u.key)); },
  buy(k) {
    const u = ALTAR.find(a => a.key === k);
    if (!u) return false;
    const l = this.lv(k);
    if (l >= u.max) return false;
    const c = this.costOf(u);
    if (this.souls < c) return false;
    this.souls -= c;
    this.levels[k] = l + 1;
    this.save();
    return true;
  },
};
Meta.load();

/* ---------- 직업 ----------
   직업 = 시작 무기 + 스탯 성향 + 고유 특성.
   무기 이름과 스킬 컨셉을 직업 테마에 맞춰 묶어둔다. */
const CLASSES = [
  {
    key: "paladin", name: "성기사", icon: "🛡️", color: "#ffd36e",
    tagline: "멈춰 서서 파고든다",
    start: "aura",
    gemChance: .11,  // 군중을 통째로 쓸어 담으므로 한 마리당 전리품은 가장 낮다
    desc: "군중 한가운데로 파고들어 버티는 직업. 체력이 압도적으로 높고 느리다.",
    mods: { maxHp: 150, speed: -.08, armor: .12, regen: .4 },
    // ── 진영: 멈추면 방벽이 서고, 둘러싸일수록 강해진다. 군중 속으로 파고드는 직업.
    stanceName: "진영",
    stanceHint: "멈추면 방벽(방어·회복·연사) · 곁의 적이 많을수록 피해 증가",
    stance: {
      update(p, dt, moving) {
        const bl = traitLv("bulwark") + traitLv("immovable");
        const need = Math.max(.12, advVal("bulwarkInstant", .6) - .15 * bl);
        const on = advVal("bulwarkAlways", false) || (!moving && p.stillTime >= need);
        p.bulwark = on ? Math.min(1, p.bulwark + dt * 6) : Math.max(0, p.bulwark - dt * 8);

        // 접전: 곁에 붙은 적 수만큼 피해가 오른다 (p.press 는 공용 패스에서 계산됨)
        const R = 155 * p.stats.area;
        const found = hash.query(p.x, p.y, R, scratch3);
        const perPress = advVal("pressDmg", .06) + .025 * traitLv("crusade") + .025 * traitLv("zealotry");
        p.dynDmg *= 1 + perPress * p.press;

        if (on) {
          // 방패벽은 밀집할수록 더 잘 막는다. '둘러싸일수록 강해진다'는 규칙이
          // 피해에만 걸리고 방어에는 안 걸리면, 파고들라는 설계가 그냥 자살 명령이 된다.
          p.dynArmor *= 1 - Math.min(advVal("bulwarkCap", .88), .52 + .08 * bl + .02 * p.press);
          // 접전 보너스는 적이 몰려야 나오므로 초반엔 사실상 0이다.
          // 방벽 자체에 쿨다운 감소를 붙여 '자리를 지키면 꾸준히 때린다'는 기본값을 준다.
          p.dynCd *= .72;
          // 자리를 지키면 체력이 돌아온다 — 파고들기 → 버티기 → 회복의 리듬
          p.hp = Math.min(p.stats.maxHp,

function advanceOptions(tier) {
  // 4차 초월은 3차 최종형(32종)마다 따로 두지 않고 직업을 부모로 삼는다.
  // 경로마다 붙이면 데이터가 64개가 되고 하나하나가 얕아진다 — 갈래 수보다 무게가 중요하다.
  if (tier === 4) return ADVANCES.filter(a => a.tier === 4 && a.from === (player.cls && player.cls.key));
  const prev = player.advance[tier - 2];
  const from = tier === 1 ? (player.cls && player.cls.key) : (prev && prev.key);
  return ADVANCES.filter(a => a.tier === tier && a.from === from);
}
// 전직 스탯/자세/스킬은 나중에 얻은 것이 이긴다
function curSkill() {
  for (let i = player.advance.length - 1; i >= 0; i--)
    if (player.advance[i].skill) return player.advance[i].skill;
  return player.cls ? player.cls.skill : null;
}
function advVal(key, def) {
  let v = def;
  for (const a of player.advance)
    if (a.stanceMod && a.stanceMod[key] !== undefined) v = a.stanceMod[key];
  return v;
}
function advName() {
  return player.advance.length ? player.advance[player.advance.length - 1].name
                               : (player.cls ? player.cls.name : "");
}
function advIcon() {
  return player.advance.length ? player.advance[player.advance.length - 1].icon
                               : (player.cls ? player.cls.icon : "");
}
function advColor() {
  return player.advance.length ? player.advance[player.advance.length - 1].color
                               : (player.cls ? player.cls.color : "#fff");
}

let selectedClass = 0;

/* ---------- HUD ---------- */
function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ":" + String(s).padStart(2, "0");
}

function drawHUD() {
  const s = player.stats;
  // 선택 화면 위에는 전투 배너를 띄우지 않는다. (반드시 사용 지점보다 먼저 선언할 것 —
  // 아래쪽에 두었더니 조합 해금 배너가 뜨는 프레임마다 TDZ 예외가 나서 화면이 멈췄다)
  const overlay = Game.state === "levelup" || Game.state === "advance" || Game.state === "paused";

  // 경험치 바 (상단 전체)
  const xpf = clamp(player.xp / player.xpNext, 0, 1);
  ctx.fillStyle = "#0d0d18"; ctx.fillRect(0, 0, W, 14);
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "#3fa9ff"); g.addColorStop(1, "#7ce7ff");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W * xpf, 14);
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(0, 0, W, 4);
  ctx.font = "700 11px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff"; ctx.fillText(player.level + "레벨", 34, 7);

  // 체력
  const hpf = clamp(player.hp / s.maxHp, 0, 1);
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(14, 24, 240, 20);
  ctx.fillStyle = hpf > .3 ? "#3ddc84" : "#ff5b6b";
  ctx.fillRect(16, 26, 236 * hpf, 16);
  ctx.font = "700 13px " + FONT; ctx.fillStyle = "#fff"; ctx.textAlign = "left";
  ctx.fillText(Math.ceil(player.hp) + " / " + Math.round(s.maxHp), 22, 34);

  // 직업 자원
  const C = player.cls;
  if (C) {
    const R = C.resource, rf = clamp(player.res / RES_MAX, 0, 1);
    const ready = player.res >= curSkill().cost;
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(14, 47, 240, 13);
    ctx.fillStyle = R.color;
    ctx.globalAlpha = ready ? 1 : .62;
    ctx.fillRect(16, 49, 236 * rf, 9);
    ctx.globalAlpha = 1;
    // 스킬 발동에 필요한 지점을 눈금으로 표시
    const markX = 16 + 236 * (curSkill().cost / RES_MAX);
    ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.fillRect(markX - 1, 46, 2, 15);
    ctx.font = "700 10px " + FONT; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.fillText(R.name + "  " + Math.floor(player.res), 20, 53);
    if (player.advance.length) {
      ctx.textAlign = "right";
      ctx.font = "700 11px " + FONT; ctx.fillStyle = advColor();
      ctx.fillText(advIcon() + " " + advName(), 248, 53);
      ctx.textAlign = "left";
    }
  }

  // 직업 자세 상태 — 지금 강해지고 있는지 한눈에 보여야 한다
  let cy = 68;
  if (C && C.stance) {
    ctx.fillStyle = "rgba(10,10,20,.6)";
    ctx.beginPath(); ctx.roundRect(14, cy, 240, 22, 6); ctx.fill();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    if (C.key === "paladin") {
      const on = player.bulwark > .5;
      ctx.font = "700 12px " + FONT;
      ctx.fillStyle = on ? "#ffd36e" : "rgba(255,255,255,.35)";
      ctx.fillText("🛡 방벽 " + (on ? "-" + Math.round((1 - player.dynArmor) * 100) + "%" : "대기"), 22, cy + 11);
      ctx.textAlign = "right";
      ctx.fillStyle = player.press > 0 ? "#ff9f6b" : "rgba(255,255,255,.3)";
      ctx.fillText("접전 ×" + player.press + "  (+" + Math.round((player.dynDmg - 1) * 100) + "%)", 248, cy + 11);
    } else {
      const st = Math.floor(player.channel), maxStage = 3 + traitLv("deepMana");
      ctx.font = "700 12px " + FONT;
      ctx.fillStyle = st > 0 ? "#9bb8ff" : "rgba(255,255,255,.35)";
      ctx.fillText("✦ 영창", 22, cy + 11);
      for (let i = 0; i < maxStage; i++) {
        ctx.fillStyle = i < st ? "#9bb8ff" : "rgba(255,255,255,.13)";
        ctx.beginPath(); ctx.roundRect(76 + i * 17, cy + 6, 13, 10, 3); ctx.fill();
      }
      ctx.textAlign = "right";
      ctx.fillStyle = st > 0 ? "#9bb8ff" : "rgba(255,255,255,.3)";
      ctx.fillText("피해 +" + Math.round((player.dynDmg - 1) * 100) + "%", 248, cy + 11);
    }
    cy += 26;
  }

  // 활성화된 속성 조합 — 지금 일하고 있는지가 보여야 한다
  for (const cb of COMBOS) {
    if (!player.combos.has(cb.key)) continue;
    const pr = comboProcs[cb.key];
    const fl = pr ? clamp(pr.flash, 0, 1) : 0;
    if (pr && pr.flash > 0) pr.flash -= 1 / 60;
    const ea = ELEMENTS[cb.a], eb = ELEMENTS[cb.b];
    ctx.fillStyle = fl > 0 ? "rgba(56,44,20," + (.6 + fl * .35).toFixed(2) + ")" : "rgba(10,10,20,.62)";
    ctx.beginPath(); ctx.roundRect(14, cy, 240, 24, 7); ctx.fill();
    ctx.strokeStyle = fl > 0 ? "rgba(255,225,150," + (.4 + fl * .6).toFixed(2) + ")" : "rgba(255,210,140,.28)";
    ctx.lineWidth = fl > 0 ? 2 : 1; ctx.stroke();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "11px " + FONT;
    ctx.fillStyle = ea.color; ctx.fillText(ea.icon, 21, cy + 12);
    ctx.fillStyle = "rgba(255,255,255,.3)"; ctx.fillText("+", 36, cy + 12);
    ctx.fillStyle = eb.color; ctx.fillText(eb.icon, 46, cy + 12);
    const done = player.mastered.has(cb.key);
    ctx.font = "700 11.5px " + FONT;
    ctx.fillStyle = done ? "#ffe9a8" : (fl > 0 ? "#fff3d0" : "#ffd9a0");
    ctx.fillText((done ? "★ " : "") + cb.name, 66, cy + 12);
    // 오른쪽은 한 줄로 합쳐 한 번만 정렬한다 (따로 그리면 긴 이름과 겹친다)
    const cnt = pr && pr.count ? "×" + pr.count.toLocaleString("ko-KR") : "";
    const prog = done ? "★" + MASTER_POWER + "배"
      : Math.min(elemLevel(cb.a), COMBO_MASTER) + "+" + Math.min(elemLevel(cb.b), COMBO_MASTER)
        + "/" + (COMBO_MASTER * 2);
    ctx.textAlign = "right";
    ctx.font = "700 10px " + FONT;
    ctx.fillStyle = done ? "#ffd34d" : "rgba(255,255,255,.42)";
    ctx.fillText((cnt ? cnt + "  ·  " : "") + prog, 246, cy + 12);
    ctx.textAlign = "left";
    cy += 27;
  }

  // 아직 안 열린 조합의 진행도 — 무엇을 얼마나 더 올려야 하는지 항상 떠 있게 한다
  const pending = combosPending();
  for (let i = 0; i < Math.min(3, pending.length); i++) {
    const { c, la, lb } = pending[i];
    const ea = ELEMENTS[c.a], eb = ELEMENTS[c.b];
    ctx.fillStyle = "rgba(10,10,20,.42)";
    ctx.beginPath(); ctx.roundRect(14, cy, 240, 22, 7); ctx.fill();
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.lineWidth = 1; ctx.stroke();
    ctx.setLineDash([]);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "700 10px " + FONT;
    ctx.fillStyle = la >= COMBO_LEVEL ? ea.color : "rgba(255,255,255,.32)";
    ctx.fillText(ea.icon + " " + la + "/" + COMBO_LEVEL, 21, cy + 11);
    ctx.fillStyle = lb >= COMBO_LEVEL ? eb.color : "rgba(255,255,255,.32)";
    ctx.fillText(eb.icon + " " + lb + "/" + COMBO_LEVEL, 76, cy + 11);
    ctx.textAlign = "right";
    ctx.font = "600 10.5px " + FONT; ctx.fillStyle = "rgba(255,255,255,.4)";
    ctx.fillText(c.name, 246, cy + 11);
    ctx.textAlign = "left";
    cy += 25;
  }

  // 타이머
  ctx.textAlign = "center";
  ctx.font = "800 30px " + FONT;
  ctx.lineWidth = 5; ctx.strokeStyle = "rgba(0,0,0,.7)";
  ctx.strokeText(fmtTime(Game.time), W / 2, 42);
  ctx.fillStyle = "#fff"; ctx.fillText(fmtTime(Game.time), W / 2, 42);

  // 처치 수 / 기록
  ctx.textAlign = "right"; ctx.font = "700 14px " + FONT;
  ctx.fillStyle = "rgba(255,255,255,.85)";
  ctx.fillText("☠ " + Game.kills, W - 16, 32);
  ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.font = "600 12px " + FONT;
  ctx.fillText("최고 기록 " + fmtTime(Game.bestTime), W - 16, 50);

  // 보유 무기 / 패시브
  let ix = 14;
  const drawSlot = (icon, level, tint) => {
    ctx.fillStyle = "rgba(10,10,20,.66)";
    ctx.beginPath(); ctx.roundRect(ix, H - 54, 40, 40, 8); ctx.fill();
    ctx.strokeStyle = tint; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.font = "20px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff"; ctx.fillText(icon, ix + 20, H - 35);
    ctx.font = "700 10px " + FONT; ctx.textAlign = "right";
    ctx.fillStyle = level >= MAX_LEVEL ? "#ffd34d" : "rgba(255,255,255,.8)";
    ctx.fillText(level >= MAX_LEVEL ? "최대" : level + "렙", ix + 37, H - 20);
    ix += 46;
  };
  for (const w of player.weapons) drawSlot(WEAPONS[w.key].icon, w.level, "rgba(255,210,120,.5)");
  ix += 12;
  for (const p of player.passives) drawSlot(PASSIVES[p.key].icon, p.level, "rgba(140,200,255,.4)");
  if (player.traits.length) {
    ix += 12;
    for (const t of player.traits) {
      const d = traitDefByKey(t.key);
      if (d) drawSlot(d.icon, t.level, (advColor() || "#c9a3ff") + "88");
    }
  }

  // ── 미니맵 — 어디에 뭐가 있는지 한눈에
  {
    const MM = 152, mx = W - MM - 16, my = H - MM - 76;
    const RANGE = 2400, sc = (MM / 2 - 6) / RANGE;
    ctx.save();
    ctx.fillStyle = "rgba(8,8,16,.78)";
    ctx.beginPath(); ctx.roundRect(mx, my, MM, MM, 10); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.roundRect(mx + 1, my + 1, MM - 2, MM - 2, 9); ctx.clip();
    const ccx = mx + MM / 2, ccy = my + MM / 2;

    // 적 밀도 — 전부 찍으면 무의미하므로 표본만
    ctx.fillStyle = "rgba(255,120,120,.32)";
    for (let i = 0; i < enemies.length; i += 4) {
      const e = enemies[i];
      if (!e.active || e.boss || e.sigilKey) continue;
      const dx = (e.x - player.x) * sc, dy = (e.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 || Math.abs(dy) > MM / 2) continue;
      ctx.fillRect(ccx + dx - 1, ccy + dy - 1, 2, 2);
    }
    // 지형 — 벽만 옅게
    ctx.fillStyle = "rgba(150,150,175,.30)";
    for (const o of obstacles) {
      if (!o.wall) continue;
      const dx = (o.x - player.x) * sc, dy = (o.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 - 3 || Math.abs(dy) > MM / 2 - 3) continue;
      ctx.fillRect(ccx + dx - 2, ccy + dy - 2, 4, 4);
    }
    // 지형지물
    for (const lm of landmarks) {
      const dx = (lm.x - player.x) * sc, dy = (lm.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 - 4 || Math.abs(dy) > MM / 2 - 4) continue;
      ctx.fillStyle = lm.T.color;
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, lm.type === "shrine" ? 4 : 3, 0, TAU); ctx.fill();
    }
    // 징표·아이템
    for (const pk of pickups) {
      if (!pk.active) continue;
      const dx = (pk.x - player.x) * sc, dy = (pk.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 - 4 || Math.abs(dy) > MM / 2 - 4) continue;
      const crit = pk.kind === "sigil";
      ctx.fillStyle = crit ? "#ffd34d" : "rgba(255,255,255,.5)";
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, crit ? 4 : 2, 0, TAU); ctx.fill();
    }
    // 보스·파수꾼 — 가장 크게, 맥동
    const bp = .6 + Math.sin(performance.now() / 180) * .4;
    for (const e of enemies) {
      if (!e.active || (!e.boss && !e.sigilKey)) continue;
      const dx = clamp((e.x - player.x) * sc, -MM / 2 + 6, MM / 2 - 6);
      const dy = clamp((e.y - player.y) * sc, -MM / 2 + 6, MM / 2 - 6);
      ctx.globalAlpha = bp;
      ctx.fillStyle = e.boss ? "#ff3b6b" : "#c9a3ff";
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, 6, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = e.boss ? "#ff3b6b" : "#c9a3ff"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, 9, 0, TAU); ctx.stroke();
    }
    // 플레이어
    ctx.fillStyle = "#fff";
    ctx.save(); ctx.translate(ccx, ccy); ctx.rotate(Math.atan2(player.faceY, player.faceX));
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.restore();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "700 9px " + FONT; ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.fillText(Math.round(RANGE / 10) + "m", mx + 6, my + MM - 9);
  }

  // ── 보스 체력바 — 살아 있는 동안 화면 위에
  {
    let boss = null;
    for (const e of enemies) if (e.active && (e.boss || e.sigilKey)) { boss = e; if (e.boss) break; }
    if (boss) {
      const bw = 420, bx = W / 2 - bw / 2, by = 64;
      const f = clamp(boss.hp / boss.maxHp, 0, 1);
      ctx.fillStyle = "rgba(0,0,0,.6)";
      ctx.beginPath(); ctx.roundRect(bx, by, bw, 16, 5); ctx.fill();
      ctx.fillStyle = boss.boss ? "#ff3b6b" : "#c9a3ff";
      ctx.beginPath(); ctx.roundRect(bx + 2, by + 2, (bw - 4) * f, 12, 4); ctx.fill();
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "700 11px " + FONT; ctx.fillStyle = "#fff";
      ctx.fillText((boss.boss ? (boss.type.title || "보스") : "제단의 파수꾼") + "  " + Math.ceil(boss.hp).toLocaleString("ko-KR"), W / 2, by + 8);
      // 화면 밖이면 방향까지
      const sx = boss.x - cam.x, sy = boss.y - cam.y;
      if (sx < 0 || sx > W || sy < 0 || sy > H) {
        const d = Math.round(Math.hypot(boss.x - player.x, boss.y - player.y) / 10);
        ctx.font = "700 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.6)";
        ctx.fillText(d + "m 떨어져 있음", W / 2, by + 28);
      }
    }
  }

  // 화면 밖 보스·파수꾼 방향 — 지형지물보다 강하게
  for (const e of enemies) {
    if (!e.active || (!e.boss && !e.sigilKey)) continue;
    const sx = e.x - cam.x, sy = e.y - cam.y;
    const m = 58;
    if (sx > m && sx < W - m && sy > m && sy < H - m) continue;
    const ax = clamp(sx, m, W - m), ay = clamp(sy, m, H - m);
    const ang = Math.atan2(sy - player.sy, sx - player.sx);
    const col = e.boss ? "#ff3b6b" : "#c9a3ff";
    ctx.save();
    ctx.globalAlpha = .7 + Math.sin(performance.now() / 170) * .3;
    ctx.translate(ax, ay); ctx.rotate(ang);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(24, 0); ctx.lineTo(-8, -13); ctx.lineTo(-8, 13); ctx.closePath(); ctx.fill();
    ctx.rotate(-ang);
    ctx.font = "800 12px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = col;
    ctx.fillText(e.boss ? (e.type.title || "보스") : "파수꾼", 0, -26);
    ctx.font = "700 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.fillText(Math.round(Math.hypot(e.x - player.x, e.y - player.y) / 10) + "m", 0, 26);
    ctx.restore();
  }

  // 화면 밖 지형지물 방향 표시 — 어디로 갈지 모르면 돌아다닐 수 없다
  for (const lm of landmarks) {
    const sx = lm.x - cam.x, sy = lm.y - cam.y;
    const m = 46;
    if (sx > m && sx < W - m && sy > m && sy < H - m) continue;
    const d = Math.hypot(lm.x - player.x, lm.y - player.y);
    if (d > 1500) continue;
    const ax = clamp(sx, m, W - m), ay = clamp(sy, m, H - m);
    const ang = Math.atan2(sy - player.sy, sx - player.sx);
    ctx.save();
    ctx.globalAlpha = clamp(1.4 - d / 1500, .3, .95);
    ctx.translate(ax, ay);
    ctx.rotate(ang);
    ctx.fillStyle = lm.T.color;
    ctx.beginPath();
    ctx.moveTo(14, 0); ctx.lineTo(-6, -8); ctx.lineTo(-6, 8);
    ctx.closePath(); ctx.fill();
    ctx.rotate(-ang);
    ctx.font = "17px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(lm.T.icon, 0, -20);
    ctx.font = "700 9px " + FONT; ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.fillText(Math.round(d / 10) + "m", 0, 18);
    ctx.restore();
  }

  // 소지품 (Q 로 사용)
  {
    const bw = 40, gap = 6;
    const bx0 = W - 16 - (bw * MAX_ITEMS + gap * (MAX_ITEMS - 1));
    for (let i = 0; i < MAX_ITEMS; i++) {
      const bx = bx0 + i * (bw + gap), by = H - 54;
      const key = player.items[i], C = key ? CONSUMABLES[key] : null;
      ctx.fillStyle = C ? "rgba(24,22,38,.92)" : "rgba(10,10,20,.5)";
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bw, 8); ctx.fill();
      ctx.strokeStyle = C ? (i === 0 ? C.color : C.color + "66") : "rgba(255,255,255,.1)";
      ctx.lineWidth = C && i === 0 ? 2 : 1; ctx.stroke();
      if (C) {
        ctx.font = "21px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(C.icon, bx + bw / 2, by + bw / 2);
      }
    }
    ctx.font = "600 10px " + FONT; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillStyle = player.items.length ? "rgba(255,255,255,.6)" : "rgba(255,255,255,.25)";
    ctx.fillText("Q 사용", W - 16, H - 66);
    if (player.items.length) {
      const C0 = CONSUMABLES[player.items[0]];
      ctx.font = "600 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.45)";
      ctx.fillText(C0.name, W - 16, H - 6);
    }
  }

  // 징표 · 버프
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.font = "700 14px " + FONT;
  ctx.fillStyle = player.sigils > 0 ? "#ffd34d" : "rgba(255,255,255,.28)";
  ctx.fillText("🔯 " + player.sigils, W - 16, 68);
  let by2 = 90;
  if (player.buffFury > 0) {
    ctx.font = "700 12px " + FONT; ctx.fillStyle = "#ff6b4a";
    ctx.fillText("🧪 광란 " + player.buffFury.toFixed(1) + "초", W - 16, by2); by2 += 20;
  }
  if (player.buffWard > 0) {
    ctx.font = "700 12px " + FONT; ctx.fillStyle = "#8fd0ff";
    ctx.fillText("🔰 수호 " + player.buffWard.toFixed(1) + "초", W - 16, by2); by2 += 20;
  }

  // 보스 미션 — 지금 무엇을 해야 하는지 항상 보이게 둔다
  if (Mission.on && !overlay) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const big = Mission.flash > 0;
    ctx.globalAlpha = big ? 1 : .9;
    ctx.font = (big ? "800 26px " : "800 17px ") + FONT;
    ctx.fillStyle = "#ff9a5c";
    ctx.fillText("❗ " + Mission.text, W / 2, big ? 150 : 82);
    if (Mission.sub) {
      ctx.font = (big ? "600 14px " : "600 11.5px ") + FONT;
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.fillText(Mission.sub, W / 2, (big ? 150 : 82) + (big ? 26 : 17));
    }
    // 남은 표식 개수
    ctx.font = "700 13px " + FONT; ctx.fillStyle = "#ffd34d";
    ctx.fillText("남은 " + Mission.marks.length + "개", W / 2, (big ? 150 : 82) + (big ? 50 : 33));
    ctx.globalAlpha = 1;
  }

  // 전직 대기 — 레벨은 됐는데 아직 때가 아닐 때
  if (Game.advanceWaitT > 0 && !Game.advancePending) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.globalAlpha = .55 + Math.sin(performance.now() / 420) * .2;
    ctx.font = "800 16px " + FONT; ctx.fillStyle = "#c9a3ff";
    const w = Math.max(0, Math.ceil(Game.advanceWaitT));
    ctx.fillText("⏳ " + ["1차", "2차", "3차", "4차"][Game.advanceWaitTier - 1] + " 각성까지 "
      + Math.floor(w / 60) + ":" + String(w % 60).padStart(2, "0"), W / 2, 108);
    ctx.globalAlpha = 1;
  }

  // 전직 대기 — 때는 됐는데 징표가 없을 때
  if (Game.advancePending) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const a = .65 + Math.sin(performance.now() / 320) * .3;
    ctx.globalAlpha = a;
    ctx.font = "800 17px " + FONT; ctx.fillStyle = "#ffd34d";
    ctx.fillText("⛩️ 전직 가능 — 전직의 징표가 필요하다", W / 2, 108);
    ctx.font = "600 12px " + FONT; ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillText("봉인된 제단의 파수꾼이나 보스를 쓰러뜨려라", W / 2, 128);
    ctx.globalAlpha = 1;
  }

  // 지형지물 알림
  if (Game.lmFlash > 0 && !overlay) {
    ctx.globalAlpha = Math.min(1, Game.lmFlash / 3 * 1.6);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 20px " + FONT; ctx.fillStyle = "#ffe9a8";
    ctx.fillText(Game.lmFlashText, W / 2, 206);
    ctx.globalAlpha = 1;
  }

  // 능동 스킬
  if (player.cls) {
    const C = player.cls, ready = player.res >= curSkill().cost;
    const bw = 62, bx = W / 2 - bw / 2, by = H - 106;
    ctx.save();
    if (ready) { ctx.shadowColor = C.resource.color; ctx.shadowBlur = 16; }
    ctx.fillStyle = ready ? "rgba(28,26,42,.95)" : "rgba(12,12,20,.7)";
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bw, 12); ctx.fill();
    ctx.strokeStyle = ready ? C.resource.color : "rgba(255,255,255,.14)";
    ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = ready ? 1 : .4;
    ctx.font = "30px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff"; ctx.fillText(curSkill().icon, bx + bw / 2, by + 28);
    ctx.font = "700 11px " + FONT;
    ctx.fillStyle = ready ? C.resource.color : "rgba(255,255,255,.55)";
    ctx.fillText(Math.min(100, Math.floor(player.res)) + " / " + curSkill().cost, bx + bw / 2, by + 50);
    ctx.globalAlpha = 1;
    // 이름과 단축키는 박스 밖에 — 62px 안에 한글 이름은 들어가지 않는다
    ctx.font = "700 12px " + FONT;
    ctx.fillStyle = ready ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.4)";
    ctx.fillText(curSkill().name, bx + bw / 2, by + bw + 12);
    ctx.font = "600 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.3)";
    ctx.fillText("스페이스", bx + bw / 2, by + bw + 27);
  }

  // 새 조합 해금 배너
  if (Game.comboFlash > 0 && !overlay) {
    const a = clamp(Game.comboFlash / 2.6, 0, 1);
    ctx.globalAlpha = Math.min(1, a * 1.6);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const last = COMBOS.filter(c => (Game.comboFlashMaster ? player.mastered : player.combos).has(c.key)).slice(-1)[0];
    const txt = last ? last.icon + " " + last.name + " — " + last.desc : "";
    ctx.font = "600 14px " + FONT;
    const bwid = Math.max(300, ctx.measureText(txt).width + 60);
    ctx.fillStyle = "rgba(10,8,18,.82)";
    ctx.beginPath(); ctx.roundRect(W / 2 - bwid / 2, 82, bwid, 62, 12); ctx.fill();
    ctx.strokeStyle = "rgba(255,217,160,.4)"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.font = "800 20px " + FONT; ctx.fillStyle = Game.comboFlashMaster ? "#ffe9a8" : "#ffd9a0";
    ctx.fillText(Game.comboFlashMaster ? "★ 조합 완성! 효과가 강해졌다" : "속성 조합 발동!", W / 2, 104);
    ctx.font = "600 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.8)";
    if (last) ctx.fillText(txt, W / 2, 128);
    ctx.globalAlpha = 1;
  }

  // 전직 연출
  if (Game.advanceFlash > 0 && !overlay) {
    const a = clamp(Game.advanceFlash / 3.2, 0, 1);
    ctx.globalAlpha = Math.min(1, a * 1.5);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 40px " + FONT; ctx.fillStyle = advColor();
    ctx.fillText(advIcon() + "  " + advName(), W / 2, 132);
    ctx.font = "700 15px " + FONT; ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillText(player.advance.length >= 3 ? "★ 각성 완료 — 규칙이 바뀌었다"
                                            : "전직 완료 — 스킬과 특성이 새로 열렸다", W / 2, 164);
    ctx.globalAlpha = 1;
  }

  // 사냥개 무리 경고
  if (Game.houndWarn > 0 && !overlay) {
    ctx.globalAlpha = Math.min(1, Game.houndWarn / 2.4 * 1.8) * (.6 + Math.abs(Math.sin(Game.time * 8)) * .4);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 24px " + FONT; ctx.fillStyle = "#ff9f6b";
    ctx.fillText("🐺 사냥개 무리가 온다 — 도망칠 수 없다", W / 2, 178);
    ctx.globalAlpha = 1;
  }

  // 조작 안내 (초반에만)
  if (Game.time < 8) {
    ctx.globalAlpha = clamp((8 - Game.time) / 3, 0, 1);
    ctx.textAlign = "center"; ctx.font = "600 15px " + FONT;
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.fillText("WASD 이동  ·  공격은 자동  ·  SPACE 직업 스킬  ·  Q 아이템  ·  맵의 🧰⛩️🗿 을 찾아라", W / 2, H - 100);
    ctx.globalAlpha = 1;
  }
}

/* ---------- 오버레이 ---------- */
function panel(x, y, w, h, r = 14, fill = "rgba(12,12,22,.92)", stroke = "rgba(255,255,255,.14)") {
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke();
}
const inRect = (mx, my, x, y, w, h) => mx >= x && mx <= x + w && my >= y && my <= y + h;

/* ---------- 시작 화면 ----------
   바로 직업 선택으로 들어가면 '무슨 게임인지' 알기 전에 고르게 된다.
   여기서 이름과 규칙 한 줄, 기록, 그리고 들어갈 문 두 개(시작 / 제단)만 보여준다.
   배경은 실제 게임의 도형을 그대로 써서, 정지 화면이 아니라 세계의 한 장면이 되게 한다. */
const introMobs = [];
function drawIntro() {
  Game.introT += 1 / 60;
  const t = Game.introT;

  // 배경 — 어둠 속에서 실루엣이 천천히 지나간다
  ctx.fillStyle = "#07070d";
  ctx.fillRect(0, 0, W, H);
  const g0 = ctx.createRadialGradient(W / 2, H * .42, 60, W / 2, H * .42, W * .62);
  g0.addColorStop(0, "rgba(60,44,96,.5)");
  g0.addColorStop(1, "rgba(6,6,12,0)");
  ctx.fillStyle = g0; ctx.fillRect(0, 0, W, H);

  if (!introMobs.length)
    for (let i = 0; i < 26; i++)
      introMobs.push({ x: rnd(W), y: rnd(H), sp: rnd(9, 26), s: rnd(.5, 1.3),
                       k: pick(["bat", "slime", "ghost", "zombie"]), ph: rnd(TAU) });
  for (const m of introMobs) {
    m.x -= m.sp / 60;
    if (m.x < -40) { m.x = W + 40; m.y = rnd(H); }
    const T = ENEMY_TYPES[m.k];
    ctx.save();
    ctx.globalAlpha = .16;
    ctx.fillStyle = T.color;
    const r = 13 * m.s, yy = m.y + Math.sin(t * 1.6 + m.ph) * 5;
    ctx.beginPath(); ctx.arc(m.x, yy, r, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // 불티
  for (let i = 0; i < 40; i++) {
    const a = (i * 97.3) % 1, sp = 14 + a * 30;
    const yy = H - ((t * sp + a * H) % (H + 60)) + 30;
    const xx = (i * 137.5) % W + Math.sin(t * .7 + i) * 14;
    ctx.globalAlpha = .10 + a * .2;
    ctx.fillStyle = "#ffb35c";
    ctx.fillRect(xx, yy, 2, 2 + a * 3);
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  // 문장(紋章) — 방패와 검
  const cx = W / 2, cy = 150;
  const bob = Math.sin(t * 1.3) * 4;
  ctx.save();
  ctx.translate(cx, cy + bob);
  ctx.globalAlpha = .28 + Math.sin(t * 2) * .08;
  ctx.fillStyle = "#ffd36e";
  ctx.beginPath(); ctx.arc(0, 0, 62, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#2a2438";
  ctx.beginPath();
  ctx.moveTo(0, -46); ctx.lineTo(38, -28); ctx.lineTo(38, 14);
  ctx.quadraticCurveTo(0, 52, 0, 52);
  ctx.quadraticCurveTo(0, 52, -38, 14);
  ctx.lineTo(-38, -28); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#ffd36e"; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = "#ffe9b8"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(0, 30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-16, -12); ctx.lineTo(16, -12); ctx.stroke();
  ctx.restore();

  // 제목
  ctx.font = "800 66px " + FONT;

  ctx.fillStyle = "#ff9a5c";

  panel(bx2, by, bw, bh, 12,
    hoverAltar ? "rgba(201,163,255,.2)" : "rgba(20,16,32,.9)",

  ctx.font = "800 20px " + FONT; ctx.fillStyle = "#c9a3ff";

    if (hoverStart) { Game.state = "title"; Sfx.play(520, .18, "triangle", .7, 260); return; }
    if (hoverAltar) { Game.introFrom = "intro"; Game.state = "altar"; return; }

  // 조작 · 규칙 한 줄씩
