# GitHub Pages 배포.
# game/index.html 하나만 있으면 되는 게임이라 빌드 단계가 없다.
# 다만 그 파일은 아티팩트로 올리려고 <!doctype> 없이 <meta> 부터 시작하므로,
# 정식 페이지로 서빙할 때는 doctype 을 앞에 붙여 표준 모드로 렌더되게 한다.
name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - claude/vampire-survival-game-uosewa
    paths:
      - "game/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 게 있으면 최신 것으로 대체한다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 사이트 구성
        run: |
          mkdir -p _site
          {
            printf '<!doctype html>\n'
            cat game/index.html
          } > _site/index.html
          # 링크를 받은 사람이 어떤 주소로 들어와도 게임이 뜨게 한다
          cp _site/index.html _site/404.html
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
