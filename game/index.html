function advanceOptions(tier) {
  // 4차 초월은 3차 최종형(32종)마다 따로 두지 않고 직업을 부모로 삼는다.
  // 경로마다 붙이면 데이터가 64개가 되고 하나하나가 얕아진다 — 갈래 수보다 무게가 중요하다.
  if (tier === 4) return ADVANCES.filter(a => a.tier === 4 && a.from === (player.cls && player.cls.key));
  const prev = player.advance[tier - 2];
  const from = tier === 1 ? (player.cls && player.cls.key) : (prev && prev.key);
  return ADVANCES.filter(a => a.tier === tier && a.from === from);
}
// 전직 스탯/자세/스킬은 나중에 얻은 것이 이긴다
function curSkill() {
  for (let i = player.advance.length - 1; i >= 0; i--)
    if (player.advance[i].skill) return player.advance[i].skill;
  return player.cls ? player.cls.skill : null;
}
function advVal(key, def) {
  let v = def;
  for (const a of player.advance)
    if (a.stanceMod && a.stanceMod[key] !== undefined) v = a.stanceMod[key];
  return v;
}
function advName() {
  return player.advance.length ? player.advance[player.advance.length - 1].name
                               : (player.cls ? player.cls.name : "");
}
function advColor() {
  return player.advance.length ? player.advance[player.advance.length - 1].color
                               : (player.cls ? player.cls.color : "#fff");
}

let selectedClass = 0;

/* ---------- 빛 ----------
   여기까지 오면서 그림은 조밀해졌는데 화면은 여전히 '전부 같은 밝기'였다.
   레퍼런스 그림과의 차이 중 픽셀 수로 설명되지 않는 가장 큰 것이 이것이다 —
   화톳불 옆이 밝고 구석이 어두우면 같은 그림도 공간이 된다.

   방식: 화면 크기의 1/4 짜리 판에 어둠을 깔고, 광원 자리를 지워(destination-out)
   구멍을 낸 뒤, 그 판을 확대해 월드 위에 덮는다.

   1/4 로 그리는 것이 핵심이다. 원본 해상도로 그리면 매끈한 그라디언트가 되어
   이 게임의 다른 모든 것(격자에 맞춘 픽셀)과 재질이 어긋난다.
   낮은 해상도에서 그린 뒤 보간 없이 늘리면 빛도 계단이 된다 —
   스프라이트의 lightMap 을 3단계로 끊은 것과 같은 이유다. */
const LIGHT_K = 4;
let lightCv = null, lightCtx = null;
function drawLighting() {
  if (!Opt.light) return;
  const lw = Math.ceil(W / LIGHT_K), lh = Math.ceil(H / LIGHT_K);
  if (!lightCv) { lightCv = document.createElement("canvas"); lightCtx = lightCv.getContext("2d"); }
  if (lightCv.width !== lw || lightCv.height !== lh) { lightCv.width = lw; lightCv.height = lh; }
  const g2 = lightCtx;
  const str = Opt.light === 1 ? .55 : 1;           // '약하게'
  g2.setTransform(1, 0, 0, 1, 0, 0);
  g2.globalCompositeOperation = "source-over";
  g2.clearRect(0, 0, lw, lh);
  g2.fillStyle = "rgba(8,6,22," + (.34 * str).toFixed(3) + ")";
  g2.fillRect(0, 0, lw, lh);
  // 가장자리를 더 어둡게 — 시선이 가운데로 모인다
  const vg = g2.createRadialGradient(lw / 2, lh / 2, lh * .32, lw / 2, lh / 2, lh * .95);
  vg.addColorStop(0, "rgba(6,4,16,0)");
  vg.addColorStop(1, "rgba(6,4,16," + (.30 * str).toFixed(3) + ")");
  g2.fillStyle = vg; g2.fillRect(0, 0, lw, lh);

  g2.globalCompositeOperation = "destination-out";
  const punch = (wx, wy, r, core) => {
    const cx = (wx - cam.x) / LIGHT_K, cy = (wy - cam.y) / LIGHT_K, rr = r / LIGHT_K;
    if (cx < -rr || cx > lw + rr || cy < -rr || cy > lh + rr) return;
    /* 정거리 감쇠(0→.5→1)는 가장자리에 동그란 테를 남긴다.
       실제 빛처럼 안쪽은 완만하고 바깥으로 갈수록 빨리 죽게 단계를 더 준다. */
    const k = core === undefined ? 1 : core;
    const gr = g2.createRadialGradient(cx, cy, 0, cx, cy, rr);
    gr.addColorStop(0, "rgba(0,0,0," + k.toFixed(3) + ")");
    gr.addColorStop(.40, "rgba(0,0,0," + (k * .82).toFixed(3) + ")");
    gr.addColorStop(.68, "rgba(0,0,0," + (k * .44).toFixed(3) + ")");
    gr.addColorStop(.87, "rgba(0,0,0," + (k * .14).toFixed(3) + ")");
    gr.addColorStop(1, "rgba(0,0,0,0)");
    g2.fillStyle = gr;
    g2.beginPath(); g2.arc(cx, cy, rr, 0, TAU); g2.fill();
  };

  /* 광원. 주인공은 반드시 넣는다 — 자기 발밑이 어두우면 게임이 안 된다. */
  punch(player.x, player.y, 310 + (player.stance ? 50 : 0));
  for (const o of obstacles) {
    if (o.kind === "brazier") punch(o.x, o.y - o.r * .4, o.r * 7 + Math.sin(Game.time * 6 + o.seed * 9) * 8);
    else if (o.kind === "lantern") punch(o.x + o.r * .6, o.y - o.r * 2.4, o.r * 8 + Math.sin(Game.time * 5 + o.seed * 9) * 6);
    else if (o.kind === "crystal") punch(o.x, o.y - o.r, o.r * 4.2, .8);
    else if (o.kind === "obelisk") punch(o.x, o.y - o.r * 2, o.r * 3.4, .6);
  }
  for (const st of structures) punch(st.x, st.y, st.r * 2.6, .75);
  for (const lm of landmarks) punch(lm.x, lm.y, 130, .8);
  for (const e of enemies) {
    if (!e.active) continue;
    if (e.boss || e.elite) punch(e.x, e.y, e.r * 4, .8);
  }
  /* 폭발은 그 순간 방을 밝힌다. 다만 타격 이펙트까지 광원으로 두면 안 된다 —
     후반에는 한 프레임에 백 개가 뜨고, 그만큼 겹치면 화면이 하얗게 날아간다.
     (실제로 그렇게 나왔다.) 폭발만, 그것도 여덟 개까지. */
  let nfx = 0;
  for (const f of fxs) {
    if (!f.active || f.key.indexOf("fx_boom") !== 0) continue;
    const t = clamp(f.life / f.maxLife, 0, 1);
    punch(f.x, f.y, ATLAS_FRAMES[f.key].w * f.scale * 1.5 * (1.2 - t * .4), t * .9);
    if (++nfx >= 8) break;
  }

  const blit = () => {
    ctx.save();
    ctx.setTransform(canvas.width / W, 0, 0, canvas.width / W, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(lightCv, 0, 0, lw, lh, 0, 0, lw * LIGHT_K, lh * LIGHT_K);
    ctx.restore();
    ctx.imageSmoothingEnabled = false;
  };
  blit();

  /* 따뜻한 덧빛. 어둠을 걷어내기만 해서는 불이 '타고 있다'가 안 된다 —
     걷어낸 자리는 그냥 원래 밝기일 뿐이다. 색을 얹어야 광원이 된다.
     같은 판을 지우고 다시 써서 캔버스를 하나만 쓴다. */
  g2.globalCompositeOperation = "source-over";
  g2.clearRect(0, 0, lw, lh);
  let warm = false;
  const glow = (wx, wy, r, col, a) => {
    const cx = (wx - cam.x) / LIGHT_K, cy = (wy - cam.y) / LIGHT_K, rr = r / LIGHT_K;
    if (cx < -rr || cx > lw + rr || cy < -rr || cy > lh + rr) return;
    const c = hexRGB(col);
    const gr = g2.createRadialGradient(cx, cy, 0, cx, cy, rr);
    gr.addColorStop(0, "rgba(" + c + "," + (a * str).toFixed(3) + ")");
    gr.addColorStop(.35, "rgba(" + c + "," + (a * str * .5).toFixed(3) + ")");
    gr.addColorStop(.65, "rgba(" + c + "," + (a * str * .18).toFixed(3) + ")");
    gr.addColorStop(1, "rgba(" + c + ",0)");
    g2.fillStyle = gr;
    g2.beginPath(); g2.arc(cx, cy, rr, 0, TAU); g2.fill();
    warm = true;
  };
  for (const o of obstacles) {
    if (o.kind === "brazier")
      glow(o.x, o.y - o.r * .4, o.r * 6 + Math.sin(Game.time * 6 + o.seed * 9) * 8, "#ff8a3c", .34);
    else if (o.kind === "lantern")
      glow(o.x + o.r * .6, o.y - o.r * 2.4, o.r * 7 + Math.sin(Game.time * 5 + o.seed * 9) * 6, "#ffc266", .3);
    else if (o.kind === "crystal") glow(o.x, o.y - o.r, o.r * 3.4, o.K.color, .2);
  }
  let gfx = 0;
  for (const f of fxs) {
    if (!f.active || f.key.indexOf("fx_boom") !== 0) continue;
    const t = clamp(f.life / f.maxLife, 0, 1);
    const el = f.key.split("_")[2];
    if (!el || !ELEMENTS[el]) continue;
    glow(f.x, f.y, ATLAS_FRAMES[f.key].w * f.scale * 1.6, ELEMENTS[el].color, .2 * t);
    if (++gfx >= 8) break;
  }
  if (warm) {
    ctx.globalCompositeOperation = "lighter";
    blit();
    ctx.globalCompositeOperation = "source-over";
  }
}

// "#rrggbb" → "r,g,b" — 그라디언트에 알파를 따로 붙이려면 숫자로 풀어야 한다
function hexRGB(h) {
  return parseInt(h.substr(1, 2), 16) + "," + parseInt(h.substr(3, 2), 16) + "," +
         parseInt(h.substr(5, 2), 16);
}

/* ---------- HUD ---------- */
function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ":" + String(s).padStart(2, "0");
}

function drawHUD() {
  const s = player.stats;
  // 선택 화면 위에는 전투 배너를 띄우지 않는다. (반드시 사용 지점보다 먼저 선언할 것 —
  // 아래쪽에 두었더니 조합 해금 배너가 뜨는 프레임마다 TDZ 예외가 나서 화면이 멈췄다)
  const overlay = Game.state === "levelup" || Game.state === "advance" || Game.state === "paused";

  // 경험치 바 (상단 전체)
  const xpf = clamp(player.xp / player.xpNext, 0, 1);
  ctx.fillStyle = "#0d0d18"; ctx.fillRect(0, 0, W, 14);
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "#3fa9ff"); g.addColorStop(1, "#7ce7ff");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W * xpf, 14);
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(0, 0, W, 4);
  ctx.font = "700 11px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff"; ctx.fillText(player.level + "레벨", 34, 7);

  // 체력
  const hpf = clamp(player.hp / s.maxHp, 0, 1);
  pxBar(14, 24, 240, 21, hpf, hpf > .3 ? "#3ddc84" : "#ff5b6b");
  ctx.font = "700 13px " + FONT; ctx.fillStyle = "#fff"; ctx.textAlign = "left";
  ctx.fillText(Math.ceil(player.hp) + " / " + Math.round(s.maxHp), 22, 34);

  // 직업 자원
  const C = player.cls;
  if (C) {
    const R = C.resource, rf = clamp(player.res / RES_MAX, 0, 1);
    const ready = player.res >= curSkill().cost;
    ctx.globalAlpha = ready ? 1 : .62;
    pxBar(14, 47, 240, 15, rf, R.color);
    ctx.globalAlpha = 1;
    // 스킬 발동에 필요한 지점을 눈금으로 표시
    const markX = Math.round((14 + PIX + (240 - PIX * 2) * (curSkill().cost / RES_MAX)) / PIX) * PIX;
    ctx.fillStyle = "rgba(255,255,255,.8)";
    ctx.beginPath(); pxR(markX, 45, PIX, 19); ctx.fill();
    ctx.font = "700 10px " + FONT; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.fillText(R.name + "  " + Math.floor(player.res), 20, 53);
    if (player.advance.length) {
      ctx.textAlign = "right";
      ctx.font = "700 11px " + FONT; ctx.fillStyle = advColor();
      drawMenuIcon("stance", 254, 49, advColor(), 2);
      ctx.fillText(advName(), 268, 53);
      ctx.textAlign = "left";
    }
  }

  // 직업 자세 상태 — 지금 강해지고 있는지 한눈에 보여야 한다
  let cy = 68;
  if (C && C.stance) {
    pxChip(14, cy, 240, 22, "rgba(10,10,20,.6)", null, 6);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    if (C.key === "paladin") {
      const on = player.bulwark > .5;
      ctx.font = "700 12px " + FONT;
      ctx.fillStyle = on ? "#ffd36e" : "rgba(255,255,255,.35)";
      drawMenuIcon("shield", 26, cy + 7, on ? "#ffd36e" : "#8a8598", 2);
    ctx.fillText("방벽 " + (on ? "-" + Math.round((1 - player.dynArmor) * 100) + "%" : "대기"), 40, cy + 11);
      ctx.textAlign = "right";
      ctx.fillStyle = player.press > 0 ? "#ff9f6b" : "rgba(255,255,255,.3)";
      ctx.fillText("접전 ×" + player.press + "  (+" + Math.round((player.dynDmg - 1) * 100) + "%)", 248, cy + 11);
    } else {
      const st = Math.floor(player.channel), maxStage = 3 + traitLv("deepMana");
      ctx.font = "700 12px " + FONT;
      ctx.fillStyle = st > 0 ? "#9bb8ff" : "rgba(255,255,255,.35)";
      drawMenuIcon("skill", 26, cy + 7, "#9bb8ff", 2);
    ctx.fillText("영창", 40, cy + 11);
      for (let i = 0; i < maxStage; i++) {
        pxChip(76 + i * 17, cy + 6, 13, 10, i < st ? "#9bb8ff" : "rgba(255,255,255,.13)", null, 3);
      }
      ctx.textAlign = "right";
      ctx.fillStyle = st > 0 ? "#9bb8ff" : "rgba(255,255,255,.3)";
      ctx.fillText("피해 +" + Math.round((player.dynDmg - 1) * 100) + "%", 248, cy + 11);
    }
    cy += 26;
  }

  // 활성화된 속성 조합 — 지금 일하고 있는지가 보여야 한다
  for (const cb of COMBOS) {
    if (!player.combos.has(cb.key)) continue;
    const pr = comboProcs[cb.key];
    const fl = pr ? clamp(pr.flash, 0, 1) : 0;
    if (pr && pr.flash > 0) pr.flash -= 1 / 60;
    const ea = ELEMENTS[cb.a], eb = ELEMENTS[cb.b];
    pxChip(14, cy, 240, 24,
      fl > 0 ? "rgba(56,44,20," + (.6 + fl * .35).toFixed(2) + ")" : "rgba(10,10,20,.62)",
      fl > 0 ? "rgba(255,225,150," + (.4 + fl * .6).toFixed(2) + ")" : "rgba(255,210,140,.28)", 7);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "11px " + FONT;
    drawMenuIcon("element", 22, cy + 8, ea.color, 2);
    ctx.fillStyle = "rgba(255,255,255,.3)"; ctx.fillText("+", 36, cy + 12);
    drawMenuIcon("element", 47, cy + 8, eb.color, 2);
    const done = player.mastered.has(cb.key);
    ctx.font = "700 11.5px " + FONT;
    ctx.fillStyle = done ? "#ffe9a8" : (fl > 0 ? "#fff3d0" : "#ffd9a0");
    ctx.fillText((done ? "★ " : "") + cb.name, 66, cy + 12);
    // 오른쪽은 한 줄로 합쳐 한 번만 정렬한다 (따로 그리면 긴 이름과 겹친다)
    const cnt = pr && pr.count ? "×" + pr.count.toLocaleString("ko-KR") : "";
    const prog = done ? "★" + MASTER_POWER + "배"
      : Math.min(elemLevel(cb.a), COMBO_MASTER) + "+" + Math.min(elemLevel(cb.b), COMBO_MASTER)
        + "/" + (COMBO_MASTER * 2);
    ctx.textAlign = "right";
    ctx.font = "700 10px " + FONT;
    ctx.fillStyle = done ? "#ffd34d" : "rgba(255,255,255,.42)";
    ctx.fillText((cnt ? cnt + "  ·  " : "") + prog, 246, cy + 12);
    ctx.textAlign = "left";
    cy += 27;
  }

  // 아직 안 열린 조합의 진행도 — 무엇을 얼마나 더 올려야 하는지 항상 떠 있게 한다
  const pending = combosPending();
  for (let i = 0; i < Math.min(3, pending.length); i++) {
    const { c, la, lb } = pending[i];
    const ea = ELEMENTS[c.a], eb = ELEMENTS[c.b];
    pxChip(14, cy, 240, 22, "rgba(10,10,20,.42)", "rgba(255,255,255,.16)", 7);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "700 10px " + FONT;
    ctx.fillStyle = la >= COMBO_LEVEL ? ea.color : "rgba(255,255,255,.32)";
    drawMenuIcon("element", 24, cy + 7, ea.color, 2); ctx.fillText(la + "/" + COMBO_LEVEL, 36, cy + 11);
    ctx.fillStyle = lb >= COMBO_LEVEL ? eb.color : "rgba(255,255,255,.32)";
    drawMenuIcon("element", 79, cy + 7, eb.color, 2); ctx.fillText(lb + "/" + COMBO_LEVEL, 91, cy + 11);
    ctx.textAlign = "right";
    ctx.font = "600 10.5px " + FONT; ctx.fillStyle = "rgba(255,255,255,.4)";
    ctx.fillText(c.name, 246, cy + 11);
    ctx.textAlign = "left";
    cy += 25;
  }

  // 타이머
  ctx.textAlign = "center";
  ctx.font = "800 30px " + FONT;
  ctx.lineWidth = 5; ctx.strokeStyle = "rgba(0,0,0,.7)";
  ctx.strokeText(fmtTime(Game.time), W / 2, 42);
  ctx.fillStyle = "#fff"; ctx.fillText(fmtTime(Game.time), W / 2, 42);

  // 처치 수 / 기록
  ctx.textAlign = "right"; ctx.font = "700 14px " + FONT;
  ctx.fillStyle = "rgba(255,255,255,.85)";
  ctx.fillText(String(Game.kills), W - 16, 32);
  drawMenuIcon("skull", W - 24 - ctx.measureText(String(Game.kills)).width, 31, "#e8e5da", 2);
  ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.font = "600 12px " + FONT;
  ctx.fillText("최고 기록 " + fmtTime(Game.bestTime), W - 16, 50);

  // 보유 무기 / 패시브
  let ix = 14;
  /* 칸 안의 그림도 픽셀이다. 직업 특성은 68종이라 저마다 판을 뜰 수 없어
     각성 색을 입힌 문장(紋章) 하나로 묶는다 — 이름은 레벨업 화면에서 이미 봤다. */
  const drawSlot = (px, level, tint, col) => {
    pxChip(ix, H - 54, 40, 40, "rgba(10,10,20,.66)", tint, 8);
    drawMenuIcon(px, ix + 20, H - 37, col, 3);
    ctx.font = "700 10px " + FONT; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillStyle = level >= MAX_LEVEL ? "#ffd34d" : "rgba(255,255,255,.8)";
    ctx.fillText(level >= MAX_LEVEL ? "최대" : level + "렙", ix + 37, H - 20);
    ix += 46;
  };
  for (const w of player.weapons) {
    const D = WEAPONS[w.key];
    drawSlot(D.px, w.level, "rgba(255,210,120,.5)", ELEMENTS[D.element].color);
  }
  ix += 12;
  for (const p of player.passives) drawSlot(PASSIVES[p.key].px, p.level, "rgba(140,200,255,.4)", "#8fd0ff");
  if (player.traits.length) {
    ix += 12;
    for (const t of player.traits)
      drawSlot("stance", t.level, (advColor() || "#c9a3ff") + "88", advColor() || "#c9a3ff");
  }

  // ── 미니맵 — 어디에 뭐가 있는지 한눈에
  {
    /* 오른쪽 아래는 터치 버튼 자리다 — 겹치면 미니맵을 누르다 스킬이 나간다.
       터치 기기에서는 오른쪽 위로 올리고, 좁은 화면에서는 크기도 줄인다. */
    const MM = narrow() ? 116 : 152;
    const mx = W - MM - 16, my = touch.seen ? 86 : H - MM - 76;
    const RANGE = 2400, sc = (MM / 2 - 6) / RANGE;
    ctx.save();
    pxChip(mx, my, MM, MM, "rgba(8,8,16,.78)", "rgba(255,255,255,.16)", 10);
    ctx.beginPath(); pxChipPath(mx + PIX, my + PIX, MM - PIX * 2, MM - PIX * 2, 8); ctx.clip();
    const ccx = mx + MM / 2, ccy = my + MM / 2;

    // 적 밀도 — 전부 찍으면 무의미하므로 표본만
    ctx.fillStyle = "rgba(255,120,120,.32)";
    for (let i = 0; i < enemies.length; i += 4) {
      const e = enemies[i];
      if (!e.active || e.boss || e.sigilKey) continue;
      const dx = (e.x - player.x) * sc, dy = (e.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 || Math.abs(dy) > MM / 2) continue;
      ctx.fillRect(ccx + dx - 1, ccy + dy - 1, 2, 2);
    }
    // 지형 — 벽만 옅게
    ctx.fillStyle = "rgba(150,150,175,.30)";
    for (const o of obstacles) {
      if (!o.wall) continue;
      const dx = (o.x - player.x) * sc, dy = (o.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 - 3 || Math.abs(dy) > MM / 2 - 3) continue;
      ctx.fillRect(ccx + dx - 2, ccy + dy - 2, 4, 4);
    }
    // 대형 구조물 — 가장 크게. 멀리서도 갈 값이 있는지 보여야 한다
    for (const s of structures) {
      const dx = (s.x - player.x) * sc, dy = (s.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 - 5 || Math.abs(dy) > MM / 2 - 5) continue;
      ctx.fillStyle = s.K.color;
      ctx.globalAlpha = s.st ? .55 + .45 * Math.abs(Math.sin(Game.time * 3)) : 1;
      ctx.fillRect(ccx + dx - 4, ccy + dy - 4, 8, 8);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "rgba(0,0,0,.7)"; ctx.lineWidth = 1;
      ctx.strokeRect(ccx + dx - 4, ccy + dy - 4, 8, 8);
    }
    // 지형지물
    for (const lm of landmarks) {
      const dx = (lm.x - player.x) * sc, dy = (lm.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 - 4 || Math.abs(dy) > MM / 2 - 4) continue;
      ctx.fillStyle = lm.T.color;
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, lm.type === "shrine" ? 4 : 3, 0, TAU); ctx.fill();
    }
    // 징표·아이템
    for (const pk of pickups) {
      if (!pk.active) continue;
      const dx = (pk.x - player.x) * sc, dy = (pk.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 - 4 || Math.abs(dy) > MM / 2 - 4) continue;
      const crit = pk.kind === "sigil";
      ctx.fillStyle = crit ? "#ffd34d" : "rgba(255,255,255,.5)";
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, crit ? 4 : 2, 0, TAU); ctx.fill();
    }
    // 보스·파수꾼 — 가장 크게, 맥동
    const bp = .6 + Math.sin(performance.now() / 180) * .4;
    for (const e of enemies) {
      if (!e.active || (!e.boss && !e.sigilKey)) continue;
      const dx = clamp((e.x - player.x) * sc, -MM / 2 + 6, MM / 2 - 6);
      const dy = clamp((e.y - player.y) * sc, -MM / 2 + 6, MM / 2 - 6);
      ctx.globalAlpha = bp;
      ctx.fillStyle = e.boss ? "#ff3b6b" : "#c9a3ff";
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, 6, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = e.boss ? "#ff3b6b" : "#c9a3ff"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, 9, 0, TAU); ctx.stroke();
    }
    // 플레이어
    ctx.fillStyle = "#fff";
    ctx.save(); ctx.translate(ccx, ccy); ctx.rotate(Math.atan2(player.faceY, player.faceX));
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.restore();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "700 9px " + FONT; ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.fillText(Math.round(RANGE / 10) + "m", mx + 6, my + MM - 9);
  }

  // ── 보스 체력바 — 살아 있는 동안 화면 위에
  {
    let boss = null;
    for (const e of enemies) if (e.active && (e.boss || e.sigilKey)) { boss = e; if (e.boss) break; }
    if (boss) {
      const bw = 420, bx = W / 2 - bw / 2, by = 64;
      const f = clamp(boss.hp / boss.maxHp, 0, 1);
      pxChip(bx, by, bw, 16, "rgba(0,0,0,.6)", "rgba(255,255,255,.14)", 5);
      pxChip(bx + PIX, by + PIX, (bw - PIX * 2) * f, 16 - PIX * 2,
             boss.boss ? "#ff3b6b" : "#c9a3ff", null, 3);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "700 11px " + FONT; ctx.fillStyle = "#fff";
      ctx.fillText((boss.boss ? (boss.type.title || "보스") : "제단의 파수꾼") + "  " + Math.ceil(boss.hp).toLocaleString("ko-KR"), W / 2, by + 8);
      // 화면 밖이면 방향까지
      const sx = boss.x - cam.x, sy = boss.y - cam.y;
      if (sx < 0 || sx > W || sy < 0 || sy > H) {
        const d = Math.round(Math.hypot(boss.x - player.x, boss.y - player.y) / 10);
        ctx.font = "700 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.6)";
        ctx.fillText(d + "m 떨어져 있음", W / 2, by + 28);
      }
    }
  }

  // 화면 밖 보스·파수꾼 방향 — 지형지물보다 강하게
  for (const e of enemies) {
    if (!e.active || (!e.boss && !e.sigilKey)) continue;
    const sx = e.x - cam.x, sy = e.y - cam.y;
    const m = 58;
    if (sx > m && sx < W - m && sy > m && sy < H - m) continue;
    const ax = clamp(sx, m, W - m), ay = clamp(sy, m, H - m);
    const ang = Math.atan2(sy - player.sy, sx - player.sx);
    const col = e.boss ? "#ff3b6b" : "#c9a3ff";
    ctx.save();
    ctx.globalAlpha = .7 + Math.sin(performance.now() / 170) * .3;
    ctx.translate(ax, ay); ctx.rotate(ang);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(24, 0); ctx.lineTo(-8, -13); ctx.lineTo(-8, 13); ctx.closePath(); ctx.fill();
    ctx.rotate(-ang);
    ctx.font = "800 12px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = col;
    ctx.fillText(e.boss ? (e.type.title || "보스") : "파수꾼", 0, -26);
    ctx.font = "700 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.fillText(Math.round(Math.hypot(e.x - player.x, e.y - player.y) / 10) + "m", 0, 26);
    ctx.restore();
  }

  // 화면 밖 지형지물 방향 표시 — 어디로 갈지 모르면 돌아다닐 수 없다
  // 구조물 — 한 판에 몇 개 없고 크게 돌아갈 값이 있어서 더 멀리서도 알려준다
  for (const s of structures) {
    const sx = s.x - cam.x, sy = s.y - cam.y;
    const m = 52;
    if (sx > m && sx < W - m && sy > m && sy < H - m) continue;
    const d = Math.hypot(s.x - player.x, s.y - player.y);
    if (d > 2600) continue;
    const ax = clamp(sx, m, W - m), ay = clamp(sy, m, H - m);
    const ang = Math.atan2(sy - player.sy, sx - player.sx);
    ctx.save();
    ctx.globalAlpha = clamp(1.5 - d / 2600, .35, .95) * (s.st ? .6 + .4 * Math.abs(Math.sin(Game.time * 4)) : 1);
    ctx.translate(ax, ay); ctx.rotate(ang);
    ctx.fillStyle = s.K.color;
    ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-7, -10); ctx.lineTo(-7, 10); ctx.closePath(); ctx.fill();
    ctx.rotate(-ang);
    ctx.font = "700 11px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = s.K.color;
    iconText(s.K.px, s.K.name, 0, -20, s.K.color, 2);
    ctx.font = "600 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillText(Math.round(d / 10) + "m" + (s.st ? " · 가동 중" : ""), 0, 20);
    ctx.restore();
  }

  for (const lm of landmarks) {
    const sx = lm.x - cam.x, sy = lm.y - cam.y;
    const m = 46;
    if (sx > m && sx < W - m && sy > m && sy < H - m) continue;
    const d = Math.hypot(lm.x - player.x, lm.y - player.y);
    if (d > 1500) continue;
    const ax = clamp(sx, m, W - m), ay = clamp(sy, m, H - m);
    const ang = Math.atan2(sy - player.sy, sx - player.sx);
    ctx.save();
    ctx.globalAlpha = clamp(1.4 - d / 1500, .3, .95);
    ctx.translate(ax, ay);
    ctx.rotate(ang);
    ctx.fillStyle = lm.T.color;
    ctx.beginPath();
    ctx.moveTo(14, 0); ctx.lineTo(-6, -8); ctx.lineTo(-6, 8);
    ctx.closePath(); ctx.fill();
    ctx.rotate(-ang);
    ctx.font = "17px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    drawMenuIcon(lm.T.px, 0, -20, lm.T.color, 3);
    ctx.font = "700 9px " + FONT; ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.fillText(Math.round(d / 10) + "m", 0, 18);
    ctx.restore();
  }

  // 소지품 (Q 로 사용)
  {
    const bw = 40, gap = 6;
    const slotW = bw * MAX_ITEMS + gap * (MAX_ITEMS - 1);
    const bx0 = touch.seen ? 16 : W - 16 - slotW;
    for (let i = 0; i < MAX_ITEMS; i++) {
      const bx = bx0 + i * (bw + gap), by = H - 54;
      const key = player.items[i], C = key ? CONSUMABLES[key] : null;
      pxChip(bx, by, bw, bw, C ? "rgba(24,22,38,.92)" : "rgba(10,10,20,.5)",
             C ? (i === 0 ? C.color : C.color + "66") : "rgba(255,255,255,.1)", 8);
      if (C) {
        ctx.font = "21px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        drawMenuIcon(C.px, bx + bw / 2, by + bw / 2, C.color, 3);
      }
    }
    const lx = touch.seen ? 16 : W - 16;
    ctx.font = "600 10px " + FONT;
    ctx.textAlign = touch.seen ? "left" : "right"; ctx.textBaseline = "middle";
    ctx.fillStyle = player.items.length ? "rgba(255,255,255,.6)" : "rgba(255,255,255,.25)";
    if (!touch.seen) ctx.fillText("Q 사용", lx, H - 66);
    if (player.items.length) {
      const C0 = CONSUMABLES[player.items[0]];
      ctx.font = "600 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.45)";
      ctx.fillText(C0.name, lx, H - 6);
    }
  }

  // 징표 · 버프
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.font = "700 14px " + FONT;
  ctx.fillStyle = player.sigils > 0 ? "#ffd34d" : "rgba(255,255,255,.28)";
  ctx.fillText(String(player.sigils), W - 16, 68);
  drawMenuIcon("sigil", W - 24 - ctx.measureText(String(player.sigils)).width, 67, "#ffd34d", 2);
  let by2 = 90;
  if (player.buffFury > 0) {
    ctx.font = "700 12px " + FONT; ctx.fillStyle = "#ff6b4a";
    { const t = "광란 " + player.buffFury.toFixed(1) + "초";
      ctx.fillText(t, W - 16, by2);
      drawMenuIcon("flask", W - 24 - ctx.measureText(t).width, by2 - 1, "#ff6b4a", 2); }
    by2 += 20;
  }
  if (player.buffWard > 0) {
    ctx.font = "700 12px " + FONT; ctx.fillStyle = "#8fd0ff";
    { const t = "수호 " + player.buffWard.toFixed(1) + "초";
      ctx.fillText(t, W - 16, by2);
      drawMenuIcon("shield", W - 24 - ctx.measureText(t).width, by2 - 1, "#8fd0ff", 2); }
    by2 += 20;
  }

  // 보스 미션 — 지금 무엇을 해야 하는지 항상 보이게 둔다
  if (Mission.on && !overlay) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const big = Mission.flash > 0;
    /* 좁은 화면에서는 왼쪽 위의 조합 줄이 세로로 길게 서서 이 배너와 겹친다 —
       가운데 정렬이라 그 위를 그대로 지나간다. 좁으면 그 아래로 내린다. */
    const my = big ? 150 : narrow() ? 152 : 82;
    ctx.globalAlpha = big ? 1 : .9;
    fitFont("800", big ? 26 : 17, Mission.text, W - 60);
    ctx.fillStyle = "#ff9a5c";
    iconText("alert", Mission.text, W / 2, my, "#ff5b6b", big ? 3 : 2);
    if (Mission.sub) {
      fitFont("600", big ? 14 : 11.5, Mission.sub, W - 40);
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.fillText(Mission.sub, W / 2, my + (big ? 26 : 17));
    }
    // 남은 표식 개수
    ctx.font = "700 13px " + FONT; ctx.fillStyle = "#ffd34d";
    ctx.fillText("남은 " + Mission.marks.length + "개", W / 2, my + (big ? 50 : 33));
    ctx.globalAlpha = 1;
  }

  // 전직 대기 — 레벨은 됐는데 아직 때가 아닐 때
  if (Game.advanceWaitT > 0 && !Game.advancePending) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.globalAlpha = .55 + Math.sin(performance.now() / 420) * .2;
    ctx.font = "800 16px " + FONT; ctx.fillStyle = "#c9a3ff";
    const w = Math.max(0, Math.ceil(Game.advanceWaitT));
    ctx.fillText("⏳ " + ["1차", "2차", "3차", "4차"][Game.advanceWaitTier - 1] + " 각성까지 "
      + Math.floor(w / 60) + ":" + String(w % 60).padStart(2, "0"), W / 2, 108);
    ctx.globalAlpha = 1;
  }

  // 전직 대기 — 때는 됐는데 징표가 없을 때
  if (Game.advancePending) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const a = .65 + Math.sin(performance.now() / 320) * .3;
    ctx.globalAlpha = a;
    ctx.font = "800 17px " + FONT; ctx.fillStyle = "#ffd34d";
    iconText("shrine", "전직 가능 — 전직의 징표가 필요하다", W / 2, 108, "#c9a3ff", 2);
    ctx.font = "600 12px " + FONT; ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillText("봉인된 제단의 파수꾼이나 보스를 쓰러뜨려라", W / 2, 128);
    ctx.globalAlpha = 1;
  }

  // 지형지물 알림
  if (Game.lmFlash > 0 && !overlay) {
    ctx.globalAlpha = Math.min(1, Game.lmFlash / 3 * 1.6);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 20px " + FONT; ctx.fillStyle = "#ffe9a8";
    ctx.fillText(Game.lmFlashText, W / 2, 206);
    ctx.globalAlpha = 1;
  }

  // 능동 스킬 — 터치에서는 오른쪽 아래 버튼이 같은 일을 하므로 그리지 않는다
  if (player.cls && !touch.seen) {
    const C = player.cls, ready = player.res >= curSkill().cost;
    const bw = 62, bx = W / 2 - bw / 2, by = H - 106;
    ctx.save();
    if (ready) { ctx.shadowColor = C.resource.color; ctx.shadowBlur = 16; }
    pxChip(bx, by, bw, bw, ready ? "rgba(28,26,42,.95)" : "rgba(12,12,20,.7)",
           ready ? C.resource.color : "rgba(255,255,255,.14)", 12);
    ctx.restore();
    ctx.globalAlpha = ready ? 1 : .4;
    ctx.font = "30px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    drawMenuIcon("skill", bx + bw / 2, by + 26, C.color, 4);
    ctx.font = "700 11px " + FONT;
    ctx.fillStyle = ready ? C.resource.color : "rgba(255,255,255,.55)";
    ctx.fillText(Math.min(100, Math.floor(player.res)) + " / " + curSkill().cost, bx + bw / 2, by + 50);
    ctx.globalAlpha = 1;
    // 이름과 단축키는 박스 밖에 — 62px 안에 한글 이름은 들어가지 않는다
    ctx.font = "700 12px " + FONT;
    ctx.fillStyle = ready ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.4)";
    ctx.fillText(curSkill().name, bx + bw / 2, by + bw + 12);
    ctx.font = "600 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.3)";
    ctx.fillText("스페이스", bx + bw / 2, by + bw + 27);
  }

  // 새 조합 해금 배너
  if (Game.comboFlash > 0 && !overlay) {
    const a = clamp(Game.comboFlash / 2.6, 0, 1);
    ctx.globalAlpha = Math.min(1, a * 1.6);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const last = COMBOS.filter(c => (Game.comboFlashMaster ? player.mastered : player.combos).has(c.key)).slice(-1)[0];
    const txt = last ? last.name + " — " + last.desc : "";
    ctx.font = "600 14px " + FONT;
    const bwid = Math.max(300, ctx.measureText(txt).width + 60);
    pxChip(W / 2 - bwid / 2, 82, bwid, 62, "rgba(10,8,18,.82)", "rgba(255,217,160,.4)", 12);
    ctx.font = "800 20px " + FONT; ctx.fillStyle = Game.comboFlashMaster ? "#ffe9a8" : "#ffd9a0";
    ctx.fillText(Game.comboFlashMaster ? "★ 조합 완성! 효과가 강해졌다" : "속성 조합 발동!", W / 2, 104);
    ctx.font = "600 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.8)";
    if (last) ctx.fillText(txt, W / 2, 128);
    ctx.globalAlpha = 1;
  }

  // 전직 연출
  if (Game.advanceFlash > 0 && !overlay) {
    const a = clamp(Game.advanceFlash / 3.2, 0, 1);
    ctx.globalAlpha = Math.min(1, a * 1.5);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 40px " + FONT; ctx.fillStyle = advColor();
    iconText("stance", advName(), W / 2, 132, advColor(), 3);
    ctx.font = "700 15px " + FONT; ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillText(player.advance.length >= 3 ? "★ 각성 완료 — 규칙이 바뀌었다"
                                            : "전직 완료 — 스킬과 특성이 새로 열렸다", W / 2, 164);
    ctx.globalAlpha = 1;
  }

  // 사냥개 무리 경고
  if (Game.houndWarn > 0 && !overlay) {
    ctx.globalAlpha = Math.min(1, Game.houndWarn / 2.4 * 1.8) * (.6 + Math.abs(Math.sin(Game.time * 8)) * .4);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 24px " + FONT; ctx.fillStyle = "#ff9f6b";
    iconText("wolf", "사냥개 무리가 온다 — 도망칠 수 없다", W / 2, 178, "#d8a86a", 3);
    ctx.globalAlpha = 1;
  }

  // 조작 안내 (초반에만)
  if (Game.time < 8) {
    ctx.globalAlpha = clamp((8 - Game.time) / 3, 0, 1);
    ctx.textAlign = "center"; ctx.font = "600 15px " + FONT;
    ctx.fillStyle = "rgba(255,255,255,.75)";
    const tip = touch.seen
      ? "끌어서 이동  ·  공격은 자동  ·  오른쪽 아래 버튼으로 스킬과 아이템"
      : "WASD 이동  ·  공격은 자동  ·  SPACE 직업 스킬  ·  Q 아이템  ·  맵의 보물을 찾아라";
    fitFont("600", 13, tip, W - 32);
    ctx.fillText(tip, W / 2, H - 100);
    ctx.globalAlpha = 1;
  }

  if (touch.seen && !overlay) drawTouchControls();
}

/* 터치 조작을 눈에 보이게 그린다.
   조이스틱은 여태 '보이지 않는' 물건이었다 — 어디를 눌러야 하는지, 지금 얼마나 기울었는지
   알 방법이 없었다. 버튼은 아예 없었다. */
function drawTouchControls() {
  if (touch.pressT > 0) touch.pressT = Math.max(0, touch.pressT - 1 / 60);

  // 조이스틱 — 누른 자리에 테와 손잡이
  if (touch.active) {
    const dx = touch.x - touch.ox, dy = touch.y - touch.oy;
    const len = Math.hypot(dx, dy), R = 56;
    const k = len > R ? R / len : 1;
    ctx.globalAlpha = .5;
    pxRing(touch.ox, touch.oy, R, PIX, pxPal("#e8e5da"));
    ctx.globalAlpha = .8;
    ctx.fillStyle = "#e8e5da"; ctx.beginPath();
    pxEllipse(touch.ox + dx * k, touch.oy + dy * k, 15, 15); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 스킬 · 아이템 · 일시정지 버튼
  const sk = curSkill();
  for (const b of touchBtns()) {
    if (b.key === "pause") {              // 두 줄 — 흔한 일시정지 표시
      ctx.globalAlpha = .8;
      ctx.fillStyle = "rgba(10,10,20,.72)";
      ctx.beginPath(); pxEllipse(b.x, b.y, b.r, b.r); ctx.fill();
      pxRing(b.x, b.y, b.r, PIX, pxPal("#e8e5da"));
      ctx.fillStyle = "#e8e5da"; ctx.beginPath();
      pxR(b.x - 7, b.y - 9, 5, 18); pxR(b.x + 3, b.y - 9, 5, 18); ctx.fill();
      ctx.globalAlpha = 1;
      continue;
    }
    const isSkill = b.key === "skill";
    const ready = isSkill ? (sk && player.res >= sk.cost) : player.items.length > 0;
    const col = isSkill ? (player.cls ? player.cls.color : "#ffd36e") : "#8fd0ff";
    const hit = touch.press === b.key && touch.pressT > 0;

    ctx.globalAlpha = ready ? .92 : .4;
    ctx.fillStyle = "rgba(10,10,20,.72)";
    ctx.beginPath(); pxEllipse(b.x, b.y, b.r, b.r); ctx.fill();
    pxRing(b.x, b.y, b.r, hit ? PIX * 2 : PIX, pxPal(col));

    // 자원이 차는 만큼 안쪽이 찬다 — 언제 쓸 수 있는지 버튼만 봐도 알아야 한다
    if (isSkill && sk) {
      const f = clamp(player.res / sk.cost, 0, 1);
      if (f > 0) {
        ctx.globalAlpha = ready ? .34 : .22;
        ctx.fillStyle = col;
        ctx.beginPath();
        pxEllipse(b.x, b.y + b.r * (1 - f), b.r * .82, b.r * .82 * f); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    drawMenuIcon(isSkill ? "skill" : "gem", b.x, b.y - 5, ready ? col : "#6b6480", 3);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "700 10px " + FONT;
    ctx.fillStyle = ready ? "rgba(255,255,255,.85)" : "rgba(255,255,255,.4)";
    ctx.fillText(isSkill ? b.label : (player.items.length || "") + " " + b.label, b.x, b.y + b.r - 12);
  }
}

/* ---------- 오버레이 ---------- */
/* 막대 하나 — 체력 · 직업 자원. 예전에는 fillRect 두 번이라 종이처럼 납작했다.
   틀을 두르고 채움의 윗줄만 밝게 하면 같은 값으로 두께가 생긴다.
   빛은 위에서 온다 — 스프라이트·지형·이펙트와 같은 규칙이다. */
/* 막대. 예전에는 몸통 한 색에 윗줄 한 색, 그리고 검은 홈뿐이었다 — 넷.
   막대는 화면에서 늘 보이는 것이라 여기가 밋밋하면 UI 전체가 밋밋해 보인다.
   홈 둘 · 채움 넷 · 앞머리 하나로 아홉 단계를 쓴다.
   앞머리(선두의 밝은 한 칸)가 특히 중요하다 — 그게 있어야 '차오르는 중'으로 읽힌다. */
function pxBar(x, y, w, h, f, color, track) {
  pxChip(x, y, w, h, track || "rgba(0,0,0,.62)", "rgba(255,255,255,.13)", 4);
  ctx.fillStyle = "rgba(0,0,0,.4)";                            // 홈 안쪽의 깊은 그늘
  ctx.beginPath(); pxR(x + PIX, y + PIX, w - PIX * 2, PIX); ctx.fill();
  const iw = Math.max(0, (w - PIX * 2) * clamp(f, 0, 1));
  if (iw < PIX) return;
  const pal = pxPal(color);
  ctx.fillStyle = pal[2];                                      // 몸통
  ctx.beginPath(); pxR(x + PIX, y + PIX, iw, h - PIX * 2); ctx.fill();
  ctx.fillStyle = pal[1];                                      // 위쪽 밝은 면
  ctx.beginPath(); pxR(x + PIX, y + PIX, iw, PIX); ctx.fill();
  ctx.fillStyle = pal[0];                                      // 그 위 한 줄의 광
  ctx.beginPath(); pxR(x + PIX, y + PIX, iw, Math.min(PIX, h / 4)); ctx.fill();
  ctx.globalAlpha = .3;
  ctx.fillStyle = "#000";                                      // 아래쪽 그늘
  ctx.beginPath(); pxR(x + PIX, y + h - PIX * 2, iw, PIX); ctx.fill();
  ctx.globalAlpha = 1;
  if (iw >= PIX * 2 && f < .995) {                             // 앞머리 — 차오르는 중이라는 표시
    ctx.fillStyle = pal[0];
    ctx.beginPath(); pxR(x + PIX + iw - PIX, y + PIX, PIX, h - PIX * 2); ctx.fill();
  }
}

/* 작은 칸 — 배지 · 조합 줄 · HUD 막대 · 슬롯 · 미니맵 테. panel() 의 축소판이다.
   화면에 둥근 모서리가 하나라도 남으면 그것만 재질이 달라 눈에 띈다.
   fill 을 생략하면 테두리만 그린다(이미 그려진 것 위에 액자만 두를 때). */
function pxChipPath(x, y, w, h, r) {
  const P = PIX;
  const x0 = Math.round(x / P) * P, y0 = Math.round(y / P) * P;
  const w0 = Math.max(P * 2, Math.round(w / P) * P), h0 = Math.max(P * 2, Math.round(h / P) * P);
  const c = clamp(Math.round((r === undefined ? 6 : r) / P / 2), 0,
                  Math.min(3, Math.floor(h0 / P / 2), Math.floor(w0 / P / 2)));
  if (!c) { ctx.rect(x0, y0, w0, h0); return; }
  for (let i = 0; i < c; i++) {
    const ins = (c - i) * P;
    ctx.rect(x0 + ins, y0 + i * P, w0 - ins * 2, P);
    ctx.rect(x0 + ins, y0 + h0 - (i + 1) * P, w0 - ins * 2, P);
  }
  ctx.rect(x0, y0 + c * P, w0, h0 - c * 2 * P);
}
function pxChip(x, y, w, h, fill, stroke, r) {
  const P = PIX;
  if (stroke) {
    ctx.fillStyle = stroke;
    ctx.beginPath(); pxChipPath(x, y, w, h, r); ctx.fill();
    /* 테에 경사. panel() 과 같은 규칙이다 — 위·왼쪽은 밝고 아래·오른쪽은 어둡다.
       반투명으로 덮으므로 테 색이 무엇이든 통하고, 자리를 하나도 안 먹는다.
       화면에 이 칸이 수십 개라 여기 한 줄이 UI 전체의 재질을 정한다. */
    const co = (r || 6) - P;
    ctx.fillStyle = "rgba(255,255,255,.16)";
    ctx.beginPath();
    ctx.rect(x + co, y, w - co * 2, P);
    ctx.rect(x, y + co, P, h - co * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.3)";
    ctx.beginPath();
    ctx.rect(x + co, y + h - P, w - co * 2, P);
    ctx.rect(x + w - P, y + co, P, h - co * 2);
    ctx.fill();
    if (fill) {
      ctx.fillStyle = fill;
      ctx.beginPath(); pxChipPath(x + P, y + P, w - P * 2, h - P * 2, co); ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,.22)";                  // 안쪽 위의 그늘 — 파인 것처럼
      ctx.beginPath(); ctx.rect(x + P + co, y + P, w - P * 2 - co * 2, P); ctx.fill();
    }
  } else if (fill) {
    ctx.fillStyle = fill;
    ctx.beginPath(); pxChipPath(x, y, w, h, r); ctx.fill();
  }
}

/* 화면의 모든 칸(직업 카드 · 레벨업 카드 · 제단 줄 · 설정 줄 · 일시정지 · 결과)이
   이 함수 하나를 쓴다. 예전에는 `roundRect` 에 1.5px 선 하나였다 —
   가장자리가 부드러워 게임의 다른 모든 것과 재질이 어긋났고, 웹 페이지처럼 보였다.

   지금은 격자에 맞춘 액자다. 바깥 검은 테 · 상태색 테 · 안쪽 판, 그리고
   위·왼쪽에 광, 아래·오른쪽에 그늘 — 빛 방향은 스프라이트·지형과 같은 왼쪽 위다.
   모서리는 둥글리는 대신 계단으로 깎는다. 픽셀에서 곡선은 계단이지, 곡선이 아니다. */
function panel(x, y, w, h, r = 14, fill = "rgba(12,12,22,.92)", stroke = "rgba(255,255,255,.14)") {
  const P = PIX;
  // 격자에 안 맞추면 테두리 굵기가 칸마다 달라져 액자가 흔들린다
  const x0 = Math.round(x / P) * P, y0 = Math.round(y / P) * P;
  const w0 = Math.max(P * 8, Math.round(w / P) * P);
  const h0 = Math.max(P * 8, Math.round(h / P) * P);
  const cut = clamp(Math.round(r / P / 2), 1, Math.min(4, Math.floor(h0 / P / 2) - 2));
  const shape = (xx, yy, ww, hh, c) => {
    for (let i = 0; i < c; i++) {
      const ins = (c - i) * P;
      ctx.rect(xx + ins, yy + i * P, ww - ins * 2, P);
      ctx.rect(xx + ins, yy + hh - (i + 1) * P, ww - ins * 2, P);
    }
    ctx.rect(xx, yy + c * P, ww, hh - c * 2 * P);
  };
  /* 액자에 색을 늘리되 **크기는 건드리지 않는다.**

     처음엔 테를 두 칸에서 네 칸으로 두껍게 만들었다. 색은 늘었는데 안쪽이 두 칸씩
     줄어서, 제단 줄 아래의 진행 막대가 테에 잘렸다. 화면 구성 요소의 자리는
     이 함수 바깥에 박혀 있으므로 액자가 자리를 먹으면 안 된다.

     그래서 같은 두 칸 안에서 색을 늘린다 —
     상태색 테에 경사를 준다(위·왼쪽은 밝게, 아래·오른쪽은 어둡게).
     반투명으로 덮으므로 상태색이 무엇이든 통한다. 여기에 네 귀퉁이의 못과
     안쪽 판의 두 단 광·두 단 그늘이 붙어 색 열하나가 된다. */
  ctx.fillStyle = "#07070d";                                   // 바깥 테
  ctx.beginPath(); shape(x0, y0, w0, h0, cut); ctx.fill();
  ctx.fillStyle = stroke;                                      // 상태색 테
  const bc = Math.max(1, cut - 1);
  ctx.beginPath(); shape(x0 + P, y0 + P, w0 - P * 2, h0 - P * 2, bc); ctx.fill();
  // 테의 경사 — 금속이라면 위가 밝고 아래가 어둡다
  const bx = x0 + P, by = y0 + P, bw = w0 - P * 2, bh = h0 - P * 2, bo = bc * P;
  ctx.fillStyle = "rgba(255,255,255,.24)";
  ctx.beginPath();
  ctx.rect(bx + bo, by, bw - bo * 2, P);
  ctx.rect(bx, by + bo, P, bh - bo * 2);
  ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.38)";
  ctx.beginPath();
  ctx.rect(bx + bo, by + bh - P, bw - bo * 2, P);
  ctx.rect(bx + bw - P, by + bo, P, bh - bo * 2);
  ctx.fill();

  ctx.fillStyle = fill;                                        // 안쪽 판
  ctx.beginPath(); shape(x0 + P * 2, y0 + P * 2, w0 - P * 4, h0 - P * 4, bc); ctx.fill();
  const ix = x0 + P * 2, iy = y0 + P * 2, iw = w0 - P * 4, ih = h0 - P * 4;
  const ic = bc * P;
  ctx.fillStyle = "rgba(255,255,255,.10)";                     // 위·왼쪽 광
  ctx.beginPath();
  ctx.rect(ix + ic, iy, iw - ic * 2, P);
  ctx.rect(ix, iy + ic, P, ih - ic * 2);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.04)";                     // 그 아래 한 단 — 두께가 생긴다
  ctx.beginPath(); ctx.rect(ix + ic, iy + P, iw - ic * 2, P); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.46)";                           // 아래·오른쪽 그늘
  ctx.beginPath();
  ctx.rect(ix + ic, iy + ih - P, iw - ic * 2, P);
  ctx.rect(ix + iw - P, iy + ic, P, ih - ic * 2);
  ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.2)";
  ctx.beginPath(); ctx.rect(ix + ic, iy + ih - P * 2, iw - ic * 2, P); ctx.fill();

  /* 네 귀퉁이의 못. 액자가 '벽에 박혀 있다'가 되려면 고정된 자리가 보여야 한다.
     상태색 테 위에 찍으므로 안쪽 자리를 먹지 않는다. */
  const nd = bo + P;
  ctx.fillStyle = "#8d94a8";
  ctx.beginPath();
  for (const [nx, ny] of [[nd, P], [bw - nd - P, P], [nd, bh - P * 2], [bw - nd - P, bh - P * 2]])
    ctx.rect(bx + nx, by + ny, P, P);
  ctx.fill();
}
const inRect = (mx, my, x, y, w, h) => mx >= x && mx <= x + w && my >= y && my <= y + h;

/* ---------- 시작 화면 ----------
   바로 직업 선택으로 들어가면 '무슨 게임인지' 알기 전에 고르게 된다.
   여기서 이름과 규칙 한 줄, 기록, 그리고 들어갈 문 두 개(시작 / 제단)만 보여준다.
   배경은 실제 게임의 도형을 그대로 써서, 정지 화면이 아니라 세계의 한 장면이 되게 한다. */
/* 규칙 줄의 작은 아이콘. 이모지를 쓰면 폰트라 OS 마다 다르게 뜨고,
   무엇보다 이 게임의 다른 모든 것과 재질이 다르다. */
function drawRuleIcon(kind, x, y) {
  const P = PIX, R2 = (dx, dy, w, h) => pxR(x + dx * P, y + dy * P, w * P, h * P);
  ctx.beginPath();
  if (kind === "pad") {                       // 방향키
    ctx.fillStyle = "#8ef0b0";
    R2(-1, -4, 2, 2); R2(-1, 2, 2, 2); R2(-4, -1, 2, 2); R2(2, -1, 2, 2);
    ctx.fill();
    ctx.fillStyle = "rgba(142,240,176,.35)"; ctx.beginPath(); R2(-1, -1, 2, 2); ctx.fill();
  } else if (kind === "cards") {              // 카드 석 장
    ctx.fillStyle = "#ffd36e";
    for (let i = 0; i < 3; i++) R2(-4 + i * 3, -3 + (i === 1 ? -1 : 0), 2, 6);
    ctx.fill();
  } else if (kind === "steps") {              // 오르는 네 단계
    ctx.fillStyle = "#c9a3ff";
    for (let i = 0; i < 4; i++) R2(-4 + i * 2, 3 - (i + 1) * 1.6, 1.4, (i + 1) * 1.6);
    ctx.fill();
  } else {                                    // 해골
    ctx.fillStyle = "#e8e5da";
    R2(-3, -4, 6, 5); R2(-2, 1, 4, 2);
    ctx.fill();
    ctx.fillStyle = "#1a1a26"; ctx.beginPath();
    R2(-2, -3, 1.6, 2); R2(.6, -3, 1.6, 2); R2(-.6, 1, 1.4, 2);
    ctx.fill();
  }
}
