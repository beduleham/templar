name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/ign8t-mcp-setup-ud6x6r
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build static export
        run: npm run build
        env:
          BASE_PATH: /templar
          # 시크릿이 비어 있으면 앱은 클라이언트 도메인 스토어로 동작한다.
          # anon 키는 공개돼도 되는 값이지만(RLS가 통제), 저장소에는 두지 않는다.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Disable Jekyll
        run: touch out/.nojekyll
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          # gh-pages 는 두 사이트가 나눠 쓴다 — 루트는 이 사이트, /game/ 은 템플러.
          # keep_files 가 없으면 out/ 에 없는 파일을 전부 지워서 game/ 이 통째로
          # 사라진다(실제로 그랬다). 지우지 않도록 켜 둔다.
          #
          # 대가: 이 사이트에서 삭제된 파일도 gh-pages 에 남는다. 정적 내보내기의
          # 자산은 이름에 해시가 붙어 쌓여도 무해하지만, 라우트를 지웠을 때는
          # 옛 페이지가 계속 서빙되므로 그때만 손으로 지운다.
          keep_files: true
