        const u = j / n, cx2 = px0 + (px1 - px0) * u, cy2 = py0 + (py1 - py0) * u;
        for (let k = -3; k <= 3; k += PIX) pxPush(pxBand(Math.abs(k), 4), cx2 + k, cy2);
      }
      px0 = px1; py0 = py1;
    }
    pxFlush(bc);
    ctx.restore();
  }

  /* 적이 쏜 탄 — 아군 탄과 헷갈리면 안 된다.
     아군 탄은 무기의 속성색, 적 탄은 무조건 붉은 테를 두른다. */
  for (const p of eshots) {
    if (!p.active) continue;
    const sx = p.x - cam.x, sy = p.y - cam.y;
    if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) continue;
    pxDisc(sx, sy, p.r + 2, ESHOT_RING);
    pxDisc(sx, sy, p.r - 1, pxPal(p.color));
  }

  drawStructures();

  // 첨탑의 빛줄기
  for (const b of beams) {
    if (!b.active) continue;
    const x0 = b.x0 - cam.x, y0 = b.y0 - cam.y, x1 = b.x1 - cam.x, y1 = b.y1 - cam.y;
    const t = b.life / .22;
    ctx.save();
    ctx.globalAlpha = t;
    ctx.globalCompositeOperation = "lighter";
    const len = Math.hypot(x1 - x0, y1 - y0);
    pxLance(x0, y0, Math.atan2(y1 - y0, x1 - x0), len, 5 + t * 5, pxPal(b.color));
    ctx.restore();
  }

  /* 이펙트 — 가산 합성(lighter)이라 여러 발이 겹치면 흰빛으로 타오른다.
     알파를 수명보다 빠르게 떨어뜨려 잔상이 남지 않게 한다. */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const f of fxs) {
    if (!f.active) continue;
    const sx = f.x - cam.x, sy = f.y - cam.y;
    if (sx < -90 || sx > W + 90 || sy < -90 || sy > H + 90) continue;
    ctx.globalAlpha = Math.min(1, f.life / f.maxLife * 1.7);
    if (f.rot) {
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(f.rot);
      Sprites.draw(f.key, 0, 0, f.scale, f.maxLife - f.life, false);
      ctx.restore();
    } else {
      Sprites.draw(f.key, sx, sy, f.scale, f.maxLife - f.life, false);
    }
  }
  ctx.restore();

  // 파티클
  // 파티클은 수백 개라 색깔이 바뀔 때만 칠한다. 원 대신 격자 칸이라 가장자리가 또렷하다.
  {
    let pc = null;
    for (const p of particles) {
      if (!p.active) continue;
      const a = clamp(p.life / p.maxLife, 0, 1);
      if (p.color !== pc) { if (pc) ctx.fill(); pc = p.color; ctx.fillStyle = pc; ctx.beginPath(); }
      ctx.globalAlpha = a;
      const s2 = Math.max(PIX, Math.round(p.r / PIX) * PIX);
      ctx.rect(Math.round((p.x - cam.x) / PIX) * PIX - s2 / 2,
               Math.round((p.y - cam.y) / PIX) * PIX - s2 / 2, s2, s2);
    }
    if (pc) ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 데미지 숫자 — 어트랙트 데모에서는 읽을 정보가 아니라 글자 노이즈다
  if (Attract.on) { ctx.globalAlpha = 1; return; }
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.75)";
  for (const n of numbers) {
    if (!n.active) continue;
    const nx = n.x - cam.x, ny = n.y - cam.y;
    if (nx < -40 || nx > W + 40 || ny < -30 || ny > H + 30) continue;
    ctx.globalAlpha = clamp(n.life / .7, 0, 1);
    ctx.font = "700 " + n.size + "px " + FONT;
    ctx.strokeText(n.text, nx, ny);
    ctx.fillStyle = n.color;
    ctx.fillText(n.text, nx, ny);
  }
  ctx.globalAlpha = 1;
}

/* 대형 구조물 그리기.
   건물은 화면에서 가장 큰 물체라 크기가 변한다 — 스프라이트로 확대하면 어긋난다.
   그래서 격자 렌더로 짓는다(docs/art-spec.md 12·13절과 같은 규칙).

   실루엣이 멀리서 구분되어야 한다. 색만 다르면 '뭔가 큰 것'으로만 보인다.
   그래서 종류마다 윗부분의 형태를 다르게 한다 —
   첨탑은 뾰족하게, 샘은 낮고 둥글게, 성채는 톱니, 대장간은 굴뚝. */
function drawStructures() {
  for (const s of structures) {
    const sx = s.x - cam.x, sy = s.y - cam.y;
    const R = s.r;
    if (sx < -R - 120 || sx > W + R + 120 || sy < -R - 160 || sy > H + R + 160) continue;
    const K = s.K, st = s.st, on = !!st;
    const cols = pxPal(K.color);
    // 종류마다 꼭대기가 다르다. 한 값으로 붙이면 첨탑에서는 글자가 건물을 가린다.
    const topY = s.kind === "spire" ? -R * 2.05 : s.kind === "bastion" ? -R * 1.45
               : s.kind === "forge" ? -R * 1.72 : -R * 1.22;
    const P = PIX;
    const q = v => Math.round(v / P) * P;
    const box = (x0, y0, x1, y1) => ctx.rect(q(sx + x0), q(sy + y0), q(x1 - x0), q(y1 - y0));

    // 바닥 그림자 — 큰 것일수록 깊게
    ctx.save();
    ctx.globalAlpha = .34;
    ctx.fillStyle = "#000";
    ctx.beginPath(); pxEllipse(sx, sy + R * .3, R * .62, R * .24); ctx.fill();
    ctx.globalAlpha = 1;

    // 가동 중이면 발밑에 진영이 돈다
    if (on) {
      const ar = K.aura ? R * K.aura : R * 1.15;
      ctx.globalAlpha = .10 + .05 * Math.sin(Game.time * 3);
      ctx.fillStyle = K.color;
      ctx.beginPath(); pxEllipse(sx, sy + R * .3, ar, ar * .42); ctx.fill();
      ctx.globalAlpha = .5;
      ctx.fillStyle = cols[0];
      ctx.beginPath();
      const steps = Math.max(16, Math.ceil(TAU * ar / (P * 3)));
      for (let i = 0; i < steps; i++) {
        const a = i / steps * TAU + Game.time * .4;
        ctx.rect(q(sx + Math.cos(a) * ar), q(sy + R * .3 + Math.sin(a) * ar * .42), P, P);
      }
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ── 몸통 ── 꺼져 있으면 어둡다. 켜야 색이 산다.
    // 꺼져 있어도 종류색을 살짝 섞는다. 전부 같은 회색이면 멀리서 무엇인지 몰라
    // 갈지 말지를 정할 수가 없다.
    const dark = pxPalCache[K.color + "|off"] ||
      (pxPalCache[K.color + "|off"] = mixHex(K.color, "#43424f", .72));
    const body = on ? cols[2] : dark;
    const trim = on ? cols[1] : mixHex(K.color, "#5a5967", .6);
    const lit  = on ? cols[0] : mixHex(K.color, "#6a6979", .5);
    const base = R * .5;                       // 반폭
    ctx.fillStyle = body;
    ctx.beginPath();
    box(-base, -R * .12, base, R * .3);        // 기단
    if (s.kind === "spire") {
      box(-base * .42, -R * 1.5, base * .42, -R * .1);          // 오벨리스크 몸
      for (let i = 0; i < 7; i++) {                              // 끝으로 갈수록 좁아진다
        const w = base * .42 * (1 - i / 7), y = -R * 1.5 - i * P * 2.2;
        box(-w, y - P * 2.2, w, y);
      }
    } else if (s.kind === "font") {
      box(-base * .9, -R * .5, base * .9, -R * .05);             // 낮고 넓은 수반
      for (const sgn of [-1, 1]) box(sgn * base * .78, -R * .95, sgn * base * .58, -R * .4);  // 기둥 둘
      box(-base * .95, -R * 1.05, base * .95, -R * .9);          // 상인방
    } else if (s.kind === "bastion") {
      box(-base * .82, -R * 1.05, base * .82, -R * .05);         // 성벽
      for (let i = -3; i <= 3; i++)                              // 톱니
        box(i * base * .26 - base * .1, -R * 1.28, i * base * .26 + base * .1, -R * 1.02);
      for (const sgn of [-1, 1]) box(sgn * base * .95, -R * 1.15, sgn * base * .68, -R * .02);  // 망루
    } else {
      box(-base * .8, -R * .8, base * .8, -R * .05);             // 대장간 몸채
      box(-base * .95, -R * .95, base * .95, -R * .74);          // 처마
      box(base * .3, -R * 1.55, base * .68, -R * .8);            // 굴뚝
    }
    ctx.fill();

    // ── 테두리·장식 ──
    ctx.fillStyle = trim;
    ctx.beginPath();
    box(-base, -R * .12, base, -R * .12 + P);                    // 기단 윗선
    box(-base, R * .3 - P, base, R * .3);
    ctx.fill();

    // ── 빛나는 심장부 ── 켜져 있으면 맥동한다
    const pulse = on ? .55 + .45 * Math.abs(Math.sin(Game.time * 3.4)) : .22;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = lit;
    ctx.beginPath();
    if (s.kind === "spire") {
      const y = -R * 1.5 - 7 * P * 2.2;                          // 꼭대기 수정
      box(-P * 2, y - P * 5, P * 2, y);
      box(-P * 3, y - P * 3, P * 3, y - P * 2);
    } else if (s.kind === "font") {
      box(-base * .74, -R * .42, base * .74, -R * .12);          // 찰랑이는 수면
    } else if (s.kind === "bastion") {
      box(-P * 3, -R * .78, P * 3, -R * .3);                     // 문장
      box(-P * 6, -R * .64, P * 6, -R * .5);
    } else {
      box(-base * .34, -R * .58, base * .34, -R * .12);          // 화구
    }
    ctx.fill();
    ctx.globalAlpha = 1;

    // ── 어두운 구멍 ── 창·문·틈. 큰 면이 비어 있으면 건물이 아니라 판자로 보인다.
    ctx.fillStyle = "rgba(12,12,20,.66)";
    ctx.beginPath();
    if (s.kind === "spire") {
      for (let i = 0; i < 4; i++) box(-base * .42, -R * (.35 + i * .28), base * .42, -R * (.32 + i * .28));
    } else if (s.kind === "font") {
      box(-base * .18, -R * .95, base * .18, -R * .5);           // 기둥 사이 그늘
    } else if (s.kind === "bastion") {
      for (const sgn of [-1, 1]) {                                // 화살 구멍
        box(sgn * base * .5 - P, -R * .88, sgn * base * .5 + P, -R * .66);
        box(sgn * base * .5 - P, -R * .56, sgn * base * .5 + P, -R * .34);
      }
      box(-base * .17, -R * .34, base * .17, -R * .02);           // 성문
    } else {
      box(-base * .24, -R * .42, base * .24, -R * .04);           // 대장간 입구
    }
    ctx.fill();

    // 굴뚝 연기 — 가동 중에만 오른다
    if (on && s.kind === "forge") {
      ctx.globalAlpha = .4;
      ctx.fillStyle = "#9a9aa8";
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const u = ((Game.time * .55 + i * .2) % 1);
        const yy = -R * 1.55 - u * R * .5, w = P * (1 + u * 3);
        box(base * .49 - w + Math.sin(u * 6 + i) * P * 2, yy - P * 2, base * .49 + w + Math.sin(u * 6 + i) * P * 2, yy);
      }
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ── 상태 ── 남은 시간과 체력. 언제 무너지는지 보여야 지킬지 뺄지 판단이 된다.
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (on) {
      const bw = R * 1.05, bx = sx - bw / 2, by = sy + topY - 16;
      ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(bx - 2, by - 2, bw + 4, 12);
      ctx.fillStyle = "#ff6b7f";
      ctx.fillRect(bx, by, bw * clamp(st.hp / st.max, 0, 1), 4);
      ctx.fillStyle = K.color;
      ctx.fillRect(bx, by + 5, bw * clamp(st.t / K.dur, 0, 1), 3);
      ctx.font = "700 12px " + FONT; ctx.fillStyle = K.color;
      iconText(K.px, K.name + "  " + Math.ceil(st.t) + "초", sx, by - 12, K.color, 2);
    } else {
      ctx.globalAlpha = .55 + Math.sin(Game.time * 2 + s.x * .01) * .2;
      ctx.font = "700 12px " + FONT; ctx.fillStyle = K.color;
      iconText(K.px, K.name, sx, sy + topY - 16, K.color, 2);
      ctx.font = "600 10.5px " + FONT; ctx.fillStyle = "rgba(255,255,255,.55)";
      ctx.fillText(K.desc + " · 다가가면 가동", sx, sy + topY - 2);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

   직업이 '가끔 누르는 버튼'이 아니라 '매 순간의 규칙'이 되도록,

    { key: "taunt", name: "도발", icon: "📢", max: 2,
      desc: "방벽을 세우면 주변의 적이 끌려온다. 더 둘러싸일수록 강해진다.",
      detail: l => "흡인력 " + l + "단계" },

      desc: "체력이 바닥일수록 단단해지고 빨라진다.",
      detail: l => "HP 40% 이하: 피해 -" + (22 * l) + "% · 이동 +" + (14 * l) + "%" },
  ],
  mage: [
    { key: "focus", name: "집중 영창", icon: "🎯", max: 3,
      desc: "영창 단계가 더 빨리 오른다.",
      detail: l => "영창 속도 +" + (30 * l) + "%" },
    { key: "deepMana", name: "심층 마력", icon: "🌌", max: 2,
      desc: "영창을 한 단계 더 쌓을 수 있다.",

    { key: "overload", name: "비전 과부하", icon: "⚡", max: 2,
      desc: "3단계 이상에서 발사체가 적을 더 꿰뚫는다.",
      detail: l => "관통 +" + (2 * l) },
    { key: "meltdown", name: "마력 폭주", icon: "☄️", max: 3,

      detail: l => (1.8 - .3 * l).toFixed(1) + "초마다 폭발" },
  ],
};

function traitLv(key) {
  const t = player.traits.find(t => t.key === key);
  return t ? t.level : 0;
}
// 전직으로 열린 특성까지 합친 목록
function traitList() {
  const out = (player.cls && TRAITS[player.cls.key]) ? TRAITS[player.cls.key].slice() : [];
  for (const a of player.advance) if (a.traits) out.push(...a.traits);
  return out;
}
function traitDefByKey(key) {
  return traitList().find(t => t.key === key);
}
function traitDef(clsKey, key) {   // 이전 호출부 호환
  return traitDefByKey(key);
}

/* ---------- 능동 스킬 빌더 ----------
   전직마다 스킬이 바뀌어야 하는데 24개를 손으로 쓰면 관리가 안 된다.
   형태별로 만들어 쓰고, 수치만 전직 데이터에 둔다. */
function skWave(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    spawnWave({ x: p.x, y: p.y, maxR: o.r * p.stats.area,
      dmg: (o.dmg + p.level * (o.perLv || 10)) * p.stats.damage * p.dynDmg,
      life: o.life || .5, color: o.color, element: o.elem, heal: o.heal || 0 });
    if (o.iframe) p.iframe = Math.max(p.iframe, o.iframe);
    if (o.healPct) p.hp = Math.min(p.stats.maxHp, p.hp + p.stats.maxHp * o.healPct);
    cam.shake = o.shake || 12;
    spawnParticles(p.x, p.y, 34, o.color, 320, .8, 5);
    Sfx.play(o.freq || 320, .45, "triangle", 1, o.slide || 500);
  } };
}

function skBurst(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const targets = nearestEnemies(p.x, p.y, 900, o.n);
    for (let i = 0; i < o.n; i++) {
      const t = targets[i % Math.max(1, targets.length)];
      const a = t ? Math.atan2(t.y - p.y, t.x - p.x) + rnd(-.22, .22)
                  : i / o.n * TAU;
      const sp = (o.speed || 380) * p.stats.projSpeed;
      spawnProjectile({
        x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: (o.r || 11) * p.stats.area,
        dmg: (o.dmg + p.level * (o.perLv || 8)) * p.stats.damage * p.dynDmg,
        pierce: o.pierce || 2, life: o.life || 2.2, kind: o.kind || "orb",
        angle: a, color: o.color, element: o.elem,
        homing: o.homing || 0, target: t || null,
      });
    }
    cam.shake = 8;
    Sfx.play(o.freq || 540, .3, "triangle", .9, 400);
  } };
}

function skStrike(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const pool = nearestEnemies(p.x, p.y, 800, o.n * 2);
    const dmg = (o.dmg + p.level * (o.perLv || 14)) * p.stats.damage * p.dynDmg;
    for (let i = 0; i < o.n; i++) {
      const e = pool[i % Math.max(1, pool.length)];
      if (!e || !e.active) continue;
      spawnBolt(e.x, e.y);
      damageEnemy(e, dmg, e.x, e.y - 60, 0, o.elem);
      spawnWave({ x: e.x, y: e.y, maxR: (o.splash || 90) * p.stats.area,
        dmg: dmg * .5, life: .28, color: o.color, element: o.elem });
    }
    cam.shake = 10;
    Sfx.play(200, .3, "sawtooth", .8, 700);
  } };
}

function skSlash(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const base = Math.atan2(p.faceY, p.faceX);
    const dmg = (o.dmg + p.level * (o.perLv || 12)) * p.stats.damage * p.dynDmg;
    for (let i = 0; i < o.n; i++)
      spawnSlash(p, base + (i - (o.n - 1) / 2) * (o.spread || .55), dmg,
                 o.len * p.stats.area, 1.4, o.elem);
    if (o.iframe) p.iframe = Math.max(p.iframe, o.iframe);
    cam.shake = 10;
    spawnParticles(p.x + p.faceX * 40, p.y + p.faceY * 40, 20, o.color, 260, .5, 4);
    Sfx.play(280, .3, "sawtooth", .8, 260);
  } };
}

function skDash(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    p.dash = o.dur; p.dashX = p.faceX; p.dashY = p.faceY;
    p.dashDmg = (o.dmg + p.level * (o.perLv || 12)) * p.stats.damage * p.dynDmg;
    p.dashHit.clear();
    p.iframe = Math.max(p.iframe, o.dur + .2);
    cam.shake = 8;
    Sfx.play(190, .3, "sawtooth", .85, 320);
  } };
}

function skBlink(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const ox = p.x, oy = p.y;
    p.x += p.faceX * o.dist; p.y += p.faceY * o.dist;
    p.iframe = Math.max(p.iframe, o.iframe || .9);
    const dmg = (o.dmg + p.level * (o.perLv || 8)) * p.stats.damage * p.dynDmg;
    for (const [bx, by] of [[ox, oy], [p.x, p.y]]) {
      spawnParticles(bx, by, 22, o.color, 280, .6, 4);
      for (let i = 0; i < o.n; i++) {
        const a = i / o.n * TAU, sp = 540 * p.stats.projSpeed;
        spawnProjectile({
          x: bx, y: by, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          r: 8 * p.stats.area, dmg, pierce: o.pierce || 2, life: 1.0,
          kind: o.kind || "dagger", angle: a, color: o.color, element: o.elem,
        });
      }
    }
    Sfx.play(760, .2, "sine", .8, -420);
  } };
}

/* ---------- 메타 진행 : 제단 ----------
   판이 끝나도 남는 것이 있어야 다시 시작하게 된다.
   영혼을 모아 영구 강화를 사고, 그 강화가 다음 판의 시작 지점을 올린다. */
/* 값은 '한 판에 다 사지 못하게' 잡는다. 봇 계측으로 살아남은 판이 180~660영혼이니
   전부(11,570) 채우려면 서른다섯 판 안팎이 든다. 첫 칸(90)은 첫 판이나 두 번째 판에 닿는다.

     desc 에 같은 숫자를 또 적어 두면 한쪽만 고칠 때 어긋난다 — 수치가 없는 칸만 desc 를 쓴다. */

    cost: l => [90, 180, 340, 560, 850][l] },

    cost: l => [120, 240, 450, 750, 1150][l] },

  { key: "zeal",    name: "신념",   per: "시작 자원",   unit: "", step: 25, max: 3,
    cost: l => [160, 360, 650][l] },
  { key: "rebirth", name: "부활",   step: 0, desc: "쓰러질 때 한 번 되살아난다", max: 1,
    cost: () => 1400 },
];

const Meta = {
  souls: 0, levels: {},
  load() {
    try {
      this.souls = Number(localStorage.getItem("ts_souls") || 0) || 0;
      this.levels = JSON.parse(localStorage.getItem("ts_altar") || "{}") || {};
    } catch (e) { this.souls = 0; this.levels = {}; }
  },
  save() {
    try {
      localStorage.setItem("ts_souls", String(this.souls));
      localStorage.setItem("ts_altar", JSON.stringify(this.levels));
    } catch (e) { /* 저장 불가여도 게임은 돈다 */ }
  },
  lv(k) { return this.levels[k] || 0; },
  costOf(u) { return u.cost(this.lv(u.key)); },
  buy(k) {
    const u = ALTAR.find(a => a.key === k);
    if (!u) return false;
    const l = this.lv(k);
    if (l >= u.max) return false;
    const c = this.costOf(u);
    if (this.souls < c) return false;
    this.souls -= c;
    this.levels[k] = l + 1;
    this.save();
    return true;
  },
};
Meta.load();

        p.dynArmor *= 1 - .09 * Math.min(3, cont);

        // 단계에 비례해 계속 커지면 후반에 레벨이 다른 직업의 두 배가 되고,
        // 반대로 너무 조이면 6~8분에 성장이 막혀 굶어 죽는다. 2단계에서 포화시킨다.
        p.dynMagnet *= 1 + Math.min(2.8, 1.6 * st);

        // 적이 수백 마리인 판에서 '주변에 적이 없을 때'를 기다리면 영창은 영영 못 쓴다.
        // 자리를 지킬 시간을 벌어줘야 하는데, 밀어내기로 하면 무적 거품이 생겨
        // 마법사가 다시 한 대도 안 맞게 된다(측정으로 확인). 그래서 미는 대신 얼린다 —
        // 적은 늦게 올 뿐 반드시 도착한다. 마법사의 속성이 냉기라 테마도 맞는다.
        // 사방 효과는 반경이 곧 넓이의 제곱이라 조금만 키워도 화면을 덮는다.
        // 마법사는 '초반에 약한 대신 키우면 강한' 직업이므로 기본 반경을 절반 이하로 줄인다.
        p.frostVeil = st >= 2 ? (42 + 15 * st) * p.stats.area : 0;
        if (st > 0) {
          const R = (34 + 12 * st) * p.stats.area;
          const found = hash.query(p.x, p.y, R, scratch3);
          for (let i = 0; i < found.length; i++) {
            const e = found[i];
            if (!e.active) continue;
            // 0.3 은 '조금 느려질 뿐'이라 자리를 벌어주지 못했다 — 영창이 성립하려면 실제로 붙잡아야 한다
            if (dist2(e.x, e.y, p.x, p.y) < R * R) e.slow = Math.max(e.slow, .3 + .08 * st);
          }
        }
        // 비전 과부하: 깊게 영창하면 발사체가 더 꿰뚫는다
        if (st >= 3) p.dynPierce += 2 * traitLv("overload");
        if (st >= maxStage) p.dynPierce += advVal("pierceAtMax", 0);

        // 마력 폭주: 최대 단계를 유지하면 주변이 주기적으로 터진다
        const ml = traitLv("meltdown");
        if (ml > 0 && st >= maxStage) {
          p.meltTimer -= dt;
          if (p.meltTimer <= 0) {
            p.meltTimer = 1.8 - .3 * ml;
            // 반경 240 고정이면 특성을 키워도 체감이 없다 — 단계에 묶는다
            spawnWave({ x: p.x, y: p.y, maxR: (48 + 24 * ml) * p.stats.area,
              dmg: (60 + p.level * 9) * p.stats.damage * p.dynDmg, life: .4,
              color: "#bcd0ff", element: "frost" });
            Sfx.play(420, .25, "triangle", .7, 300);
          }
        } else p.meltTimer = 0;
      },
    },
    // 시간에 따라 꾸준히 찬다 → 아끼느냐 지금 쓰느냐의 자원 관리
    resource: { name: "마나", color: "#9bb8ff", perSec: 8, hint: "시간에 따라 충전" },
    skill: {
      name: "비전 폭발", icon: "✳️", cost: 55,
      desc: "주변의 적들에게 유도 마력탄을 쏟아붓는다.",
      // 다른 직업 스킬은 단발(파동)이나 경로 판정인데 이것만 '탄 14발 × 관통 2' 였다.
      // 실질 타격 수가 30~40배라 1레벨부터 과했다.
      // 발 수와 관통을 레벨에 묶어, 처음엔 약하고 키울수록 강해지게 바꾼다.
      use(p) {
        const n = clamp(6 + Math.floor(p.level / 4), 6, 16);
        const pierce = p.level >= 20 ? 2 : 1;
        const targets = nearestEnemies(p.x, p.y, 900, n);
        for (let i = 0; i < n; i++) {
          const t = targets[i % Math.max(1, targets.length)];
          const a = t ? Math.atan2(t.y - p.y, t.x - p.x) + rnd(-.2, .2) : rnd(TAU);
          const sp = 330 * p.stats.projSpeed;
          spawnProjectile({
            x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            r: 12 * p.stats.area, dmg: 38 * p.stats.damage + p.level * 9,
            pierce, life: 2.2, kind: "orb", angle: a,
            color: "#bcd0ff", element: "frost", homing: 8, target: t || null,
          });
        }
        cam.shake = 8;
        Sfx.play(540, .35, "triangle", .9, 420);
      },
    },
  },
];

function advanceOptions(tier) {
  // 4차 초월은 3차 최종형(32종)마다 따로 두지 않고 직업을 부모로 삼는다.
  // 경로마다 붙이면 데이터가 64개가 되고 하나하나가 얕아진다 — 갈래 수보다 무게가 중요하다.
  if (tier === 4) return ADVANCES.filter(a => a.tier === 4 && a.from === (player.cls && player.cls.key));
  const prev = player.advance[tier - 2];
  const from = tier === 1 ? (player.cls && player.cls.key) : (prev && prev.key);
  return ADVANCES.filter(a => a.tier === tier && a.from === from);
}
// 전직 스탯/자세/스킬은 나중에 얻은 것이 이긴다
function curSkill() {
  for (let i = player.advance.length - 1; i >= 0; i--)
    if (player.advance[i].skill) return player.advance[i].skill;
  return player.cls ? player.cls.skill : null;
}
function advVal(key, def) {
  let v = def;
  for (const a of player.advance)
    if (a.stanceMod && a.stanceMod[key] !== undefined) v = a.stanceMod[key];
  return v;
}
function advName() {
  return player.advance.length ? player.advance[player.advance.length - 1].name
                               : (player.cls ? player.cls.name : "");
}
function advColor() {
  return player.advance.length ? player.advance[player.advance.length - 1].color
                               : (player.cls ? player.cls.color : "#fff");
}

let selectedClass = 0;

/* ---------- HUD ---------- */
function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ":" + String(s).padStart(2, "0");
}

function drawHUD() {
  const s = player.stats;
  // 선택 화면 위에는 전투 배너를 띄우지 않는다. (반드시 사용 지점보다 먼저 선언할 것 —
  // 아래쪽에 두었더니 조합 해금 배너가 뜨는 프레임마다 TDZ 예외가 나서 화면이 멈췄다)
  const overlay = Game.state === "levelup" || Game.state === "advance" || Game.state === "paused";

  // 경험치 바 (상단 전체)
  const xpf = clamp(player.xp / player.xpNext, 0, 1);
  ctx.fillStyle = "#0d0d18"; ctx.fillRect(0, 0, W, 14);
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "#3fa9ff"); g.addColorStop(1, "#7ce7ff");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W * xpf, 14);
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(0, 0, W, 4);
  ctx.font = "700 11px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff"; ctx.fillText(player.level + "레벨", 34, 7);

  // 체력
  const hpf = clamp(player.hp / s.maxHp, 0, 1);
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(14, 24, 240, 20);
  ctx.fillStyle = hpf > .3 ? "#3ddc84" : "#ff5b6b";
  ctx.fillRect(16, 26, 236 * hpf, 16);
  ctx.font = "700 13px " + FONT; ctx.fillStyle = "#fff"; ctx.textAlign = "left";
  ctx.fillText(Math.ceil(player.hp) + " / " + Math.round(s.maxHp), 22, 34);

  // 직업 자원
  const C = player.cls;
  if (C) {
    const R = C.resource, rf = clamp(player.res / RES_MAX, 0, 1);
    const ready = player.res >= curSkill().cost;
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(14, 47, 240, 13);
    ctx.fillStyle = R.color;
    ctx.globalAlpha = ready ? 1 : .62;
    ctx.fillRect(16, 49, 236 * rf, 9);
    ctx.globalAlpha = 1;
    // 스킬 발동에 필요한 지점을 눈금으로 표시
    const markX = 16 + 236 * (curSkill().cost / RES_MAX);
    ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.fillRect(markX - 1, 46, 2, 15);
    ctx.font = "700 10px " + FONT; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.fillText(R.name + "  " + Math.floor(player.res), 20, 53);
    if (player.advance.length) {
      ctx.textAlign = "right";
      ctx.font = "700 11px " + FONT; ctx.fillStyle = advColor();
      drawMenuIcon("stance", 254, 49, advColor(), 2);
      ctx.fillText(advName(), 268, 53);
      ctx.textAlign = "left";
    }
  }

  // 직업 자세 상태 — 지금 강해지고 있는지 한눈에 보여야 한다
  let cy = 68;
  if (C && C.stance) {
    ctx.fillStyle = "rgba(10,10,20,.6)";
    ctx.beginPath(); ctx.roundRect(14, cy, 240, 22, 6); ctx.fill();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    if (C.key === "paladin") {
      const on = player.bulwark > .5;
      ctx.font = "700 12px " + FONT;
      ctx.fillStyle = on ? "#ffd36e" : "rgba(255,255,255,.35)";
      drawMenuIcon("shield", 26, cy + 7, on ? "#ffd36e" : "#8a8598", 2);
    ctx.fillText("방벽 " + (on ? "-" + Math.round((1 - player.dynArmor) * 100) + "%" : "대기"), 40, cy + 11);
      ctx.textAlign = "right";
      ctx.fillStyle = player.press > 0 ? "#ff9f6b" : "rgba(255,255,255,.3)";
      ctx.fillText("접전 ×" + player.press + "  (+" + Math.round((player.dynDmg - 1) * 100) + "%)", 248, cy + 11);
    } else {
      const st = Math.floor(player.channel), maxStage = 3 + traitLv("deepMana");
      ctx.font = "700 12px " + FONT;
      ctx.fillStyle = st > 0 ? "#9bb8ff" : "rgba(255,255,255,.35)";
      drawMenuIcon("skill", 26, cy + 7, "#9bb8ff", 2);
    ctx.fillText("영창", 40, cy + 11);
      for (let i = 0; i < maxStage; i++) {
        ctx.fillStyle = i < st ? "#9bb8ff" : "rgba(255,255,255,.13)";
        ctx.beginPath(); ctx.roundRect(76 + i * 17, cy + 6, 13, 10, 3); ctx.fill();
      }
      ctx.textAlign = "right";
      ctx.fillStyle = st > 0 ? "#9bb8ff" : "rgba(255,255,255,.3)";
      ctx.fillText("피해 +" + Math.round((player.dynDmg - 1) * 100) + "%", 248, cy + 11);
    }
    cy += 26;
  }

  // 활성화된 속성 조합 — 지금 일하고 있는지가 보여야 한다
  for (const cb of COMBOS) {
    if (!player.combos.has(cb.key)) continue;
    const pr = comboProcs[cb.key];
    const fl = pr ? clamp(pr.flash, 0, 1) : 0;
    if (pr && pr.flash > 0) pr.flash -= 1 / 60;
    const ea = ELEMENTS[cb.a], eb = ELEMENTS[cb.b];
    ctx.fillStyle = fl > 0 ? "rgba(56,44,20," + (.6 + fl * .35).toFixed(2) + ")" : "rgba(10,10,20,.62)";
    ctx.beginPath(); ctx.roundRect(14, cy, 240, 24, 7); ctx.fill();
    ctx.strokeStyle = fl > 0 ? "rgba(255,225,150," + (.4 + fl * .6).toFixed(2) + ")" : "rgba(255,210,140,.28)";
    ctx.lineWidth = fl > 0 ? 2 : 1; ctx.stroke();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "11px " + FONT;
    drawMenuIcon("element", 22, cy + 8, ea.color, 2);
    ctx.fillStyle = "rgba(255,255,255,.3)"; ctx.fillText("+", 36, cy + 12);
    drawMenuIcon("element", 47, cy + 8, eb.color, 2);
    const done = player.mastered.has(cb.key);
    ctx.font = "700 11.5px " + FONT;
    ctx.fillStyle = done ? "#ffe9a8" : (fl > 0 ? "#fff3d0" : "#ffd9a0");
    ctx.fillText((done ? "★ " : "") + cb.name, 66, cy + 12);
    // 오른쪽은 한 줄로 합쳐 한 번만 정렬한다 (따로 그리면 긴 이름과 겹친다)
    const cnt = pr && pr.count ? "×" + pr.count.toLocaleString("ko-KR") : "";
    const prog = done ? "★" + MASTER_POWER + "배"
      : Math.min(elemLevel(cb.a), COMBO_MASTER) + "+" + Math.min(elemLevel(cb.b), COMBO_MASTER)
        + "/" + (COMBO_MASTER * 2);
    ctx.textAlign = "right";
    ctx.font = "700 10px " + FONT;
    ctx.fillStyle = done ? "#ffd34d" : "rgba(255,255,255,.42)";
    ctx.fillText((cnt ? cnt + "  ·  " : "") + prog, 246, cy + 12);
    ctx.textAlign = "left";
    cy += 27;
  }

  // 아직 안 열린 조합의 진행도 — 무엇을 얼마나 더 올려야 하는지 항상 떠 있게 한다
  const pending = combosPending();
  for (let i = 0; i < Math.min(3, pending.length); i++) {
    const { c, la, lb } = pending[i];
    const ea = ELEMENTS[c.a], eb = ELEMENTS[c.b];
    ctx.fillStyle = "rgba(10,10,20,.42)";
    ctx.beginPath(); ctx.roundRect(14, cy, 240, 22, 7); ctx.fill();
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.lineWidth = 1; ctx.stroke();
    ctx.setLineDash([]);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "700 10px " + FONT;
    ctx.fillStyle = la >= COMBO_LEVEL ? ea.color : "rgba(255,255,255,.32)";
    drawMenuIcon("element", 24, cy + 7, ea.color, 2); ctx.fillText(la + "/" + COMBO_LEVEL, 36, cy + 11);
    ctx.fillStyle = lb >= COMBO_LEVEL ? eb.color : "rgba(255,255,255,.32)";
    drawMenuIcon("element", 79, cy + 7, eb.color, 2); ctx.fillText(lb + "/" + COMBO_LEVEL, 91, cy + 11);
    ctx.textAlign = "right";
    ctx.font = "600 10.5px " + FONT; ctx.fillStyle = "rgba(255,255,255,.4)";
    ctx.fillText(c.name, 246, cy + 11);
    ctx.textAlign = "left";
    cy += 25;
  }

  // 타이머
  ctx.textAlign = "center";
  ctx.font = "800 30px " + FONT;
  ctx.lineWidth = 5; ctx.strokeStyle = "rgba(0,0,0,.7)";
  ctx.strokeText(fmtTime(Game.time), W / 2, 42);
  ctx.fillStyle = "#fff"; ctx.fillText(fmtTime(Game.time), W / 2, 42);

  // 처치 수 / 기록
  ctx.textAlign = "right"; ctx.font = "700 14px " + FONT;
  ctx.fillStyle = "rgba(255,255,255,.85)";
  ctx.fillText(String(Game.kills), W - 16, 32);
  drawMenuIcon("skull", W - 24 - ctx.measureText(String(Game.kills)).width, 31, "#e8e5da", 2);
  ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.font = "600 12px " + FONT;
  ctx.fillText("최고 기록 " + fmtTime(Game.bestTime), W - 16, 50);

  // 보유 무기 / 패시브
  let ix = 14;
  /* 칸 안의 그림도 픽셀이다. 직업 특성은 68종이라 저마다 판을 뜰 수 없어
     각성 색을 입힌 문장(紋章) 하나로 묶는다 — 이름은 레벨업 화면에서 이미 봤다. */
  const drawSlot = (px, level, tint, col) => {
    ctx.fillStyle = "rgba(10,10,20,.66)";
    ctx.beginPath(); ctx.roundRect(ix, H - 54, 40, 40, 8); ctx.fill();
    ctx.strokeStyle = tint; ctx.lineWidth = 1.5; ctx.stroke();
    drawMenuIcon(px, ix + 20, H - 37, col, 3);
    ctx.font = "700 10px " + FONT; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillStyle = level >= MAX_LEVEL ? "#ffd34d" : "rgba(255,255,255,.8)";
    ctx.fillText(level >= MAX_LEVEL ? "최대" : level + "렙", ix + 37, H - 20);
    ix += 46;
  };
  for (const w of player.weapons) {
    const D = WEAPONS[w.key];
    drawSlot(D.px, w.level, "rgba(255,210,120,.5)", ELEMENTS[D.element].color);
  }
  ix += 12;
  for (const p of player.passives) drawSlot(PASSIVES[p.key].px, p.level, "rgba(140,200,255,.4)", "#8fd0ff");
  if (player.traits.length) {
    ix += 12;
    for (const t of player.traits)
      drawSlot("stance", t.level, (advColor() || "#c9a3ff") + "88", advColor() || "#c9a3ff");
  }

  // ── 미니맵 — 어디에 뭐가 있는지 한눈에
  {
    /* 오른쪽 아래는 터치 버튼 자리다 — 겹치면 미니맵을 누르다 스킬이 나간다.
       터치 기기에서는 오른쪽 위로 올리고, 좁은 화면에서는 크기도 줄인다. */
    const MM = narrow() ? 116 : 152;
    const mx = W - MM - 16, my = touch.seen ? 86 : H - MM - 76;
    const RANGE = 2400, sc = (MM / 2 - 6) / RANGE;
    ctx.save();
    ctx.fillStyle = "rgba(8,8,16,.78)";
    ctx.beginPath(); ctx.roundRect(mx, my, MM, MM, 10); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.roundRect(mx + 1, my + 1, MM - 2, MM - 2, 9); ctx.clip();
    const ccx = mx + MM / 2, ccy = my + MM / 2;

    // 적 밀도 — 전부 찍으면 무의미하므로 표본만
    ctx.fillStyle = "rgba(255,120,120,.32)";
    for (let i = 0; i < enemies.length; i += 4) {
      const e = enemies[i];
      if (!e.active || e.boss || e.sigilKey) continue;
      const dx = (e.x - player.x) * sc, dy = (e.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 || Math.abs(dy) > MM / 2) continue;
      ctx.fillRect(ccx + dx - 1, ccy + dy - 1, 2, 2);
    }
    // 지형 — 벽만 옅게
    ctx.fillStyle = "rgba(150,150,175,.30)";
    for (const o of obstacles) {
      if (!o.wall) continue;
      const dx = (o.x - player.x) * sc, dy = (o.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 - 3 || Math.abs(dy) > MM / 2 - 3) continue;
      ctx.fillRect(ccx + dx - 2, ccy + dy - 2, 4, 4);
    }
    // 대형 구조물 — 가장 크게. 멀리서도 갈 값이 있는지 보여야 한다
    for (const s of structures) {
      const dx = (s.x - player.x) * sc, dy = (s.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 - 5 || Math.abs(dy) > MM / 2 - 5) continue;
      ctx.fillStyle = s.K.color;
      ctx.globalAlpha = s.st ? .55 + .45 * Math.abs(Math.sin(Game.time * 3)) : 1;
      ctx.fillRect(ccx + dx - 4, ccy + dy - 4, 8, 8);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "rgba(0,0,0,.7)"; ctx.lineWidth = 1;
      ctx.strokeRect(ccx + dx - 4, ccy + dy - 4, 8, 8);
    }
    // 지형지물
    for (const lm of landmarks) {
      const dx = (lm.x - player.x) * sc, dy = (lm.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 - 4 || Math.abs(dy) > MM / 2 - 4) continue;
      ctx.fillStyle = lm.T.color;
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, lm.type === "shrine" ? 4 : 3, 0, TAU); ctx.fill();
    }
    // 징표·아이템
    for (const pk of pickups) {
      if (!pk.active) continue;
      const dx = (pk.x - player.x) * sc, dy = (pk.y - player.y) * sc;
      if (Math.abs(dx) > MM / 2 - 4 || Math.abs(dy) > MM / 2 - 4) continue;
      const crit = pk.kind === "sigil";
      ctx.fillStyle = crit ? "#ffd34d" : "rgba(255,255,255,.5)";
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, crit ? 4 : 2, 0, TAU); ctx.fill();
    }
    // 보스·파수꾼 — 가장 크게, 맥동
    const bp = .6 + Math.sin(performance.now() / 180) * .4;
    for (const e of enemies) {
      if (!e.active || (!e.boss && !e.sigilKey)) continue;
      const dx = clamp((e.x - player.x) * sc, -MM / 2 + 6, MM / 2 - 6);
      const dy = clamp((e.y - player.y) * sc, -MM / 2 + 6, MM / 2 - 6);
      ctx.globalAlpha = bp;
      ctx.fillStyle = e.boss ? "#ff3b6b" : "#c9a3ff";
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, 6, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = e.boss ? "#ff3b6b" : "#c9a3ff"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(ccx + dx, ccy + dy, 9, 0, TAU); ctx.stroke();
    }
    // 플레이어
    ctx.fillStyle = "#fff";
    ctx.save(); ctx.translate(ccx, ccy); ctx.rotate(Math.atan2(player.faceY, player.faceX));
    ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.restore();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = "700 9px " + FONT; ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.fillText(Math.round(RANGE / 10) + "m", mx + 6, my + MM - 9);
  }

  // ── 보스 체력바 — 살아 있는 동안 화면 위에
  {
    let boss = null;
    for (const e of enemies) if (e.active && (e.boss || e.sigilKey)) { boss = e; if (e.boss) break; }
    if (boss) {
      const bw = 420, bx = W / 2 - bw / 2, by = 64;
      const f = clamp(boss.hp / boss.maxHp, 0, 1);
      ctx.fillStyle = "rgba(0,0,0,.6)";
      ctx.beginPath(); ctx.roundRect(bx, by, bw, 16, 5); ctx.fill();
      ctx.fillStyle = boss.boss ? "#ff3b6b" : "#c9a3ff";
      ctx.beginPath(); ctx.roundRect(bx + 2, by + 2, (bw - 4) * f, 12, 4); ctx.fill();
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "700 11px " + FONT; ctx.fillStyle = "#fff";
      ctx.fillText((boss.boss ? (boss.type.title || "보스") : "제단의 파수꾼") + "  " + Math.ceil(boss.hp).toLocaleString("ko-KR"), W / 2, by + 8);
      // 화면 밖이면 방향까지
      const sx = boss.x - cam.x, sy = boss.y - cam.y;
      if (sx < 0 || sx > W || sy < 0 || sy > H) {
        const d = Math.round(Math.hypot(boss.x - player.x, boss.y - player.y) / 10);
        ctx.font = "700 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.6)";
        ctx.fillText(d + "m 떨어져 있음", W / 2, by + 28);
      }
    }
  }

  // 화면 밖 보스·파수꾼 방향 — 지형지물보다 강하게
  for (const e of enemies) {
    if (!e.active || (!e.boss && !e.sigilKey)) continue;
    const sx = e.x - cam.x, sy = e.y - cam.y;
    const m = 58;
    if (sx > m && sx < W - m && sy > m && sy < H - m) continue;
    const ax = clamp(sx, m, W - m), ay = clamp(sy, m, H - m);
    const ang = Math.atan2(sy - player.sy, sx - player.sx);
    const col = e.boss ? "#ff3b6b" : "#c9a3ff";
    ctx.save();
    ctx.globalAlpha = .7 + Math.sin(performance.now() / 170) * .3;
    ctx.translate(ax, ay); ctx.rotate(ang);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(24, 0); ctx.lineTo(-8, -13); ctx.lineTo(-8, 13); ctx.closePath(); ctx.fill();
    ctx.rotate(-ang);
    ctx.font = "800 12px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = col;
    ctx.fillText(e.boss ? (e.type.title || "보스") : "파수꾼", 0, -26);
    ctx.font = "700 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.fillText(Math.round(Math.hypot(e.x - player.x, e.y - player.y) / 10) + "m", 0, 26);
    ctx.restore();
  }

  // 화면 밖 지형지물 방향 표시 — 어디로 갈지 모르면 돌아다닐 수 없다
  // 구조물 — 한 판에 몇 개 없고 크게 돌아갈 값이 있어서 더 멀리서도 알려준다
  for (const s of structures) {
    const sx = s.x - cam.x, sy = s.y - cam.y;
    const m = 52;
    if (sx > m && sx < W - m && sy > m && sy < H - m) continue;
    const d = Math.hypot(s.x - player.x, s.y - player.y);
    if (d > 2600) continue;
    const ax = clamp(sx, m, W - m), ay = clamp(sy, m, H - m);
    const ang = Math.atan2(sy - player.sy, sx - player.sx);
    ctx.save();
    ctx.globalAlpha = clamp(1.5 - d / 2600, .35, .95) * (s.st ? .6 + .4 * Math.abs(Math.sin(Game.time * 4)) : 1);
    ctx.translate(ax, ay); ctx.rotate(ang);
    ctx.fillStyle = s.K.color;
    ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-7, -10); ctx.lineTo(-7, 10); ctx.closePath(); ctx.fill();
    ctx.rotate(-ang);
    ctx.font = "700 11px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = s.K.color;
    iconText(s.K.px, s.K.name, 0, -20, s.K.color, 2);
    ctx.font = "600 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillText(Math.round(d / 10) + "m" + (s.st ? " · 가동 중" : ""), 0, 20);
    ctx.restore();
  }

  for (const lm of landmarks) {
    const sx = lm.x - cam.x, sy = lm.y - cam.y;
    const m = 46;
    if (sx > m && sx < W - m && sy > m && sy < H - m) continue;
    const d = Math.hypot(lm.x - player.x, lm.y - player.y);
    if (d > 1500) continue;
    const ax = clamp(sx, m, W - m), ay = clamp(sy, m, H - m);
    const ang = Math.atan2(sy - player.sy, sx - player.sx);
    ctx.save();
    ctx.globalAlpha = clamp(1.4 - d / 1500, .3, .95);
    ctx.translate(ax, ay);
    ctx.rotate(ang);
    ctx.fillStyle = lm.T.color;
    ctx.beginPath();
    ctx.moveTo(14, 0); ctx.lineTo(-6, -8); ctx.lineTo(-6, 8);
    ctx.closePath(); ctx.fill();
    ctx.rotate(-ang);
    ctx.font = "17px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    drawMenuIcon(lm.T.px, 0, -20, lm.T.color, 3);
    ctx.font = "700 9px " + FONT; ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.fillText(Math.round(d / 10) + "m", 0, 18);
    ctx.restore();
  }

  // 소지품 (Q 로 사용)
  {
    const bw = 40, gap = 6;
    const slotW = bw * MAX_ITEMS + gap * (MAX_ITEMS - 1);
    const bx0 = touch.seen ? 16 : W - 16 - slotW;
    for (let i = 0; i < MAX_ITEMS; i++) {
      const bx = bx0 + i * (bw + gap), by = H - 54;
      const key = player.items[i], C = key ? CONSUMABLES[key] : null;
      ctx.fillStyle = C ? "rgba(24,22,38,.92)" : "rgba(10,10,20,.5)";
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bw, 8); ctx.fill();
      ctx.strokeStyle = C ? (i === 0 ? C.color : C.color + "66") : "rgba(255,255,255,.1)";
      ctx.lineWidth = C && i === 0 ? 2 : 1; ctx.stroke();
      if (C) {
        ctx.font = "21px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        drawMenuIcon(C.px, bx + bw / 2, by + bw / 2, C.color, 3);
      }
    }
    const lx = touch.seen ? 16 : W - 16;
    ctx.font = "600 10px " + FONT;
    ctx.textAlign = touch.seen ? "left" : "right"; ctx.textBaseline = "middle";
    ctx.fillStyle = player.items.length ? "rgba(255,255,255,.6)" : "rgba(255,255,255,.25)";
    if (!touch.seen) ctx.fillText("Q 사용", lx, H - 66);
    if (player.items.length) {
      const C0 = CONSUMABLES[player.items[0]];
      ctx.font = "600 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.45)";
      ctx.fillText(C0.name, lx, H - 6);
    }
  }

  // 징표 · 버프
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.font = "700 14px " + FONT;
  ctx.fillStyle = player.sigils > 0 ? "#ffd34d" : "rgba(255,255,255,.28)";
  ctx.fillText(String(player.sigils), W - 16, 68);
  drawMenuIcon("sigil", W - 24 - ctx.measureText(String(player.sigils)).width, 67, "#ffd34d", 2);
  let by2 = 90;
  if (player.buffFury > 0) {
    ctx.font = "700 12px " + FONT; ctx.fillStyle = "#ff6b4a";
    { const t = "광란 " + player.buffFury.toFixed(1) + "초";
      ctx.fillText(t, W - 16, by2);
      drawMenuIcon("flask", W - 24 - ctx.measureText(t).width, by2 - 1, "#ff6b4a", 2); }
    by2 += 20;
  }
  if (player.buffWard > 0) {
    ctx.font = "700 12px " + FONT; ctx.fillStyle = "#8fd0ff";
    { const t = "수호 " + player.buffWard.toFixed(1) + "초";
      ctx.fillText(t, W - 16, by2);
      drawMenuIcon("shield", W - 24 - ctx.measureText(t).width, by2 - 1, "#8fd0ff", 2); }
    by2 += 20;
  }

  // 보스 미션 — 지금 무엇을 해야 하는지 항상 보이게 둔다
  if (Mission.on && !overlay) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const big = Mission.flash > 0;
    /* 좁은 화면에서는 왼쪽 위의 조합 줄이 세로로 길게 서서 이 배너와 겹친다 —
       가운데 정렬이라 그 위를 그대로 지나간다. 좁으면 그 아래로 내린다. */
    const my = big ? 150 : narrow() ? 152 : 82;
    ctx.globalAlpha = big ? 1 : .9;
    fitFont("800", big ? 26 : 17, Mission.text, W - 60);
    ctx.fillStyle = "#ff9a5c";
    iconText("alert", Mission.text, W / 2, my, "#ff5b6b", big ? 3 : 2);
    if (Mission.sub) {
      fitFont("600", big ? 14 : 11.5, Mission.sub, W - 40);
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.fillText(Mission.sub, W / 2, my + (big ? 26 : 17));
    }
    // 남은 표식 개수
    ctx.font = "700 13px " + FONT; ctx.fillStyle = "#ffd34d";
    ctx.fillText("남은 " + Mission.marks.length + "개", W / 2, my + (big ? 50 : 33));
    ctx.globalAlpha = 1;
  }

  // 전직 대기 — 레벨은 됐는데 아직 때가 아닐 때
  if (Game.advanceWaitT > 0 && !Game.advancePending) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.globalAlpha = .55 + Math.sin(performance.now() / 420) * .2;
    ctx.font = "800 16px " + FONT; ctx.fillStyle = "#c9a3ff";
    const w = Math.max(0, Math.ceil(Game.advanceWaitT));
    ctx.fillText("⏳ " + ["1차", "2차", "3차", "4차"][Game.advanceWaitTier - 1] + " 각성까지 "
      + Math.floor(w / 60) + ":" + String(w % 60).padStart(2, "0"), W / 2, 108);
    ctx.globalAlpha = 1;
  }

  // 전직 대기 — 때는 됐는데 징표가 없을 때
  if (Game.advancePending) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const a = .65 + Math.sin(performance.now() / 320) * .3;
    ctx.globalAlpha = a;
    ctx.font = "800 17px " + FONT; ctx.fillStyle = "#ffd34d";
    iconText("shrine", "전직 가능 — 전직의 징표가 필요하다", W / 2, 108, "#c9a3ff", 2);
    ctx.font = "600 12px " + FONT; ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillText("봉인된 제단의 파수꾼이나 보스를 쓰러뜨려라", W / 2, 128);
    ctx.globalAlpha = 1;
  }

  // 지형지물 알림
  if (Game.lmFlash > 0 && !overlay) {
    ctx.globalAlpha = Math.min(1, Game.lmFlash / 3 * 1.6);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 20px " + FONT; ctx.fillStyle = "#ffe9a8";
    ctx.fillText(Game.lmFlashText, W / 2, 206);
    ctx.globalAlpha = 1;
  }

  // 능동 스킬 — 터치에서는 오른쪽 아래 버튼이 같은 일을 하므로 그리지 않는다
  if (player.cls && !touch.seen) {
    const C = player.cls, ready = player.res >= curSkill().cost;
    const bw = 62, bx = W / 2 - bw / 2, by = H - 106;
    ctx.save();
    if (ready) { ctx.shadowColor = C.resource.color; ctx.shadowBlur = 16; }
    ctx.fillStyle = ready ? "rgba(28,26,42,.95)" : "rgba(12,12,20,.7)";
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bw, 12); ctx.fill();
    ctx.strokeStyle = ready ? C.resource.color : "rgba(255,255,255,.14)";
    ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = ready ? 1 : .4;
    ctx.font = "30px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    drawMenuIcon("skill", bx + bw / 2, by + 26, C.color, 4);
    ctx.font = "700 11px " + FONT;
    ctx.fillStyle = ready ? C.resource.color : "rgba(255,255,255,.55)";
    ctx.fillText(Math.min(100, Math.floor(player.res)) + " / " + curSkill().cost, bx + bw / 2, by + 50);
    ctx.globalAlpha = 1;
    // 이름과 단축키는 박스 밖에 — 62px 안에 한글 이름은 들어가지 않는다
    ctx.font = "700 12px " + FONT;
    ctx.fillStyle = ready ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.4)";
    ctx.fillText(curSkill().name, bx + bw / 2, by + bw + 12);
    ctx.font = "600 10px " + FONT; ctx.fillStyle = "rgba(255,255,255,.3)";
    ctx.fillText("스페이스", bx + bw / 2, by + bw + 27);
  }

  // 새 조합 해금 배너
  if (Game.comboFlash > 0 && !overlay) {
    const a = clamp(Game.comboFlash / 2.6, 0, 1);
    ctx.globalAlpha = Math.min(1, a * 1.6);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const last = COMBOS.filter(c => (Game.comboFlashMaster ? player.mastered : player.combos).has(c.key)).slice(-1)[0];
    const txt = last ? last.name + " — " + last.desc : "";
    ctx.font = "600 14px " + FONT;
    const bwid = Math.max(300, ctx.measureText(txt).width + 60);
    ctx.fillStyle = "rgba(10,8,18,.82)";
    ctx.beginPath(); ctx.roundRect(W / 2 - bwid / 2, 82, bwid, 62, 12); ctx.fill();
    ctx.strokeStyle = "rgba(255,217,160,.4)"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.font = "800 20px " + FONT; ctx.fillStyle = Game.comboFlashMaster ? "#ffe9a8" : "#ffd9a0";
    ctx.fillText(Game.comboFlashMaster ? "★ 조합 완성! 효과가 강해졌다" : "속성 조합 발동!", W / 2, 104);
    ctx.font = "600 13px " + FONT; ctx.fillStyle = "rgba(255,255,255,.8)";
    if (last) ctx.fillText(txt, W / 2, 128);
    ctx.globalAlpha = 1;
  }

  // 전직 연출
  if (Game.advanceFlash > 0 && !overlay) {
    const a = clamp(Game.advanceFlash / 3.2, 0, 1);
    ctx.globalAlpha = Math.min(1, a * 1.5);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 40px " + FONT; ctx.fillStyle = advColor();
    iconText("stance", advName(), W / 2, 132, advColor(), 3);
    ctx.font = "700 15px " + FONT; ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillText(player.advance.length >= 3 ? "★ 각성 완료 — 규칙이 바뀌었다"
                                            : "전직 완료 — 스킬과 특성이 새로 열렸다", W / 2, 164);
    ctx.globalAlpha = 1;
  }

  // 사냥개 무리 경고
  if (Game.houndWarn > 0 && !overlay) {
    ctx.globalAlpha = Math.min(1, Game.houndWarn / 2.4 * 1.8) * (.6 + Math.abs(Math.sin(Game.time * 8)) * .4);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "800 24px " + FONT; ctx.fillStyle = "#ff9f6b";
    iconText("wolf", "사냥개 무리가 온다 — 도망칠 수 없다", W / 2, 178, "#d8a86a", 3);
    ctx.globalAlpha = 1;
  }

  // 조작 안내 (초반에만)
  if (Game.time < 8) {
    ctx.globalAlpha = clamp((8 - Game.time) / 3, 0, 1);
    ctx.textAlign = "center"; ctx.font = "600 15px " + FONT;
    ctx.fillStyle = "rgba(255,255,255,.75)";
    const tip = touch.seen
      ? "끌어서 이동  ·  공격은 자동  ·  오른쪽 아래 버튼으로 스킬과 아이템"
      : "WASD 이동  ·  공격은 자동  ·  SPACE 직업 스킬  ·  Q 아이템  ·  맵의 보물을 찾아라";
    fitFont("600", 13, tip, W - 32);
    ctx.fillText(tip, W / 2, H - 100);
    ctx.globalAlpha = 1;
  }

  if (touch.seen && !overlay) drawTouchControls();
}

/* 터치 조작을 눈에 보이게 그린다.
   조이스틱은 여태 '보이지 않는' 물건이었다 — 어디를 눌러야 하는지, 지금 얼마나 기울었는지
   알 방법이 없었다. 버튼은 아예 없었다. */
function drawTouchControls() {
  if (touch.pressT > 0) touch.pressT = Math.max(0, touch.pressT - 1 / 60);

  // 조이스틱 — 누른 자리에 테와 손잡이
  if (touch.active) {
    const dx = touch.x - touch.ox, dy = touch.y - touch.oy;
    const len = Math.hypot(dx, dy), R = 56;
    const k = len > R ? R / len : 1;
    ctx.globalAlpha = .5;
    pxRing(touch.ox, touch.oy, R, PIX, pxPal("#e8e5da"));
    ctx.globalAlpha = .8;
    ctx.fillStyle = "#e8e5da"; ctx.beginPath();
    pxEllipse(touch.ox + dx * k, touch.oy + dy * k, 15, 15); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 스킬 · 아이템 · 일시정지 버튼
  const sk = curSkill();
  for (const b of touchBtns()) {
    if (b.key === "pause") {              // 두 줄 — 흔한 일시정지 표시
      ctx.globalAlpha = .8;
      ctx.fillStyle = "rgba(10,10,20,.72)";
      ctx.beginPath(); pxEllipse(b.x, b.y, b.r, b.r); ctx.fill();
      pxRing(b.x, b.y, b.r, PIX, pxPal("#e8e5da"));
      ctx.fillStyle = "#e8e5da"; ctx.beginPath();
      pxR(b.x - 7, b.y - 9, 5, 18); pxR(b.x + 3, b.y - 9, 5, 18); ctx.fill();
      ctx.globalAlpha = 1;
      continue;
    }
    const isSkill = b.key === "skill";
    const ready = isSkill ? (sk && player.res >= sk.cost) : player.items.length > 0;
    const col = isSkill ? (player.cls ? player.cls.color : "#ffd36e") : "#8fd0ff";
    const hit = touch.press === b.key && touch.pressT > 0;

    ctx.globalAlpha = ready ? .92 : .4;
    ctx.fillStyle = "rgba(10,10,20,.72)";
    ctx.beginPath(); pxEllipse(b.x, b.y, b.r, b.r); ctx.fill();
    pxRing(b.x, b.y, b.r, hit ? PIX * 2 : PIX, pxPal(col));

    // 자원이 차는 만큼 안쪽이 찬다 — 언제 쓸 수 있는지 버튼만 봐도 알아야 한다
    if (isSkill && sk) {
      const f = clamp(player.res / sk.cost, 0, 1);
      if (f > 0) {
        ctx.globalAlpha = ready ? .34 : .22;
        ctx.fillStyle = col;
        ctx.beginPath();
        pxEllipse(b.x, b.y + b.r * (1 - f), b.r * .82, b.r * .82 * f); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    drawMenuIcon(isSkill ? "skill" : "gem", b.x, b.y - 5, ready ? col : "#6b6480", 3);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "700 10px " + FONT;
    ctx.fillStyle = ready ? "rgba(255,255,255,.85)" : "rgba(255,255,255,.4)";
    ctx.fillText(isSkill ? b.label : (player.items.length || "") + " " + b.label, b.x, b.y + b.r - 12);
  }
}

/* ---------- 오버레이 ---------- */
function panel(x, y, w, h, r = 14, fill = "rgba(12,12,22,.92)", stroke = "rgba(255,255,255,.14)") {
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke();
}
const inRect = (mx, my, x, y, w, h) => mx >= x && mx <= x + w && my >= y && my <= y + h;

/* ---------- 시작 화면 ----------
   바로 직업 선택으로 들어가면 '무슨 게임인지' 알기 전에 고르게 된다.
   여기서 이름과 규칙 한 줄, 기록, 그리고 들어갈 문 두 개(시작 / 제단)만 보여준다.
   배경은 실제 게임의 도형을 그대로 써서, 정지 화면이 아니라 세계의 한 장면이 되게 한다. */
/* 규칙 줄의 작은 아이콘. 이모지를 쓰면 폰트라 OS 마다 다르게 뜨고,
   무엇보다 이 게임의 다른 모든 것과 재질이 다르다. */
function drawRuleIcon(kind, x, y) {
  const P = PIX, R2 = (dx, dy, w, h) => pxR(x + dx * P, y + dy * P, w * P, h * P);
  ctx.beginPath();
  if (kind === "pad") {                       // 방향키
    ctx.fillStyle = "#8ef0b0";
    R2(-1, -4, 2, 2); R2(-1, 2, 2, 2); R2(-4, -1, 2, 2); R2(2, -1, 2, 2);
    ctx.fill();
    ctx.fillStyle = "rgba(142,240,176,.35)"; ctx.beginPath(); R2(-1, -1, 2, 2); ctx.fill();
  } else if (kind === "cards") {              // 카드 석 장
    ctx.fillStyle = "#ffd36e";
    for (let i = 0; i < 3; i++) R2(-4 + i * 3, -3 + (i === 1 ? -1 : 0), 2, 6);
    ctx.fill();
  } else if (kind === "steps") {              // 오르는 네 단계
    ctx.fillStyle = "#c9a3ff";
    for (let i = 0; i < 4; i++) R2(-4 + i * 2, 3 - (i + 1) * 1.6, 1.4, (i + 1) * 1.6);
    ctx.fill();
  } else {                                    // 해골
    ctx.fillStyle = "#e8e5da";
    R2(-3, -4, 6, 5); R2(-2, 1, 4, 2);
    ctx.fill();
    ctx.fillStyle = "#1a1a26"; ctx.beginPath();
    R2(-2, -3, 1.6, 2); R2(.6, -3, 1.6, 2); R2(-.6, 1, 1.4, 2);
    ctx.fill();
  }
}

/* (x, y) 를 한가운데로 두고 그린다. cell 로 크기를 정한다.
   글자 옆에 들어가는 자리는 cell 2 로 줄여 쓴다 — 판을 5×5 로 줄여도 봤는데
   그 크기에서는 검도 별도 마름모도 전부 '+' 로 뭉개져 구분이 안 됐다.
   칸이 세계의 PIX 보다 잘아지지만, 어차피 글자 옆이라 그쪽이 훨씬 잘 읽힌다. */
function drawMenuIcon(kind, x, y, col, cell = PIX) {
  const rows = MENU_ICONS[kind];
  if (!rows) return false;
  const pal = pxPal(col);                       // [밝음, 몸통, 바탕]
  const h = rows.length, w = rows[0].length;
  const x0 = Math.round((x - w * cell / 2) / cell) * cell;
  const y0 = Math.round((y - h * cell / 2) / cell) * cell;
  for (let k = 0; k < 3; k++) {
    const ch = String(2 - k);                   // 2(밝음) → pal[0]
    let any = false;
    ctx.beginPath();
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++)
      if (rows[r][c] === ch) { ctx.rect(x0 + c * cell, y0 + r * cell, cell, cell); any = true; }
    if (any) { ctx.fillStyle = pal[k]; ctx.fill(); }
  }
  return true;
}

/* 메뉴 세 화면의 공통 바탕.
   뒤에서는 어트랙트 데모가 실제로 굴러간다 — 덮어 가리되 지우지는 않는다.
   시작 · 직업 선택 · 제단이 같은 재질로 보이도록 한 곳에 모아 둔다. */
function menuScrim(a) {
  Game.introT += 1 / 60;
  const t = Game.introT;
  ctx.fillStyle = "rgba(7,7,13," + a + ")";
  ctx.fillRect(0, 0, W, H);
  // 위아래를 조금 더 눌러 글자가 앉을 자리를 만든다 (그라디언트 대신 띠로)
  for (let i = 0; i < 10; i++) {
    ctx.globalAlpha = .055;
    ctx.fillStyle = "#05050a";
    ctx.fillRect(0, i * 9, W, 9);
    ctx.fillRect(0, H - 90 + i * 9, W, 9);
  }
  ctx.globalAlpha = 1;
  // 불티
  for (let i = 0; i < 40; i++) {
    const p = (i * 97.3) % 1, sp = 14 + p * 30;
    const yy = H - ((t * sp + p * H) % (H + 60)) + 30;
    const xx = (i * 137.5) % W + Math.sin(t * .7 + i) * 14;
    ctx.globalAlpha = .10 + p * .2;
    ctx.fillStyle = "#ffb35c";
    ctx.fillRect(xx, yy, 2, 2 + p * 3);
  }
  ctx.globalAlpha = 1;
}

function drawIntro() {
  menuScrim(.52);
  const t = Game.introT;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  // 문장(紋章) — 방패와 검
  const cx = W / 2, cy = 150;
  /* 문장 — 방패와 십자. 베지어와 그라디언트로 그리면 이 화면만 매끈해서 뜬다.
     방패 폭을 높이별로 구해 가로줄로 쌓는다(테두리는 한 겹 크게 깔고 그 위에 속). */
  const bob = Math.round(Math.sin(t * 1.3) * 4 / PIX) * PIX;
  const shieldW = (y, k) => {                     // y = -46 .. 52
    if (y < -40) return (38 + k) * (1 - (-40 - y) / 9);   // 윗변 모서리
    if (y <= 14) return 38 + k;
    const u = (y - 14) / 38;
    return (38 + k) * Math.sqrt(Math.max(0, 1 - u * u));  // 아래로 좁아져 뾰족해진다
  };
  const shield = (k, col) => {
    ctx.fillStyle = col; ctx.beginPath();
    for (let y = -49; y <= 53 + k; y += PIX) {
      const w = shieldW(y, k);
      if (w < PIX * .5) continue;
      pxR(cx - w, cy + bob + y, w * 2, PIX);
    }
    ctx.fill();
  };
  ctx.save();
  // 맥동하는 후광 — 방패 모서리(중심에서 68)보다 밖에 둬야 겹쳐 잘려 보이지 않는다
  ctx.globalAlpha = .26 + Math.sin(t * 2) * .09;
  pxRing(cx, cy + bob + 2, 76, PIX * 2, pxPal("#ffd36e"));
  ctx.globalAlpha = 1;
  shield(4, "#ffd36e");                           // 테두리
  shield(0, "#2a2438");                           // 속
  ctx.fillStyle = "#ffe9b8"; ctx.beginPath();     // 십자
  pxR(cx - PIX * 2, cy + bob - 30, PIX * 4, 60);

  ctx.fill();

  // 제목 — 좁은 화면에서는 글꼴을 줄여 잘리지 않게

  // 기록

  /* 버튼 두 개. 나란히 놓으면 538px 이 필요해 세로 화면(520)에서 잘린다 —
     좁으면 위아래로 쌓는다. */
  const two = W >= 580;

  ctx.fillText("스페이스 또는 클릭", bx + bw / 2, by + 43);

  panel(bx2, by2, bw, bh, 12,

  const sw = 130, sh = 30, sx = cx - sw / 2, sy = by2 + bh + 10;

    ["cards", "레벨업마다 3택", "무기 6칸 · 능력 6칸 — 무엇을 포기할지가 빌드가 된다"],
    ["steps", "각성 4단계", "3:00 · 6:00 · 9:00 · 12:00 — 레벨과 징표를 함께 채워야 열린다"],
    ["skull", "보스는 미션을 낸다", "표식을 부수기 전에는 거의 다치지 않는다"],
  ];
  /* cx-330 으로 고정돼 있었다 — 폭이 520 이면 화면 밖이다.
     좁으면 설명을 제목 아래로 내려 두 줄로 쓴다. */
  const wide = W >= 800;
