<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Templar Survivors</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0a12; color: #e8e8f0;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #15152a 0%, #08080f 70%);
  }
  canvas {
    display: block;
    image-rendering: auto;
    touch-action: none;
    box-shadow: 0 0 60px rgba(0,0,0,.8);
    cursor: crosshair;
  }
</style>
<div id="stage"><canvas id="game"></canvas></div>
<script>
"use strict";
/* ==========================================================================
   Templar Survivors — 뱀파이어 서바이버즈 스타일 오토배틀러
   의존성 없음. Canvas 2D + WebAudio 만 사용.
   ========================================================================== */

/* ---------- 설정 ---------- */
const W = 1280, H = 720;          // 논리 해상도 (실제 크기는 CSS로 스케일)
const STEP = 1 / 60;              // 고정 타임스텝
const RUN_TIME = 15 * 60;         // 15분 생존 = 클리어
const MAX_WEAPONS = 6, MAX_PASSIVES = 6, MAX_LEVEL = 8;
// 전직 레벨 (1차 · 2차 · 3차 · 4차 각성)
const ADV_LEVELS = [8, 20, 34, 52];
// 징표는 단계만큼 든다 — 뒤로 갈수록 제단과 보스를 더 찾아다녀야 한다
const ADV_SIGILS = [1, 2, 3, 4];
// 레벨만으로 열면 경험치 배율을 조절할 때마다 전직 시점이 같이 흔들린다.
// 판 전체 길이(RUN_TIME)의 1/5 · 2/5 · 3/5 · 4/5 지점을 함께 요구해, 성장 속도와
// 무관하게 한 판 안에서 늘 같은 리듬으로 열리게 한다. 15분 기준 3:00 · 6:00 · 9:00 · 12:00.
const ADV_AT = [.2, .4, .6, .8];
const advTime = tier => RUN_TIME * ADV_AT[tier - 1];
const ADV_TIERS = 4;
// 조합은 두 속성 무기를 이 레벨까지 올려야 열리고(COMBO_LEVEL),
// 둘 다 최대치가 되면 '완성'되어 효과가 강해진다(COMBO_MASTER).
//   1로 두면 무기를 모으기만 하는 게 최적이 되어 강화할 이유가 사라지고,
//   반대로 곧바로 최대치를 요구하면 조합이 판의 마지막 1/3에만 열리고
//   중간에 죽으면 시스템을 아예 못 본다(측정: 첫 해금 10:47~13:31).
//   그래서 절반에서 열고, 최대치에서 보상한다.
const COMBO_LEVEL = 4;
const COMBO_MASTER = MAX_LEVEL;
const MASTER_POWER = 1.7;          // 완성 시 조합 효과 배수

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });

// roundRect 미지원 브라우저 대비
if (!ctx.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * scale) + "px";
  canvas.style.height = Math.floor(H * scale) + "px";
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
window.addEventListener("resize", resize);

/* ---------- 유틸 ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndInt = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };

// 좌표 기반 결정적 해시 (같은 좌표는 항상 같은 값). 0~1 균등 분포.
// 주의: 곱셈을 그냥 `*` 로 하면 결과가 2^53 을 넘어 하위 비트가 날아가고,
// 분포가 [0, 0.5) 에 갇힌다. 실제로 그 버그 때문에 배경 장식도 지형지물도
// 한 번도 생성되지 않았다. 32비트 정수 곱셈(Math.imul)을 써야 한다.
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

/* ---------- 사운드 (에셋 없이 합성) ---------- */
const Sfx = {
  ctx: null, on: true, last: {},
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = .25; this.master.connect(this.ctx.destination); }
  },
  play(freq, dur, type = "square", vol = 1, slide = 0) {
    if (!this.on || !this.ctx) return;
    if (this.ctx.state === "suspended") this.ctx.resume();
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol * .3, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(g); g.connect(this.master); osc.start(t); osc.stop(t + dur + .02);
  },
  // 같은 소리가 초당 수십 번 나지 않도록 제한
  throttled(key, ms, fn) {
    const now = performance.now();
    if (this.last[key] && now - this.last[key] < ms) return;
    this.last[key] = now; fn();
  },
  hit()     { this.throttled("hit", 45, () => this.play(rnd(420, 540), .05, "square", .35, -200)); },
  shoot()   { this.throttled("shoot", 70, () => this.play(700, .05, "triangle", .3, -300)); },
  hurt()    { this.play(150, .22, "sawtooth", .9, -90); },
  pickup()  { this.throttled("pickup", 55, () => this.play(880, .05, "sine", .35, 300)); },
  levelup() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.play(f, .13, "triangle", .8), i * 70)); },
  boss()    { this.play(70, .8, "sawtooth", 1, 40); },
  dead()    { [400, 330, 260, 180].forEach((f, i) => setTimeout(() => this.play(f, .3, "sawtooth", .8), i * 130)); },
};

/* ---------- 배경음악 ----------
   에셋을 쓰지 않는 게 이 프로젝트의 규칙이라 음악도 WebAudio 로 합성한다.
   setInterval 로 음을 찍으면 타이밍이 흔들려 박자가 무너지므로,
   오디오 클럭 기준으로 미리(lookahead) 예약하는 방식으로 만든다.

   구성은 층(layer)으로 나눈다. 같은 곡을 상황에 따라 두껍게/얇게 연주해
   시작 화면과 전투, 보스전이 같은 세계로 들리게 한다.
     드럼 · 베이스   항상
     아르페지오      전투부터
     리드 멜로디     전투부터 (보스전에는 옥타브 위로)
     긴장 패드       보스전 */
const Music = {
  ctx: null, gain: null, on: true,
  step: 0, nextTime: 0, timer: null, mode: "menu",
  bpm: 152,

  // Am - F - C - G : 단조로 시작해 장조로 풀리는, 달리는 느낌의 진행
  prog: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]],
  // 리드 멜로디 (16분음표 격자, null 은 쉼표)
  lead: [76, null, 74, 72, null, 72, 74, null, 76, null, 79, null, 77, null, 74, null],

  mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); },

  start(mode) {
    this.mode = mode || "menu";
    if (!Sfx.ctx) Sfx.init();
    if (!Sfx.ctx) return;
    this.ctx = Sfx.ctx;
    if (this.ctx.state === "suspended") this.ctx.resume();
    if (this.timer) return;                       // 이미 돌고 있으면 모드만 바꾼다
    if (!this.gain) {
      this.gain = this.ctx.createGain();
      this.gain.gain.value = .0;
      this.gain.connect(this.ctx.destination);
    }
    this.nextTime = this.ctx.currentTime + .1;
    this.timer = setInterval(() => this.schedule(), 25);
    this.fade(this.vol());
  },
  stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } this.fade(0); },
  fade(v) {
    if (!this.gain || !this.ctx) return;
    const t = this.ctx.currentTime;
    this.gain.gain.cancelScheduledValues(t);
    this.gain.gain.setValueAtTime(this.gain.gain.value, t);
    this.gain.gain.linearRampToValueAtTime(Sfx.on ? v : 0, t + .5);
  },
  setMode(m) { if (this.mode !== m) { this.mode = m; this.fade(this.vol()); } },
  vol() { return this.mode === "boss" ? .19 : this.mode === "play" ? .16 : .12; },

  // 오디오 클럭보다 조금 앞서서 예약해 둔다
  schedule() {
    if (!this.ctx) return;
    const spb = 60 / this.bpm / 4;                // 16분음표 한 칸
    while (this.nextTime < this.ctx.currentTime + .12) {
      this.tick(this.step, this.nextTime, spb);
      this.step = (this.step + 1) % 64;
      this.nextTime += spb;
    }
  },

  tone(t, freq, dur, type, vol, dest) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(dest || this.gain);
    o.start(t); o.stop(t + dur + .02);
  },
  noise(t, dur, vol, hp) {
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp || 2000;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.gain);
    src.start(t);
  },

  tick(i, t, spb) {
    const bar = Math.floor(i / 16) % 4;
    const chord = this.prog[bar];
    const beat = i % 16;
    const full = this.mode === "play" || this.mode === "boss";
    const boss = this.mode === "boss";

    // 킥 — 네 박자를 끌고 간다
    if (beat % 4 === 0) {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(45, t + .12);
      g.gain.setValueAtTime(.9, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .18);
      o.connect(g); g.connect(this.gain); o.start(t); o.stop(t + .2);
    }
    // 스네어 · 하이햇
    if (beat === 4 || beat === 12) this.noise(t, .12, .28, 1400);
    if (full && beat % 2 === 1) this.noise(t, .03, .07, 6000);

    // 베이스 — 8분음표로 밀어붙인다
    if (beat % 2 === 0) {
      const root = chord[0] - 12;
      this.tone(t, this.mtof(beat % 8 === 6 ? root + 7 : root), spb * 1.7, "sawtooth", .16);
    }
    // 아르페지오
    if (full) {
      const n = chord[(i % 3)] + (beat >= 8 ? 12 : 0);
      this.tone(t, this.mtof(n), spb * 1.3, "square", .045);
    }
    // 리드 — 보스전에서는 한 옥타브 위로 올려 급해진다
    if (full) {
      const m = this.lead[beat];
      if (m !== null) this.tone(t, this.mtof(m + (boss ? 12 : 0) + (bar === 3 ? 2 : 0)), spb * 2.2, "triangle", .075);
    }
    // 보스전 긴장 패드
    if (boss && beat === 0)
      this.tone(t, this.mtof(chord[0] - 24), spb * 15, "sawtooth", .05);
  },
};

/* ---------- 입력 ---------- */
const keys = new Set();
const mouse = { x: W / 2, y: H / 2, down: false, clicked: false };
const touch = { active: false, ox: 0, oy: 0, x: 0, y: 0 };

addEventListener("keydown", e => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Tab"].includes(e.key)) e.preventDefault();
  keys.add(e.key.toLowerCase());
  Sfx.init();
  Game.onKey(e.key.toLowerCase());
});
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());

function canvasPos(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: (clientX - r.left) / r.width * W, y: (clientY - r.top) / r.height * H };
}
canvas.addEventListener("mousemove", e => { const p = canvasPos(e.clientX, e.clientY); mouse.x = p.x; mouse.y = p.y; });
canvas.addEventListener("mousedown", e => { Sfx.init(); mouse.down = true; mouse.clicked = true; const p = canvasPos(e.clientX, e.clientY); mouse.x = p.x; mouse.y = p.y; });
addEventListener("mouseup", () => mouse.down = false);
canvas.addEventListener("contextmenu", e => { e.preventDefault(); Sfx.init(); useSkill(); });

// 모바일: 화면을 누른 지점 기준 가상 조이스틱
canvas.addEventListener("touchstart", e => {
  e.preventDefault(); Sfx.init();
  const t = e.changedTouches[0], p = canvasPos(t.clientX, t.clientY);
  mouse.x = p.x; mouse.y = p.y; mouse.clicked = true;
  touch.active = true; touch.ox = p.x; touch.oy = p.y; touch.x = p.x; touch.y = p.y;
}, { passive: false });
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  const t = e.changedTouches[0], p = canvasPos(t.clientX, t.clientY);
  touch.x = p.x; touch.y = p.y;
}, { passive: false });
canvas.addEventListener("touchend", e => { e.preventDefault(); touch.active = false; }, { passive: false });

function inputVector() {
  let dx = 0, dy = 0;
  if (keys.has("a") || keys.has("arrowleft"))  dx -= 1;
  if (keys.has("d") || keys.has("arrowright")) dx += 1;
  if (keys.has("w") || keys.has("arrowup"))    dy -= 1;
  if (keys.has("s") || keys.has("arrowdown"))  dy += 1;
  if (!dx && !dy && touch.active) {
    const tx = touch.x - touch.ox, ty = touch.y - touch.oy;
    const len = Math.hypot(tx, ty);
    if (len > 12) { dx = tx / len; dy = ty / len; }
  }
  const l = Math.hypot(dx, dy);
  return l > 0 ? { x: dx / l, y: dy / l } : { x: 0, y: 0 };
}

/* ---------- 공간 해시 (적 300마리 충돌을 O(n²) 없이) ---------- */
class SpatialHash {
  constructor(cell = 64) { this.cell = cell; this.map = new Map(); }
  clear() { this.map.clear(); }
  key(cx, cy) { return cx * 73856093 ^ cy * 19349663; }
  insert(e) {
    const cx = Math.floor(e.x / this.cell), cy = Math.floor(e.y / this.cell);
    const k = this.key(cx, cy);
    let bucket = this.map.get(k);
    if (!bucket) { bucket = []; this.map.set(k, bucket); }
    bucket.push(e);
  }
  // 반경 r 안의 후보를 out 배열에 채워서 반환 (할당 최소화)
  query(x, y, r, out) {
    out.length = 0;
    const c = this.cell;
    const x0 = Math.floor((x - r) / c), x1 = Math.floor((x + r) / c);
    const y0 = Math.floor((y - r) / c), y1 = Math.floor((y + r) / c);
    for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
      const bucket = this.map.get(this.key(cx, cy));
      if (bucket) for (let i = 0; i < bucket.length; i++) out.push(bucket[i]);
    }
    return out;
  }
}

/* ---------- 소모품 ----------
   주워서 소지품(3칸)에 넣고 Q 로 쓴다. 언제 쓰느냐가 판단이 되도록
   즉발형과 지속형을 섞어 둔다. */
const CONSUMABLES = {
  bomb: { name: "화염병", icon: "💣", color: "#ff8a3c",
    desc: "주변을 크게 폭발시킨다",
    use(p) {
      spawnWave({ x: p.x, y: p.y, maxR: 420 * p.stats.area,
        dmg: (120 + p.level * 14) * p.stats.damage, life: .5,
        color: "#ff8a3c", element: "fire" });
      cam.shake = 16; Sfx.play(120, .4, "sawtooth", 1, -60);
    } },
  sand: { name: "시간의 모래", icon: "⏳", color: "#9ce0c0",
    desc: "6초간 화면의 모든 적이 느려진다",
    use(p) {
      for (const e of enemies) if (e.active) e.slow = Math.max(e.slow, 6);
      spawnWave({ x: p.x, y: p.y, maxR: 900, dmg: 0, life: .8, color: "#9ce0c0", element: "frost" });
      Sfx.play(300, .6, "sine", .8, -160);
    } },
  fury: { name: "광란의 물약", icon: "🧪", color: "#ff6b4a",
    desc: "12초간 공격 속도 +60%",
    use(p) { p.buffFury = 12; Sfx.play(440, .3, "square", .8, 300); } },
  ward: { name: "수호의 부적", icon: "🔰", color: "#8fd0ff",
    desc: "8초간 받는 피해 -60%",
    use(p) { p.buffWard = 8; p.iframe = Math.max(p.iframe, .5); Sfx.play(520, .35, "triangle", .8, 200); } },
  soul: { name: "영혼석", icon: "💠", color: "#c9a3ff",
    desc: "경험치를 크게 얻는다",
    use(p) {
      p.xp += p.xpNext * .55;
      spawnNumber(p.x, p.y - 40, "경험치 +", "#c9a3ff", 20);
      Sfx.play(880, .3, "triangle", .9, 400);
    } },
};
const CONSUMABLE_KEYS = Object.keys(CONSUMABLES);
const MAX_ITEMS = 3;

/* ---------- 맵의 지형지물 ----------
   무한 평지에서는 어디로 갈 이유가 없다. 월드를 격자로 나눠 칸마다
   결정적으로(해시로) 지형지물을 놓아, 돌아다닐 목적을 만든다.
   시드가 좌표이므로 저장할 필요가 없고, 멀어졌다 돌아와도 같은 자리에 있다. */
const LM_CELL = 760;
const lmState = new Map();     // "cx,cy" -> "done" | "fighting"
const landmarks = [];          // 지금 근처에 있는 것만 실체화

const LM_TYPES = {
  chest:    { name: "보물 상자",   icon: "🧰", color: "#e8c96a", r: 20 },
  shrine:   { name: "봉인된 제단", icon: "⛩️", color: "#c9a3ff", r: 26 },
  monolith: { name: "고대 비석",   icon: "🗿", color: "#8fd0ff", r: 24 },
};

function updateLandmarks() {
  landmarks.length = 0;
  const cx0 = Math.floor(player.x / LM_CELL), cy0 = Math.floor(player.y / LM_CELL);
  for (let cx = cx0 - 2; cx <= cx0 + 2; cx++) {
    for (let cy = cy0 - 2; cy <= cy0 + 2; cy++) {
      const h = hash2(cx, cy);
      if (h < .80) continue;                       // 칸의 20% 정도에만 놓인다
      const key = cx + "," + cy;
      if (lmState.get(key) === "done") continue;
      const type = h > .97 ? "monolith" : h > .90 ? "shrine" : "chest";
      const T = LM_TYPES[type];
      landmarks.push({
        key, type, T,
        x: cx * LM_CELL + LM_CELL * (.18 + hash2(cx + 31, cy) * .64),
        y: cy * LM_CELL + LM_CELL * (.18 + hash2(cx, cy + 31) * .64),
        r: T.r,
        fighting: lmState.get(key) === "fighting",
      });
    }
  }
}

/* ---------- 지형: 벽과 바위 ----------
   길을 막는 것이 있어야 '어디로 갈지'가 판단이 된다.
   충돌은 전부 원으로 처리한다 — 사각형은 모서리에 끼는 문제가 생기고,
   적 수백 마리를 밀어내야 하므로 값이 싸야 한다. */
const OBS_CELL = 265;
const obsState = new Map();      // "cx,cy" -> "gone" | { hp, max }
const obstacles = [];
const spawnedObs = [];           // 보스가 소환한 것 — 격자와 무관하게 존재한다

/* 지형 종류.
   막기만 하는 지형이 여러 개면 종류를 나눈 의미가 없다. 각각 다른 판단을 만든다.
     block   이동을 막는가
     stop    발사체를 막는가 (벽 뒤에서 쏘는 전술이 통하지 않는다)
     reflect 발사체를 튕겨내는가 (내 마법이 나에게 돌아온다)
     hp      부술 수 있는가 (null 이면 불괴)
     hurt    밟으면 아픈가 */
/* 보스 미션.
   보스가 그냥 체력 큰 적이면 '계속 때린다'가 유일한 답이 된다.
   미션은 그 답을 잠시 막아, 판단할 거리를 하나 만든다 —
   무엇을 먼저 부술지, 어디로 빠질지. 미션이 살아 있는 동안 보스는 보호받는다. */
const Mission = {
  on: false, text: "", sub: "", boss: null, marks: [], flash: 0,
  start(boss, text, sub, marks) {
    this.on = true; this.boss = boss; this.text = text; this.sub = sub || "";
    this.marks = marks || []; this.flash = 2.6;
    Game.lmFlash = 0;
    cam.shake = 14;
    Sfx.play(160, .6, "sawtooth", .8, 240);
  },
  // 표식(소환 지형)이 모두 사라지면 미션 완료
  update(dt) {
    if (this.flash > 0) this.flash -= dt;
    if (!this.on) return;
    if (!this.boss || !this.boss.active) { this.clear(); return; }
    this.marks = this.marks.filter(m => m.st.hp > 0 && spawnedObs.includes(m));
    if (!this.marks.length) {
      this.on = false;
      Game.lmFlash = 2.4; Game.lmFlashText = "보호가 걷혔다 — 지금이다";
      Sfx.play(700, .5, "triangle", .9, 500);
      cam.shake = 12;
    }
  },
  clear() { this.on = false; this.boss = null; this.marks.length = 0; this.text = ""; this.sub = ""; },
  // 미션 중에는 보스가 받는 피해가 크게 줄어든다
  guard(e) { return this.on && this.boss === e ? .18 : 1; },
};

const OBS_KINDS = {
  //                        이동    발사체  반사   부술수  기본 크기      체력
  rock:    { name: "바위",     block: true,  stop: false, reflect: false, breakable: true,  r: [11, 30], hp: 200, color: "#6a6a7c" },
  wall:    { name: "석벽",     block: true,  stop: false, reflect: false, breakable: false, r: [24, 62], color: "#4a4a5c" },
  pillar:  { name: "신전 기둥", block: true,  stop: true,  reflect: false, breakable: false, r: [16, 40], color: "#8a8264" },
  ruin:    { name: "폐허",     block: true,  stop: true,  reflect: false, breakable: false, r: [40, 96], color: "#54505f" },
  crystal: { name: "수정 기둥", block: true,  stop: false, reflect: true,  breakable: true,  r: [14, 38], hp: 420, color: "#7fd0e8" },
  thorn:   { name: "가시덤불",  block: false, stop: false, reflect: false, breakable: true,  r: [18, 54], hp: 120, color: "#5c7a48", hurt: true },
  // ── 추가 ──
  tree:    { name: "고목",     block: true,  stop: true,  reflect: false, breakable: true,  r: [26, 66], hp: 600, color: "#4a3a2c" },
  statue:  { name: "석상",     block: true,  stop: true,  reflect: false, breakable: false, r: [20, 44], color: "#7a7488" },
  bones:   { name: "거대 유해", block: true,  stop: false, reflect: false, breakable: true,  r: [30, 78], hp: 340, color: "#c8c2b0" },
  obelisk: { name: "첨탑",     block: true,  stop: true,  reflect: false, breakable: false, r: [18, 34], color: "#6a5a86" },
  brazier: { name: "화톳불",   block: false, stop: false, reflect: false, breakable: true,  r: [12, 24], hp: 150, color: "#ff8a3c", burn: true },
  bog:     { name: "늪",      block: false, stop: false, reflect: false, breakable: false, r: [34, 92], color: "#3a4a52", slow: true },
};
const OBS_LIST = Object.keys(OBS_KINDS);

function updateObstacles() {
  obstacles.length = 0;
  const cx0 = Math.floor(player.x / OBS_CELL), cy0 = Math.floor(player.y / OBS_CELL);
  for (let cx = cx0 - 4; cx <= cx0 + 4; cx++) {
    for (let cy = cy0 - 4; cy <= cy0 + 4; cy++) {
      const h = hash2(cx * 3 + 911, cy * 7 + 733);
      if (h < .63) continue;
      const key = cx + "," + cy;
      const st0 = obsState.get(key);
      if (st0 === "gone") continue;
      const x = cx * OBS_CELL + OBS_CELL * (.2 + hash2(cx + 5, cy + 17) * .6);
      const y = cy * OBS_CELL + OBS_CELL * (.2 + hash2(cx + 17, cy + 5) * .6);
      if (Math.abs(x) < 260 && Math.abs(y) < 260) continue;          // 시작 지점은 비워둔다
      let blocked = false;                                           // 지형지물을 막지 않는다
      for (const lm of landmarks) if (dist2(lm.x, lm.y, x, y) < 130 * 130) { blocked = true; break; }
      if (blocked) continue;
      // 어떤 지형인지는 좌표로 결정된다 (같은 자리에 늘 같은 것이 선다)
      const t = hash2(cx * 13 + 7, cy * 29 + 3);
      let kind;
      if (h > .983)      kind = "ruin";        // 아주 드물게 폐허
      else if (h > .966) kind = "obelisk";
      else if (h > .948) kind = "statue";
      else if (h > .928) kind = t < .5 ? "pillar" : "wall";
      else if (t > .93)  kind = "crystal";     // 마법을 튕겨낸다
      else if (t > .87)  kind = "tree";
      else if (t > .82)  kind = "bones";
      else if (t > .78)  kind = "bog";
      else if (t > .74)  kind = "brazier";
      else if (t > .62)  kind = "thorn";
      else               kind = "rock";
      const K = OBS_KINDS[kind];
      // 크기는 같은 종류 안에서도 크게 흔든다. 다 비슷한 크기면 눈에 안 들어온다.
      // 게다가 드물게(6%) '거대'가 서서 지형의 이정표가 된다.
      const sz = hash2(cx * 7 + 31, cy * 11 + 53);
      const huge = hash2(cx * 41 + 5, cy * 23 + 91) > .94;
      const r = (K.r[0] + (K.r[1] - K.r[0]) * (sz * sz)) * (huge ? 1.75 : 1);
      let st = st0;
      if (!st) {
        // 큰 것일수록 단단하다 — 보이는 것과 체감이 어긋나면 안 된다
        const mx = !K.breakable ? Infinity
                 : Math.round((K.hp || 200) * (r / K.r[0]) * .8 + Game.time * 1.6);
        st = { hp: mx, max: mx };
        obsState.set(key, st);
      }
      obstacles.push({ key, kind, K, wall: !K.breakable, x, y, r, st, seed: h, huge });
    }
  }
  // 보스가 소환한 지형
  for (let i = spawnedObs.length - 1; i >= 0; i--) {
    const o = spawnedObs[i];
    o.life -= STEP;
    if (o.life <= 0 || o.st.hp <= 0) { spawnedObs.splice(i, 1); continue; }
    obstacles.push(o);
  }
}

/* 보스가 그 자리에 지형을 세운다 — 길을 막는 것 자체가 공격이 된다 */
function spawnObstacleAt(x, y, kind, hp, life) {
  if (spawnedObs.length > 40) spawnedObs.shift();
  const K = OBS_KINDS[kind];
  const r = kind === "pillar" ? 26 : kind === "crystal" ? 22 : 30;
  const o = { key: "sp" + (obsSeq++), kind, K, wall: !K.breakable, x, y, r,
              st: { hp, max: hp }, seed: Math.random(), life: life || 999, spawned: true };
  spawnedObs.push(o);
  spawnParticles(x, y, 14, K.color, 200, .6, 4);
  return o;
}
let obsSeq = 0;

// 원 밀어내기 — 플레이어와 적 모두 같은 함수를 쓴다
function pushOutOfObstacles(ent, radius) {
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (!o.K.block) continue;                 // 가시덤불은 지나갈 수 있다
    let dx = ent.x - o.x, dy = ent.y - o.y;
    const min = o.r + radius;
    const d2 = dx * dx + dy * dy;
    if (d2 >= min * min) continue;
    // 정확히 중심에 겹치면 방향이 정해지지 않는다 — 임의 방향으로 밀어낸다.
    // (지형이 엔티티 위에서 생성되면 실제로 발생한다)
    if (d2 < .01) {
      const a = (o.x + o.y) % TAU;
      ent.x = o.x + Math.cos(a) * min;
      ent.y = o.y + Math.sin(a) * min;
      continue;
    }
    const d = Math.sqrt(d2);
    const push = (min - d) / d;
    ent.x += dx * push; ent.y += dy * push;
  }
}

// 부술 수 있는 바위만 피해를 받는다
function damageObstacle(o, dmg) {
  if (!o.K.breakable) return false;
  o.st.hp -= dmg;
  spawnParticles(o.x, o.y, 2, o.K.color, 90, .3, 2.5);
  if (o.st.hp > 0) return false;
  if (!o.spawned) obsState.set(o.key, "gone");
  spawnParticles(o.x, o.y, 18, o.K.color, 220, .7, 4);
  spawnGem(o.x, o.y, 3);
  if (Math.random() < .22) givePickupItem(pick(CONSUMABLE_KEYS), o.x, o.y);
  Sfx.throttled("rock", 90, () => Sfx.play(160, .18, "square", .5, -80));
  return true;
}

/* ---------- 스프라이트 레이어 ----------
   지금은 이미지 에셋이 하나도 없어서 전부 도형으로 그린다.
   나중에 아틀라스 1장 + 프레임 정의만 넣으면 그림만 갈아끼울 수 있도록,
   '무엇을 그릴지(key)'와 '어떻게 그릴지(도형 or 스프라이트)'를 여기서 분리해 둔다.

   사용 예:
     Sprites.load("atlas.png", { bat: { x:0, y:0, w:32, h:32, n:4, fps:8 }, ... });
   이후로는 draw() 가 자동으로 스프라이트를 쓰고, 없는 key 만 도형으로 폴백한다. */
const Sprites = {
  atlas: null, frames: {}, ready: false,

  load(url, frames) {
    const img = new Image();
    img.onload = () => { this.atlas = img; this.frames = frames || {}; this.ready = true; };
    img.onerror = () => { this.ready = false; };   // 실패해도 도형 렌더링으로 계속 돈다
    img.src = url;
  },

  /* 그렸으면 true, 프레임이 없으면 false → 호출부가 도형으로 폴백한다.
     호출부는 scale 로 '적 반지름 / 14' 를 넘긴다. 즉 28px 프레임이 히트박스와 정확히 겹친다.
     보스처럼 큰 것은 같은 28px 에 그리면 뭉개지므로, 큰 프레임을 쓰고 s 로 되돌린다.
       예) 64px 프레임 + s: 0.44  →  화면에서는 28px 기준으로 보이되 픽셀은 2배로 촘촘하다
     ox / oy 는 발밑을 기준으로 맞출 때 쓴다(기둥처럼 위로 긴 그림). */
  draw(key, sx, sy, scale, time, flip) {
    if (!this.ready || !key) return false;
    const f = this.frames[key];
    if (!f) return false;
    const n = f.n || 1;
    const idx = n > 1 ? Math.floor(time * (f.fps || 8)) % n : 0;
    const w = f.w, h = f.h;
    const k = scale * (f.s || 1);
    ctx.save();
    ctx.translate(sx + (f.ox || 0) * k, sy + (f.oy || 0) * k);
    if (flip) ctx.scale(-1, 1);
    ctx.imageSmoothingEnabled = false;          // 픽셀아트는 보간하지 않는다
    ctx.drawImage(this.atlas, f.x + idx * w, f.y, w, h,
                  -w * k / 2, -h * k / 2, w * k, h * k);
    ctx.restore();
    return true;
  },
};

  elite:  { key: "elite",  name: "정예", hp: 5.5,  dmg: 1.45, xp: 4,  r: 1.24, ring: "#ffd34d", drop: .55 },
  rare:   { key: "rare",   name: "희귀", hp: 15,   dmg: 1.9,  xp: 10,  r: 1.5,  ring: "#c9a3ff", drop: 1 },

// 등급 추첨 — 시간이 갈수록 상위 등급이 섞인다
function rollRank(t) {
  const m = t / 60;
  if (m >= 4 && Math.random() < Math.min(.10, (m - 4) * .013)) return RANKS.rare;
  if (m >= 1 && Math.random() < Math.min(.26, (m - 1) * .024)) return RANKS.elite;
  return RANKS.common;
}

/* ---------- 오브젝트 풀 ---------- */
function makePool(size, factory) {
  const arr = new Array(size);
  for (let i = 0; i < size; i++) { arr[i] = factory(); arr[i].active = false; }
  return arr;
}
function alloc(pool) {
  for (let i = 0; i < pool.length; i++) if (!pool[i].active) return pool[i];
  return null;               // 풀이 가득 차면 스폰을 건너뛴다 (프레임 드랍 방지)
}

/* 놓치면 안 되는 것(경험치·징표)은 풀이 가득 찼다고 사라지면 안 된다.
   빈 칸이 없으면 플레이어에게서 가장 먼 것을 밀어내고 그 칸을 쓴다.
   keep(o) 가 true 인 항목은 절대 밀어내지 않는다. */
function allocEvict(pool, keep) {
  const free = alloc(pool);
  if (free) return free;
  let far = null, farD = -1;
  for (let i = 0; i < pool.length; i++) {
    const o = pool[i];
    if (keep && keep(o)) continue;
    const d = dist2(o.x, o.y, player.x, player.y);
    if (d > farD) { farD = d; far = o; }
  }
  return far;
}

/* ---------- 스폰 헬퍼 ---------- */
function spawnProjectile(o) {
  const p = alloc(projectiles); if (!p) return null;
  p.active = true;
  p.x = o.x; p.y = o.y; p.vx = o.vx; p.vy = o.vy; p.r = o.r; p.dmg = o.dmg;
  p.pierce = o.pierce + (player.dynPierce || 0); p.life = o.life; p.kind = o.kind; p.angle = o.angle;
  p.color = o.color; p.homing = o.homing || 0; p.target = o.target || null;
  p.element = o.element || "physical"; p.maxLife = o.life; p.retarget = 0;
  const ps = player.dynProjSpeed || 1;
  if (ps !== 1) { p.vx *= ps; p.vy *= ps; }
  if (!p.homing && player.dynHoming) p.homing = player.dynHoming;
  p.spin = o.kind === "dagger" ? 0 : rnd(-4, 4);
  p.hitIds.clear();
  return p;
}
function spawnSlash(p, ang, dmg, len, life, element) {
  const s = alloc(slashes); if (!s) return;
  s.active = true; s.x = p.x; s.y = p.y; s.ang = ang; s.len = len;
  s.life = s.maxLife = life * .28; s.dmg = dmg; s.hitIds.clear();
  s.element = element || "physical";
}

function spawnWave(o) {
  const w = alloc(waves); if (!w) return;
  w.active = true; w.x = o.x; w.y = o.y; w.r = 0; w.maxR = o.maxR;
  w.life = w.maxLife = o.life; w.dmg = o.dmg; w.color = o.color;
  w.element = o.element || "physical"; w.heal = o.heal || 0;
  w.hitIds.clear();
}
function spawnEShot(x, y, vx, vy, dmg, color) {
  const p = alloc(eshots); if (!p) return;
  p.active = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy;
  p.dmg = dmg; p.life = 4; p.r = 7; p.color = color || "#ff7a7a";
}

function spawnHazard(x, y, r, dmg, life, color) {
  const h = allocEvict(hazards, null); if (!h) return;
  h.active = true; h.x = x; h.y = y; h.r = r; h.dmg = dmg;
  h.life = h.maxLife = life; h.color = color; h.tick = 0;
}

function spawnBolt(x, y) {
  const b = alloc(bolts); if (!b) return;
  b.active = true; b.x = x; b.y = y; b.life = .3; b.seed = rnd(1000);
}
function spawnParticles(x, y, n, color, speed = 120, life = .5, r = 3) {
  for (let i = 0; i < n; i++) {
    const p = alloc(particles); if (!p) return;
    const a = rnd(TAU), s = rnd(speed * .3, speed);
    p.active = true; p.x = x; p.y = y; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
    p.life = p.maxLife = rnd(life * .5, life); p.r = rnd(r * .6, r); p.color = color; p.drag = .9;
  }
}
function spawnNumber(x, y, text, color, size = 14) {
  const n = alloc(numbers); if (!n) return;
  n.active = true; n.x = x + rnd(-6, 6); n.y = y; n.vy = -46; n.life = .7;
  n.text = text; n.color = color; n.size = size;
}
function spawnGem(x, y, value) {
  let g = alloc(gems);
  if (!g) {
    // 풀이 가득 차면 가장 먼(사실상 못 줍는) 보석을 재활용한다.
    // 그냥 버리면 후반에 "처치해도 경험치가 안 나온다"가 된다.
    g = allocEvict(gems, null);
    if (!g) return;
    value += g.value;                    // 총량은 보존한다
  }
  g.active = true; g.x = x; g.y = y;
  const a = rnd(TAU); g.vx = Math.cos(a) * 60; g.vy = Math.sin(a) * 60;
  g.value = value; g.tier = value >= 40 ? 2 : value >= 8 ? 1 : 0;
  g.pulled = false; g.bob = rnd(TAU);
}
function spawnPickup(x, y, kind) {
  // 징표와 소모품은 진행에 직결되므로, 자리가 없으면 회복/자석을 밀어내고라도 놓는다.
  const critical = kind === "sigil" || kind.startsWith("item:");
  const p = critical
    ? allocEvict(pickups, o => o.kind === "sigil")
    : alloc(pickups);
  if (!p) return;
  p.active = true; p.x = x; p.y = y; p.kind = kind; p.bob = rnd(TAU);
}

/* ---------- 적 조회 ---------- */
/* 가장 가까운 적 k개.
   탐색 반경이 800~1200 이라 공간 해시는 오히려 수백 개 셀을 훑게 된다.
   대신 풀을 한 번 선형 순회하며 상위 k개만 삽입 정렬로 유지한다 —
   할당도 정렬도 없고, k 는 항상 작다(1~14).
   반환 배열을 호출부가 잠시 들고 있으므로 버퍼를 라운드로빈으로 돌려 재진입에 대비한다. */
const NEAR_BUFS = 6;
const nearBufs = [], nearDists = [];
for (let i = 0; i < NEAR_BUFS; i++) { nearBufs.push([]); nearDists.push([]); }
let nearIdx = 0;

function nearestEnemies(x, y, maxDist, count) {
  const buf = nearBufs[nearIdx], dists = nearDists[nearIdx];
  nearIdx = (nearIdx + 1) % NEAR_BUFS;
  buf.length = 0;
  const md2 = maxDist * maxDist;
  let n = 0;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (!e.active) continue;
    const d = dist2(e.x, e.y, x, y);
    if (d > md2) continue;
    if (n < count) {
      let j = n++;
      while (j > 0 && dists[j - 1] > d) { dists[j] = dists[j - 1]; buf[j] = buf[j - 1]; j--; }
      dists[j] = d; buf[j] = e;
    } else if (d < dists[count - 1]) {
      let j = count - 1;
      while (j > 0 && dists[j - 1] > d) { dists[j] = dists[j - 1]; buf[j] = buf[j - 1]; j--; }
      dists[j] = d; buf[j] = e;
    }
  }
  buf.length = n;
  return buf;
}

function damageEnemy(e, dmg, fromX, fromY, knock, elem) {
  if (!e.active) return;
  if (e.boss && Mission.on) dmg *= Mission.guard(e);   // 미션 중에는 보호받는다
  elem = elem || "physical";
  const s = player.stats, C = player.combos;

  // 속성 고유 효과
  if (elem === "frost") e.slow = Math.max(e.slow, 1.5);
  if (elem === "fire") { e.burn = Math.max(e.burn, 2.5); e.burnDps = Math.max(e.burnDps, dmg * .35); }

  // 조합: 정화의 불길 — 속성을 가리지 않고 화상을 남긴다
  if (C && C.has("pyre") && elem !== "fire") {
    const cp = comboPower("pyre");
    e.burn = Math.max(e.burn, 2.0 * cp); e.burnDps = Math.max(e.burnDps, dmg * .22 * cp);
    procCombo("pyre", e.x, e.y);
  }

  let mul = 1;
  // 조합: 빙결 처형 — 둔화된 적에게 물리 피해 증폭
  if (C && C.has("shatter") && elem === "physical" && e.slow > 0) { mul *= 1 + .45 * comboPower("shatter"); procCombo("shatter", e.x, e.y); }
  // 전직: 속성 증폭 / 둔화된 적 추가 피해
  if (elem !== "physical") mul *= 1 + advVal("elemAmp", 0) + .12 * traitLv("attune");
  if (e.burn > 0) mul *= 1 + advVal("poisonBonus", 0);
  if (e.slow > 0 && (advVal("deepFreeze", false) || traitLv("chronos")))
    mul *= 1 + .18 * traitLv("chronos") + (advVal("deepFreeze", false) ? .2 : 0);
  // 조합: 학살 — 처치 누적 버프
  if (C && C.has("carnage") && player.carnage > 0) { mul *= 1 + player.carnage; procCombo("carnage", e.x, e.y); }
  // 직업 자세(진영의 접전 스택 / 영창 단계)는 매 프레임 변하므로 여기서 곱한다
  mul *= player.dynDmg;

  const crit = Math.random() < ((s ? s.crit : .1) + player.dynCrit);
  let final = dmg * mul * (crit ? player.dynCritMul : 1);
  // 방패병 — 방패가 깨지기 전까지는 대부분을 막는다
  if (e.shieldHp > 0) {
    e.shieldHp -= final;
    if (e.shieldHp <= 0) {
      e.shieldHp = 0;
      spawnParticles(e.x, e.y, 14, "#cfd6e6", 220, .5, 3.5);
      spawnNumber(e.x, e.y - e.r - 16, "방패 파괴!", "#cfd6e6", 16);
      Sfx.throttled("shbreak", 120, () => Sfx.play(300, .2, "square", .5, -160));
    }
    final *= .25;
  }
  e.hp -= final;
  e.flash = .12;
  Game.dmgDealt += final;

  // 조합: 흡혈 전환
  if (C && C.has("leech") && player.leechBudget > 0) {
    const heal = Math.min(player.leechBudget, final * .015 * comboPower("leech"));
    player.leechBudget -= heal;
    player.hp = Math.min(s.maxHp, player.hp + heal);
    procCombo("leech", player.x, player.y);
  }

  const col = crit ? "#ffd34d" : (ELEMENTS[elem] ? ELEMENTS[elem].color : "#ffffff");
  spawnNumber(e.x, e.y - e.r, Math.round(final), col, crit ? 19 : 14);
  if (knock) {
    const a = Math.atan2(e.y - fromY, e.x - fromX);
    e.kx += Math.cos(a) * knock; e.ky += Math.sin(a) * knock;
  }
  // 전직: 처형 — 체력이 바닥난 적을 즉시 끝낸다
  const exe = advVal("execute", 0);
  if (exe > 0 && !e.boss && e.hp > 0 && e.hp < e.maxHp * (exe + .04 * traitLv("reap"))) {
    spawnNumber(e.x, e.y - e.r - 14, "처형!", "#e0426a", 20);
    e.hp = 0;
  }
  // 전직: 중독 — 모든 공격이 지속 피해를 남긴다
  if (advVal("poison", false)) {
    e.burn = Math.max(e.burn, 3);
    e.burnDps = Math.max(e.burnDps, dmg * .3);
  }
  // 전직: 파괴자 — 타격이 확률적으로 터진다
  const sh = advVal("shatterHit", 0);
  if (sh > 0 && Math.random() < sh + .08 * traitLv("demolish"))
    spawnWave({ x: e.x, y: e.y, maxR: 90 * player.stats.area, dmg: final * .6,
      life: .26, color: "#c94a2a", element: "fire" });
  if (e.hp <= 0) killEnemy(e, elem);
  else spawnParticles(e.x, e.y, 2, e.type.color, 90, .3, 2.5);
}

function killEnemy(e, elem) {
  const wasSlowed = e.slow > 0;
  e.active = false;
  Game.kills++;
  if (e.type.onDeath) e.type.onDeath(e);
  // 등급 보상 — 정예·희귀는 눈에 띄게 돌려준다
  if (e.rank && e.rank.drop) {
    if (Game.itemCd <= 0 && Math.random() < e.rank.drop) {
      givePickupItem(pick(CONSUMABLE_KEYS), e.x, e.y);
      Game.itemCd = ITEM_CD;
    }
    if (e.rank === RANKS.rare && Game.heartCd <= 0) { spawnPickup(e.x + 34, e.y, "heart"); Game.heartCd = HEART_CD; }
    spawnParticles(e.x, e.y, 18, e.rank.ring, 240, .7, 4);
  }
  player.onKill(e);
  // 전직: 피의 갈증 — 처치할 때마다 회복
  const kh = .006 * traitLv("bloodlust") + advVal("killHeal", 0);
  if (kh) player.hp = Math.min(player.stats.maxHp, player.hp + player.stats.maxHp * kh);
  // 3차 각성: 처치할 때마다 폭발이 번진다
  if (advVal("deathExplode", false))
    spawnWave({ x: e.x, y: e.y, maxR: 130 * player.stats.area,
      dmg: e.maxHp * .5 + 40 + player.level * 6, life: .3,
      color: advColor(), element: "fire" });
  // 3차 각성: 중독된 적이 죽으면 역병이 퍼진다
  if (advVal("poisonNova", false) && e.burn > 0) {
    const R = 200 * player.stats.area;
    const near = hash.query(e.x, e.y, R, scratch2);
    for (let i = 0; i < near.length; i++) {
      const o = near[i];
      if (!o.active || dist2(o.x, o.y, e.x, e.y) > R * R) continue;
      o.burn = Math.max(o.burn, 3);
      o.burnDps = Math.max(o.burnDps, e.burnDps * .9);
    }
    spawnWave({ x: e.x, y: e.y, maxR: R, dmg: 0, life: .3, color: "#a8f06a", element: "blood" });
  }

  const C = player.combos;
  if (C) {
    // 폭발 연쇄 — 화염 + 뇌전
    if (C.has("blast") && Math.random() < .28 * comboPower("blast") * (1 + .3 * traitLv("prism"))) {
      spawnWave({ x: e.x, y: e.y, maxR: 100 * player.stats.area * comboPower("blast"),
                  dmg: (e.maxHp * .35 + 20) * comboPower("blast"),
                  life: .3, color: "#ff8a3c", element: "fire" });
      procCombo("blast", e.x, e.y);
      Sfx.throttled("blast", 90, () => Sfx.play(120, .18, "sawtooth", .5, -60));
    }
    // 감전 폭풍 — 뇌전 + 냉기 (둔화된 적이 죽을 때)
    if (C.has("surge") && wasSlowed) {
      const cp = comboPower("surge");
      const near = nearestEnemies(e.x, e.y, 220 * cp, cp > 1 ? 4 : 2);
      for (const o of near) { spawnBolt(o.x, o.y); damageEnemy(o, (30 + e.maxHp * .25) * cp, e.x, e.y, 40, "storm"); }
      if (near.length) procCombo("surge", e.x, e.y);
    }
  }
  spawnParticles(e.x, e.y, e.boss ? 40 : 8, e.type.color, e.boss ? 320 : 150, .6, e.boss ? 6 : 3.5);
  // 모든 적이 보석을 떨구면 화면이 보석으로 덮이고, 처치 수가 곧 경험치가 된다.
  // 확률로 바꾸면 '무엇을 잡느냐'가 의미를 갖는다 — 등급이 붙은 적과 보스는 반드시 떨군다.
  const sure = e.boss || e.sigilKey || (e.rank && e.rank.key !== "common");
  const base = (e.xp !== undefined ? e.xp : e.type.xp) * (e.rank ? e.rank.xp : 1);
  if (sure) {
    spawnGem(e.x, e.y, base);
  } else {
    // 초반 가산 — 무기가 아직 1레벨인 구간에 확률까지 낮으면 빌드가 시작을 못 한다.
    const early = 1 + EARLY_GEM_BONUS * Math.max(0, 1 - Game.time / EARLY_GEM_SECONDS);
    // 종류별 보정 — 가장 흔한 잡몹(박쥐·슬라임)은 따로 낮춰 둔다
    const chance = Math.min(1, player.stats.gemChance * early * (e.type.dropMul || 1));
    if (Math.random() < chance) {
      // 드물게 떨구되 한 알이 크다.
      //   확률만 내리면 성장이 그대로 굶는다 — 실제로 10%대로 내렸더니 전사가 4분 동안
      //   1레벨에 묶인 채 적이 68 → 244 마리로 불어나 죽었다. 낮은 확률은 '적게 주는 것'이
      //   아니라 '뭉쳐서 주는 것'이어야 한다.
      //   다만 확률을 완전히 상쇄하면 직업 특성이 사라지므로, 기준(GEM_REF)보다 확률이
      //   높은 직업이 총량에서도 조금 유리하도록 지수 0.4 만큼만 남긴다.
      //   기대 경험치 = 기본값 × (확률 / GEM_REF)^0.4 → 성기사 0.88배 · 추적자 1.14배.
      spawnGem(e.x, e.y, base / chance * Math.pow(chance / GEM_REF, .4));
    }
  }
  if (e.sigilKey) {
    // 제단의 파수꾼 — 봉인을 지키던 자
    lmState.set(e.sigilKey, "done");
    e.sigilKey = null;
    giveSigil(e.x, e.y);
    givePickupItem(pick(CONSUMABLE_KEYS), e.x + 46, e.y);   // 파수꾼도 사건이다
    Game.itemCd = ITEM_CD;
    cam.shake = 16;
    Game.lmFlash = 3; Game.lmFlashText = "파수꾼을 쓰러뜨렸다";
  }
  if (e.boss) {
    if (Mission.boss === e) Mission.clear();
    cam.shake = 16; Sfx.boss();
    spawnPickup(e.x, e.y, "vacuum");
    spawnPickup(e.x + 40, e.y, "heart");
    givePickupItem(pick(CONSUMABLE_KEYS), e.x - 80, e.y);   // 보스는 대기와 무관하게 확정
    givePickupItem(pick(CONSUMABLE_KEYS), e.x + 80, e.y);
    Game.itemCd = ITEM_CD;
    giveSigil(e.x - 40, e.y);          // 보스도 징표를 준다 — 전직 경로가 하나뿐이면 막힌다
  } else if (Game.heartCd <= 0 && Math.random() < .004) {
    // 일반 몹도 아주 가끔은 준다. 회복이 완전히 끊기면 등급 몹을 못 만난 판이 그냥 막힌다.
    // 다만 더 긴 대기를 걸어 '주 공급원'이 되지는 않게 한다.
    spawnPickup(e.x, e.y, Math.random() < .8 ? "heart" : "vacuum");
    Game.heartCd = TRASH_CD;
  }
  Sfx.hit();
}

/* 지형지물에 닿았을 때 — 이동에 목적을 주는 지점 */
function touchLandmark(lm) {
  if (lm.type === "chest") {
    lmState.set(lm.key, "done");
    const key = pick(CONSUMABLE_KEYS);
    givePickupItem(key, lm.x, lm.y);
    spawnParticles(lm.x, lm.y, 26, "#e8c96a", 240, .8, 4);
    Sfx.play(660, .25, "triangle", .8, 340);
  } else if (lm.type === "shrine" && !lm.fighting) {
    // 봉인은 아직 준비되지 않은 자에게 열리지 않는다.
    // 파수꾼은 접촉 피해만으로 1레벨 물몸을 두 대에 죽인다 — 시작 5초에 밟아 죽는 건 '선택'이 아니다.
    if (player.level < SHRINE_MIN_LEVEL) {
      Game.lmFlash = 2.2;
      Game.lmFlashText = "봉인이 너무 단단하다 — 레벨 " + SHRINE_MIN_LEVEL + " 이상 필요";
      return;
    }
    // 제단은 그냥 주는 게 아니라 지키는 자가 있다
    lmState.set(lm.key, "fighting");
    const g = Game.spawnEnemy("guardian", lm.x + rnd(-40, 40), lm.y + rnd(-40, 40));
    if (g) {
      g.sigilKey = lm.key;
      // 파수꾼만은 '시간'이 아니라 '플레이어의 준비 상태'에 맞춘다.
      // 나머지 적은 난이도 곡선(시간 비례)을 그대로 쓰는데, 제단은 레벨로 잠겨 있다.
      // 둘을 분리해 두면 경험치 배율을 건드리는 순간 파수꾼 혼자 강해진다 —
      // 실제로 경험치를 절반으로 줄이자 3~5분 사망이 몰렸고, 계측해 보니 최대 피해원이 파수꾼이었다.
      const lvScale = 1 + Math.max(0, player.level - SHRINE_MIN_LEVEL) * .34;
      const G = ENEMY_TYPES.guardian;
      g.maxHp = g.hp = G.hp * lvScale * (1 + .55 * Game.shrinesOpened);   // 첫 제단이 가장 무르다
      g.dmg = G.dmg * (1 + Math.min(1.2, Math.max(0, player.level - SHRINE_MIN_LEVEL) * .035));
      Game.shrinesOpened++;
    }
    for (let i = 0; i < 10; i++) {
      const a = rnd(TAU);
      Game.spawnEnemy(pick(Game.currentTypes()), lm.x + Math.cos(a) * 180, lm.y + Math.sin(a) * 180);
    }
    Game.lmFlash = 3; Game.lmFlashText = "봉인이 풀렸다 — 파수꾼을 쓰러뜨려라";
    cam.shake = 14; Sfx.boss();
  } else if (lm.type === "monolith") {
    lmState.set(lm.key, "done");
    // 이번 판 한정 영구 강화 — 찾아간 대가
    const rolls = [
      ["damage", .08, "모든 피해 +8%"],
      ["area", .10, "공격 범위 +10%"],
      ["speed", .07, "이동 속도 +7%"],
      ["cooldown", -.07, "공격 쿨다운 -7%"],
    ];
    const r = pick(rolls);
    player.monolith = player.monolith || {};
    player.monolith[r[0]] = (player.monolith[r[0]] || 0) + r[1];
    recomputeStats();
    Game.lmFlash = 3; Game.lmFlashText = "고대 비석 — " + r[2];
    spawnParticles(lm.x, lm.y, 30, "#8fd0ff", 260, .9, 4);
    Sfx.play(300, .5, "triangle", .9, 500);
  }
}

function givePickupItem(key, x, y) {
  spawnPickup(x, y, "item:" + key);
}

function giveSigil(x, y) {
  spawnPickup(x, y, "sigil");
}

/* ---------- 플레이어 ---------- */
const player = {
  x: 0, y: 0, r: 14, sx: W / 2, sy: H / 2,
  hp: 100, level: 1, xp: 0, xpNext: 5,
  faceX: 1, faceY: 0, iframe: 0, hurtFlash: 0, walk: 0,
  cls: null,     // 선택한 직업
  weapons: [],   // { key, level, timer, ... }
  passives: [],  // { key, level }
  stats: null,
  base: { maxHp: 100, speed: 208 },
  // 직업 자원 · 조합 · 전용 특성
  res: 0, noHit: 0, combos: new Set(), mastered: new Set(), traits: [], advance: [],
  items: [], sigils: 0, buffFury: 0, buffWard: 0,
  tickA: 0, tickB: 0, shieldT: 0, shieldOn: 0, echoT: 0, echoSkill: null,
  // 매 프레임 다시 계산되는 배수 (진영 / 영창처럼 상황에 따라 변하는 것)
  dynDmg: 1, dynCd: 1, dynArmor: 1, dynPierce: 0, dynSpeed: 1, dynMagnet: 1,
  dynCrit: 0, dynCritMul: 2, dynProjSpeed: 1, dynHoming: 0, dynBurnAmp: 1,
  stillTime: 0, bulwark: 0, press: 0, channel: 0, meltTimer: 0, blocked: 0,
  carnage: 0, carnageTimer: 0, leechBudget: 0,
  dash: 0, dashX: 1, dashY: 0, dashDmg: 0, dashHit: new Set(),
};

/* ---------- 직업 자원 · 능동 스킬 ----------
   순수 오토배틀에 '언제 쓰느냐'의 판단을 하나 추가한다.
   자원이 차는 방식이 직업마다 달라서 플레이 리듬 자체가 갈린다. */
const RES_MAX = 100;

player.onKill = function (e) {
  const R = player.cls && player.cls.resource;
  if (R && R.onKill) player.res = clamp(player.res + R.onKill * advVal("rageGain", 1) * (e.boss ? 10 : 1), 0, RES_MAX);
  if (player.combos.has("carnage")) {
    const cp = comboPower("carnage");
    player.carnage = Math.min(.35 * cp, player.carnage + .014 * cp);
    player.carnageTimer = 3.5;
  }
};

player.onHurt = function () {
  const R = player.cls && player.cls.resource;
  player.noHit = 0;
  if (!R) return;
  if (R.onHurt) player.res = clamp(player.res + R.onHurt, 0, RES_MAX);
  if (R.resetOnHurt) player.res = 0;
};

function updateResource(dt) {
  const R = player.cls && player.cls.resource;
  if (!R) return;
  player.noHit += dt;
  let d = 0;
  if (R.perSec) d += R.perSec;
  if (R.decay) d -= R.decay;
  if (R.noHitPerSec && player.noHit > 1.6) d += R.noHitPerSec;
  if (d) player.res = clamp(player.res + d * dt, 0, RES_MAX);
}

function useItem() {
  if (Game.state !== "playing" || !player.items.length) return;
  const key = player.items.shift();
  const C = CONSUMABLES[key];
  C.use(player);
  spawnNumber(player.x, player.y - 30, C.icon + " " + C.name, C.color, 18);
}

function useSkill() {
  const C = player.cls;
  if (!C || Game.state !== "playing") return;
  if (player.res < curSkill().cost) {
    Sfx.throttled("nores", 260, () => Sfx.play(130, .09, "square", .3, -40));
    return;
  }
  const sk = curSkill();
  player.res -= sk.cost;
  sk.use(player);
  if (advVal("skillEcho", false)) { player.echoT = .45; player.echoSkill = sk; }
}

/* ---------- 속성 조합 판정 ---------- */
/* 조합이 실제로 몇 번 터졌는지 세고, 터질 때 화면에 띄운다.
   "조합이 열렸다"만 알려주고 끝내면 플레이어는 그게 일하고 있는지 알 수 없다. */
const comboProcs = {};
function procCombo(key, x, y) {
  let e = comboProcs[key];
  if (!e) e = comboProcs[key] = { count: 0, flash: 0 };
  e.count++; e.flash = .9;
  if (x !== undefined && Math.random() < .22) {
    const c = COMBOS.find(c => c.key === key);
    if (c) spawnNumber(x, y - 34, c.icon + " " + c.name, "#ffd9a0", 15);
  }
}
function resetCombos() { for (const k in comboProcs) delete comboProcs[k]; }

/* 이 카드를 고르면(무기를 얻거나 한 단계 올리면) 어떤 조합이 열리는지 */
function combosAfterPick(key, level) {
  const els = new Set();
  let seen = false;
  for (const w of player.weapons) {
    const lv = w.key === key ? level : w.level;
    if (w.key === key) seen = true;
    if (lv >= COMBO_LEVEL) els.add(WEAPONS[w.key].element);
  }
  if (!seen && level >= COMBO_LEVEL) els.add(WEAPONS[key].element);
  const out = [];
  for (const c of COMBOS) {
    if (player.combos.has(c.key)) continue;
    if (els.has(c.a) && els.has(c.b)) out.push(c);
  }
  return out;
}

/* 아직 안 열린 조합의 진행 상황 — 무엇을 얼마나 더 올려야 하는지 보여준다 */
function combosPending() {
  const out = [];
  for (const c of COMBOS) {
    if (player.combos.has(c.key)) continue;
    const la = Math.min(elemLevel(c.a), COMBO_LEVEL);
    const lb = Math.min(elemLevel(c.b), COMBO_LEVEL);
    if (!la && !lb) continue;                 // 양쪽 다 없으면 힌트할 게 없다
    out.push({ c, la, lb, sum: la + lb });
  }
  out.sort((x, y) => y.sum - x.sum);          // 가까운 것부터
  return out;
}

// 어떤 속성이 조합에 '기여'하려면 그 속성 무기가 COMBO_LEVEL 이상이어야 한다
function elemLevel(elem) {
  let best = 0;
  for (const w of player.weapons)
    if (WEAPONS[w.key].element === elem && w.level > best) best = w.level;
  return best;
}
function activeElements(minLv) {
  const need = minLv || COMBO_LEVEL;
  const els = new Set();
  for (const w of player.weapons)
    if (w.level >= need) els.add(WEAPONS[w.key].element);
  return els;
}
// 완성된 조합은 효과가 세진다 — 최대치까지 올릴 이유를 여기서 만든다
function comboPower(key) {
  return player.mastered.has(key) ? MASTER_POWER : 1;
}

function recomputeCombos() {
  const els = activeElements();
  const mst = activeElements(COMBO_MASTER);
  const before = player.combos.size, beforeM = player.mastered.size;
  player.combos = new Set();
  player.mastered = new Set();
  for (const c of COMBOS) {
    if (!els.has(c.a) || !els.has(c.b)) continue;
    player.combos.add(c.key);
    if (mst.has(c.a) && mst.has(c.b)) player.mastered.add(c.key);
  }
  if (player.combos.size > before || player.mastered.size > beforeM) {
    Game.comboFlash = 2.6;
    Game.comboFlashMaster = player.mastered.size > beforeM;
    Sfx.play(player.mastered.size > beforeM ? 880 : 660, .3, "triangle", .9, 500);
  }
}

function recomputeStats() {
  const s = {
    damage: 1, cooldown: 1, area: 1, speed: 1, armor: 1, projSpeed: 1,
    maxHp: player.base.maxHp + (player.level - 1) * 3, regen: 0, magnet: 1, xpGain: 1, crit: .10,
    gemChance: player.cls ? player.cls.gemChance : .10,  // 직업마다 다르다
  };
  // 직업 보정을 먼저 적용하고, 그 위에 패시브를 곱한다
  const C = player.cls;
  if (C) {
    const m = C.mods;
    if (m.maxHp)    s.maxHp += m.maxHp;
    if (m.speed)    s.speed *= 1 + m.speed;
    if (m.damage)   s.damage *= 1 + m.damage;
    if (m.area)     s.area *= 1 + m.area;
    if (m.cooldown) s.cooldown *= 1 + m.cooldown;
    if (m.armor)    s.armor *= 1 - m.armor;
    if (m.regen)    s.regen += m.regen;
    if (m.crit)     s.crit += m.crit;
    if (m.xpGain)   s.xpGain *= 1 + m.xpGain;
    if (m.gemChance) s.gemChance += m.gemChance;
  }
  // 전직 보정 — 직업 보정과 같은 방식으로 누적된다.
  // 1·2차는 체감이 약해서 증폭한다 (3차는 데이터에 이미 크게 잡혀 있다).
  for (const a of player.advance) {
    const m = a.mods || {};
    const k = a.tier >= 3 ? 1 : 1.55;
    if (m.maxHp)    s.maxHp += m.maxHp * k;
    if (m.speed)    s.speed *= 1 + m.speed * k;
    if (m.damage)   s.damage *= 1 + m.damage * k;
    if (m.area)     s.area *= 1 + m.area * k;
    if (m.cooldown) s.cooldown *= 1 + m.cooldown * k;
    if (m.armor)    s.armor *= 1 - m.armor * k;
    if (m.regen)    s.regen += m.regen * k;
    if (m.crit)     s.crit += m.crit * k;
    if (m.xpGain)   s.xpGain *= 1 + m.xpGain * k;
    if (m.gemChance) s.gemChance += m.gemChance * k;
  }
  for (const p of player.passives) PASSIVES[p.key].apply(s, p.level);
  // 고대 비석 — 이번 판 동안만 남는 보정
  const M = player.monolith;
  if (M) {
    if (M.damage) s.damage *= 1 + M.damage;
    if (M.area) s.area *= 1 + M.area;
    if (M.speed) s.speed *= 1 + M.speed;
    if (M.cooldown) s.cooldown *= 1 + M.cooldown;
  }
  // 제단(영구 강화)은 마지막에 곱한다
  s.maxHp  *= 1 + .08 * Meta.lv("vigor");
  s.damage *= 1 + .05 * Meta.lv("edge");
  s.speed  *= 1 + .04 * Meta.lv("swift");
  s.xpGain *= 1 + .06 * Meta.lv("avarice");
  s.gemChance = clamp(s.gemChance + .01 * Meta.lv("avarice"), .01, 1);
  player.stats = s;
  player.hp = Math.min(player.hp, s.maxHp);
}

function addWeapon(key) {
  const w = player.weapons.find(w => w.key === key);
  if (w) w.level++;
  else player.weapons.push({ key, level: 1, timer: 0, angle: 0, fx: 0 });
  // 강화로도 조합이 열리므로 획득/강화 양쪽에서 다시 판정한다
  recomputeCombos();
}
function addTrait(key) {
  const t = player.traits.find(t => t.key === key);
  if (t) t.level++;
  else player.traits.push({ key, level: 1 });
}

/* 자세가 없는 직업(전사·추적자)과, 자세 밖에서 도는 전직 효과를 여기서 처리한다.
   매 프레임 dyn* 배수에 곱해지고, 프레임마다 초기화되므로 상태가 남지 않는다. */
function applyAdvanceEffects(p, dt, moving) {
  const s = p.stats;

  // 광전사 계열 — 피가 마를수록 빨라지고 세진다
  if (advVal("lowHpFury", false)) {
    const f = 1 - clamp(p.hp / s.maxHp, 0, 1);
    const amp = advVal("furyAmp", 1) * (1 + .25 * traitLv("warcry"));
    p.dynDmg *= 1 + .85 * f * amp;
    p.dynCd *= 1 - .38 * f;
  }
  // 검투사 계열 — 포위될수록 단단해진다
  const ca = advVal("crowdArmor", 0);
  if (ca) {
    const per = ca + traitLv("champion") * .008;
    p.dynArmor *= 1 - Math.min(.72, per * p.press);
    const cr = advVal("crowdRegen", 0);
    if (cr) p.hp = Math.min(s.maxHp, p.hp + s.maxHp * cr * p.press * dt);
  }
  if (traitLv("showman")) p.dynDmg *= 1 + .015 * traitLv("showman") * p.press;

  // 마검사 계열 — 곁의 적에게 추가 피해
  const mb = advVal("meleeBonus", 0);
  if (mb > 0 && p.press > 0)
    p.dynDmg *= 1 + (mb + .25 * traitLv("bladeDance")) * Math.min(1, p.press / 6);

  // 암살자 계열 — 집중이 찰수록 치명타
  if (advVal("focusCrit", false))
    p.dynCrit += (p.res / RES_MAX) * .35 * advVal("focusAmp", 1);
  if (traitLv("manaEdge")) p.dynCrit += .04 * traitLv("manaEdge") * Math.floor(p.channel);
  if (traitLv("shadowstep")) p.dynDmg *= 1 + .08 * traitLv("shadowstep") * Math.min(4, p.noHit / 5);
  if (traitLv("onehit")) p.dynCritMul = 2 + .4 * traitLv("onehit");

  // 사냥꾼 계열 — 발사체 강화
  const pb = advVal("projBoost", 0);
  if (pb) p.dynProjSpeed *= 1 + pb;
  p.dynPierce += advVal("pierceBonus", 0);
  if (advVal("allHoming", false)) p.dynHoming = 6.5;

  // 화상·중독 증폭
  p.dynBurnAmp = (1 + .45 * traitLv("pyreLord") + .5 * traitLv("virulence")) * advVal("burnAmp", 1);

  /* ── 3차 각성 — 수치가 아니라 규칙을 바꾸는 것들 ── */
  p.dynCrit += advVal("critAll", 0);
  p.dynCritMul += advVal("critMulBonus", 0);
  p.dynMagnet *= 1 + advVal("magnetAll", 0);
  const sh = advVal("shadowScale", 0);
  if (sh) p.dynDmg *= 1 + .1 * sh * Math.min(4, p.noHit / 5);

  // 주기 효과 — 대지 파동 / 낙뢰 / 룬 맥동
  const quake = advVal("quakeAura", 0), bolt = advVal("boltAura", 0), rune = advVal("runePulse", 0);
  if (quake || bolt || rune) {
    p.tickA -= dt;
    if (p.tickA <= 0) {
      p.tickA = quake ? 2.2 / quake : bolt ? 2.6 / bolt : 2.4 / rune;
      const dmg = (90 + p.level * 16) * s.damage * p.dynDmg;
      if (quake) {
        spawnWave({ x: p.x, y: p.y, maxR: 300 * s.area * quake, dmg, life: .45,
          color: "#d8c08a", element: "physical" });
        cam.shake = Math.max(cam.shake, 7);
      } else if (bolt) {
        const pool = nearestEnemies(p.x, p.y, 700, 6);
        for (const e of pool) { spawnBolt(e.x, e.y); damageEnemy(e, dmg, e.x, e.y - 60, 0, "storm"); }
      } else {
        spawnWave({ x: p.x, y: p.y, maxR: 260 * s.area, dmg, life: .4,
          color: "#8fb0ff", element: "frost" });
      }
    }
  }
  // 상시 빙결 — 시간의 주인
  if (advVal("freezeAura", false)) {
    const R = 340 * s.area;
    const found = hash.query(p.x, p.y, R, scratch3);
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (e.active && dist2(e.x, e.y, p.x, p.y) < R * R) e.slow = Math.max(e.slow, .4);
    }
  }
  // 주기적 무적 방패 — 일정 시간마다 한 대를 완전히 무시한다
  const gs = advVal("guardShield", 0);
  if (gs) {
    if (p.shieldOn <= 0) {
      p.shieldT -= dt;
      if (p.shieldT <= 0) { p.shieldOn = 1; p.shieldT = gs; }
    }
  } else { p.shieldOn = 0; }

  // 스킬 메아리 — 0.45초 뒤 한 번 더
  if (p.echoT > 0) {
    p.echoT -= dt;
    if (p.echoT <= 0 && p.echoSkill) { p.echoSkill.use(p); p.echoSkill = null; }
  }
}

function applyAdvance(a) {
  player.sigils = Math.max(0, player.sigils - (ADV_SIGILS[a.tier - 1] || 1));   // 단계만큼 소비한다
  player.advance.push(a);
  recomputeStats();
  // 전직은 판의 전환점이어야 한다 — 체력을 가득 채우고 주변을 쓸어버린다
  player.hp = player.stats.maxHp;
  if (a.grant) addWeapon(a.grant);
  Game.advanceFlash = 3.6;
  Game.slowmo = .9 + a.tier * .25;      // 차수가 높을수록 길게
  Game.whiteFlash = 1;
  cam.shake = 14 + a.tier * 8;
  spawnParticles(player.x, player.y, 50 + a.tier * 30, a.color, 420, 1.4, 7);
  // 각성의 파동 — 차수만큼 커지고, 3차는 실제로 적을 쓸어버린다
  spawnWave({
    x: player.x, y: player.y, maxR: 300 + a.tier * 200,
    dmg: a.tier >= 2 ? (120 + player.level * 22) * player.stats.damage : 0,
    life: .9, color: a.color, element: "holy",
  });
  player.iframe = Math.max(player.iframe, 1.2 + a.tier * .6);
  player.res = RES_MAX;                 // 새 스킬을 즉시 써볼 수 있게
  [523, 659, 784, 1046, 1318, 1568].forEach((f, i) =>
    setTimeout(() => Sfx.play(f, .2, "triangle", .95), i * 75));
}

function addPassive(key) {
  const p = player.passives.find(p => p.key === key);
  if (p) p.level++;
  else player.passives.push({ key, level: 1 });
  const before = player.stats.maxHp;
  recomputeStats();
  if (key === "vitality") player.hp = Math.min(player.stats.maxHp, player.hp + (player.stats.maxHp - before));
}

/* ---------- 게임 상태 ---------- */
const Game = {
  state: "intro",        // intro | title | altar | playing | levelup | advance | paused | dead | won
  introT: 0,             // 시작 화면 연출 시간
  time: 0, kills: 0, dmgDealt: 0,
  spawnAcc: 0, bossIdx: 0,
  choices: [], hover: -1, comboFlash: 0, comboFlashMaster: false,
  usedRebirth: false, soulsEarned: 0, houndWarn: 0, traitPick: false, advanceFlash: 0,
  showNames: true,
  lmFlash: 0, lmFlashText: "", advancePending: 0, advanceWaitT: 0, advanceWaitTier: 0, slowmo: 0, whiteFlash: 0,
  itemCd: 0, heartCd: 0,
  bestTime: Number(localStorage.getItem("ts_best") || 0),

  // 판이 끝나면 영혼을 정산한다 (다음 판의 시작 지점이 올라간다)
  endRun() {
    saveBest();
    this.soulsEarned = Math.floor(this.kills / 8) + Math.floor(this.time / 10) + (this.state === "won" ? 150 : 0);
    Meta.souls += this.soulsEarned;
    Meta.save();
  },

  // 레벨과 징표가 모두 갖춰졌을 때만 전직 화면을 연다.
  // 징표는 제단의 파수꾼이나 보스에게서 나오므로, 맵을 돌아다닐 이유가 된다.
  checkAdvance() {
    if (this.state === "advance" || this.state === "dead" || this.state === "won") return false;
    for (let tier = 1; tier <= ADV_TIERS; tier++) {
      if (player.level < ADV_LEVELS[tier - 1] || player.advance.length >= tier) continue;
      const opts = advanceOptions(tier);
      if (!opts.length) continue;
      // 시간 관문 — 레벨을 아무리 빨리 올려도 판의 1/5 · 2/5 · 3/5 · 4/5 전에는 열리지 않는다
      if (this.time < advTime(tier)) {
        this.advancePending = 0;
        this.advanceWaitT = advTime(tier) - this.time;
        this.advanceWaitTier = tier;
        return false;
      }
      this.advanceWaitT = 0;
      // 징표는 단계만큼 든다
      if (player.sigils < ADV_SIGILS[tier - 1]) { this.advancePending = tier; return false; }
      this.advancePending = 0;
      this.choices = opts;
      this.state = "advance";
      this.hover = -1;
      Sfx.levelup();
      return true;
    }
    this.advancePending = 0;
    this.advanceWaitT = 0;
    return false;
  },

  reset() {
    for (const pool of [enemies, projectiles, slashes, waves, gems, pickups, particles, numbers, bolts, eshots, hazards])
      for (const o of pool) o.active = false;
    this.time = 0; this.kills = 0; this.dmgDealt = 0; this.spawnAcc = 0; this.bossIdx = 0;
    player.x = 0; player.y = 0; player.level = 1; player.xp = 0; player.xpNext = 5;
    player.iframe = 0; player.hurtFlash = 0; player.faceX = 1; player.faceY = 0;
    player.weapons.length = 0; player.passives.length = 0;
    player.res = clamp(25 * Meta.lv("zeal"), 0, RES_MAX);
    player.noHit = 0; player.combos = new Set(); player.mastered = new Set();
    player.carnage = 0; player.carnageTimer = 0; player.leechBudget = 0;
    player.dash = 0; player.dashHit.clear();
    player.traits.length = 0; player.advance.length = 0; this.advanceFlash = 0;
    player.items.length = 0; player.sigils = 0; player.buffFury = 0; player.buffWard = 0;
    player.tickA = 0; player.tickB = 0; player.shieldT = 0; player.shieldOn = 0;
    player.echoT = 0; player.echoSkill = null;
    player.monolith = null;
    lmState.clear(); landmarks.length = 0; obsState.clear(); obstacles.length = 0; this.lmFlash = 0; this.lmFlashText = ""; this.advancePending = 0; this.advanceWaitT = 0; this.shrinesOpened = 0; this.itemCd = 0; this.heartCd = 0; spawnedObs.length = 0; Mission.clear(); Mission.flash = 0;
    player.stillTime = 0; player.bulwark = 0; player.press = 0;
    player.channel = 0; player.meltTimer = 0; player.frostVeil = 0; player.terrainSpeed = 1;
    player.dynDmg = 1; player.dynCd = 1; player.dynArmor = 1;
    player.dynPierce = 0; player.dynSpeed = 1; player.dynMagnet = 1;
    this.comboFlash = 0; resetCombos(); this.slowmo = 0; this.whiteFlash = 0; this.usedRebirth = false; this.soulsEarned = 0; this.houndWarn = 0;
    player.cls = CLASSES[selectedClass];
    recomputeStats();
    player.hp = player.stats.maxHp;
    addWeapon(player.cls.start);
    cam.x = player.x - W / 2; cam.y = player.y - H / 2; cam.shake = 0;
    this.state = "playing";
  },

  onKey(k) {
    // 브라우저는 사용자 입력 전에는 소리를 못 내게 막는다 — 첫 키에서 깨운다
    Sfx.init(); Music.start(this.state === "playing" ? "play" : "menu");
    if (k === "m") { Sfx.on = !Sfx.on; Music.fade(Sfx.on ? Music.vol() : 0); return; }
    if (k === "n") { this.showNames = !this.showNames; return; }   // 몬스터 이름표
    if (this.state === "intro") {
      if (k === "tab") { this.state = "altar"; return; }
      if (k === " " || k === "enter") { this.state = "title"; Sfx.play(520, .18, "triangle", .7, 260); return; }
      return;
    }
    if (this.state === "title") {
      if (k === "tab") { this.state = "altar"; return; }
      if (k === "escape") { this.state = "intro"; return; }
      const i = "1234".indexOf(k);
      if (i >= 0 && CLASSES[i]) { selectedClass = i; return this.reset(); }
      if (k === " " || k === "enter") return this.reset();
      return;
    }
    if (this.state === "altar") {
      if (k === "tab" || k === "escape") { this.state = this.introFrom || "intro"; return; }
      const i = "123456".indexOf(k);
      if (i >= 0 && ALTAR[i]) {
        if (Meta.buy(ALTAR[i].key)) Sfx.play(880, .14, "triangle", .8, 300);
        else Sfx.play(150, .1, "square", .35, -40);
      }
      return;
    }
    if ((this.state === "dead" || this.state === "won") && (k === " " || k === "enter" || k === "r")) return this.reset();
    if (this.state === "playing" && (k === " " || k === "shift")) { useSkill(); return; }
    if (this.state === "playing" && (k === "q" || k === "e")) { useItem(); return; }
    if (this.state === "playing" && (k === "escape" || k === "p")) { this.state = "paused"; return; }
    if (this.state === "paused" && (k === "escape" || k === "p")) { this.state = "playing"; return; }
    if (this.state === "levelup" || this.state === "advance") {
      const i = "123".indexOf(k);
      if (i >= 0 && this.choices[i]) this.applyChoice(this.choices[i]);
    }
  },

  /* --- 레벨업 --- */
  levelUp() {
    // 한 번의 호출로 여러 레벨이 올라갈 수 있다. 고를 게 없는 레벨은 화면을 띄우지 않고
    // 조용히 넘긴다 — 안 그러면 후반에 회복 카드만 뜨는 창이 끝없이 이어져 게임이 멈춘 것처럼 보인다.
    for (let guard = 0; guard < 400; guard++) {
      player.level++;
      player.xp -= player.xpNext;
      // 2차 곡선만으로는 후반을 못 막는다 — 15분에 30만 마리를 잡으면 경험치가 수백만이 들어와
      // 레벨이 300을 넘어가고 모든 무기·패시브가 최대치가 된다(= 고를 게 없어진다).
      // 꼬리를 25레벨/×1.12 로 뒀더니 한 판에 선택 화면이 61~79번 떴다.
      // 12초에 한 번꼴이라 "플레이가 아니라 스킬 선택만 계속 누르게 된다"는 지적이 나왔다.
      // 15레벨부터 ×1.20 으로 세워 한 판을 40대 초반, 선택 화면 35~45번으로 줄인다.
      const tail = Math.pow(1.20, Math.max(0, player.level - 15));
      player.xpNext = Math.floor((5 + (player.level - 1) * 5.5 + Math.pow(player.level, 2) * .55) * tail);
      // 레벨당 최대 체력이 오르므로 여기서 다시 계산한다.
      // 오른 만큼은 그대로 채워준다 — 레벨업이 곧 한 숨 돌릴 여유가 되게.
      recomputeStats();
      player.hp = Math.min(player.stats.maxHp, player.hp + player.stats.maxHp * .06);
      // 전직 관문 — 레벨만으로는 열리지 않는다. 징표를 찾아와야 한다.
      if (this.checkAdvance()) return;
      this.choices = this.rollChoices();
      // 고를 게 남아 있으면 여기서 멈추고 선택 화면을 띄운다
      if (!this.choices.every(c => c.type === "heal")) break;
      // 전부 회복 카드 = 더 배울 게 없다. 회복만 주고 넘어간다.
      player.hp = Math.min(player.stats.maxHp, player.hp + 40);
      spawnNumber(player.x, player.y - 30, player.level + "레벨", "#ffe37a", 17);
      if (player.xp < player.xpNext) return;
    }
    this.state = "levelup";
    this.hover = -1;
    Sfx.levelup();
    spawnParticles(player.x, player.y, 24, "#ffe37a", 220, .8, 4);
  },

  rollChoices() {
    // 직업 전용 특성을 일반 카드와 같은 슬롯에서 경쟁시키면, 특성이 있는 직업만
    // 무기 강화를 덜 받아 화력이 뒤처진다(측정으로 확인). 그래서 트랙을 분리한다 —
    // 3레벨마다 한 번은 특성만 나오는 판이고, 나머지는 무기·능력만 나온다.
    const list = traitList();
    const traitPool = [];
    for (const t of list) {
      const lv = traitLv(t.key);
      if (lv < t.max) traitPool.push({ type: "trait", key: t.key, level: lv + 1, isNew: lv === 0 });
    }
    const take = arr => arr.length ? arr.splice(Math.floor(rnd(arr.length)), 1)[0] : null;

    if (player.level % 3 === 0 && traitPool.length) {
      this.traitPick = true;
      const out = [];
      while (out.length < 3 && traitPool.length) out.push(take(traitPool));
      while (out.length < 3) out.push({ type: "heal" });
      return out;
    }
    this.traitPick = false;

    const weaponPool = [], passivePool = [];
    for (const key in WEAPONS) {
      const owned = player.weapons.find(w => w.key === key);
      if (owned) { if (owned.level < MAX_LEVEL) weaponPool.push({ type: "weapon", key, level: owned.level + 1 }); }
      else if (player.weapons.length < MAX_WEAPONS) weaponPool.push({ type: "weapon", key, level: 1, isNew: true });
    }
    for (const key in PASSIVES) {
      const owned = player.passives.find(p => p.key === key);
      if (owned) { if (owned.level < MAX_LEVEL) passivePool.push({ type: "passive", key, level: owned.level + 1 }); }
      else if (player.passives.length < MAX_PASSIVES) passivePool.push({ type: "passive", key, level: 1, isNew: true });
    }

    const out = [];
    // 화력이 고사하지 않도록 무기를 최소 1개 보장
    if (weaponPool.length) out.push(take(weaponPool));
    const rest = weaponPool.concat(passivePool);
    while (out.length < 3 && rest.length) {
      const c = take(rest);
      if (c && !out.includes(c)) out.push(c);
    }
    while (out.length < 3) out.push({ type: "heal" });
    return out;
  },

  applyChoice(c) {
    if (c.tier) { applyAdvance(c); this.state = "playing"; if (player.xp >= player.xpNext) this.levelUp(); return; }
    if (c.type === "weapon") addWeapon(c.key);
    else if (c.type === "passive") addPassive(c.key);
    else if (c.type === "trait") addTrait(c.key);
    else player.hp = Math.min(player.stats.maxHp, player.hp + 40);
    this.state = "playing";
    // 레벨업 직후 경험치가 또 넘쳐 있으면 연속 레벨업
    if (player.xp >= player.xpNext) this.levelUp();
  },

  /* --- 적 스폰 --- */
  currentTypes() {
    let types = SPAWN_TABLE[0].types;
    for (const row of SPAWN_TABLE) if (this.time >= row.t) types = row.types;
    return types;
  },
  difficulty() {
    const m = this.time / 60;
    // 적 곡선은 '플레이어가 그 시각에 얼마나 강한가'에 맞춰야 한다.
    // 전직을 시간 관문(3:45 · 7:30 · 11:15)으로 옮기면서 플레이어의 힘이 크게 뒤로 밀렸는데
    // 적 곡선은 '1분대에 1차 전직을 마친 플레이어' 기준 그대로였다.
    // 그래서 계단을 옮겨도 벽은 따라 움직이기만 했다(3:36 → 4:35). 곡선 자체를 낮춘다.
    return { hp: 1 + m * .85 + Math.pow(m, 2.4) * .021, spd: 1 + m * .045, dmg: 1 + m * .13 };
  },
  targetCount() {
    return Math.min(340, Math.floor(30 + this.time / 60 * 16));
  },

  spawnEnemy(typeKey, forceX, forceY, forceRank) {
    const e = alloc(enemies); if (!e) return null;
    const T = ENEMY_TYPES[typeKey], d = this.difficulty();
    const rank = forceRank || (T.boss || typeKey === "guardian" ? RANKS.common : rollRank(this.time));
    let x, y;
    if (forceX !== undefined) { x = forceX; y = forceY; }
    else {
      // 화면 바깥 링에서 스폰 (플레이어가 보는 곳에서 튀어나오지 않게)
      const a = rnd(TAU), rad = rnd(720, 830);
      x = player.x + Math.cos(a) * rad;
      y = player.y + Math.sin(a) * rad;
    }
    e.active = true; e.id = enemyIdSeq++;
    e.x = x; e.y = y; e.vx = 0; e.vy = 0; e.kx = 0; e.ky = 0;
    e.type = T; e.boss = !!T.boss;
    e.rank = rank;
    e.xp = T.xp;                 // 개체별 값 — 분열체 자식처럼 깎이는 경우가 있다
    e.r = T.r * rank.r;
    // 보스는 기본 체력이 이미 크다(3,200~9,000). 시간 배수를 그대로 곱하면 두 번 커져서
    // 5분 보스가 20,000 이 되고, 레벨 12짜리 화력으로는 시간 안에 못 잡는다.
    // 실측: 물량을 고친 뒤에도 성기사 외 세 직업이 5:05 전후에 몰려 죽었다(= 보스 등장 시각).
    // 지수를 씌워 후반 보스는 여전히 커지되 초반 보스가 벽이 되지 않게 한다.
    e.maxHp = e.hp = T.hp * rank.hp * (e.boss ? Math.max(1, Math.pow(d.hp, .72)) : d.hp);
    e.spd = T.speed * d.spd * rnd(.92, 1.08) * (rank === RANKS.rare ? .92 : 1);
    e.dmg = T.dmg * rank.dmg * d.dmg;
    e.t1 = rnd(.4, 1.6); e.state = 0; e.gen = 0; e.hasteT = 0; e.phase = 0;
    e.introDone = false; e.rageDone = false;      // 보스 1회성 연출
    e.telT = 0; e.telX = 0; e.telY = 0; e.telR = 0;   // 예고 범위기
    e.shieldMax = e.shieldHp = T.shieldHp ? T.shieldHp * rank.hp * d.hp : 0;
    e.flash = 0; e.wob = rnd(TAU); e.slow = 0; e.burn = 0; e.burnDps = 0; e.sigilKey = null;
    return e;
  },

  updateSpawning(dt) {
    // 보스 웨이브
    while (this.bossIdx < BOSS_TIMES.length && this.time >= BOSS_TIMES[this.bossIdx]) {
      this.bossIdx++;
      const b = this.spawnEnemy(BOSS_ORDER[Math.min(this.bossIdx - 1, BOSS_ORDER.length - 1)]);
      // 1번째 보스는 배수 없음, 이후 보스만 강해진다 (5분 구간의 난이도 스파이크 완화)
      if (b) { b.maxHp = b.hp = b.hp * (1 + (this.bossIdx - 1) * .6); cam.shake = 12; Sfx.boss(); }
      for (let i = 0; i < 8 + this.bossIdx * 6; i++) this.spawnEnemy(pick(this.currentTypes()));
    }

    let alive = 0;
    for (const e of enemies) if (e.active) alive++;
    const want = this.targetCount();
    if (alive < want) {
      this.spawnAcc += dt * (9 + this.time / 60 * 4);
      while (this.spawnAcc >= 1 && alive < want) {
        this.spawnAcc -= 1; alive++;
        this.spawnEnemy(pick(this.currentTypes()));
      }
    } else this.spawnAcc = 0;

    // 1차 각성 이후 30초마다 사냥개 무리 — 플레이어보다 빨라서 계속 도망만 칠 수 없다.
    // 각성 전에 풀면 대응 수단이 없는 채로 맞는다.
    const ht = Math.floor(this.time), pht = Math.floor(this.time - dt);
    if (ht !== pht && this.time >= 300 && ht % 30 === 0) {
      const a = rnd(TAU), n = 8 + Math.floor((this.time - 300) / 50);
      for (let i = 0; i < n; i++) {
        const aa = a + rnd(-.7, .7), rad = rnd(820, 980);
        this.spawnEnemy("hound", player.x + Math.cos(aa) * rad, player.y + Math.sin(aa) * rad);
      }
      this.houndWarn = 2.4;
      Sfx.play(240, .5, "sawtooth", .7, -120);
    }


    // 30초마다 소규모 러시 (한쪽 방향에서 몰려옴)
    const t = Math.floor(this.time), pt = Math.floor(this.time - dt);
    if (t !== pt && t > 0 && t % 24 === 0) {
      const a = rnd(TAU);
      for (let i = 0; i < 18 + t / 14; i++) {
        const aa = a + rnd(-.5, .5), rad = rnd(780, 950);
        this.spawnEnemy(pick(this.currentTypes()), player.x + Math.cos(aa) * rad, player.y + Math.sin(aa) * rad);
      }
    }
  },
};

/* ---------- 업데이트 ---------- */
function update(dt) {
  if (Game.state !== "playing") return;

  Game.time += dt;
  if (Game.time >= RUN_TIME) { Game.state = "won"; Game.endRun(); return; }
  Game.updateSpawning(dt);

  const s = player.stats;

  /* 1. 플레이어 이동 · 자원 */
  const mv = inputVector();
  if (mv.x || mv.y) { player.faceX = mv.x; player.faceY = mv.y; player.walk += dt * 10; }
  if (player.dash > 0) {
    // 돌진 중에는 입력을 무시하고 고정 방향으로 밀려난다
    player.dash -= dt;
    player.x += player.dashX * 940 * dt;
    player.y += player.dashY * 940 * dt;
    spawnParticles(player.x, player.y, 1, "#ff8a5c", 60, .3, 3);
  } else {
    const tspd = player.terrainSpeed || 1;      // 지형 감속 (가시덤불 · 늪)
    player.x += mv.x * player.base.speed * s.speed * player.dynSpeed * tspd * dt;
    player.y += mv.y * player.base.speed * s.speed * player.dynSpeed * tspd * dt;
  }
  // 정지 지속 시간 — 기사의 방벽과 마법사의 영창이 모두 여기에 걸린다
  const moving = !!(mv.x || mv.y) || player.dash > 0;
  player.stillTime = moving ? 0 : player.stillTime + dt;
  player.iframe = Math.max(0, player.iframe - dt);
  player.hurtFlash = Math.max(0, player.hurtFlash - dt);
  if (s.regen) player.hp = Math.min(s.maxHp, player.hp + s.regen * dt);
  updateResource(dt);
  Mission.update(dt);
  // 음악은 상황을 따라간다 — 보스가 살아 있으면 두꺼워진다
  {
    let bossAlive = false;
    for (const e of enemies) if (e.active && e.boss) { bossAlive = true; break; }
    Music.setMode(bossAlive ? "boss" : "play");
  }
  if (Game.itemCd > 0) Game.itemCd = Math.max(0, Game.itemCd - dt);
  if (Game.heartCd > 0) Game.heartCd = Math.max(0, Game.heartCd - dt);

  // 시간 관문이 풀리는 순간을 놓치지 않게 — 다음 레벨업까지 기다릴 필요가 없다
  if (Game.advanceWaitT > 0 && Game.time >= advTime(Game.advanceWaitTier)) Game.checkAdvance();

  // 지형지물 — 근처 칸만 실체화하고 닿으면 발동
  updateLandmarks();
  updateObstacles();
  pushOutOfObstacles(player, player.r);
  /* 막지 않는 지형의 효과.
     막는 것만 있으면 지형은 '피해 다니는 것'뿐이지만,
     밟을지 말지를 고르게 하면 지형이 판단거리가 된다. */
  player.terrainSpeed = 1;
  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    const K = ob.K;
    if (!K.hurt && !K.slow && !K.burn) continue;
    const rr = ob.r + player.r;
    const inside = dist2(player.x, player.y, ob.x, ob.y) < rr * rr;

    // 화톳불 — 곁을 지나는 적을 태운다. 플레이어에겐 무해하니 '적을 끌고 오는' 자산이 된다.
    if (K.burn) {
      // obstacles 배열은 매 프레임 새로 만들어진다. 타이머를 그 임시 객체에 두면
      // 매 프레임 0 이 되어 스로틀이 전혀 안 걸린다 — 프레임을 넘어 사는 건 st 뿐이다.
      ob.st.burnT = (ob.st.burnT || 0) - dt;
      if (ob.st.burnT <= 0) {
        ob.st.burnT = .45;
        const near = hash.query(ob.x, ob.y, ob.r + 34, scratch2);
        for (let j = 0; j < near.length; j++) {
          const en = near[j];
          const er = ob.r + en.r + 12;
          if (en.active && dist2(en.x, en.y, ob.x, ob.y) < er * er)
            damageEnemy(en, 14 + Game.time * .5, ob.x, ob.y, 20, "fire");
        }
      }
      continue;
    }
    if (!inside) continue;

    if (K.hurt) {                       // 가시덤불 — 아프고 느려진다
      player.terrainSpeed = Math.min(player.terrainSpeed, .55);
      player.thornTick = (player.thornTick || 0) - dt;
      if (player.thornTick <= 0) {
        player.thornTick = .55;
        hurtPlayer(6 + Game.time * .035, " 가시");
        spawnParticles(player.x, player.y, 4, "#7ea85c", 120, .3, 3);
      }
    } else if (K.slow) {                // 늪 — 아프진 않지만 모두가 느려진다
      player.terrainSpeed = Math.min(player.terrainSpeed, .5);
      const near = hash.query(ob.x, ob.y, ob.r + 20, scratch2);
      for (let j = 0; j < near.length; j++) {
        const en = near[j];
        const er = ob.r + en.r;
        if (en.active && dist2(en.x, en.y, ob.x, ob.y) < er * er) en.slow = Math.max(en.slow, .45);
      }
    }
  }
  for (const lm of landmarks) {
    const rr = lm.r + player.r + 6;
    if (dist2(lm.x, lm.y, player.x, player.y) < rr * rr) touchLandmark(lm);
  }
  if (player.buffFury > 0) player.buffFury -= dt;
  if (player.buffWard > 0) player.buffWard -= dt;
  // 흡혈은 초당 상한을 둬서 무한 회복이 되지 않게 한다
  player.leechBudget = Math.min(s.maxHp * .05, player.leechBudget + s.maxHp * .05 * dt);
  if (player.carnageTimer > 0) player.carnageTimer -= dt;
  else if (player.carnage > 0) player.carnage = Math.max(0, player.carnage - dt * .12);


  /* 2. 공간 해시 재구축 */
  hash.clear();
  for (const e of enemies) if (e.active) hash.insert(e);

  /* 2-b. 직업 자세 · 전직 효과 — 매 프레임 다시 계산되는 배수 */
  player.dynDmg = 1; player.dynCd = 1; player.dynArmor = 1; player.frostVeil = 0;
  player.dynPierce = 0; player.dynSpeed = 1; player.dynMagnet = 1;
  player.dynCrit = 0; player.dynCritMul = 2; player.dynProjSpeed = 1;
  player.dynHoming = 0; player.dynBurnAmp = 1;
  // 곁에 붙은 적 수는 여러 직업·전직이 함께 쓰므로 공용으로 한 번만 센다
  {
    const R = 155 * s.area;
    const found = hash.query(player.x, player.y, R, scratch3);
    let n = 0;
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (e.active && dist2(e.x, e.y, player.x, player.y) < R * R) n++;
    }
    player.press = Math.min(14, n);
  }
  if (player.cls && player.cls.stance) player.cls.stance.update(player, dt, moving);
  if (player.advance.length) applyAdvanceEffects(player, dt, moving);
  if (player.buffFury > 0) player.dynCd *= .4;      // 광란의 물약
  if (player.buffWard > 0) player.dynArmor *= .4;   // 수호의 부적

  /* 3. 무기 */
  for (const w of player.weapons) {
    const def = WEAPONS[w.key];
    if (def.passiveUpdate) { def.passiveUpdate(player, w, dt); continue; }
    if (w.fx > 0) w.fx -= dt;
    w.timer -= dt;
    if (w.timer <= 0) {
      w.timer += Math.max(.06, def.cd[w.level - 1] * s.cooldown * player.dynCd);
      def.fire(player, w);
    }
  }

  /* 4. 발사체 */
  for (const p of projectiles) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; continue; }
    if (p.homing) {
      p.retarget -= dt;
      if ((!p.target || !p.target.active) && p.retarget <= 0) {
        p.retarget = .2;                     // 재탐색은 초당 5회로 제한
        p.target = nearestEnemies(p.x, p.y, 800, 1)[0] || null;
      }
      if (p.target) {
        const want = Math.atan2(p.target.y - p.y, p.target.x - p.x);
        const cur = Math.atan2(p.vy, p.vx);
        let diff = ((want - cur + Math.PI * 3) % TAU) - Math.PI;
        const na = cur + clamp(diff, -p.homing * dt, p.homing * dt);
        const sp = Math.hypot(p.vx, p.vy);
        p.vx = Math.cos(na) * sp; p.vy = Math.sin(na) * sp;
        p.angle = na;
      }
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === "dagger") p.angle = Math.atan2(p.vy, p.vx);
    else p.angle += p.spin * dt;

    // 지형과의 상호작용 — 종류마다 다르다
    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      const rr = p.r + ob.r;
      if (dist2(p.x, p.y, ob.x, ob.y) >= rr * rr) continue;

      if (ob.K.reflect) {
        // 수정 기둥 — 마법이 튕겨 나간다. 각도만 뒤집으면 기둥 안에 갇히므로
        // 법선 방향으로 반사하고 표면 밖으로 밀어낸다.
        const nx = (p.x - ob.x) / (Math.hypot(p.x - ob.x, p.y - ob.y) || 1);
        const ny = (p.y - ob.y) / (Math.hypot(p.x - ob.x, p.y - ob.y) || 1);
        const dot = p.vx * nx + p.vy * ny;
        if (dot < 0) {                        // 다가올 때만 튕긴다
          p.vx -= 2 * dot * nx; p.vy -= 2 * dot * ny;
          p.angle = Math.atan2(p.vy, p.vx);
          p.x = ob.x + nx * (rr + 1); p.y = ob.y + ny * (rr + 1);
          p.bounced = (p.bounced || 0) + 1;
          p.hitIds.clear();                   // 튕긴 뒤에는 같은 적을 다시 때릴 수 있다
          spawnParticles(p.x, p.y, 4, "#bfefff", 150, .3, 3);
          Sfx.throttled("ref", 70, () => Sfx.play(880, .08, "triangle", .3, 300));
          if (p.bounced > 3) p.active = false;
        }
        damageObstacle(ob, p.dmg * .5);
        break;
      }
      if (ob.K.breakable) {
        damageObstacle(ob, p.dmg * .8);
        spawnParticles(p.x, p.y, 2, ob.K.color, 110, .25, 2.5);
        if (--p.pierce <= 0) { p.active = false; break; }
      } else if (ob.K.stop) {
        // 신전 기둥·폐허는 발사체를 막는다 — 뒤에 숨은 적은 못 맞힌다
        spawnParticles(p.x, p.y, 3, "#cfcfe0", 120, .25, 2.5);
        p.active = false; break;
      }
    }
    if (!p.active) continue;

    const found = hash.query(p.x, p.y, p.r + 26, scratch);
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (!e.active || p.hitIds.has(e.id)) continue;
      const rr = p.r + e.r;
      if (dist2(p.x, p.y, e.x, e.y) < rr * rr) {
        p.hitIds.add(e.id);
        damageEnemy(e, p.dmg, p.x, p.y, p.kind === "flame" ? 40 : 150, p.element);
        spawnParticles(p.x, p.y, 3, p.color, 130, .25, 2.5);
        if (--p.pierce <= 0) { p.active = false; break; }
      }
    }
  }

  /* 5. 채찍 참격 */
  for (const sl of slashes) {
    if (!sl.active) continue;
    sl.life -= dt;
    if (sl.life <= 0) { sl.active = false; continue; }
    sl.x = player.x; sl.y = player.y;
    const cx = sl.x + Math.cos(sl.ang) * sl.len * .5;
    const cy = sl.y + Math.sin(sl.ang) * sl.len * .5;
    const found = hash.query(cx, cy, sl.len * .6, scratch);
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (!e.active || sl.hitIds.has(e.id)) continue;
      // 부채꼴 판정: 거리 + 각도
      const dx = e.x - sl.x, dy = e.y - sl.y;
      const d = Math.hypot(dx, dy);
      if (d > sl.len + e.r) continue;
      let da = Math.abs(((Math.atan2(dy, dx) - sl.ang + Math.PI * 3) % TAU) - Math.PI);
      if (da < .62) {
        sl.hitIds.add(e.id);
        damageEnemy(e, sl.dmg, sl.x, sl.y, 260, sl.element);
        // 3차 각성: 참격이 적중하면 연쇄한다
        if (advVal("chainSlash", false) && Math.random() < .16 && sl.dmg > 4)
          spawnSlash(player, Math.atan2(e.y - player.y, e.x - player.x) + rnd(-.7, .7),
                     sl.dmg * .55, sl.len * .8, 1.0, sl.element);
      }
    }
  }

  /* 5-b. 파동 (피의 낫 · 스킬 · 폭발 연쇄) */
  for (const wv of waves) {
    if (!wv.active) continue;
    wv.life -= dt;
    if (wv.life <= 0) { wv.active = false; continue; }
    const t = 1 - wv.life / wv.maxLife;
    wv.r = wv.maxR * Math.sqrt(t);          // 처음엔 빠르게, 끝에선 천천히 퍼진다
    for (let i = 0; i < obstacles.length; i++) {
      const o = obstacles[i];
      if (o.wall || wv.hitIds.has("o" + o.key)) continue;
      const rr = wv.r + o.r;
      if (dist2(o.x, o.y, wv.x, wv.y) < rr * rr) {
        wv.hitIds.add("o" + o.key);
        damageObstacle(o, wv.dmg * .6);
      }
    }
    const found = hash.query(wv.x, wv.y, wv.r + 30, scratch);
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (!e.active || wv.hitIds.has(e.id)) continue;
      const rr = wv.r + e.r;
      if (dist2(e.x, e.y, wv.x, wv.y) < rr * rr) {
        wv.hitIds.add(e.id);
        damageEnemy(e, wv.dmg, wv.x, wv.y, 200, wv.element);
        if (wv.heal) player.hp = Math.min(s.maxHp, player.hp + wv.heal);
      }
    }
  }

  /* 5-c. 돌진 충돌 */
  if (player.dash > 0) {
    const found = hash.query(player.x, player.y, 46, scratch);
    for (let i = 0; i < found.length; i++) {
      const e = found[i];
      if (!e.active || player.dashHit.has(e.id)) continue;
      const rr = 34 + e.r;
      if (dist2(e.x, e.y, player.x, player.y) < rr * rr) {
        player.dashHit.add(e.id);
        damageEnemy(e, player.dashDmg * (1 + .4 * traitLv("charge")), player.x, player.y, 420, "physical");
      }
    }
  }

  /* 6. 적 */
  const sepR = 26;
  for (const e of enemies) {
    if (!e.active) continue;
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;

    // 너무 멀어지면 반대편 링으로 재배치 (스폰 비용 절약)
    if (d > 1500) {
      const a = rnd(TAU), rad = rnd(760, 880);
      e.x = player.x + Math.cos(a) * rad; e.y = player.y + Math.sin(a) * rad;
      continue;
    }

    e.wob += dt * 6;
    if (e.hasteT > 0) e.hasteT -= dt;
    // 고유 행동 — false 를 돌려주면 이번 프레임은 스스로 움직인다
    if (e.type.think && e.type.think(e, dt, d) === false) {
      if (e.flash > 0) e.flash -= dt;
      continue;
    }
    if (e.slow > 0) e.slow -= dt;
    if (e.burn > 0) {
      e.burn -= dt;
      e.hp -= e.burnDps * (player.dynBurnAmp || 1) * dt;
      if (Math.random() < dt * 7) spawnParticles(e.x, e.y, 1, "#ff8a3c", 70, .3, 2);
      if (e.hp <= 0) { killEnemy(e, "fire"); continue; }
    }
