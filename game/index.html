      if (!g.active || g.tier !== tier) continue;
      const sx = g.x - cam.x, sy = g.y - cam.y;
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
      const r = br + Math.sin(g.bob) * .6;
      const gx = Math.round(sx / PIX) * PIX, gy = Math.round(sy / PIX) * PIX;
      const rows = Math.max(1, Math.round(r / PIX));
      for (let i = -rows; i <= rows; i++) {
        const w = Math.max(PIX, Math.round((r - Math.abs(i * PIX)) * .8 / PIX) * PIX);
        ctx.rect(gx - w, gy + i * PIX, w * 2, PIX);
      }
      any = true;
    }
    if (!any) continue;
    ctx.fillStyle = col; ctx.fill();
    ctx.beginPath();                                    // 윗면 광택
    for (const g of gems) {
      if (!g.active || g.tier !== tier) continue;
      const sx = g.x - cam.x, sy = g.y - cam.y;
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
      const gx = Math.round(sx / PIX) * PIX, gy = Math.round(sy / PIX) * PIX;
      ctx.rect(gx - PIX, gy - PIX, PIX, PIX);
    }
    ctx.fillStyle = "#ffffff"; ctx.globalAlpha = .8; ctx.fill(); ctx.globalAlpha = 1;
  }
  // 아이템
  for (const pk of pickups) {
    if (!pk.active) continue;
    const sx = pk.x - cam.x, sy = pk.y - cam.y + Math.sin(pk.bob) * 3;
    ctx.save();
    const isItem = pk.kind.startsWith("item:");
    const C = isItem ? CONSUMABLES[pk.kind.slice(5)] : null;
    const glow = pk.kind === "heart" ? "#ff5b7a" : pk.kind === "sigil" ? "#ffd34d"
               : C ? C.color : "#7fd2ff";
    // 이모지는 폰트라 픽셀이 아니다. 도형으로 직접 찍는다.
    const P2 = PIX, gx = Math.round(sx / P2) * P2, gy = Math.round(sy / P2) * P2;
    const R2 = (x, y, w, h) => ctx.rect(gx + x * P2, gy + y * P2, w * P2, h * P2);
    ctx.globalAlpha = .22 + .1 * Math.sin(Game.time * 4 + pk.bob);
    ctx.fillStyle = glow; ctx.beginPath();
    pxEllipse(gx, gy, pk.kind === "sigil" ? 24 : 18, pk.kind === "sigil" ? 24 : 18);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = glow; ctx.beginPath();
    if (pk.kind === "heart") {                       // 고기 — 회복
      R2(-3, -1, 6, 3); R2(-2, -2, 4, 1); R2(-4, 0, 1, 2); R2(3, 0, 1, 2);
      ctx.fill();
      ctx.fillStyle = "#f2e3c8"; ctx.beginPath(); R2(-1, 2, 2, 2); ctx.fill();  // 뼈
    } else if (pk.kind === "sigil") {                // 징표 — 육각 문양
      for (let i = -4; i <= 4; i++) {
        const w = 5 - Math.abs(i) * .55;
        ctx.rect(gx - Math.round(w) * P2, gy + i * P2, Math.round(w) * 2 * P2, P2);
      }
      ctx.fill();
      ctx.fillStyle = "#fff8dc"; ctx.beginPath();
      R2(-1, -3, 2, 6); R2(-3, -1, 6, 2);
      ctx.fill();
    } else if (C) {                                  // 소모품 — 약병
      R2(-2, -1, 4, 4); R2(-1, -3, 2, 2); R2(-2, -4, 4, 1);
      ctx.fill();
      ctx.fillStyle = "#ffffff"; ctx.globalAlpha = .55; ctx.beginPath();
      R2(-1, 0, 1, 2); ctx.fill(); ctx.globalAlpha = 1;
    } else {                                         // 자석
      R2(-3, -3, 2, 5); R2(1, -3, 2, 5); R2(-3, -4, 6, 1);
      ctx.fill();
      ctx.fillStyle = "#ff5b5b"; ctx.beginPath(); R2(-3, 2, 2, 1); ctx.fill();
      ctx.fillStyle = "#e8e8f0"; ctx.beginPath(); R2(1, 2, 2, 1); ctx.fill();
    }
    ctx.restore();
  }

  // 보스 대형 범위기 예고 — 밟고 있으면 죽는다는 걸 미리 보여준다
  for (const e of enemies) {
    if (!e.active || !e.telT || e.telT <= 0) continue;
    const sx = e.telX - cam.x, sy = e.telY - cam.y;
    const f = 1 - e.telT / 1.5;
    ctx.save();
    ctx.globalAlpha = .18 + f * .3;
    ctx.fillStyle = "#a8e04a";
    ctx.beginPath(); pxEllipse(sx, sy, e.telR * f, e.telR * f); ctx.fill();
    ctx.globalAlpha = .85;
    pxRing(sx, sy, e.telR, PIX * 2, pxPal("#d4ff7a"));
    ctx.restore();
  }

  // 지형 — 종류마다 실루엣이 다르다. 무엇이 막고 무엇이 튕기는지 한눈에 보여야 한다.
  for (const o of obstacles) {
    if (o.struct) continue;                    // 구조물은 따로 그린다
    const sx = o.x - cam.x, sy = o.y - cam.y;
    if (sx < -100 || sx > W + 100 || sy < -100 || sy > H + 100) continue;
    ctx.save();
    // 늪은 바닥에 깔린 것이라 그림자를 지지 않는다
    if (o.kind !== "bog") {
      ctx.fillStyle = "rgba(0,0,0,.32)";
      ctx.beginPath(); pxEllipse(sx, sy + o.r * .55, o.r * .95, o.r * .36); ctx.fill();
    }
    /* 지형은 전부 격자 렌더다. arc / stroke / 다각형 fill 을 쓰면
       그 지형만 가장자리가 부드러워져 주변의 픽셀과 어긋난다.
       색은 세 겹으로 쓴다 — 겉(어두움) · 몸통 · 윗면(밝음). 위에서 빛이 온다. */
    /* 톤은 다섯 단계다. 예전엔 세 단계(겉·몸통·윗면)뿐이라 지형이 전부 평면이었다 —
       스프라이트를 64·128칸으로 올리고 나니 그 차이가 눈에 띄게 벌어졌다.
       빛은 스프라이트와 같은 방향(왼쪽 위)에서 온다. 어긋나면 빛이 두 개로 보인다. */
    const deep = mixHex(o.K.color, "#0d0d16", .74);
    const dark = mixHex(o.K.color, "#0d0d16", .5);
    const mid  = mixHex(o.K.color, "#0d0d16", .22);
    const lit  = mixHex(o.K.color, "#ffffff", .28);
    const hot  = mixHex(o.K.color, "#ffffff", .55);
    const BONE = "#ded2b4", BONE_D = "#9d8c6f";       // 중립색 — 한 지형에 한 군데만
    /* 재질. 스프라이트를 재질로 다시 칠하고 나니 지형만 뒤처졌다 —
       여기는 색 하나에서 뽑은 다섯 단계가 전부라, 나무 상자도 무쇠 통도 돌기둥도
       결국 같은 색의 명암이었다. 스프라이트와 같은 재질을 여기에도 들인다.
       (어두움 → 밝음 순) */
    const IRON  = ["#232838", "#3c4459", "#616a80", "#9aa2b5"];
    const WOOD  = ["#2a1c12", "#46311f", "#6a4a2e", "#93694a"];
    const GOLD  = ["#6b4a10", "#a8791f", "#e6b845", "#ffe9a8"];
    const RUST  = ["#3f2611", "#7a4a22", "#a86a2e"];
    const MOSS  = ["#1e3320", "#3a5a30", "#6a9444"];
    const GORE  = ["#4a0f16", "#8c1c26", "#c04452"];
    const blob = (n, jitter, squash, col, ox, oy, rr) => {
      ctx.fillStyle = col; ctx.beginPath();
      pxBlob(sx + (ox || 0), sy + (oy || 0), rr || o.r, n, jitter, squash, Math.floor(o.x));
      ctx.fill();
    };
    const rects = (col, list) => {
      ctx.fillStyle = col; ctx.beginPath();
      for (const [x, y, w, h] of list) pxR(sx + x, sy + y, w, h);
      ctx.fill();
    };
    const lines = (col, list) => {
      ctx.fillStyle = col; ctx.beginPath();
      for (const [x0, y0, x1, y1, t] of list) pxLineQ(sx + x0, sy + y0, sx + x1, sy + y1, t);
      ctx.fill();
    };
    const rnd = k => hash2(Math.floor(o.x) + k * 37, Math.floor(o.y) + k * 91);

    if (o.kind === "pillar") {
      /* 신전 기둥 — 세로로 길고, 발사체를 막는다.
         원통은 '왼쪽 밝음 → 오른쪽 어두움' 한 줄만 넣어도 둥글게 선다. */
      const h = o.r * 2.6, w = o.r * .52;
      rects(mid, [[-w, -h, w * 2, h]]);
      rects(lit, [[-w, -h, w * .7, h]]);                         // 빛 받는 면
      rects(dark, [[w * .42, -h, w * .58, h]]);                  // 그늘 면
      rects(deep, [[w * .86, -h, w * .14, h]]);
      for (let i = -2; i <= 2; i++)                              // 홈
        rects(i < 0 ? mid : deep, [[i * w * .34, -h + o.r * .2, PIX, h - o.r * .4]]);
      for (const [yy, hh] of [[-h - o.r * .3, o.r * .34], [-o.r * .28, o.r * .34]]) {
        rects(mid, [[-w * 1.4, yy, w * 2.8, hh]]);               // 주두·주초
        rects(hot, [[-w * 1.4, yy, w * 2.8, PIX]]);
        rects(deep, [[-w * 1.4, yy + hh - PIX, w * 2.8, PIX]]);
      }
      if (rnd(3) > .6) rects(deep, [[-w * .2, -h * .7, PIX, h * .3]]);   // 금
      /* 밑동의 이끼. 돌 하나만 세우면 '방금 놓인 돌'이고, 밑에 이끼가 끼면
         '오래 서 있던 돌'이 된다 — 색 두 개로 세월이 붙는다. */
      for (let i = -1; i <= 1; i++)
        rects(i ? MOSS[0] : MOSS[1], [[i * w * .8 - w * .3, -o.r * .1, w * .6, PIX]]);
      rects(RUST[0], [[-w * .5, -h * .34, w * .2, h * .12]]);            // 빗물 자국
    } else if (o.kind === "ruin") {
      /* 폐허 — 두 번 틀렸다. 덩어리로 그렸더니 웅덩이가 됐고,
         높이가 다른 기둥 다섯을 세웠더니 도시 스카이라인이 됐다.
         폐허는 '무너진 벽'이다 — 낮은 바닥벽 + 아치 문 + 부서진 윗단. */
      blob(9, .22, .34, deep, 0, o.r * .1, o.r * 1.02);           // 잔해가 깔린 바닥
      const W2 = o.r * .92, H2 = o.r * 1.15;
      rects(mid, [[-W2, -H2, W2 * 2, H2 + o.r * .12]]);           // 벽 몸통
      rects(lit, [[-W2, -H2, W2 * .5, H2 + o.r * .12]]);
      rects(dark, [[W2 * .35, -H2, W2 * .65, H2 + o.r * .12]]);
      for (let i = -2; i <= 2; i++)                               // 밑동의 이끼
        rects(i % 2 ? MOSS[0] : MOSS[1], [[i * W2 * .38 - W2 * .18, o.r * .02, W2 * .36, PIX]]);
      const rows = Math.max(3, Math.round(o.r / 14));             // 돌 켜
      for (let i = 1; i < rows; i++) {
        const y = -H2 + i * (H2 + o.r * .12) / rows;
        rects(deep, [[-W2, y, W2 * 2, PIX]]);
        for (let k = -2; k <= 2; k++)
          rects(deep, [[k * W2 * .5 + (i % 2) * W2 * .25, y, PIX, (H2 + o.r * .12) / rows]]);
      }
      // 아치 문 — 이것 하나로 '건물이었던 것'이 된다
      const aw = W2 * .34, ah = H2 * .72;
      ctx.fillStyle = "#0b0b12"; ctx.beginPath();
      pxR(sx - aw, sy - ah + aw, aw * 2, ah - aw + o.r * .12);
      pxEllipse(sx, sy - ah + aw, aw, aw);
      ctx.fill();
      // 부서진 윗단 — 이가 빠진 것처럼
      for (let i = -3; i <= 3; i++) {
        const d = (rnd(i + 9) * .5 + .15) * o.r;
        rects(mid, [[i * W2 * .29 - W2 * .13, -H2 - d, W2 * .26, d]]);
        rects(hot, [[i * W2 * .29 - W2 * .13, -H2 - d, W2 * .26, PIX]]);
      }
      for (let i = 0; i < 4; i++)                                 // 발치의 돌덩이
        blob(6, .3, .8, dark, (rnd(i) - .5) * o.r * 2.1, o.r * (.05 + rnd(i + 4) * .12),
             o.r * (.09 + rnd(i + 7) * .07));
    } else if (o.kind === "crystal") {
      /* 수정 기둥 — 마법을 튕겨낸다. 물방울 하나로 두면 물방울로 보인다.
         면을 갈라야 수정이다 — 왼쪽 면은 밝고 오른쪽 면은 어둡다. */
      const f = clamp(o.st.hp / o.st.max, 0, 1);
      const pulse = .5 + Math.sin(Game.time * 2.6 + o.seed * 9) * .25;
      ctx.globalAlpha = .2 * pulse;
      ctx.fillStyle = o.K.color; ctx.beginPath();
      pxEllipse(sx, sy - o.r * .5, o.r * 1.7, o.r * 1.7); ctx.fill();
      ctx.globalAlpha = 1;
      const body = f > .5 ? mid : dark, face = f > .5 ? hot : lit;
      const shard = (ox, hh, ww, tilt) => {
        const top = -hh, bot = o.r * .28;
        ctx.fillStyle = body; ctx.beginPath();
        for (let y = top; y <= bot; y += PIX) {
          const u = (y - top) / (bot - top);
          const w = ww * (u < .74 ? .1 + u * 1.2 : .99 - (u - .74) * 1.4);
          pxR(sx + ox + tilt * (1 - u) - w, sy + y, w * 2, PIX);
        }
        ctx.fill();
        ctx.fillStyle = face; ctx.beginPath();                    // 왼쪽 면
        for (let y = top; y <= bot; y += PIX) {
          const u = (y - top) / (bot - top);
          const w = ww * (u < .74 ? .1 + u * 1.2 : .99 - (u - .74) * 1.4);
          pxR(sx + ox + tilt * (1 - u) - w, sy + y, w * .8, PIX);
        }
        ctx.fill();
        ctx.fillStyle = deep; ctx.beginPath();                    // 오른쪽 그늘 면
        for (let y = top + hh * .1; y <= bot; y += PIX) {
          const u = (y - top) / (bot - top);
          const w = ww * (u < .74 ? .1 + u * 1.2 : .99 - (u - .74) * 1.4);
          pxR(sx + ox + tilt * (1 - u) + w * .5, sy + y, w * .5, PIX);
        }
        ctx.fill();
      };
      shard(-o.r * .52, o.r * 1.35, o.r * .3, -o.r * .18);        // 곁가지 둘
      shard(o.r * .5, o.r * 1.05, o.r * .26, o.r * .16);
      shard(0, o.r * 2.15, o.r * .44, 0);                          // 중심
      rects(hot, [[-o.r * .1, -o.r * 1.9, PIX, o.r * 1.4]]);       // 심지
      ctx.globalAlpha = .8 * pulse;
      rects("#ffffff", [[-o.r * .1, -o.r * 1.86, PIX, o.r * .5]]);
      ctx.globalAlpha = 1;
    } else if (o.kind === "thorn") {
      /* 가시덤불 — 막지 않으므로 낮게. 다만 '가시'가 보여야 아프게 생겼다.
         예전엔 초록 매트에 잔가지를 얹은 것이라 이끼로 보였다. */
      const f = clamp(o.st.hp / o.st.max, 0, 1);
      const base = f > .5 ? mid : "#4a4626";
      blob(9, .5, .5, deep, 0, o.r * .06, o.r * 1.02);
      blob(9, .5, .5, base);
      const br = [], tip = [];
      for (let i = 0; i < 9; i++) {                                // 얽힌 줄기
        const a = i / 9 * TAU + o.seed * 4;
        const a2 = a + .5 + rnd(i) * .6;
        const x0 = Math.cos(a) * o.r * .22, y0 = Math.sin(a) * o.r * .13;
        const x1 = Math.cos(a2) * o.r * .8, y1 = Math.sin(a2) * o.r * .44;
        br.push([x0, y0, x1, y1, PIX]);
        for (let k = 0; k < 3; k++) {                              // 줄기에 돋은 가시
          const t = .35 + k * .25;
          const px2 = x0 + (x1 - x0) * t, py2 = y0 + (y1 - y0) * t;
          const s2 = k % 2 ? 1 : -1;
          tip.push([px2, py2, px2 - (y1 - y0) * .22 * s2, py2 + (x1 - x0) * .22 * s2, PIX]);
        }
      }
      lines(deep, br);
      lines(f > .5 ? lit : mid, tip);
      for (let i = 0; i < 4; i++)                                  // 열매 몇 — 붉은 점
        rects("#8a2a3a", [[Math.cos(i * 1.9 + o.seed * 5) * o.r * .5 - PIX,
                           Math.sin(i * 1.9 + o.seed * 5) * o.r * .28 - PIX, PIX * 2, PIX * 2]]);
    } else if (o.kind === "tree") {
      /* 고목 — 가지가 한쪽으로만 뻗어 '갈퀴'로 보였다. 양쪽으로 벌리고
         뿌리와 옹이를 넣는다. 죽은 나무라 잎은 없다. */
      const f = clamp(o.st.hp / o.st.max, 0, 1);
      const h = o.r * 2.3, tw = o.r * .24;
      const body = f > .4 ? mid : dark;
      for (let i = 0; i < 5; i++) {                                // 뿌리
        const a = Math.PI * (.12 + i * .19);
        lines(dark, [[0, -o.r * .1, Math.cos(a) * o.r * .95, o.r * .28, o.r * .1]]);
      }
      const bb = [];
      for (let i = 0; i < 6; i++) {                                // 가지 — 양쪽으로
        const s2 = i % 2 ? 1 : -1;
        const yy = -h * (.5 + i * .085);
        const a = -Math.PI / 2 + s2 * (.85 + rnd(i) * .5);
        const L = o.r * (.8 + rnd(i + 3) * .55);
        const ex = Math.cos(a) * L, ey = yy + Math.sin(a) * L * .6;
        bb.push([s2 * tw * .5, yy, ex, ey, Math.max(PIX, o.r * .1)]);
        bb.push([ex, ey, ex + Math.cos(a - s2 * .7) * L * .4,
                 ey + Math.sin(a - s2 * .7) * L * .3, PIX]);       // 잔가지
      }
      lines(body, bb);
      rects(body, [[-tw, -h, tw * 2, h + o.r * .2]]);              // 줄기
      rects(f > .4 ? lit : mid, [[-tw, -h, tw * .8, h + o.r * .2]]);
      rects(deep, [[tw * .3, -h, tw * .7, h + o.r * .2]]);
      for (let i = 0; i < 3; i++)                                  // 옹이
        rects(deep, [[-tw * .4, -h * (.25 + i * .26), tw * .8, PIX * 2]]);
      ctx.fillStyle = "#0b0b12"; ctx.beginPath();                  // 구멍
      pxEllipse(sx - tw * .1, sy - h * .38, tw * .5, tw * .8); ctx.fill();
      if (rnd(5) > .55) {                                          // 가끔 걸려 있는 뼈
        rects(BONE_D, [[tw * 1.1, -h * .52, o.r * .28, PIX]]);
        rects(BONE, [[tw * 1.1, -h * .52 - PIX, o.r * .28, PIX]]);
      }
    } else if (o.kind === "statue") {
      /* 석상 — 받침 위의 인영. 예전엔 네모 셋이라 소화전으로 보였다.
         두건과 모아 쥔 손을 넣으면 사람으로 읽힌다. */
      const R = o.r;
      rects(deep, [[-R * .95, -R * .3, R * 1.9, R * .56]]);        // 받침
      rects(mid, [[-R * .88, -R * .3, R * 1.76, R * .46]]);
      rects(hot, [[-R * .88, -R * .3, R * 1.76, PIX]]);
      rects(deep, [[-R * .88, -R * .3 + R * .46 - PIX, R * 1.76, PIX]]);
      for (let y = -R * 1.72; y <= -R * .3; y += PIX) {            // 아래로 퍼지는 옷
        const u = (y + R * 1.72) / (R * 1.42);
        const w = R * (.42 + u * u * .3);                          // 가늘면 받침에 꽂힌 칼로 보인다
        rects(mid, [[-w, y, w * 2, PIX]]);
        rects(lit, [[-w, y, w * .55, PIX]]);
        rects(deep, [[w * .55, y, w * .45, PIX]]);
      }
      for (const t of [-.4, .25])                                  // 옷 주름
        rects(deep, [[R * .45 * t, -R * 1.5, PIX, R * 1.15]]);
      rects(deep, [[-R * .62, -R * 1.52, R * .3, R * .54]]);       // 모아 쥔 팔
      rects(mid, [[-R * .6, -R * 1.5, R * .26, R * .5]]);
      rects(lit, [[-R * .6, -R * 1.5, R * .1, R * .5]]);
      rects(deep, [[R * .32, -R * 1.52, R * .3, R * .54]]);
      rects(mid, [[R * .34, -R * 1.5, R * .26, R * .5]]);
      rects(deep, [[-R * .34, -R * 2.06, R * .68, R * .5]]);       // 두건 쓴 머리
      rects(mid, [[-R * .31, -R * 2.02, R * .62, R * .44]]);
      rects(lit, [[-R * .31, -R * 2.02, R * .2, R * .44]]);
      rects("#0b0b12", [[-R * .2, -R * 1.88, R * .4, R * .18]]);   // 두건 안 — 얼굴이 없다
      rects(hot, [[-R * .34, -R * 2.06, R * .68, PIX]]);
      if (rnd(2) > .5) {                                           // 깨진 모서리
        rects("#0b0b12", [[R * .1, -R * 2.02, R * .16, R * .2]]);
        rects("#3a4a2c", [[-R * .5, -R * .5, R * .3, PIX * 2]]);   // 이끼
      }
    } else if (o.kind === "bones") {
      /* 거대 유해 — 갈비뼈. 발사체는 사이로 지나간다.
         유일한 중립색 지형이라 뼈 톤을 직접 쓴다. */
      const R = o.r;
      ctx.fillStyle = BONE_D; ctx.beginPath();                     // 척추 — 그늘 먼저
      pxLineQ(sx - R * .9, sy + R * .34, sx + R * .9, sy - R * .06, Math.max(PIX, R * .14));
      ctx.fill();
      ctx.fillStyle = BONE; ctx.beginPath();
      pxLineQ(sx - R * .9, sy + R * .3, sx + R * .9, sy - R * .1, Math.max(PIX, R * .1));
      ctx.fill();
      for (let i = 0; i < 6; i++) {
        const px2 = -R * .8 + i * R * .32, py2 = R * .28 - i * R * .07;
        const steps = Math.max(10, Math.ceil(R * .52 * 2.2 / PIX));
        for (const [col, dy] of [[BONE_D, PIX], [BONE, 0]]) {
          ctx.fillStyle = col; ctx.beginPath();
          for (let k = 0; k <= steps; k++) {
            const a = Math.PI * (.15 + .7 * k / steps);
            pxR(sx + px2 + Math.cos(a) * R * .52 - PIX,
                sy + py2 - R * .5 + Math.sin(a) * R * .52 - PIX + dy, PIX * 2, PIX * 2);
          }
          ctx.fill();
        }
      }
      ctx.fillStyle = BONE_D; ctx.beginPath();                     // 두개골
      pxEllipse(sx + R, sy - R * .12, R * .36, R * .36); ctx.fill();
      ctx.fillStyle = BONE; ctx.beginPath();
      pxEllipse(sx + R * .98, sy - R * .18, R * .32, R * .3); ctx.fill();
      rects("#0b0b12", [[R * .86, -R * .2, R * .1, R * .12], [R * 1.06, -R * .2, R * .1, R * .12]]);
      rects(BONE, [[R * .88, -R * .02, R * .26, PIX]]);            // 이빨줄
    } else if (o.kind === "obelisk") {
      /* 첨탑 — 가장 높다. 멀리서도 위치를 잡는 이정표.
         네모 기둥이라 '왼쪽 면 · 오른쪽 면'을 나눠야 서 있는 것으로 보인다. */
      const h = o.r * 4.2;
      for (let y = -h; y <= 0; y += PIX) {
        const u = (y + h) / h;
        const w = o.r * (.26 + u * .24);
        rects(mid, [[-w, y, w * 2, PIX]]);
        rects(lit, [[-w, y, w * .62, PIX]]);
        rects(deep, [[w * .38, y, w * .62, PIX]]);
      }
      const tw = o.r * .26;                                         // 뾰족한 꼭대기
      for (let i = 0; i < 8; i++) {
        const w = tw * (1 - i / 8);
        rects(mid, [[-w, -h - o.r * .5 + i * o.r * .0625, w * 2, PIX]]);
        rects(lit, [[-w, -h - o.r * .5 + i * o.r * .0625, w * .6, PIX]]);
      }
      rects(deep, [[-o.r * .5, -o.r * .1, o.r, o.r * .18]]);        // 받침
      rects(mid, [[-o.r * .46, -o.r * .12, o.r * .92, o.r * .16]]);
      ctx.globalAlpha = .5 + Math.sin(Game.time * 1.8 + o.seed * 7) * .3;
      const gl = [];                                                // 새겨진 룬
      for (let i = 1; i <= 4; i++) {
        gl.push([-o.r * .12, -h * (i / 5), o.r * .24, PIX]);
        gl.push([-o.r * .05, -h * (i / 5) + PIX, o.r * .1, PIX]);
      }
      rects("#c9a3ff", gl);
      ctx.globalAlpha = 1;
    } else if (o.kind === "brazier") {
      // 화톳불 — 적을 태운다. 불꽃이 살아 움직여야 '켜져 있다'가 읽힌다
      for (let y = -o.r * .15; y <= o.r * .35; y += PIX) {           // 무쇠 그릇
        const u = (y + o.r * .15) / (o.r * .5);
        const w = o.r * (.45 + u * .25);
        rects(IRON[1], [[-w, y, w * 2, PIX]]);
        rects(IRON[2], [[-w, y, w * .4, PIX]]);
        rects(IRON[0], [[w * .55, y, w * .45, PIX]]);
        if (u > .5 && u < .8) rects(RUST[1], [[-w * .1, y, w * .3, PIX]]);   // 흘러내린 녹
      }
      rects(IRON[3], [[-o.r * .72, -o.r * .18, o.r * 1.44, PIX]]);     // 테두리
      rects(GOLD[1], [[-o.r * .72, -o.r * .14, o.r * 1.44, PIX]]);     // 테 아래 금띠
      /* 숯불도 온도로 그린다 — 아래는 식은 검정, 그 위가 붉고, 가운데가 노랗고,
         제일 뜨거운 자리에 흰 점 하나. 이펙트에서 쓴 열 램프와 같은 규칙이다. */
      rects("#1b1820", [[-o.r * .5, -o.r * .12, o.r, PIX * 2]]);       // 숯
      rects("#7a2410", [[-o.r * .44, -o.r * .1, o.r * .88, PIX * 2]]);
      rects("#ff5a2a", [[-o.r * .34, -o.r * .1, o.r * .68, PIX]]);
      rects("#ffb03c", [[-o.r * .2, -o.r * .1, o.r * .4, PIX]]);
      rects("#fff0c0", [[-o.r * .06, -o.r * .1, o.r * .12, PIX]]);
      for (const [dx, dy] of [[-.55, .3], [.5, .34], [0, .42]]) {       // 다리
        rects(IRON[0], [[o.r * dx - PIX, o.r * dy, PIX * 2, o.r * .18]]);
        rects(RUST[0], [[o.r * dx - PIX, o.r * dy + o.r * .12, PIX * 2, o.r * .06]]);
      }
      for (let i = 0; i < 3; i++) {
        const ph = Game.time * 6 + i * 2.1 + o.seed * 9;
        const fh = o.r * (1.0 + Math.sin(ph) * .3);
        ctx.globalAlpha = .55 + Math.sin(ph * 1.4) * .25;
        ctx.fillStyle = i === 0 ? "#ffd36e" : "#ff8a3c";
        ctx.beginPath();
        const bx = sx - o.r * .3 + i * o.r * .3;
        for (let y = 0; y <= fh; y += PIX) {
          const u = y / fh, w = o.r * .16 * (1 - u * u);
          if (w < PIX * .4) break;
          pxR(bx - w, sy - o.r * .15 - y, w * 2, PIX);
        }
        ctx.fill();
      }
      ctx.globalAlpha = .12;
      ctx.fillStyle = "#ff8a3c"; ctx.beginPath();
      pxEllipse(sx, sy, o.r * 1.6, o.r * 1.6); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (o.kind === "bog") {
      // 늪 — 바닥에 깔린다. 지나갈 수 있지만 모두 느려진다
      ctx.globalAlpha = .62;
      blob(11, .22, .5, deep, 0, 0, o.r * 1.04);
      blob(11, .22, .5, o.K.color);
      ctx.globalAlpha = .34;
      blob(11, .22, .5, lit, -o.r * .06, -o.r * .04, o.r * .82);
      ctx.globalAlpha = .34;
      ctx.fillStyle = "#8fc0a8"; ctx.beginPath();
      for (let i = 0; i < 5; i++) {                                  // 떠 있는 거품
        const a = o.seed * 13 + i * 1.7 + Math.sin(Game.time * .6 + i) * .3;
        const d = o.r * (.25 + (i % 3) * .22);
        pxEllipse(sx + Math.cos(a) * d, sy + Math.sin(a) * d * .5, o.r * .1, o.r * .06);
      }
      ctx.fill();
      ctx.globalAlpha = .8;
      for (let i = 0; i < 4; i++) {                                  // 갈대 — 늪이라는 신호
        const a = o.seed * 7 + i * 1.6;
        const bx = Math.cos(a) * o.r * .78, by = Math.sin(a) * o.r * .42;
        lines("#5a6a48", [[bx, by, bx + (rnd(i) - .5) * o.r * .12, by - o.r * .3, PIX]]);
      }
      ctx.globalAlpha = 1;
    } else if (o.kind === "crate") {
      /* 나무 상자 — 널판과 쇠테. 상자는 '켜'가 보여야 상자다.
         부술 수 있는 것이므로 성한 것과 금 간 것이 달라야 한다. */
      const f = clamp(o.st.hp / o.st.max, 0, 1);
      /* 상자는 대체로 정육면체다. 세로로 길게 그렸더니 발판이나 교수대로 보였다. */
      const R = o.r * .95, hgt = o.r * 1.05;
      rects(WOOD[0], [[-R - PIX, -hgt - PIX, (R + PIX) * 2, hgt + o.r * .3 + PIX]]);
      rects(WOOD[1], [[-R, -hgt, R * 2, hgt + o.r * .3]]);
      for (let i = 0; i < 4; i++) {                                   // 세로 널판 — 나무 네 단계
        const x = -R + i * R * .5;
        rects(i % 2 ? WOOD[2] : WOOD[1], [[x, -hgt, R * .5 - PIX, hgt + o.r * .3]]);
        rects(WOOD[0], [[x + R * .5 - PIX, -hgt, PIX, hgt + o.r * .3]]);
        if (i % 2) rects(WOOD[3], [[x, -hgt, PIX, hgt + o.r * .3]]);  // 널판의 볕 받는 모서리
      }
      rects(WOOD[3], [[-R, -hgt, R * 2 - PIX, PIX]]);                 // 윗면
      for (const yy of [-hgt + o.r * .16, o.r * .02]) {               // 쇠테 — 무쇠 네 단계에 녹
        rects(IRON[0], [[-R - PIX, yy, (R + PIX) * 2, o.r * .16]]);
        rects(IRON[1], [[-R - PIX, yy + PIX, (R + PIX) * 2, o.r * .16 - PIX * 2]]);
        rects(IRON[3], [[-R - PIX, yy, (R + PIX) * 2, PIX]]);
        rects(RUST[1], [[-R * .3, yy + PIX, R * .3, o.r * .16 - PIX * 2]]);   // 녹 자국
        rects(IRON[2], [[-R - PIX, yy, PIX * 2, o.r * .16]]);         // 못
        rects(IRON[2], [[R - PIX, yy, PIX * 2, o.r * .16]]);
      }
      for (let i = 0; i < 3; i++)                                     // 밑동에 낀 이끼
        rects(i ? MOSS[0] : MOSS[1], [[-R + i * R * .7, o.r * .22, R * .4, PIX]]);
      if (f < .6) {                                                   // 금
        lines(deep, [[-R * .5, -hgt * .8, R * .2, -o.r * .1, PIX],
                     [R * .2, -o.r * .1, R * .7, -hgt * .5, PIX]]);
        if (f < .3) rects("#0b0b12", [[R * .1, -hgt * .55, R * .35, hgt * .3]]);
      }
    } else if (o.kind === "lantern") {
      /* 등불 — 기둥 위의 등. 조명 체계의 광원이기도 하다(drawLighting 참고).
         불이 살아 움직여야 '켜져 있다'가 읽힌다 — 화톳불과 같은 규칙. */
      const h = o.r * 2.6;
      rects(IRON[0], [[-o.r * .5, -o.r * .2, o.r, o.r * .4]]);        // 받침
      rects(IRON[2], [[-o.r * .5, -o.r * .2, o.r, PIX]]);
      rects(MOSS[0], [[-o.r * .5, -o.r * .2 + o.r * .34, o.r * .5, PIX]]);   // 받침에 낀 이끼
      rects(IRON[0], [[-PIX, -h * .78, PIX * 2, h * .78]]);           // 기둥
      rects(IRON[2], [[-PIX, -h * .78, PIX, h * .78]]);
      rects(RUST[1], [[-PIX, -h * .3, PIX, h * .16]]);                // 기둥에 흘러내린 녹
      lines(IRON[1], [[0, -h * .78, o.r * .6, -h * .92, PIX]]);       // 걸이
      const bx = o.r * .6, by = -h * .92;
      rects(IRON[0], [[bx - o.r * .34, by, o.r * .68, PIX]]);         // 등 지붕
      rects(GOLD[1], [[bx - o.r * .34, by, o.r * .68 - PIX, PIX]]);   // 지붕의 금테
      rects(IRON[0], [[bx - o.r * .28, by + PIX, o.r * .56, o.r * .62]]);
      rects("#2a2432", [[bx - o.r * .24, by + PIX, o.r * .48, o.r * .58]]);  // 유리 안쪽
      for (const gx2 of [-.24, 0, .24])                               // 유리를 무는 창살
        rects(IRON[1], [[bx + o.r * gx2 - PIX * .5, by + PIX, PIX, o.r * .58]]);
      const ph = Game.time * 5 + o.seed * 9;
      const fh = o.r * (.34 + Math.sin(ph) * .07);
      ctx.globalAlpha = .8 + Math.sin(ph * 1.6) * .2;
      rects("#ff8a3c", [[bx - o.r * .16, by + o.r * .62 - fh, o.r * .32, fh]]);
      rects("#ffd36e", [[bx - o.r * .08, by + o.r * .62 - fh * .7, o.r * .16, fh * .7]]);
      ctx.globalAlpha = 1;
      rects("#3a3040", [[bx - o.r * .3, by + o.r * .66, o.r * .6, PIX]]);   // 바닥판
      ctx.globalAlpha = .14;
      ctx.fillStyle = "#ffc266"; ctx.beginPath();
      pxEllipse(sx + bx, sy + by + o.r * .3, o.r * 1.7, o.r * 1.7); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (o.kind === "wall") {
      /* 석벽 — 덩어리로 그리면 공이 된다. 벽은 네모나야 벽이다.
         돌마다 톤을 흔들어야 '쌓은 것'으로 읽힌다 — 한 톤이면 상자다. */
      const h = o.r * 1.35, w = o.r * .95, bot = o.r * .25;
      rects(mid, [[-w, -h, w * 2, h + bot]]);
      const rows = Math.max(2, Math.floor(h / Math.max(PIX * 3, o.r * .3)));
      const rh = (h + bot) / rows;
      for (let i = 0; i < rows; i++) {
        const y = -h + i * rh, off = (i % 2) * w * .5;
        for (let k = -2; k <= 2; k++) {
          const x = off + k * w * .5;
          if (x >= w || x + w * .5 <= -w) continue;
          const x0 = Math.max(-w, x), x1 = Math.min(w, x + w * .5);
          const t = rnd(i * 5 + k + 20);
          rects(t > .72 ? lit : t > .38 ? mid : dark, [[x0, y, x1 - x0, rh]]);
          rects(t > .72 ? hot : lit, [[x0, y, x1 - x0 - PIX, PIX]]);   // 돌 윗면
          rects(deep, [[x0, y + rh - PIX, x1 - x0, PIX]]);             // 줄눈
          rects(deep, [[x1 - PIX, y, PIX, rh]]);
        }
      }
      rects(hot, [[-w, -h, w * 2, PIX]]);                             // 벽 윗면
      rects(deep, [[-w, -h, PIX, h + bot]]);
      rects(deep, [[w - PIX, -h, PIX, h + bot]]);
    } else {
      /* 바위 — 가장 흔하다(전체의 6할). 여기가 제일 오래 보인다.
         면을 갈라야 돌이다 — 윗면 · 왼쪽 면 · 오른쪽 그늘 · 밑동. */
      blob(7, .34, .86, deep, 0, o.r * .06, o.r * 1.02);
      blob(7, .34, .86, mid);
      ctx.fillStyle = lit; ctx.beginPath();                           // 윗면
      pxBlob(sx - o.r * .12, sy - o.r * .3, o.r * .6, 7, .34, .8, Math.floor(o.x));
      ctx.fill();
      ctx.fillStyle = hot; ctx.beginPath();                           // 정수리 광
      pxBlob(sx - o.r * .24, sy - o.r * .42, o.r * .26, 6, .3, .8, Math.floor(o.x) + 3);
      ctx.fill();
      ctx.fillStyle = dark; ctx.beginPath();                          // 오른쪽 그늘 면
      pxBlob(sx + o.r * .34, sy + o.r * .1, o.r * .42, 6, .3, .9, Math.floor(o.x) + 7);
      ctx.fill();
      const a0 = o.seed * 5;                                          // 금 하나
      lines(deep, [[Math.cos(a0) * o.r * .5, Math.sin(a0) * o.r * .3,
                    Math.cos(a0 + 2.2) * o.r * .55, Math.sin(a0 + 2.2) * o.r * .34, PIX]]);
      for (let i = 0; i < 3; i++)                                     // 발치의 부스러기
        blob(5, .3, .8, dark, (rnd(i) - .5) * o.r * 1.9, o.r * (.34 + rnd(i + 3) * .12),
             o.r * (.07 + rnd(i + 6) * .05));
    }
    ctx.restore();
  }

  /* 지형지물 셋 — 상자 · 봉인된 제단 · 고대 비석.
     예전에는 arc 와 stroke 로 그려 가장자리가 부드러웠다. 전부 격자로 옮긴다. */
  for (const lm of landmarks) {
    const sx = lm.x - cam.x, sy = lm.y - cam.y;
    if (sx < -80 || sx > W + 80 || sy < -80 || sy > H + 80) continue;
    const pulse = .6 + Math.sin(Game.time * 2 + lm.x * .01) * .25;
    const R2 = (x, y, w, h) => pxR(sx + x, sy + y, w, h);
    ctx.save();
    // 바닥 표식
    ctx.globalAlpha = .22 * pulse;
    ctx.fillStyle = lm.T.color;
    ctx.beginPath(); pxEllipse(sx, sy + lm.r * .5, lm.r * 1.7, lm.r * .8); ctx.fill();
    ctx.globalAlpha = 1;

    if (lm.type === "chest") {
      ctx.fillStyle = "#6b4a26"; ctx.beginPath(); R2(-18, -6, 36, 20); ctx.fill();
      ctx.fillStyle = "#8a6234"; ctx.beginPath();       // 둥근 뚜껑을 가로줄로
      for (let y = -18; y <= -6; y += PIX) {
        const w = 18 * Math.sqrt(Math.max(0, 1 - (y / -18) * (y / -18) * 0 + (1 - (y + 18) / 12 * 0)));
        const ww = 18 * Math.sqrt(Math.max(.04, 1 - ((y + 6) / 12) * ((y + 6) / 12)));
        pxR(sx - ww, sy + y, ww * 2, PIX);
      }
      ctx.fill();
      ctx.fillStyle = "#e8c96a"; ctx.beginPath();
      R2(-18, -8, 36, 4); R2(-4, -4, 8, 10); ctx.fill();
    } else if (lm.type === "shrine") {
      ctx.fillStyle = "#4a4560"; ctx.beginPath();
      R2(-24, -30, 8, 44); R2(16, -30, 8, 44); R2(-28, -38, 56, 10); ctx.fill();
      ctx.fillStyle = "#5f5a78"; ctx.beginPath(); R2(-28, -38, 56, PIX); ctx.fill();
      // 봉인 문양 — 고리와 살
      ctx.globalAlpha = lm.fighting ? .25 : .55 + Math.sin(Game.time * 3) * .25;
      pxRing(sx, sy - 10, 13, PIX * 2, pxPal("#c9a3ff"));
      ctx.fillStyle = "#c9a3ff"; ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = Game.time * .6 + i / 5 * TAU;
        pxLineQ(sx, sy - 10, sx + Math.cos(a) * 13, sy - 10 + Math.sin(a) * 13, PIX);
      }
      ctx.fill();
      ctx.globalAlpha = 1;
      // 아직 못 여는 제단이면 미리 알려준다 — 닿고 나서야 알면 헛걸음이 된다
      if (!lm.fighting && player.level < SHRINE_MIN_LEVEL) {
        ctx.font = "700 12px " + FONT;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = "#c9a3ff";
        ctx.fillText("Lv" + SHRINE_MIN_LEVEL + " 필요", sx, sy - 50);
      }
    } else {
      // 고대 비석 — 위로 좁아지는 석판
      ctx.fillStyle = "#3f4a5c"; ctx.beginPath();
      for (let y = -34; y <= 14; y += PIX) {
        const u = (y + 34) / 48, w = 10 + u * 4;
        pxR(sx - w, sy + y, w * 2, PIX);
      }
      ctx.fill();
      ctx.fillStyle = "#55637a"; ctx.beginPath(); R2(-10, -34, 20, PIX); ctx.fill();
      ctx.globalAlpha = .5 + Math.sin(Game.time * 2.2) * .3;
      ctx.fillStyle = "#8fd0ff"; ctx.beginPath();
      for (let i = 0; i < 3; i++) pxLineQ(sx - 6, sy - 24 + i * 12, sx + 6, sy - 28 + i * 12, PIX);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  drawAdvanceGround();   // 4차 마법진 — 적보다 아래에 깔아야 포위 상황이 안 가려진다

  // 그림자는 색이 같으므로 한 번의 패스로 모아 그린다 (적 360마리 × fill 을 1회로)
  ctx.fillStyle = "rgba(0,0,0,.28)";
  ctx.beginPath();
  for (const e of enemies) {
    if (!e.active) continue;
    const sx = e.x - cam.x, sy = e.y - cam.y;
    if (sx < -70 || sx > W + 70 || sy < -70 || sy > H + 70) continue;
    pxEllipse(sx, sy + e.r * .85, e.r * .8, e.r * .32);
  }
  ctx.fill();

  for (const e of enemies) if (e.active) drawEnemy(e);
  if (!Attract.on) drawEnemyNames();

  // 지속형 무기(오라)는 플레이어 아래에 깔린다
  for (const w of player.weapons) {
    const def = WEAPONS[w.key];
    if (def.draw && w.key === "aura") def.draw(player, w);
  }

  drawStanceWorld();
  drawPlayer();

  for (const w of player.weapons) {
    const def = WEAPONS[w.key];
    if (def.draw && w.key !== "aura") def.draw(player, w);
  }

  // 참격
  for (const sl of slashes) {
    if (!sl.active) continue;
    const t = 1 - sl.life / sl.maxLife;
    const sx = sl.x - cam.x, sy = sl.y - cam.y;
    ctx.save();
    ctx.globalAlpha = (1 - t) * .95;
    ctx.globalCompositeOperation = "lighter";
    const cols = pxPal(ELEMENTS[sl.element] ? ELEMENTS[sl.element].color : "#ffe9b8");
    if (sl.len > 300) {
      // 긴 것은 '창'이다. 호로 그리면 부채꼴이 화면 1/3을 덮는다.
      const reach = sl.len * (.55 + t * .45), from = 26;
      pxLance(sx + Math.cos(sl.ang) * from, sy + Math.sin(sl.ang) * from,
              sl.ang, reach - from, (10 + sl.len * .022) * (1 - t * .4), cols);
    } else {
      const R = sl.len * (.55 + t * .5), span = .55 + t * 1.5;
      const th = (7 + sl.len * .05) * (1 - t * .55);
      pxArc(sx, sy, R, sl.ang - span / 2, sl.ang + span / 2, th, cols);
      /* 심지 — 벤 자국 안쪽에 얇고 밝은 선 하나. 레퍼런스 그림의 참격이 이렇다.
         한 겹이면 색칠한 부채꼴이고, 두 겹이면 '지나간 길'이 된다. */
      if (th > PIX * 1.6)
        pxArc(sx, sy, R, sl.ang - span * .38, sl.ang + span * .38, Math.max(PIX, th * .3), PJ_WHITE);
    }
    ctx.restore();
  }

  // 바닥 장판 — 밟으면 아프다
  for (const h of hazards) {
    if (!h.active) continue;
    const sx = h.x - cam.x, sy = h.y - cam.y;
    if (sx < -160 || sx > W + 160 || sy < -160 || sy > H + 160) continue;
    const t = h.life / h.maxLife;
    ctx.save();
    pxHazard(sx, sy, h.r, pxPal(h.color), (h.x | 0) + (h.y | 0) * 7,
      .16 + .16 * t, .38 + .28 * Math.abs(Math.sin(Game.time * 4)));
    ctx.restore();
  }

  // 파동
  for (const wv of waves) {
    if (!wv.active) continue;
    const t = 1 - wv.life / wv.maxLife;
    const sx = wv.x - cam.x, sy = wv.y - cam.y;
    if (sx < -wv.r - 60 || sx > W + wv.r + 60 || sy < -wv.r - 60 || sy > H + wv.r + 60) continue;
    ctx.save();
    ctx.globalAlpha = (1 - t) * .18;
    ctx.fillStyle = wv.color;
    ctx.beginPath(); ctx.arc(sx, sy, wv.r, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = "lighter";
    // 뒤에 남는 흐린 테 — 파동이 '지나갔다'가 보인다
    ctx.globalAlpha = (1 - t) * .3;
    pxRing(sx, sy, wv.r * .82, 3 + (1 - t) * 4, pxPal(wv.color));
    ctx.globalAlpha = (1 - t) * .75;
    pxRing(sx, sy, wv.r, 4 + (1 - t) * 7, pxPal(wv.color));
    // 앞날 — 가장 바깥 한 줄만 희게. 여기가 부딪히는 자리다.
    ctx.globalAlpha = (1 - t) * .85;
    pxRing(sx, sy, wv.r + 2, PIX, PJ_WHITE);
    ctx.restore();
  }

  /* 발사체 — 뿌연 광원 원을 걷어내고 평평한 면 + 격자 테두리로.
     테두리 칸은 색이 같은 동안 모았다가 색이 바뀔 때만 칠한다.
     탄 하나마다 칠하면 화면에 300발일 때 그만큼 path 를 여는 셈이다. */
  let pjCols = null;
  for (const p of projectiles) {
    if (!p.active) continue;
    const sx = p.x - cam.x, sy = p.y - cam.y;
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
    if (p.kind === "dagger") {
      // 회전이 필요한 것은 꼭짓점을 직접 돌린다. 회전된 좌표계에서 칸을 찍으면
      // 격자가 화면과 어긋나 안티에일리어싱이 되돌아온다.
      const ca = Math.cos(p.angle), sa = Math.sin(p.angle);
      const tip = p.r * 1.7, back = -p.r * .5, half = p.r * .45;
      const rot = (x, y, o) => { pxOut[o] = sx + x * ca - y * sa; pxOut[o + 1] = sy + x * sa + y * ca; };
      rot(tip, 0, 0); rot(back, -half, 2); rot(back, half, 4); rot(tip, 0, 6);
      if (pjCols !== PJ_STEEL) { if (pjCols) pxFlush(pjCols); pjCols = PJ_STEEL; }
      ctx.fillStyle = PJ_STEEL[2];
      ctx.beginPath(); ctx.moveTo(pxOut[0], pxOut[1]);
      ctx.lineTo(pxOut[2], pxOut[3]); ctx.lineTo(pxOut[4], pxOut[5]);
      ctx.closePath(); ctx.fill();
      pxEdge(pxOut, 8);
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(p.angle);
      ctx.fillStyle = "#6d4c33"; ctx.fillRect(-p.r * 1.2, -p.r * .22, p.r * .8, p.r * .44);
      ctx.fillStyle = "#e8c96a"; ctx.fillRect(-p.r * .62, -p.r * .6, p.r * .22, p.r * 1.2);
      // 잔상 — 날아가는 것에는 자국이 남아야 속도가 읽힌다
      ctx.globalAlpha = .32;
      ctx.fillStyle = "#cfd6e6";
      ctx.fillRect(-p.r * 3.4, -PIX / 2, p.r * 2.4, PIX);
      ctx.globalAlpha = 1;
      ctx.restore();
    } else {
      const flame = p.kind === "flame";
      const cols = pxPal(flame ? "#ff8a3c" : p.color);
      if (pjCols !== cols) { if (pjCols) pxFlush(pjCols); pjCols = cols; }
      // 불꽃은 날아가면서 사그라든다
      const t = clamp(p.life / p.maxLife, 0, 1);
      /* 꼬리. 이력을 저장하면 탄 300발 × 프레임마다 배열이 커진다 —
         속도 방향으로 뒤에 점점 작아지는 원을 몇 개 찍는 것으로 충분하다.
         멈춰 있는 탄(속도 0)에는 꼬리가 안 붙어야 하므로 속도로 나눈다. */
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > 40) {
        /* 작아지기만 하고 흐려지지 않으면 꼬리가 아니라 구슬 목걸이가 된다 —
           실제로 그렇게 나왔다. 뒤로 갈수록 흐려져야 하나의 자국으로 읽힌다. */
        const ux = p.vx / sp, uy = p.vy / sp, step = p.r * .8;
        for (let k = 3; k >= 1; k--) {
          ctx.globalAlpha = .5 - k * .11;
          pxDisc(sx - ux * step * k, sy - uy * step * k, p.r * (1 - k * .22), cols);
        }
        ctx.globalAlpha = 1;
      }
      pxDisc(sx, sy, flame ? p.r * (.75 + t * .45) : p.r, cols);
    }
  }
  if (pjCols) pxFlush(pjCols);

  // 번개
  for (const b of bolts) {
    if (!b.active) continue;
    const sx = b.x - cam.x, sy = b.y - cam.y;
    ctx.save();
    ctx.globalAlpha = clamp(b.life / .3, 0, 1);
    ctx.globalCompositeOperation = "lighter";
    const bc = pxPal("#7fd2ff");
    // 꺾인 점 사이를 격자 칸으로 채운다 — 선으로 그으면 안티에일리어싱이 남는다
    let px0 = sx + (hash2(b.seed | 0, 7) - .5) * 60, py0 = sy - 400;
    for (let i = 1; i <= 8; i++) {
      const py1 = sy - 400 + (400 * i / 8);
      const px1 = sx + (hash2((b.seed | 0) + i, i * 13) - .5) * 60 * (1 - i / 8);
      const n = Math.ceil(Math.hypot(px1 - px0, py1 - py0) / PIX);
      for (let j = 0; j <= n; j++) {
        const u = j / n, cx2 = px0 + (px1 - px0) * u, cy2 = py0 + (py1 - py0) * u;
        for (let k = -3; k <= 3; k += PIX) pxPush(pxBand(Math.abs(k), 4), cx2 + k, cy2);
      }
      px0 = px1; py0 = py1;
    }
    pxFlush(bc);
    ctx.restore();
  }

  /* 적이 쏜 탄 — 아군 탄과 헷갈리면 안 된다.
     아군 탄은 무기의 속성색, 적 탄은 무조건 붉은 테를 두른다. */
  for (const p of eshots) {
    if (!p.active) continue;
    const sx = p.x - cam.x, sy = p.y - cam.y;
    if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) continue;
    pxDisc(sx, sy, p.r + 2, ESHOT_RING);
    pxDisc(sx, sy, p.r - 1, pxPal(p.color));
  }

  drawStructures();

  // 첨탑의 빛줄기
  for (const b of beams) {
    if (!b.active) continue;
    const x0 = b.x0 - cam.x, y0 = b.y0 - cam.y, x1 = b.x1 - cam.x, y1 = b.y1 - cam.y;
    const t = b.life / .22;
    ctx.save();
    ctx.globalAlpha = t;
    ctx.globalCompositeOperation = "lighter";
    const len = Math.hypot(x1 - x0, y1 - y0);
    pxLance(x0, y0, Math.atan2(y1 - y0, x1 - x0), len, 5 + t * 5, pxPal(b.color));
    ctx.restore();
  }

  /* 이펙트 — 가산 합성(lighter)이라 여러 발이 겹치면 흰빛으로 타오른다.
     알파를 수명보다 빠르게 떨어뜨려 잔상이 남지 않게 한다. */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const f of fxs) {
    if (!f.active) continue;
    const sx = f.x - cam.x, sy = f.y - cam.y;
    if (sx < -90 || sx > W + 90 || sy < -90 || sy > H + 90) continue;
    ctx.globalAlpha = Math.min(1, f.life / f.maxLife * 1.7);
    if (f.rot) {
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(f.rot);
      Sprites.draw(f.key, 0, 0, f.scale, f.maxLife - f.life, false);
      ctx.restore();
    } else {
      Sprites.draw(f.key, sx, sy, f.scale, f.maxLife - f.life, false);
    }
  }
  ctx.restore();

  /* 파티클. 수백 개라 색깔이 바뀔 때만 칠한다. 원 대신 격자 칸이라 가장자리가 또렷하다.

     예전에는 전부 같은 크기의 네모였다. 두 가지를 더했다 —
       ① 수명이 줄면 같이 줄어든다. 끝까지 같은 크기면 '꺼지는' 게 아니라 '사라지는' 것이다.
       ② 빠른 것(streak)은 진행 방향으로 늘어난 자국을 남긴다. 불티와 피가 그렇다.
     둘 다 알파를 함께 쓰므로 globalAlpha 가 바뀌는 지점에서 경로를 끊어야 한다 —
     그래서 알파를 세 단계로 끊어 묶는다(안 그러면 파티클마다 fill 이 한 번씩 열린다). */
  {
    let pc = null, pa = -1;
    for (const p of particles) {
      if (!p.active) continue;
      const t = clamp(p.life / p.maxLife, 0, 1);
      const a = Math.ceil(t * 3) / 3;                 // 알파를 세 단계로 — 묶어 칠하려고
      // 갓 튄 것은 밝고, 식으면 몸통색, 꺼질 때는 어둡다
      const col = p.pal ? p.pal[t > .62 ? 0 : t > .3 ? 1 : 2] : p.color;
      if (col !== pc || a !== pa) {
        if (pc) ctx.fill();
        pc = col; pa = a;
        ctx.fillStyle = pc; ctx.globalAlpha = a; ctx.beginPath();
      }
      const s2 = Math.max(PIX, Math.round(p.r * (.35 + t * .65) / PIX) * PIX);
      const gx = Math.round((p.x - cam.x) / PIX) * PIX, gy = Math.round((p.y - cam.y) / PIX) * PIX;
      if (p.streak) {
        const sp = Math.hypot(p.vx, p.vy);
        if (sp > 60) {
          const L = Math.min(p.streak, sp * .035);
          const ux = p.vx / sp, uy = p.vy / sp;
          const n = Math.max(1, Math.round(L / PIX));
          for (let k = 0; k <= n; k++)
            ctx.rect(Math.round((gx - ux * k * PIX) / PIX) * PIX - s2 / 2,
                     Math.round((gy - uy * k * PIX) / PIX) * PIX - s2 / 2, s2, s2);
          continue;
        }
      }
      ctx.rect(gx - s2 / 2, gy - s2 / 2, s2, s2);
    }
    if (pc) ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 데미지 숫자 — 어트랙트 데모에서는 읽을 정보가 아니라 글자 노이즈다
  if (Attract.on) { ctx.globalAlpha = 1; return; }
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.75)";
  for (const n of numbers) {
    if (!n.active) continue;
    const nx = n.x - cam.x, ny = n.y - cam.y;
    if (nx < -40 || nx > W + 40 || ny < -30 || ny > H + 30) continue;
    ctx.globalAlpha = clamp(n.life / .7, 0, 1);
    ctx.font = "700 " + n.size + "px " + FONT;
    ctx.strokeText(n.text, nx, ny);
    ctx.fillStyle = n.color;
    ctx.fillText(n.text, nx, ny);
  }
  ctx.globalAlpha = 1;
}

/* 대형 구조물 그리기.
   건물은 화면에서 가장 큰 물체라 크기가 변한다 — 스프라이트로 확대하면 어긋난다.
   그래서 격자 렌더로 짓는다(docs/art-spec.md 12·13절과 같은 규칙).

   실루엣이 멀리서 구분되어야 한다. 색만 다르면 '뭔가 큰 것'으로만 보인다.
   그래서 종류마다 윗부분의 형태를 다르게 한다 —
   첨탑은 뾰족하게, 샘은 낮고 둥글게, 성채는 톱니, 대장간은 굴뚝. */
function drawStructures() {
  for (const s of structures) {
    const sx = s.x - cam.x, sy = s.y - cam.y;
    const R = s.r;
    if (sx < -R - 120 || sx > W + R + 120 || sy < -R - 160 || sy > H + R + 160) continue;
    const K = s.K, st = s.st, on = !!st;
    const cols = pxPal(K.color);
    // 종류마다 꼭대기가 다르다. 한 값으로 붙이면 첨탑에서는 글자가 건물을 가린다.
    const topY = s.kind === "spire" ? -R * 2.05 : s.kind === "bastion" ? -R * 1.45
               : s.kind === "forge" ? -R * 1.72 : -R * 1.22;
    const P = PIX;
    const q = v => Math.round(v / P) * P;
    const box = (x0, y0, x1, y1) => ctx.rect(q(sx + x0), q(sy + y0), q(x1 - x0), q(y1 - y0));

    // 바닥 그림자 — 큰 것일수록 깊게
    ctx.save();
    ctx.globalAlpha = .34;
    ctx.fillStyle = "#000";
    ctx.beginPath(); pxEllipse(sx, sy + R * .3, R * .62, R * .24); ctx.fill();
    ctx.globalAlpha = 1;

    // 가동 중이면 발밑에 진영이 돈다
    if (on) {
      const ar = K.aura ? R * K.aura : R * 1.15;
      ctx.globalAlpha = .10 + .05 * Math.sin(Game.time * 3);
      ctx.fillStyle = K.color;
      ctx.beginPath(); pxEllipse(sx, sy + R * .3, ar, ar * .42); ctx.fill();
      ctx.globalAlpha = .5;
      ctx.fillStyle = cols[0];
      ctx.beginPath();
      const steps = Math.max(16, Math.ceil(TAU * ar / (P * 3)));
      for (let i = 0; i < steps; i++) {
        const a = i / steps * TAU + Game.time * .4;
        ctx.rect(q(sx + Math.cos(a) * ar), q(sy + R * .3 + Math.sin(a) * ar * .42), P, P);
      }
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ── 몸통 ── 꺼져 있으면 어둡다. 켜야 색이 산다.
    // 꺼져 있어도 종류색을 살짝 섞는다. 전부 같은 회색이면 멀리서 무엇인지 몰라
    // 갈지 말지를 정할 수가 없다.
    const dark = pxPalCache[K.color + "|off"] ||
      (pxPalCache[K.color + "|off"] = mixHex(K.color, "#43424f", .72));
    const body = on ? cols[2] : dark;
    const trim = on ? cols[1] : mixHex(K.color, "#5a5967", .6);
    const lit  = on ? cols[0] : mixHex(K.color, "#6a6979", .5);
    const base = R * .5;                       // 반폭
    ctx.fillStyle = body;
    ctx.beginPath();
    box(-base, -R * .12, base, R * .3);        // 기단
    if (s.kind === "spire") {
      box(-base * .42, -R * 1.5, base * .42, -R * .1);          // 오벨리스크 몸
      for (let i = 0; i < 7; i++) {                              // 끝으로 갈수록 좁아진다
        const w = base * .42 * (1 - i / 7), y = -R * 1.5 - i * P * 2.2;
        box(-w, y - P * 2.2, w, y);
      }
    } else if (s.kind === "font") {
      box(-base * .9, -R * .5, base * .9, -R * .05);             // 낮고 넓은 수반
      for (const sgn of [-1, 1]) box(sgn * base * .78, -R * .95, sgn * base * .58, -R * .4);  // 기둥 둘
      box(-base * .95, -R * 1.05, base * .95, -R * .9);          // 상인방
    } else if (s.kind === "bastion") {
      box(-base * .82, -R * 1.05, base * .82, -R * .05);         // 성벽
      for (let i = -3; i <= 3; i++)                              // 톱니
        box(i * base * .26 - base * .1, -R * 1.28, i * base * .26 + base * .1, -R * 1.02);
      for (const sgn of [-1, 1]) box(sgn * base * .95, -R * 1.15, sgn * base * .68, -R * .02);  // 망루
    } else {
      box(-base * .8, -R * .8, base * .8, -R * .05);             // 대장간 몸채
      box(-base * .95, -R * .95, base * .95, -R * .74);          // 처마
      box(base * .3, -R * 1.55, base * .68, -R * .8);            // 굴뚝
    }
    ctx.fill();

    // ── 테두리·장식 ──
    ctx.fillStyle = trim;
    ctx.beginPath();
    box(-base, -R * .12, base, -R * .12 + P);                    // 기단 윗선
    box(-base, R * .3 - P, base, R * .3);
    ctx.fill();

    // ── 빛나는 심장부 ── 켜져 있으면 맥동한다
    const pulse = on ? .55 + .45 * Math.abs(Math.sin(Game.time * 3.4)) : .22;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = lit;
    ctx.beginPath();
    if (s.kind === "spire") {
      const y = -R * 1.5 - 7 * P * 2.2;                          // 꼭대기 수정
      box(-P * 2, y - P * 5, P * 2, y);
      box(-P * 3, y - P * 3, P * 3, y - P * 2);
    } else if (s.kind === "font") {
      box(-base * .74, -R * .42, base * .74, -R * .12);          // 찰랑이는 수면
    } else if (s.kind === "bastion") {
      box(-P * 3, -R * .78, P * 3, -R * .3);                     // 문장
      box(-P * 6, -R * .64, P * 6, -R * .5);
    } else {
      box(-base * .34, -R * .58, base * .34, -R * .12);          // 화구
    }
    ctx.fill();
    ctx.globalAlpha = 1;

    // ── 어두운 구멍 ── 창·문·틈. 큰 면이 비어 있으면 건물이 아니라 판자로 보인다.
    ctx.fillStyle = "rgba(12,12,20,.66)";
    ctx.beginPath();
    if (s.kind === "spire") {
      for (let i = 0; i < 4; i++) box(-base * .42, -R * (.35 + i * .28), base * .42, -R * (.32 + i * .28));
    } else if (s.kind === "font") {
      box(-base * .18, -R * .95, base * .18, -R * .5);           // 기둥 사이 그늘
    } else if (s.kind === "bastion") {
      for (const sgn of [-1, 1]) {                                // 화살 구멍
        box(sgn * base * .5 - P, -R * .88, sgn * base * .5 + P, -R * .66);
        box(sgn * base * .5 - P, -R * .56, sgn * base * .5 + P, -R * .34);
      }
      box(-base * .17, -R * .34, base * .17, -R * .02);           // 성문
    } else {
      box(-base * .24, -R * .42, base * .24, -R * .04);           // 대장간 입구
    }
    ctx.fill();

    // 굴뚝 연기 — 가동 중에만 오른다
    if (on && s.kind === "forge") {
      ctx.globalAlpha = .4;
      ctx.fillStyle = "#9a9aa8";
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const u = ((Game.time * .55 + i * .2) % 1);
        const yy = -R * 1.55 - u * R * .5, w = P * (1 + u * 3);
        box(base * .49 - w + Math.sin(u * 6 + i) * P * 2, yy - P * 2, base * .49 + w + Math.sin(u * 6 + i) * P * 2, yy);
      }
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ── 상태 ── 남은 시간과 체력. 언제 무너지는지 보여야 지킬지 뺄지 판단이 된다.
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (on) {
      const bw = R * 1.05, bx = sx - bw / 2, by = sy + topY - 16;
      ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(bx - 2, by - 2, bw + 4, 12);
      ctx.fillStyle = "#ff6b7f";
      ctx.fillRect(bx, by, bw * clamp(st.hp / st.max, 0, 1), 4);
      ctx.fillStyle = K.color;
      ctx.fillRect(bx, by + 5, bw * clamp(st.t / K.dur, 0, 1), 3);
      ctx.font = "700 12px " + FONT; ctx.fillStyle = K.color;
      iconText(K.px, K.name + "  " + Math.ceil(st.t) + "초", sx, by - 12, K.color, 2);
    } else {
      ctx.globalAlpha = .55 + Math.sin(Game.time * 2 + s.x * .01) * .2;
      ctx.font = "700 12px " + FONT; ctx.fillStyle = K.color;
      iconText(K.px, K.name, sx, sy + topY - 16, K.color, 2);
      ctx.font = "600 10.5px " + FONT; ctx.fillStyle = "rgba(255,255,255,.55)";
      ctx.fillText(K.desc + " · 다가가면 가동", sx, sy + topY - 2);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

function traitLv(key) {
  const t = player.traits.find(t => t.key === key);
  return t ? t.level : 0;
}
// 전직으로 열린 특성까지 합친 목록
function traitList() {
  const out = (player.cls && TRAITS[player.cls.key]) ? TRAITS[player.cls.key].slice() : [];
  for (const a of player.advance) if (a.traits) out.push(...a.traits);
  return out;
}
function traitDefByKey(key) {
  return traitList().find(t => t.key === key);
}
function traitDef(clsKey, key) {   // 이전 호출부 호환
  return traitDefByKey(key);
}

/* ---------- 능동 스킬 빌더 ----------
   전직마다 스킬이 바뀌어야 하는데 24개를 손으로 쓰면 관리가 안 된다.
   형태별로 만들어 쓰고, 수치만 전직 데이터에 둔다. */
function skWave(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    spawnWave({ x: p.x, y: p.y, maxR: o.r * p.stats.area,
      dmg: (o.dmg + p.level * (o.perLv || 10)) * p.stats.damage * p.dynDmg,
      life: o.life || .5, color: o.color, element: o.elem, heal: o.heal || 0 });
    if (o.iframe) p.iframe = Math.max(p.iframe, o.iframe);
    if (o.healPct) p.hp = Math.min(p.stats.maxHp, p.hp + p.stats.maxHp * o.healPct);
    cam.shake = o.shake || 12;
    spawnParticles(p.x, p.y, 34, o.color, 320, .8, 5);
    Sfx.play(o.freq || 320, .45, "triangle", 1, o.slide || 500);
  } };
}

function skBurst(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const targets = nearestEnemies(p.x, p.y, 900, o.n);
    for (let i = 0; i < o.n; i++) {
      const t = targets[i % Math.max(1, targets.length)];
      const a = t ? Math.atan2(t.y - p.y, t.x - p.x) + rnd(-.22, .22)
                  : i / o.n * TAU;
      const sp = (o.speed || 380) * p.stats.projSpeed;
      spawnProjectile({
        x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: (o.r || 11) * p.stats.area,
        dmg: (o.dmg + p.level * (o.perLv || 8)) * p.stats.damage * p.dynDmg,
        pierce: o.pierce || 2, life: o.life || 2.2, kind: o.kind || "orb",
        angle: a, color: o.color, element: o.elem,
        homing: o.homing || 0, target: t || null,
      });
    }
    cam.shake = 8;
    Sfx.play(o.freq || 540, .3, "triangle", .9, 400);
  } };
}

function skStrike(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const pool = nearestEnemies(p.x, p.y, 800, o.n * 2);
    const dmg = (o.dmg + p.level * (o.perLv || 14)) * p.stats.damage * p.dynDmg;
    for (let i = 0; i < o.n; i++) {
      const e = pool[i % Math.max(1, pool.length)];
      if (!e || !e.active) continue;
      spawnBolt(e.x, e.y);
      damageEnemy(e, dmg, e.x, e.y - 60, 0, o.elem);
      spawnWave({ x: e.x, y: e.y, maxR: (o.splash || 90) * p.stats.area,
        dmg: dmg * .5, life: .28, color: o.color, element: o.elem });
    }
    cam.shake = 10;
    Sfx.play(200, .3, "sawtooth", .8, 700);
  } };
}

function skSlash(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const base = Math.atan2(p.faceY, p.faceX);
    const dmg = (o.dmg + p.level * (o.perLv || 12)) * p.stats.damage * p.dynDmg;
    for (let i = 0; i < o.n; i++)
      spawnSlash(p, base + (i - (o.n - 1) / 2) * (o.spread || .55), dmg,
                 o.len * p.stats.area, 1.4, o.elem);
    if (o.iframe) p.iframe = Math.max(p.iframe, o.iframe);
    cam.shake = 10;
    spawnParticles(p.x + p.faceX * 40, p.y + p.faceY * 40, 20, o.color, 260, .5, 4);
    Sfx.play(280, .3, "sawtooth", .8, 260);
  } };
}

function skDash(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    p.dash = o.dur; p.dashX = p.faceX; p.dashY = p.faceY;
    p.dashDmg = (o.dmg + p.level * (o.perLv || 12)) * p.stats.damage * p.dynDmg;
    p.dashHit.clear();
    p.iframe = Math.max(p.iframe, o.dur + .2);
    cam.shake = 8;
    Sfx.play(190, .3, "sawtooth", .85, 320);
  } };
}

function skBlink(name, icon, cost, desc, o) {
  return { name, icon, cost, desc, use(p) {
    const ox = p.x, oy = p.y;
    p.x += p.faceX * o.dist; p.y += p.faceY * o.dist;
    p.iframe = Math.max(p.iframe, o.iframe || .9);
    const dmg = (o.dmg + p.level * (o.perLv || 8)) * p.stats.damage * p.dynDmg;
    for (const [bx, by] of [[ox, oy], [p.x, p.y]]) {
      spawnParticles(bx, by, 22, o.color, 280, .6, 4);
      for (let i = 0; i < o.n; i++) {
        const a = i / o.n * TAU, sp = 540 * p.stats.projSpeed;
        spawnProjectile({
          x: bx, y: by, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          r: 8 * p.stats.area, dmg, pierce: o.pierce || 2, life: 1.0,
          kind: o.kind || "dagger", angle: a, color: o.color, element: o.elem,
        });
      }
    }
    Sfx.play(760, .2, "sine", .8, -420);
  } };
}

/* ---------- 메타 진행 : 제단 ----------
   판이 끝나도 남는 것이 있어야 다시 시작하게 된다.
   영혼을 모아 영구 강화를 사고, 그 강화가 다음 판의 시작 지점을 올린다. */
/* 값은 '한 판에 다 사지 못하게' 잡는다. 봇 계측으로 살아남은 판이 180~660영혼이니
   전부(11,570) 채우려면 서른다섯 판 안팎이 든다. 첫 칸(90)은 첫 판이나 두 번째 판에 닿는다.
   옛 값(전부 6,240)은 7분짜리 한 판(9,429)으로 통째로 사고도 남았다. */
const ALTAR = [
  /* per · step · unit 이 있으면 「최대 체력 +16% → +24%」를 만들어 쓴다.
     desc 에 같은 숫자를 또 적어 두면 한쪽만 고칠 때 어긋난다 — 수치가 없는 칸만 desc 를 쓴다. */
  { key: "vigor",   name: "강건함", per: "최대 체력",   unit: "%", step: 8,  max: 5,
    cost: l => [90, 180, 340, 560, 850][l] },
  { key: "edge",    name: "예리함", per: "모든 피해",   unit: "%", step: 5,  max: 5,
    cost: l => [120, 240, 450, 750, 1150][l] },
  { key: "swift",   name: "민첩",   per: "이동 속도",   unit: "%", step: 4,  max: 5,
    cost: l => [90, 180, 340, 560, 850][l] },
  { key: "avarice", name: "탐욕",   per: "경험치 획득", unit: "%", step: 6,  max: 5,
    cost: l => [100, 200, 380, 620, 950][l] },
  { key: "zeal",    name: "신념",   per: "시작 자원",   unit: "", step: 25, max: 3,
    cost: l => [160, 360, 650][l] },
  { key: "rebirth", name: "부활",   step: 0, desc: "쓰러질 때 한 번 되살아난다", max: 1,
    cost: () => 1400 },
];

const Meta = {
  souls: 0, levels: {},
  load() {
    try {
      this.souls = Number(localStorage.getItem("ts_souls") || 0) || 0;
      this.levels = JSON.parse(localStorage.getItem("ts_altar") || "{}") || {};
    } catch (e) { this.souls = 0; this.levels = {}; }
  },
  save() {
    try {
      localStorage.setItem("ts_souls", String(this.souls));
      localStorage.setItem("ts_altar", JSON.stringify(this.levels));
    } catch (e) { /* 저장 불가여도 게임은 돈다 */ }
  },
  lv(k) { return this.levels[k] || 0; },
  costOf(u) { return u.cost(this.lv(u.key)); },
  buy(k) {
    const u = ALTAR.find(a => a.key === k);
    if (!u) return false;
    const l = this.lv(k);
    if (l >= u.max) return false;
    const c = this.costOf(u);
    if (this.souls < c) return false;
    this.souls -= c;
    this.levels[k] = l + 1;
    this.save();
    return true;
  },
};
Meta.load();

/* ---------- 직업 ----------
   직업 = 시작 무기 + 스탯 성향 + 고유 특성.
   무기 이름과 스킬 컨셉을 직업 테마에 맞춰 묶어둔다. */
const CLASSES = [
  {
    key: "paladin", name: "성기사", icon: "🛡️", color: "#ffd36e",
    tagline: "멈춰 서서 파고든다",
    start: "aura",
    gemChance: .11,  // 군중을 통째로 쓸어 담으므로 한 마리당 전리품은 가장 낮다
    desc: "군중 한가운데로 파고들어 버티는 직업. 체력이 압도적으로 높고 느리다.",
    mods: { maxHp: 150, speed: -.08, armor: .12, regen: .4 },
    // ── 진영: 멈추면 방벽이 서고, 둘러싸일수록 강해진다. 군중 속으로 파고드는 직업.
    stanceName: "진영",
    stanceHint: "멈추면 방벽(방어·회복·연사) · 곁의 적이 많을수록 피해 증가",
    stance: {
      update(p, dt, moving) {
        const bl = traitLv("bulwark") + traitLv("immovable");
        const need = Math.max(.12, advVal("bulwarkInstant", .6) - .15 * bl);
        const on = advVal("bulwarkAlways", false) || (!moving && p.stillTime >= need);
        p.bulwark = on ? Math.min(1, p.bulwark + dt * 6) : Math.max(0, p.bulwark - dt * 8);

        // 접전: 곁에 붙은 적 수만큼 피해가 오른다 (p.press 는 공용 패스에서 계산됨)
        const R = 155 * p.stats.area;
        const found = hash.query(p.x, p.y, R, scratch3);
        const perPress = advVal("pressDmg", .06) + .025 * traitLv("crusade") + .025 * traitLv("zealotry");
        p.dynDmg *= 1 + perPress * p.press;

        if (on) {
          // 방패벽은 밀집할수록 더 잘 막는다. '둘러싸일수록 강해진다'는 규칙이
          // 피해에만 걸리고 방어에는 안 걸리면, 파고들라는 설계가 그냥 자살 명령이 된다.
          p.dynArmor *= 1 - Math.min(advVal("bulwarkCap", .88), .52 + .08 * bl + .02 * p.press);
          // 접전 보너스는 적이 몰려야 나오므로 초반엔 사실상 0이다.
          // 방벽 자체에 쿨다운 감소를 붙여 '자리를 지키면 꾸준히 때린다'는 기본값을 준다.
          p.dynCd *= .72;
          // 자리를 지키면 체력이 돌아온다 — 파고들기 → 버티기 → 회복의 리듬
          p.hp = Math.min(p.stats.maxHp,
            p.hp + p.stats.maxHp * (.015 + advVal("regenBonus", 0) + .005 * bl
              + .012 * traitLv("fortress") + .0018 * p.press) * dt);
          // 도발: 방벽 중에는 적을 끌어당긴다 — 더 둘러싸일수록 이득이라는 규칙과 맞물린다
          const tl = traitLv("taunt");
          if (tl > 0) {
            for (let i = 0; i < found.length; i++) {
              const e = found[i];
              if (!e.active || e.boss) continue;
              const a = Math.atan2(p.y - e.y, p.x - e.x);
              // 42 는 예전의 60 이다 — 넉백 감쇠를 0.86 에서 0.90 으로 늦추면서
              // 같은 값이 40% 더 세게 당기게 됐다. 도발의 세기는 그대로 두려고 되돌린다.
              e.kx += Math.cos(a) * 42 * tl * dt * 60;
              e.ky += Math.sin(a) * 42 * tl * dt * 60;
            }
          }
        }
        // 성전사: 달리면서도 방벽 효과의 일부가 남는다
